version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    rebase-strategy: auto

  - package-ecosystem: npm
    directory: "/cloudflare/worker"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    rebase-strategy: auto
