name: Inspect Saudi Cloudflare frontend build

"on":
  push:
    branches:
      - ops/saudi-cloudflare-frontend-inspect-20260802
    paths:
      - .github/workflows/saudi-cloudflare-frontend-inspect.yml
  pull_request:
    branches:
      - saudi
    paths:
      - .github/workflows/saudi-cloudflare-frontend-inspect.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Saudi frontend
        run: npm run typecheck

      - name: Build Saudi frontend
        run: npm run build

      - name: Inspect build and Saudi API CORS source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rawaj-saudi-api
          base64 --decode ops/rawaj-saudi-cloudflare-bootstrap.tar.gz.b64 \
            > /tmp/rawaj-saudi-api.tar.gz
          tar -xzf /tmp/rawaj-saudi-api.tar.gz -C /tmp/rawaj-saudi-api

          {
            echo "## Saudi frontend Cloudflare build inventory"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Build: \`success\`"
            echo "- Output size: \`$(du -sh .output | cut -f1)\`"
            echo
            echo "### Generated Wrangler config"
            echo '```json'
            cat .output/server/wrangler.json
            echo '```'
            echo
            echo "### Entrypoints"
            find .output -maxdepth 4 -type f \
              \( -name 'index.mjs' -o -name 'index.js' -o -name 'wrangler.json' -o -name 'nitro.json' \) \
              | sort | sed 's/^/- `/' | sed 's/$/`/' || true
            echo
            echo "### Saudi API origin/CORS references"
            echo '```text'
            grep -RInE 'sa\.rawa-j\.com|ALLOWED_ORIGINS|allowedOrigins|cors|origin' \
              /tmp/rawaj-saudi-api/cloudflare/worker/src \
              /tmp/rawaj-saudi-api/cloudflare/worker/scripts \
              /tmp/rawaj-saudi-api/cloudflare/worker/wrangler* 2>/dev/null \
              | head -n 200 || true
            echo '```'
          } > /tmp/saudi-cloudflare-build.md

          gh issue comment 602 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/saudi-cloudflare-build.md

      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-saudi-frontend-cloudflare-build
          path: .output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
