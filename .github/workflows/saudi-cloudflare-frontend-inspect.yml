name: Apply Saudi region selector fix

"on":
  pull_request:
    branches:
      - saudi

permissions:
  contents: write

concurrency:
  group: rawaj-saudi-region-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and validate Saudi regions
    if: github.head_ref == 'fix/saudi-region-city-selectors-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Stabilize generated contract assertion
        run: node scripts/fix-saudi-test-generator.mjs

      - name: Apply focused location patch
        run: node scripts/apply-saudi-region-fix.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Saudi region contract
        run: npm run test:saudi-location-regions

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f src/features/locations/SaudiRegionCitySelector.tsx
          ! grep -q 'CanonicalLocationSelector' src/routes/add-listing.tsx
          ! grep -q 'CanonicalLocationSelector' src/routes/listings.index.tsx
          ! grep -q 'CanonicalLocationSelector' 'src/routes/profile/listings.$id.tsx'

      - name: Commit validated code only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            scripts/saudi-region-city-contract.test.mjs \
            src/features/locations/SaudiRegionCitySelector.tsx \
            src/features/locations/use-location-levels.ts \
            src/lib/api/location-taxonomy.ts \
            src/lib/public-data/cloudflare-client.ts \
            src/routes/add-listing.tsx \
            src/routes/listings.index.tsx \
            'src/routes/profile/listings.$id.tsx'
          git commit -m "fix(saudi): show regions and cities across marketplace"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
