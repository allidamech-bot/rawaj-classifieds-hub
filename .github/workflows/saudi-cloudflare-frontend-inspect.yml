name: Deploy Saudi frontend to Cloudflare

"on":
  pull_request:
    branches:
      - saudi
  push:
    branches:
      - saudi
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rawaj-saudi-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKER_NAME: rawaj-saudi-web
  WORKER_URL: https://rawaj-saudi-web.allidamech.workers.dev
  API_URL: https://rawaj-saudi-classifieds.allidamech.workers.dev
  PUBLIC_SITE_URL: https://sa.rawa-j.com

jobs:
  validate:
    name: Build Saudi frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Saudi frontend
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Saudi region contracts
        run: npm run test:saudi-location-regions

      - name: Type-check
        run: npm run typecheck

      - name: Build Cloudflare output
        run: npm run build

      - name: Validate generated Worker package
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/server/wrangler.json
          test -d .output/public/assets
          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync(".output/server/wrangler.json", "utf8"));
          if (config.main !== "index.mjs") throw new Error("Unexpected Saudi frontend entrypoint");
          if (config.assets?.directory !== "../public") throw new Error("Unexpected asset directory");
          if (!Array.isArray(config.compatibility_flags) || !config.compatibility_flags.includes("nodejs_compat")) {
            throw new Error("nodejs_compat is required");
          }
          NODE

      - name: Prepare isolated Saudi Worker config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = ".output/server/wrangler.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.name = process.env.WORKER_NAME;
          config.observability = { enabled: true };
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(".output/server/wrangler.json", "utf8"));
            if (config.name !== process.env.WORKER_NAME) throw new Error("Saudi Worker name mismatch");
          '

      - name: Upload validated Worker package
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-saudi-web-worker-${{ github.sha }}
          path: .output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Publish Saudi frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/saudi'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_PRODUCTION_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Check out Saudi frontend
        uses: actions/checkout@v4

      - name: Set up Node.js for live verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install live verification dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download validated Worker package
        uses: actions/download-artifact@v4
        with:
          name: rawaj-saudi-web-worker-${{ github.sha }}
          path: .output

      - name: Deploy isolated Saudi frontend Worker
        run: npx --yes wrangler@4.118.0 deploy --config .output/server/wrangler.json

      - name: Verify public Saudi frontend and API
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 12 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
            "$WORKER_URL/" > /tmp/rawaj-saudi-home.html
          grep -q "سوق إعلانات مبوبة في السعودية" /tmp/rawaj-saudi-home.html
          grep -q "سيارات ومركبات" /tmp/rawaj-saudi-home.html
          grep -q "عقارات" /tmp/rawaj-saudi-home.html

          curl --retry 12 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
            "$API_URL/v1/health" > /tmp/rawaj-saudi-health.json
          curl --retry 12 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
            "$API_URL/v1/references" > /tmp/rawaj-saudi-references.json
          curl --retry 12 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
            "$PUBLIC_SITE_URL/listings" > /tmp/rawaj-saudi-public-listings.html

          node <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("/tmp/rawaj-saudi-health.json", "utf8"));
          const refs = JSON.parse(fs.readFileSync("/tmp/rawaj-saudi-references.json", "utf8"));
          if (health.data?.service !== "rawaj-saudi-classifieds" || health.data?.database !== "ready") {
            throw new Error("Saudi API health verification failed");
          }
          if ((refs.data?.categories?.length || 0) < 12) throw new Error("Saudi categories are incomplete");
          if ((refs.data?.governorates?.length || 0) !== 13) throw new Error("Saudi regions are incomplete");
          console.log(`Saudi API ready with ${refs.data.categories.length} categories and ${refs.data.governorates.length} regions.`);
          NODE

      - name: Verify live Saudi region and city selectors
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="$PUBLIC_SITE_URL" node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ locale: "ar-SA", viewport: { width: 1440, height: 1000 } });
            await page.goto(`${process.env.SITE_URL}/listings?open_filters=true`, {
              waitUntil: "networkidle",
              timeout: 60_000,
            });

            const regionSelect = page.locator("[data-saudi-region-select]").first();
            await regionSelect.waitFor({ state: "visible", timeout: 30_000 });
            const regionValues = await regionSelect.locator("option").evaluateAll((options) =>
              options.slice(1).map((option) => option.value).filter(Boolean),
            );
            if (regionValues.length !== 13) {
              throw new Error(`Expected 13 Saudi regions, found ${regionValues.length}`);
            }

            const citySelect = page.locator("[data-saudi-city-select]").first();
            let cityCount = 0;
            for (const regionValue of regionValues) {
              await regionSelect.selectOption(regionValue);
              await page.waitForTimeout(100);
              cityCount = await citySelect.locator("option").count();
              if (cityCount > 1) break;
            }
            if (cityCount <= 1) throw new Error("No Saudi cities appeared after selecting a region");
            console.log(`Live Saudi UI verified with ${regionValues.length} regions and city options.`);
          } finally {
            await browser.close();
          }
          NODE

      - name: Record successful public deployment
        shell: bash
        run: |
          gh issue comment 602 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Saudi public frontend deployed successfully at **$PUBLIC_SITE_URL** from commit \`$GITHUB_SHA\`. The homepage, direct Saudi API, 13-region selector, and city options passed live verification."
