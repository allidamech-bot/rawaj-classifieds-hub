name: Inspect Saudi Cloudflare frontend build

"on":
  push:
    branches:
      - ops/saudi-cloudflare-frontend-inspect-20260802
    paths:
      - .github/workflows/saudi-cloudflare-frontend-inspect.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Saudi frontend
        run: npm run typecheck

      - name: Build Saudi frontend
        run: npm run build

      - name: Inventory Cloudflare build output
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Saudi frontend Cloudflare build inventory"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Build: \`success\`"
            echo
            echo "### Candidate output directories"
            for dir in .output dist build; do
              if [ -d "$dir" ]; then
                echo "- \`$dir\`: present"
                du -sh "$dir" | sed 's/^/  - size: `/' | sed 's/$/`/'
              else
                echo "- \`$dir\`: missing"
              fi
            done
            echo
            echo "### Files"
            find .output dist build -maxdepth 4 -type f 2>/dev/null \
              | sort \
              | head -n 300 \
              | while IFS= read -r file; do
                  size="$(wc -c < "$file" | tr -d ' ')"
                  echo "- \`$file\` — ${size} bytes"
                done
            echo
            echo "### Entrypoint hints"
            find .output dist build -maxdepth 5 -type f 2>/dev/null \
              \( -name 'index.mjs' -o -name 'index.js' -o -name 'worker.mjs' -o -name 'worker.js' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' \) \
              | sort \
              | sed 's/^/- `/' | sed 's/$/`/'
          } > /tmp/saudi-cloudflare-build.md

          gh issue comment 602 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/saudi-cloudflare-build.md

      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-saudi-frontend-cloudflare-build
          path: |
            .output
            dist
            build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
