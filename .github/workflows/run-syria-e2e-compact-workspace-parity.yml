name: Run Syria compact workspace E2E parity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/syria-match-saudi-owner-listings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/syria-match-saudi-owner-listings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-syria-e2e-compact-workspace-parity.py
      - run: npm ci
      - run: npx prettier --write e2e/authenticated-critical-journey.spec.ts e2e/authenticated-owner-listing-lifecycle-journey.spec.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run affected launch-critical journeys
        env:
          RAWAJ_E2E_USE_FIXTURES: "1"
          RAWAJ_E2E_API_PROXY_TARGET: https://rawaj-classifieds-hub.allidamech.workers.dev
          VITE_PUBLIC_DATA_API_BASE_URL: http://127.0.0.1:4173
          VITE_RAWAJ_E2E_DISABLE_REMOTE_MEDIA: "1"
        run: npx playwright test e2e/authenticated-critical-journey.spec.ts e2e/authenticated-owner-listing-lifecycle-journey.spec.ts --config=playwright.smoke.config.ts --project=mobile-chromium --project=desktop-chromium --workers=2
      - name: Verify new UX is exercised
        run: |
          grep -Fq 'getByRole("link", { name: /^(Manage listing|إدارة الإعلان)$/' e2e/authenticated-critical-journey.spec.ts
          grep -Fq 'async function openListingManagement(card: Locator)' e2e/authenticated-owner-listing-lifecycle-journey.spec.ts
          grep -Fq 'await openListingManagement(approvedCard);' e2e/authenticated-owner-listing-lifecycle-journey.spec.ts
          grep -Fq 'await openListingManagement(closedCard);' e2e/authenticated-owner-listing-lifecycle-journey.spec.ts
          grep -Fq 'await openListingManagement(draftCard);' e2e/authenticated-owner-listing-lifecycle-journey.spec.ts
      - name: Commit tests and remove one-shot files
        run: |
          git rm .github/workflows/run-syria-e2e-compact-workspace-parity.yml scripts/apply-syria-e2e-compact-workspace-parity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/authenticated-critical-journey.spec.ts e2e/authenticated-owner-listing-lifecycle-journey.spec.ts
          git commit -m "test(syria): follow compact listing management UX"
          git push origin HEAD:feat/syria-match-saudi-owner-listings
