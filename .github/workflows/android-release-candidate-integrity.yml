name: Android Release Candidate Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-release-candidate.yml"
      - ".github/workflows/android-release-candidate-integrity.yml"
      - "scripts/build-android-release-candidate-evidence.mjs"
      - "scripts/android-release-candidate-integrity.test.mjs"
      - "android/app/build.gradle"
      - "android/variables.gradle"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-release-candidate.yml"
      - ".github/workflows/android-release-candidate-integrity.yml"
      - "scripts/build-android-release-candidate-evidence.mjs"
      - "scripts/android-release-candidate-integrity.test.mjs"
      - "android/app/build.gradle"
      - "android/variables.gradle"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Android RC artifact integrity contract
        run: node --test scripts/android-release-candidate-integrity.test.mjs
