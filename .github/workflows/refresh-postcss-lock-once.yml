name: Refresh Patched PostCSS Lockfile Once

on:
  push:
    branches:
      - fix/final-stack-audit-closeout
    paths:
      - .github/workflows/refresh-postcss-lock-once.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-stack-audit-closeout
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin patched PostCSS and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set overrides.postcss=8.5.23
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev

      - name: Commit lockfile refresh when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "Patched PostCSS override and lockfile are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): patch PostCSS source-map traversal"
          git push origin HEAD:fix/final-stack-audit-closeout
