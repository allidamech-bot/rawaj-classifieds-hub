name: Current Acceptance Regression Temporary Gate

on:
  push:
    branches:
      - fix/home-page-navigation-ad-placement-audit
  workflow_dispatch:

concurrency:
  group: current-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run focused contracts
        shell: bash
        run: |
          set -o pipefail
          npm run test:release-blockers-chats-list-first 2>&1 | tee current-quality.log
          npm run test:release-blockers-ad-image-freshness 2>&1 | tee -a current-quality.log
      - name: Run full repository check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee -a current-quality.log
      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: current-acceptance-quality-${{ github.run_id }}
          path: current-quality.log
          if-no-files-found: error
          retention-days: 7
      - name: Publish quality result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'Current Acceptance / Quality',
              description: passed ? 'Full repository check passed' : 'Full repository check failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  browser:
    name: Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop browser smoke
        run: npm run test:e2e:smoke
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: current-acceptance-playwright-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish browser result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'Current Acceptance / Browser',
              description: passed ? 'Mobile and desktop smoke passed' : 'Browser smoke failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
