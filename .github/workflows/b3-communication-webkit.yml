name: B3 Communication WebKit Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/activity-command-premium.css"
      - "src/personal-activity-system-v10.css"
      - "src/messaging-v4.css"
      - "src/routes/chats.tsx"
      - "src/components/FeedbackWidget.tsx"
      - "src/components/feedback/feedback-dialog.css"
      - "src/components/shell/FloatingHeader.tsx"
      - "src/features/communication/ConversationPriceOffers.tsx"
      - "src/spatial-app-shell.css"
      - "src/rawaj-chromatic-premium-system-v18-chats.css"
      - "e2e/customer-interface-fixes.spec.ts"
      - "e2e/authenticated-price-offers-journey.spec.ts"
      - "src/communication-center-v3.css"
      - "src/communication-center-v2.css"
      - "e2e/b3-communication-family.spec.ts"
      - ".github/workflows/b3-communication-webkit.yml"

concurrency:
  group: b3-communication-webkit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webkit:
    name: B3.2 iPhone WebKit (emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Verify bilingual communication screens on WebKit
        env:
          RAWAJ_E2E_USE_FIXTURES: "1"
          VITE_PUBLIC_DATA_API_BASE_URL: "http://127.0.0.1:4173"
          VITE_RAWAJ_E2E_DISABLE_REMOTE_MEDIA: "1"
        run: >-
          npx playwright test e2e/b3-communication-family.spec.ts
          e2e/customer-interface-fixes.spec.ts e2e/authenticated-price-offers-journey.spec.ts
          --project=mobile-webkit --workers=1
      - name: Preserve WebKit screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-communication-webkit-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
