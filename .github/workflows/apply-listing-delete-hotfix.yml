name: Apply Listing Delete Hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/preserve-conversations-on-listing-delete
          fetch-depth: 0

      - name: Apply client compatibility changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
            'src/lib/classifieds-types.ts': [
              ('  listingId: string;\n', '  listingId: string | null;\n'),
            ],
            'src/lib/api/messaging.ts': [
              ('    listingId: rowString(row, "listing_id"),\n', '    listingId: rowNullableString(row, "listing_id"),\n'),
            ],
            'src/lib/api/shared.ts': [
              ('  if (error.code === "42501") {\n', '  if (error.code === "23503") {\n    return {\n      code: "foreign_key_conflict",\n      message: "تعذر إكمال الحذف لأن العنصر مرتبط ببيانات محفوظة أخرى.",\n      details: message,\n    };\n  }\n\n  if (error.code === "42501") {\n'),
            ],
            'src/routes/chats.tsx': [
              ('    if (!auth.profile?.id || !selectedConversation || sending) return;\n', '    if (!auth.profile?.id || !selectedConversation || sending) return;\n    if (selectedConversation.status !== "active") {\n      setNotice(\n        text(\n          "هذه المحادثة محفوظة كسجل ولا تقبل رسائل جديدة.",\n          "This conversation is preserved as history and cannot receive new messages.",\n        ),\n      );\n      return;\n    }\n'),
              ('                      <Link\n                        to="/listings/$id"\n                        params={{ id: selectedConversation.listingId }}\n                        className="truncate text-xs font-semibold text-primary"\n                      >\n                        {selectedConversation.listingTitle}\n                      </Link>\n', '                      {selectedConversation.listingId ? (\n                        <Link\n                          to="/listings/$id"\n                          params={{ id: selectedConversation.listingId }}\n                          className="truncate text-xs font-semibold text-primary"\n                        >\n                          {selectedConversation.listingTitle}\n                        </Link>\n                      ) : (\n                        <span className="block truncate text-xs font-semibold text-muted-foreground">\n                          {selectedConversation.listingTitle} · {text("إعلان محذوف", "Deleted listing")}\n                        </span>\n                      )}\n'),
              ('                  {selectedConversation.status === "blocked" && (\n', '                  {selectedConversation.status === "archived" && (\n                    <p className="mt-3 rounded-xl bg-warning/10 p-2 text-xs font-semibold text-warning">\n                      {text(\n                        "تم حذف الإعلان. احتفظنا بالمحادثة كسجل ولا يمكن إرسال رسائل جديدة.",\n                        "The listing was deleted. This conversation is preserved as history and cannot receive new messages.",\n                      )}\n                    </p>\n                  )}\n                  {selectedConversation.status === "blocked" && (\n'),
              ('                        selectedConversation.status === "blocked"\n', '                        selectedConversation.status !== "active"\n'),
            ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly 1 match, found {count}: {old[:100]!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          npx prettier --write \
            'src/lib/classifieds-types.ts' \
            'src/lib/api/messaging.ts' \
            'src/lib/api/shared.ts' \
            'src/routes/chats.tsx'

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            'src/lib/classifieds-types.ts' \
            'src/lib/api/messaging.ts' \
            'src/lib/api/shared.ts' \
            'src/routes/chats.tsx'
          git diff --cached --quiet || git commit -m 'Handle deleted listings in preserved conversations'
          git push origin HEAD:hotfix/preserve-conversations-on-listing-delete
