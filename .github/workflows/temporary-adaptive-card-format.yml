name: Temporary Adaptive Card Formatter

on:
  push:
    branches:
      - design/adaptive-listing-cards-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/adaptive-listing-cards-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add permanent adaptive card contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/workflows/quality-gate.yml';
          let source = fs.readFileSync(path, 'utf8');
          const anchor = `      - name: Home Discovery V3 contract\n        run: node --test scripts/home-discovery-v3.test.mjs\n`;
          const insertion = `${anchor}\n      - name: Adaptive Listing Cards contract\n        run: node --test scripts/adaptive-listing-cards.test.mjs\n`;
          if (!source.includes(anchor)) throw new Error('Missing Quality Gate anchor');
          if (!source.includes('Adaptive Listing Cards contract')) {
            source = source.replace(anchor, insertion);
          }
          fs.writeFileSync(path, source);
          NODE

      - name: Format adaptive card files
        run: >-
          npx prettier --write
          .github/workflows/quality-gate.yml
          scripts/adaptive-listing-cards.test.mjs
          scripts/home-discovery-v3.test.mjs
          scripts/marketplace-core-v2.test.mjs
          src/adaptive-listing-cards.css
          src/features/favorites/FavoriteListingCard.tsx
          src/features/home/FeaturedListingShowcase.tsx
          src/features/listings/RealListingCard.tsx
          src/features/listings/cards
          src/routes/favorites.tsx
          src/routes/listings.index.tsx
          src/routes/__root.tsx

      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-adaptive-card-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format adaptive listing card system"
          git push origin HEAD:design/adaptive-listing-cards-v1
