name: Admin Mobile Final Structure Contract

on:
  pull_request:
    paths:
      - "src/admin-final-polish.css"
      - "scripts/admin-mobile-final-structure.test.mjs"
      - ".github/workflows/admin-mobile-final-structure.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/admin-mobile-final-structure.test.mjs
