name: Apply Admin Actions Integrity Repair

on:
  push:
    branches:
      - agent/admin-actions-integrity-audit
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-admin-actions-integrity-repair.mjs"
      - "scripts/fix-admin-repair-script.mjs"
      - ".github/workflows/apply-admin-actions-integrity-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-admin-actions-integrity-repair
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-actions-integrity-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply governed repair
        id: repair
        shell: bash
        run: |
          set +e
          node scripts/fix-admin-repair-script.mjs > repair-diagnostic.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            node scripts/apply-admin-actions-integrity-repair.mjs >> repair-diagnostic.txt 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add repair-diagnostic.txt
            git commit -m "chore: capture admin repair diagnostic"
            git push origin HEAD:agent/admin-actions-integrity-audit
            exit "$status"
          fi
          git checkout HEAD -- .github/workflows/apply-admin-actions-integrity-repair.yml
          rm -f .github/workflows/admin-actions-integrity.yml
          rm -f repair-diagnostic.txt scripts/fix-admin-repair-script.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden admin action integrity"
          git push origin HEAD:agent/admin-actions-integrity-audit
