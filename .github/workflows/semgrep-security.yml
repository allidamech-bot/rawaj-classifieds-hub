name: Semgrep Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "7 2 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]'
    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Scan source for high-confidence security findings
        run: semgrep scan --config auto --severity ERROR --error
