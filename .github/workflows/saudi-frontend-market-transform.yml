name: Saudi frontend market transform

"on":
  push:
    branches:
      - feature/saudi-vercel-api-binding-20260802
    paths:
      - .github/workflows/saudi-frontend-market-transform.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/saudi-vercel-api-binding-20260802
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Saudi market copy and currency rules
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function update(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) {
              console.log(`No change: ${file}`);
              return;
            }
            fs.writeFileSync(file, after);
            console.log(`Updated: ${file}`);
          }

          function replaceMarketCopy(value) {
            return value
              .replaceAll('سوق إعلانات مبوبة في سوريا', 'سوق إعلانات مبوبة في السعودية')
              .replaceAll('السوق السوري', 'السوق السعودي')
              .replaceAll('سوق سوري', 'سوق سعودي')
              .replaceAll('سوق سوريا', 'سوق السعودية')
              .replaceAll('كل سوريا', 'كل السعودية')
              .replaceAll('جميع المحافظات', 'جميع المناطق')
              .replaceAll('سوريا فقط', 'السعودية فقط')
              .replaceAll('سوريا', 'السعودية')
              .replaceAll('Syrian marketplace', 'Saudi marketplace')
              .replaceAll('Syrian classifieds marketplace', 'Saudi classifieds marketplace')
              .replaceAll('Syrian classifieds', 'Saudi classifieds')
              .replaceAll('Syrian', 'Saudi')
              .replaceAll('All Syria', 'All Saudi Arabia')
              .replaceAll('across Syria', 'across Saudi Arabia')
              .replaceAll('Syria only', 'Saudi Arabia only')
              .replaceAll('Syria', 'Saudi Arabia');
          }

          const marketCopyFiles = [
            'src/routes/index.tsx',
            'src/routes/__root.tsx',
            'src/routes/category.$slug.tsx',
            'src/routes/listings.index.tsx',
            'src/routes/safety.tsx',
            'src/routes/terms.tsx',
            'src/components/shell/FloatingHeader.tsx',
            'src/components/SiteFooter.tsx',
            'src/features/search/QuickFilterRail.tsx',
            'src/features/home/DiscoveryHero.tsx',
            'src/features/storefront/OwnerStoreWorkspaceSummary.tsx',
            'src/features/storefront/StorefrontIdentityHero.tsx',
          ].filter(fs.existsSync);

          for (const file of marketCopyFiles) update(file, replaceMarketCopy);

          update('src/lib/i18n.ts', (value) => {
            let next = replaceMarketCopy(value)
              .replaceAll('new Intl.NumberFormat("ar-SY"', 'new Intl.NumberFormat("ar-SA"')
              .replace(
                'currency: "SYP" | "USD" = "SYP",',
                'currency: "SAR" | "SYP" | "USD" = "SAR",',
              )
              .replace(
                'const currencyLabel = currency === "SYP" ? localized(language, "ل.س", "SYP") : "$";',
                'const currencyLabel =\n    currency === "SAR"\n      ? localized(language, "ر.س", "SAR")\n      : currency === "SYP"\n        ? localized(language, "ل.س", "SYP")\n        : "$";',
              );
            return next;
          });

          update('src/types/index.ts', (value) =>
            value.replace('export type Currency = "SYP" | "USD";', 'export type Currency = "SAR" | "SYP" | "USD";'),
          );

          update('src/utils/format.ts', () => `// Consistent Saudi Arabic price formatting (Arabic-Indic digits + ٬ thousands separator).\nconst nf = new Intl.NumberFormat("ar-SA", { maximumFractionDigits: 0 });\n\ntype SupportedCurrency = "SAR" | "SYP" | "USD";\n\nexport function formatPrice(price: number, currency: SupportedCurrency = "SAR") {\n  if (!price && price !== 0) return "";\n  const formatted = nf.format(price);\n  const currencyLabel = currency === "SAR" ? "ر.س" : currency === "SYP" ? "ل.س" : "$";\n  return \`${'${formatted}'} ${'${currencyLabel}'}\`;\n}\n\nexport function priceLabel(price: number, type: string, currency: SupportedCurrency = "SAR") {\n  switch (type) {\n    case "free":\n      return "مجاناً";\n    case "contact":\n      return "السعر عند التواصل";\n    case "exchange":\n      return "للمبادلة";\n    case "negotiable":\n      return price ? \`${'${formatPrice(price, currency)}'} · قابل للتفاوض\` : "السعر قابل للتفاوض";\n    default:\n      return price ? formatPrice(price, currency) : "السعر غير محدد";\n  }\n}\n\nexport function priceTypeLabel(type: string) {\n  switch (type) {\n    case "fixed":\n      return "ثابت";\n    case "negotiable":\n      return "قابل للتفاوض";\n    case "contact":\n      return "عند التواصل";\n    case "free":\n      return "مجاناً";\n    case "exchange":\n      return "للمبادلة";\n    default:\n      return type;\n  }\n}\n`);

          update('.env', (value) =>
            value
              .replaceAll('https://rawaj-classifieds-hub.allidamech.workers.dev', 'https://rawaj-saudi-classifieds.allidamech.workers.dev')
              .replace(/^VITE_SITE_URL=.*$/m, 'VITE_SITE_URL=https://sa.rawa-j.com'),
          );

          update('.env.example', (value) =>
            value
              .replaceAll('https://rawaj-classifieds-hub.allidamech.workers.dev', 'https://rawaj-saudi-classifieds.allidamech.workers.dev')
              .replaceAll('https://rawa-j.com', 'https://sa.rawa-j.com'),
          );

          if (fs.existsSync('public/manifest.webmanifest')) {
            update('public/manifest.webmanifest', (value) => {
              const manifest = JSON.parse(value);
              manifest.name = 'RAWAJ Saudi Arabia | رواج السعودية';
              manifest.short_name = 'رواج السعودية';
              manifest.description = 'سوق رواج السعودية للإعلانات المبوبة';
              manifest.lang = 'ar-SA';
              return `${JSON.stringify(manifest, null, 2)}\n`;
            });
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build Saudi frontend
        run: npm run build

      - name: Commit transformed Saudi frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env .env.example public/manifest.webmanifest src
          if git diff --cached --quiet; then
            echo "No transformed files to commit."
            exit 0
          fi
          git commit -m "feat(saudi): localize frontend market and currency"
          git push origin HEAD:feature/saudi-vercel-api-binding-20260802

      - name: Report result
        if: always()
        shell: bash
        run: |
          result="${{ job.status }}"
          gh pr comment 599 --repo "$GITHUB_REPOSITORY" --body "Saudi frontend market transform finished with status: \`$result\`."
