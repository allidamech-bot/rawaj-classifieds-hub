name: Apply Listings Filter Actions and Depth

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/listings-filter-actions-and-depth'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild patch from main
        run: |
          git checkout origin/main -- \
            src/features/search/QuickFilterRail.tsx \
            src/features/search/FilterBottomSheet.tsx \
            src/features/listings/listings-components.tsx \
            src/lib/category-fields.ts \
            src/routes/listings.index.tsx
          rm -f scripts/listings-filter-actions-and-depth.test.mjs
          node scripts/repair-listings-patch-script.mjs
          node scripts/apply-listings-filter-actions-and-depth.mjs
      - run: npx prettier --write src/features/search/QuickFilterRail.tsx src/features/search/FilterBottomSheet.tsx src/features/listings/listings-components.tsx src/lib/category-fields.ts src/routes/listings.index.tsx scripts/listings-filter-actions-and-depth.test.mjs
      - run: node --test scripts/listings-filter-actions-and-depth.test.mjs
      - run: npx eslint --quiet src/features/search/QuickFilterRail.tsx src/features/search/FilterBottomSheet.tsx src/features/listings/listings-components.tsx src/lib/category-fields.ts src/routes/listings.index.tsx
      - run: npm run typecheck -- --pretty false
      - name: Commit verified product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/search/QuickFilterRail.tsx \
            src/features/search/FilterBottomSheet.tsx \
            src/features/listings/listings-components.tsx \
            src/lib/category-fields.ts \
            src/routes/listings.index.tsx \
            scripts/listings-filter-actions-and-depth.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: route quick filters and expand discovery options"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
