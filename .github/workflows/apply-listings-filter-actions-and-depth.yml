name: Apply Listings Filter Actions and Depth

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/listings-filter-actions-and-depth'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download generated product files
        run: |
          rm -rf generated-patch
          mkdir generated-patch
          gh run download 29624820445 \
            --repo "${{ github.repository }}" \
            --name listings-filter-generated-patch \
            --dir generated-patch
          cp -R generated-patch/src/. src/
          cp -R generated-patch/scripts/. scripts/
      - name: Repair generated selector and regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          sheet = Path("src/features/search/FilterBottomSheet.tsx")
          source = sheet.read_text()
          bad = '''        "[data-filter-section="" + focusTarget + ""]",'''
          good = '''        '[data-filter-section="' + focusTarget + '"]','''
          if bad not in source:
              raise SystemExit("Generated filter selector anchor was not found")
          sheet.write_text(source.replace(bad, good))

          contract = Path("scripts/listings-filter-actions-and-depth.test.mjs")
          lines = []
          replacement = '''    assert.ok(rail.includes('onOpenFilter("' + target + '")'));'''
          replaced = False
          for line in contract.read_text().splitlines():
              if "assert.match(rail, new RegExp" in line:
                  line = replacement
                  replaced = True
              lines.append(line)
          if not replaced:
              raise SystemExit("Generated quick-filter assertion anchor was not found")
          contract.write_text("\n".join(lines) + "\n")
          PY
      - run: npx prettier --write src/features/search/QuickFilterRail.tsx src/features/search/FilterBottomSheet.tsx src/features/listings/listings-components.tsx src/lib/category-fields.ts src/routes/listings.index.tsx scripts/listings-filter-actions-and-depth.test.mjs
      - run: node --test scripts/listings-filter-actions-and-depth.test.mjs
      - run: npx eslint --quiet src/features/search/QuickFilterRail.tsx src/features/search/FilterBottomSheet.tsx src/features/listings/listings-components.tsx src/lib/category-fields.ts src/routes/listings.index.tsx
      - run: npm run typecheck -- --pretty false
      - name: Commit verified product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/search/QuickFilterRail.tsx \
            src/features/search/FilterBottomSheet.tsx \
            src/features/listings/listings-components.tsx \
            src/lib/category-fields.ts \
            src/routes/listings.index.tsx \
            scripts/listings-filter-actions-and-depth.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: route quick filters and expand discovery options"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
