# Saudi frontend release with first-load gateway verification: 2026-08-02
name: Deploy Saudi frontend release

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/saudi-frontend-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rawaj-saudi-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish Saudi frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      WORKER_NAME: rawaj-saudi-web
      WORKER_URL: https://rawaj-saudi-web.allidamech.workers.dev
      FINAL_SITE_URL: https://sa.rawa-j.com
      FIREBASE_PROJECT_ID: project-af18fcaf-c46e-4ec5-93a
    steps:
      - name: Check out isolated Saudi branch
        uses: actions/checkout@v4
        with:
          ref: saudi
          fetch-depth: 1

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_PRODUCTION_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Saudi runtime boundary
        run: npm run test:runtime-boundary

      - name: Verify Saudi first-load gateway contract
        run: node --test scripts/saudi-first-load-api-gateway.test.mjs

      - name: Type-check Saudi frontend
        run: npm run typecheck

      - name: Build Cloudflare Worker package
        run: npm run build

      - name: Verify shared Firebase auth bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "$FIREBASE_PROJECT_ID" .output/public/assets
          if grep -R -q "rawaj-saudi-auth-pending" .output/public/assets; then
            echo "Saudi frontend still contains pending Firebase configuration" >&2
            exit 1
          fi

      - name: Prepare isolated Worker configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/server/wrangler.json
          test -d .output/public/assets
          node <<'NODE'
          const fs = require("node:fs");
          const path = ".output/server/wrangler.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          if (config.main !== "index.mjs") throw new Error("Unexpected Saudi frontend entrypoint");
          if (config.assets?.directory !== "../public") throw new Error("Unexpected Saudi asset directory");
          config.name = process.env.WORKER_NAME;
          config.assets.run_worker_first = true;
          config.services = [
            {
              binding: "SAUDI_API",
              service: "rawaj-saudi-classifieds",
            },
          ];
          config.observability = { enabled: true };
          if (config.services?.[0]?.binding !== "SAUDI_API") {
            throw new Error("Saudi API service binding is missing");
          }
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Deploy Saudi frontend Worker
        run: npx --yes wrangler@4.118.0 deploy --config .output/server/wrangler.json

      - name: Verify first load and same-origin API on Worker and custom domain
        shell: bash
        run: |
          set -euo pipefail
          for origin in "$WORKER_URL" "$FINAL_SITE_URL"; do
            cache_bust="first-load-$(date +%s%N)"
            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/?release=$cache_bust" > "/tmp/home-$(echo "$origin" | tr -cd '[:alnum:]').html"
            home_file="/tmp/home-$(echo "$origin" | tr -cd '[:alnum:]').html"
            grep -q "سوق إعلانات مبوبة في السعودية" "$home_file"
            grep -q "سيارات ومركبات" "$home_file"
            grep -q "عقارات" "$home_file"
            if grep -q '/_vercel/insights/script.js' "$home_file"; then
              echo "Vercel Analytics was rendered on Cloudflare origin: $origin" >&2
              exit 1
            fi

            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/v1/health?release=$cache_bust" > "/tmp/health-$(echo "$origin" | tr -cd '[:alnum:]').json"
            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/v1/references?release=$cache_bust" > "/tmp/references-$(echo "$origin" | tr -cd '[:alnum:]').json"
          done

          node <<'NODE'
          const fs = require("node:fs");
          const origins = [process.env.WORKER_URL, process.env.FINAL_SITE_URL];
          const fileKey = (origin) => origin.replace(/[^a-z0-9]/gi, "");
          for (const origin of origins) {
            const health = JSON.parse(fs.readFileSync(`/tmp/health-${fileKey(origin)}.json`, "utf8"));
            const refs = JSON.parse(fs.readFileSync(`/tmp/references-${fileKey(origin)}.json`, "utf8"));
            if (health.data?.database !== "ready") {
              throw new Error(`Saudi API proxy health failed on ${origin}`);
            }
            if (!new Set(["rawaj-classifieds-hub", "rawaj-saudi-classifieds"]).has(health.data?.service)) {
              throw new Error(`Unexpected Saudi API service on ${origin}: ${health.data?.service}`);
            }
            if ((refs.data?.categories?.length || 0) < 12) {
              throw new Error(`Saudi categories are incomplete on ${origin}`);
            }
            if ((refs.data?.taxonomyNodes?.length || 0) !== 117) {
              throw new Error(`Saudi taxonomy is incomplete on ${origin}`);
            }
            if ((refs.data?.governorates?.length || 0) !== 13) {
              throw new Error(`Saudi regions are incomplete on ${origin}`);
            }
          }
          console.log("Saudi first-load release verified on Worker URL and sa.rawa-j.com.");
          NODE

      - name: Record successful release
        shell: bash
        run: |
          saudi_sha="$(git rev-parse HEAD)"
          gh issue comment 602 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Saudi frontend deployed at **$FINAL_SITE_URL** from Saudi commit \`$saudi_sha\`. First-load HTML, the SAUDI_API service binding, same-origin health/references, 12 categories, 117 taxonomy nodes, 13 regions, and Cloudflare-only analytics behavior all passed on both the Worker URL and custom domain."
