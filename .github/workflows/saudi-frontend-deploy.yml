# Saudi frontend monitored production release with Worker-first routing: 2026-08-02
name: Deploy Saudi frontend release

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/saudi-frontend-deploy.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/saudi-frontend-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rawaj-saudi-frontend-production-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish Saudi frontend
    if: github.event_name != 'pull_request' || github.head_ref == 'release/saudi-frontend-production-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      WORKER_NAME: rawaj-saudi-web
      WORKER_URL: https://rawaj-saudi-web.allidamech.workers.dev
    steps:
      - name: Announce monitored release start
        shell: bash
        run: |
          gh issue comment 602 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Saudi frontend monitored release started from workflow run \`$GITHUB_RUN_ID\`."

      - name: Check out isolated Saudi branch
        uses: actions/checkout@v4
        with:
          ref: saudi
          fetch-depth: 1

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_PRODUCTION_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Saudi runtime boundary
        run: npm run test:runtime-boundary

      - name: Type-check Saudi frontend
        run: npm run typecheck

      - name: Build Cloudflare Worker package
        run: npm run build

      - name: Prepare isolated Worker configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/server/wrangler.json
          test -d .output/public/assets
          node <<'NODE'
          const fs = require("node:fs");
          const path = ".output/server/wrangler.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          if (config.main !== "index.mjs") throw new Error("Unexpected Saudi frontend entrypoint");
          if (config.assets?.directory !== "../public") throw new Error("Unexpected Saudi asset directory");
          config.name = process.env.WORKER_NAME;
          config.assets.run_worker_first = true;
          config.observability = { enabled: true };
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Deploy Saudi frontend Worker
        run: npx --yes wrangler@4.118.0 deploy --config .output/server/wrangler.json

      - name: Capture public route diagnostics
        id: diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -u
          fetch_route() {
            local label="$1"
            local path="$2"
            local body="/tmp/${label}.body"
            local headers="/tmp/${label}.headers"
            local error="/tmp/${label}.error"
            local status
            status="$(curl --silent --show-error --max-time 30 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$WORKER_URL$path" 2>"$error" || true)"
            echo "${label}_status=${status:-000}" >> "$GITHUB_OUTPUT"
            echo "=== $label $path ==="
            echo "HTTP ${status:-000}"
            grep -iE '^(content-type|cf-ray|server|location|x-rawaj-build-commit):' "$headers" || true
            if [ -s "$error" ]; then
              echo "curl error:"
              cat "$error"
            fi
            echo "body bytes: $(wc -c < "$body" 2>/dev/null || echo 0)"
            echo "body preview:"
            head -c 1200 "$body" 2>/dev/null || true
            echo
          }

          fetch_route home /
          fetch_route health /v1/health
          fetch_route references /v1/references

          node <<'NODE'
          const fs = require("node:fs");
          function read(path) {
            try { return fs.readFileSync(path, "utf8"); } catch { return ""; }
          }
          const home = read("/tmp/home.body");
          const healthText = read("/tmp/health.body");
          const refsText = read("/tmp/references.body");
          const report = {
            home: {
              hasSaudiTitle: home.includes("سوق إعلانات مبوبة في السعودية"),
              hasCars: home.includes("سيارات ومركبات"),
              hasRealEstate: home.includes("عقارات"),
              hasTechnicalError: home.includes("خطأ تقني") || home.includes("Technical error"),
            },
            healthJson: null,
            referencesJson: null,
          };
          try { report.healthJson = JSON.parse(healthText); } catch {}
          try { report.referencesJson = JSON.parse(refsText); } catch {}
          fs.writeFileSync("/tmp/saudi-diagnostics.json", JSON.stringify(report, null, 2));
          console.log("Diagnostic summary:");
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Publish public route diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "## Saudi frontend public-route diagnostics"
            echo
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo "- Worker: \`$WORKER_URL\`"
            echo "- Home HTTP: \`${{ steps.diagnostics.outputs.home_status || 'unknown' }}\`"
            echo "- Health HTTP: \`${{ steps.diagnostics.outputs.health_status || 'unknown' }}\`"
            echo "- References HTTP: \`${{ steps.diagnostics.outputs.references_status || 'unknown' }}\`"
            echo
            echo '```json'
            cat /tmp/saudi-diagnostics.json 2>/dev/null || echo '{"diagnostics":"unavailable"}'
            echo '```'
          } > /tmp/saudi-public-diagnostics.md
          gh issue comment 602 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/saudi-public-diagnostics.md

      - name: Verify homepage and same-origin API proxy
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.diagnostics.outputs.home_status }}" = "200"
          test "${{ steps.diagnostics.outputs.health_status }}" = "200"
          test "${{ steps.diagnostics.outputs.references_status }}" = "200"
          grep -q "سوق إعلانات مبوبة في السعودية" /tmp/home.body
          grep -q "سيارات ومركبات" /tmp/home.body
          grep -q "عقارات" /tmp/home.body

          node <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("/tmp/health.body", "utf8"));
          const refs = JSON.parse(fs.readFileSync("/tmp/references.body", "utf8"));
          if (health.data?.service !== "rawaj-saudi-classifieds" || health.data?.database !== "ready") {
            throw new Error("Saudi API proxy health verification failed");
          }
          if ((refs.data?.categories?.length || 0) < 12) throw new Error("Saudi categories are incomplete");
          if ((refs.data?.governorates?.length || 0) !== 13) throw new Error("Saudi regions are incomplete");
          console.log(`Saudi web release verified: ${refs.data.categories.length} categories, ${refs.data.governorates.length} regions.`);
          NODE

      - name: Record successful release
        shell: bash
        run: |
          saudi_sha="$(git rev-parse HEAD)"
          gh issue comment 602 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Saudi public frontend deployed successfully at **$WORKER_URL** from Saudi commit \`$saudi_sha\`. Homepage and same-origin API proxy verification passed with 12 categories and 13 regions."

      - name: Record failed release
        if: failure()
        shell: bash
        run: |
          gh issue comment 602 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Saudi frontend release failed in workflow run \`$GITHUB_RUN_ID\`. Public-route diagnostics were recorded above."
