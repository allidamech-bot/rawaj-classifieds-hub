name: Supabase Local Replay Gate

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "docs/production-schema/migration-ledger.json"
      - "scripts/replay-supabase-local.mjs"
      - "scripts/sql/clean-replay-compatibility-prelude.sql"
      - "scripts/sql/taxonomy-foundation-local-verification.sql"
      - ".github/workflows/supabase-local-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -qq --yes --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Start disposable Supabase stack
        shell: bash
        run: |
          set -Eeuo pipefail
          supabase stop --no-backup >/dev/null 2>&1 || true

          migration_backup="$RUNNER_TEMP/rawaj-supabase-migrations"
          startup_log="$RUNNER_TEMP/rawaj-supabase-start.log"
          rm -rf "$migration_backup"
          mv supabase/migrations "$migration_backup"
          mkdir -p supabase/migrations

          restore_migrations() {
            rm -rf supabase/migrations
            mv "$migration_backup" supabase/migrations
          }
          trap restore_migrations EXIT

          if ! supabase start >"$startup_log" 2>&1; then
            echo "Supabase startup failed. Last 80 log lines:"
            tail -n 80 "$startup_log"
            exit 1
          fi

          restore_migrations
          trap - EXIT
          echo "Disposable Supabase stack started successfully."

      - name: Replay canonical database history and verify invariants
        id: replay
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -o pipefail
          node scripts/replay-supabase-local.mjs 2>&1 | tee "$RUNNER_TEMP/rawaj-supabase-replay.log"

      - name: Upload replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-local-replay-${{ github.sha }}
          path: ${{ runner.temp }}/rawaj-supabase-replay.log
          if-no-files-found: warn
          retention-days: 7

      - name: Lint replayed database
        if: steps.replay.outcome == 'success'
        run: supabase db lint --local --level error

      - name: Fail when replay verification failed
        if: steps.replay.outcome == 'failure'
        run: exit 1

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup >/dev/null 2>&1 || true
