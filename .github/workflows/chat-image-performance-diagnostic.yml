name: Chat Image Performance Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chat-image-performance-diagnostic.yml"
      - "src/routes/chats.tsx"
      - "src/lib/api/messaging.ts"
      - "src/lib/api/chat-image-attachments.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capture performance report
        shell: bash
        run: |
          set +e
          node scripts/performance-budget.mjs > performance-budget.log 2>&1
          echo "$?" > performance-budget.status
          cat performance-budget.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: chat-image-performance-diagnostic
          path: |
            performance-budget-report.json
            performance-budget.log
            performance-budget.status
