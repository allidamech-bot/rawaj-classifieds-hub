name: Format Batch 8 final

on:
  push:
    branches:
      - agent/launch-readiness-batch-8

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness-batch-8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format final Batch 8 files
        run: npx prettier --write src/routes/category.\$slug.tsx src/routes/syria.\$slug.tsx scripts/launch-readiness-batch-8.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/category.\$slug.tsx src/routes/syria.\$slug.tsx scripts/launch-readiness-batch-8.test.mjs
          git commit -m "Format final Batch 8 fixes"
          git push origin HEAD:agent/launch-readiness-batch-8
