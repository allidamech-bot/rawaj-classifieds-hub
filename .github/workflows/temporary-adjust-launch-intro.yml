name: Temporary Adjust Launch Intro

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  adjust:
    if: github.head_ref == 'agent/android-release-readiness-1-0-3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Adjust launch intro timing and contract
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("android/app/src/main/java/com/rawaj/marketplace/MainActivity.java"): [
                  ("INTRO_MIN_VISIBLE_MS = 650L", "INTRO_MIN_VISIBLE_MS = 1400L"),
                  ("INTRO_MAX_VISIBLE_MS = 2400L", "INTRO_MAX_VISIBLE_MS = 3000L"),
              ],
              Path("scripts/android-release-readiness.test.mjs"): [
                  ("INTRO_MIN_VISIBLE_MS = 650L", "INTRO_MIN_VISIBLE_MS = 1400L"),
                  ("INTRO_MAX_VISIBLE_MS = 2400L", "INTRO_MAX_VISIBLE_MS = 3000L"),
              ],
          }

          for path, pairs in replacements.items():
              source = path.read_text(encoding="utf-8")
              original = source
              for old, new in pairs:
                  if old in source:
                      source = source.replace(old, new, 1)
                  elif new not in source:
                      raise SystemExit(f"Expected timing marker not found in {path}: {old}")
              if source != original:
                  path.write_text(source, encoding="utf-8")
          PY

      - name: Commit timing adjustment
        run: |
          if git diff --quiet; then
            echo "Launch intro timing is already adjusted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/rawaj/marketplace/MainActivity.java scripts/android-release-readiness.test.mjs
          git commit -m "Keep Android launch intro visible long enough"
          git push origin HEAD:${{ github.head_ref }}
