# Trigger after Saudi jose dependency repair: 2026-08-02
name: Dispatch and report Saudi bootstrap

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-saudi-bootstrap.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: dispatch-rawaj-saudi-cloudflare-production
  cancel-in-progress: false

jobs:
  dispatch:
    name: Run and report Saudi Cloudflare bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: saudi-cloudflare-bootstrap.yml
      REPORT_PR: "593"
    steps:
      - name: Announce dispatcher start
        shell: bash
        run: |
          gh pr comment "$REPORT_PR" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Saudi bootstrap dispatcher started for commit \`$GITHUB_SHA\`."

      - name: Dispatch Saudi bootstrap
        id: dispatch
        shell: bash
        run: |
          set -u
          before="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$TARGET_WORKFLOW" \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0' 2>/tmp/saudi-before-error.txt || echo 0)"

          dispatch_output="$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            -f ref=main 2>&1)"
          dispatch_rc=$?

          if [ "$dispatch_rc" -ne 0 ]; then
            echo "dispatch_ok=false" >> "$GITHUB_OUTPUT"
            printf '%s' "$dispatch_output" | base64 -w0 > /tmp/saudi-dispatch-error.b64
            echo "dispatch_error_b64=$(cat /tmp/saudi-dispatch-error.b64)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "dispatch_ok=true" >> "$GITHUB_OUTPUT"
          run_id=""
          for _ in $(seq 1 45); do
            current="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$TARGET_WORKFLOW" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)"
            if [ "$current" != "0" ] && [ "$current" != "$before" ]; then
              run_id="$current"
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "resolve_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "resolve_ok=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched Saudi bootstrap run $run_id"

      - name: Wait for Saudi bootstrap
        id: watch
        if: steps.dispatch.outputs.run_id != ''
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gh run watch "${{ steps.dispatch.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status

      - name: Report dispatcher failure
        if: always() && steps.dispatch.outputs.run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          error_text="No workflow run id was created."
          if [ -n "${{ steps.dispatch.outputs.dispatch_error_b64 }}" ]; then
            error_text="$(printf '%s' '${{ steps.dispatch.outputs.dispatch_error_b64 }}' | base64 --decode)"
          fi
          {
            echo "## Saudi bootstrap dispatcher failed"
            echo
            echo "- Dispatch accepted: \`${{ steps.dispatch.outputs.dispatch_ok || 'unknown' }}\`"
            echo "- Run resolved: \`${{ steps.dispatch.outputs.resolve_ok || 'false' }}\`"
            echo
            echo '```text'
            printf '%s\n' "$error_text"
            echo '```'
          } > /tmp/saudi-dispatch-failure.md
          gh pr comment "$REPORT_PR" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/saudi-dispatch-failure.md
          exit 1

      - name: Report detailed result
        id: report
        if: always() && steps.dispatch.outputs.run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          run_id="${{ steps.dispatch.outputs.run_id }}"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"

          conclusion="$(jq -r '.conclusion // .status // "unknown"' <<<"$run_json")"
          html_url="$(jq -r '.html_url' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"

          {
            echo "## Saudi Cloudflare bootstrap: \`$conclusion\`"
            echo
            echo "- Run: [$run_id]($html_url)"
            echo "- Commit: \`$head_sha\`"
            echo "- Worker: \`rawaj-saudi-classifieds\`"
            echo "- D1: \`rawaj-saudi-production\`"
            echo "- R2: \`rawaj-saudi-media-production\`"
            echo
            echo "### Jobs and steps"
            jq -r '
              .jobs[] |
              "#### " + .name + " — `" + (.conclusion // .status // "unknown") + "`\n" +
              ((.steps // []) | map("- " + .name + ": `" + (.conclusion // .status // "unknown") + "`") | join("\n"))
            ' <<<"$jobs_json"
          } > /tmp/saudi-bootstrap-report.md

          gh pr comment "$REPORT_PR" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/saudi-bootstrap-report.md

          if [ "$conclusion" != "success" ]; then
            exit 1
          fi
