name: Temporary Search Contract Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture contract output
        run: node --test scripts/search-filters-v1.test.mjs > search-contract.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: search-contract-diagnostic
          path: search-contract.log
          retention-days: 1
