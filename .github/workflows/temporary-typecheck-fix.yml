name: Temporary Typecheck Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'design/trust-support-hub-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/trust-support-hub-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix nullable display name and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/support.tsx')
          source = path.read_text()
          old = 'displayName={auth.profile?.displayName}'
          new = 'displayName={auth.profile?.displayName ?? undefined}'
          if old not in source:
              raise RuntimeError('Missing nullable displayName anchor')
          path.write_text(source.replace(old, new, 1))
          PY
          npx prettier --write src/routes/support.tsx
          npm run typecheck -- --pretty false
      - name: Commit fix and remove diagnostics
        run: |
          rm .github/workflows/temporary-typecheck-diagnostic.yml
          rm .github/workflows/temporary-typecheck-fix.yml
          rm typecheck-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/support.tsx
          git add -u .github/workflows/temporary-typecheck-diagnostic.yml
          git add -u .github/workflows/temporary-typecheck-fix.yml
          git add -u typecheck-diagnostic.txt
          git commit -m "Fix Trust Support Hub typecheck"
          git push origin HEAD:design/trust-support-hub-v2
