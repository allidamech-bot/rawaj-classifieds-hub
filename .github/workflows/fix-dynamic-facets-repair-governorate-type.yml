name: Fix Dynamic Facets Repair Governorate Type

on:
  pull_request:
    paths:
      - ".github/workflows/fix-dynamic-facets-repair-governorate-type.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply exact final facets type repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("supabase/migrations/202607190041_dynamic_listing_facets_repair_v1.sql")
          source = path.read_text(encoding="utf-8")
          old = "listing_row.governorate_id = p_governorate_id"
          new = "listing_row.governorate_id = p_governorate_id::text"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one governorate comparison, found {count}")
          path.write_text(source.replace(old, new), encoding="utf-8")
      - name: Verify focused SQL contracts
        run: |
          npm ci
          node --test scripts/dynamic-listing-facets-v1.test.mjs
          node --test scripts/dynamic-listing-search-v1.test.mjs
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          branch='${{ github.event.pull_request.head.ref || github.ref_name }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202607190041_dynamic_listing_facets_repair_v1.sql
          git commit -m "fix: align repaired facets governorate type"
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
