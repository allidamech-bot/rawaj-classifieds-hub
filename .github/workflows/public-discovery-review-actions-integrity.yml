name: Public Discovery Review Actions Integrity

on:
  pull_request:
    paths:
      - "src/routes/categories.tsx"
      - "src/features/listings/use-listings-results.ts"
      - "src/features/listings/use-listings-pagination.ts"
      - "src/features/reviews/SellerReviewCard.tsx"
      - "scripts/public-discovery-review-actions-integrity.test.mjs"
      - ".github/workflows/public-discovery-review-actions-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-discovery-review-actions-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/public-discovery-review-actions-integrity.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
