name: Patch admin extended recovery

on:
  push:
    branches:
      - feature/recover-admin-extended-queues

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-admin-extended-queues
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply focused recovery patches
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/recover_admin_extended.py
          python /tmp/recover_admin_extended.py
      - name: Format and validate focused files
        run: |
          npx prettier --write \
            src/routes/admin.listings.tsx \
            src/routes/admin.verifications.tsx \
            src/routes/admin.promotions.tsx \
            src/routes/admin.audit.tsx \
            src/routes/admin.owner-controls.tsx \
            src/routes/admin.ad-placements.tsx \
            scripts/admin-security-regression.mjs
          npx eslint \
            src/routes/admin.listings.tsx \
            src/routes/admin.verifications.tsx \
            src/routes/admin.promotions.tsx \
            src/routes/admin.audit.tsx \
            src/routes/admin.owner-controls.tsx \
            src/routes/admin.ad-placements.tsx
          node scripts/admin-security-regression.mjs
          npm run typecheck
      - name: Commit focused result and remove runner
        shell: bash
        run: |
          rm .github/workflows/patch-admin-extended-recovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Recover extended admin queues safely'
          git push origin HEAD:feature/recover-admin-extended-queues
