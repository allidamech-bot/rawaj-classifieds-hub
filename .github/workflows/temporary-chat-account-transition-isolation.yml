name: Temporary chat account transition isolation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-chat-account-transition-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.head_ref == 'fix/chat-composer-scope-isolation-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/chat-composer-scope-isolation-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded account transition isolation
        run: node scripts/apply-chat-account-transition-isolation.mjs

      - name: Format and validate
        run: |
          npx prettier --write \
            src/routes/chats.tsx \
            scripts/chat-composer-scope-isolation.test.mjs
          npx eslint --fix \
            src/routes/chats.tsx \
            scripts/chat-composer-scope-isolation.test.mjs
          npm run test:chat-workspace
          npm run test:listing-quality-chat-safety
          npm run typecheck -- --pretty false

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routes/chats.tsx \
            scripts/chat-composer-scope-isolation.test.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "fix: isolate chat state across account transitions"
          git push origin HEAD:fix/chat-composer-scope-isolation-v2
