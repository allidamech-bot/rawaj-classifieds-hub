name: Ad Placement Image Replacement Contract

on:
  pull_request:
    paths:
      - "src/lib/api/public-ad-placements.ts"
      - "src/lib/classifieds-api.ts"
      - "scripts/ad-placement-image-replacement.test.mjs"
      - ".github/workflows/ad-placement-image-replacement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ad placement image replacement contract
        run: node --test scripts/ad-placement-image-replacement.test.mjs
      - name: Lint changed TypeScript
        run: npx eslint --quiet src/lib/api/public-ad-placements.ts src/lib/classifieds-api.ts
