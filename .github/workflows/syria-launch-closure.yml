name: Syria Launch Closure

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: syria-launch-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syria launch closure contract
        run: node --test scripts/syria-launch-closure-contract.test.mjs

      - name: Supabase Storage Egress log summary contract
        run: node --test scripts/supabase-storage-log-summary.test.mjs
