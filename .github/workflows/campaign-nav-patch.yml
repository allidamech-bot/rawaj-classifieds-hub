name: Campaign Navigation Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/campaign-manager' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-manager
          fetch-depth: 0
      - name: Patch navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/admin.tsx')
          s=p.read_text()
          s=s.replace('  BadgeCheck,\n', '  BadgeCheck,\n  Megaphone,\n', 1)
          marker='''  {\n    to: "/admin/ad-placements",\n    labelAr: "مساحات الإعلانات",\n    icon: PanelsTopLeft,\n    permission: "canManageAdPlacements",\n  },\n'''
          insert=marker+'''  {\n    to: "/admin/campaigns",\n    labelAr: "الحملات",\n    icon: Megaphone,\n    permission: "canManageAdCampaigns",\n  },\n'''
          if marker not in s: raise SystemExit('navigation marker not found')
          p.write_text(s.replace(marker, insert, 1))
          PY
          rm .github/workflows/campaign-nav-patch.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx .github/workflows/campaign-nav-patch.yml
          git commit -m "Add campaign manager navigation"
          git push origin HEAD:feature/campaign-manager
