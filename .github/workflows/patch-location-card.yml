name: Patch listing card location display

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'use-location-display-card' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: use-location-display-card
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch listing card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/features/listings/listings-components.tsx')
          s = p.read_text()
          s = s.replace(
              'import { categoryName, formatPriceLocalized, governorateName } from "@/lib/i18n";\n',
              'import { categoryName, formatPriceLocalized } from "@/lib/i18n";\nimport { listingLocationDisplay } from "@/lib/listing-location-display";\n',
              1,
          )
          old = '''              {governorateName(
                listing.governorateId,
                listing.governorateNameAr ?? undefined,
                language,
              )}
              {listing.districtAr ? ` · ${listing.districtAr}` : ""}'''
          new = '''              {listingLocationDisplay(listing, language)}'''
          if old not in s:
              raise SystemExit('location display block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          npx prettier --write src/features/listings/listings-components.tsx
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/listings/listings-components.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use shared listing location display"
          git push origin HEAD:use-location-display-card
