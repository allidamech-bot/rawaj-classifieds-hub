name: Mobile Structural Page Application Contract
on:
  pull_request:
    paths:
      - "src/mobile-structural-ui.css"
      - "src/auth-stable-route-styles.css"
      - "scripts/mobile-structural-page-application.test.mjs"
      - ".github/workflows/mobile-structural-page-application.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/mobile-structural-page-application.test.mjs
