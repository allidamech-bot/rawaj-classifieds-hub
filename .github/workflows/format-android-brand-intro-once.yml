name: Format Android Brand Intro Once

on:
  push:
    branches:
      - agent/android-brand-intro-1-0-3
    paths:
      - ".github/workflows/format-android-brand-intro-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/android-brand-intro-1-0-3
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply project lint fixes
        run: npx eslint --fix scripts/launch-readiness-batch-7.test.mjs

      - name: Remove one-time workflow
        run: rm .github/workflows/format-android-brand-intro-once.yml

      - name: Commit formatted contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/launch-readiness-batch-7.test.mjs .github/workflows/format-android-brand-intro-once.yml
          git commit -m "Format Android brand intro contract"
          git push origin HEAD:agent/android-brand-intro-1-0-3
