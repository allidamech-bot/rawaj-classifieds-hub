name: SYP Phase A Staging Snapshot

on:
  push:
    branches:
      - agent/syp-denomination-phase-a
    paths:
      - ".github/workflows/syp-phase-a-staging-snapshot.yml"
      - "supabase/migrations/**"
      - "docs/production-schema/migration-ledger.json"
      - "scripts/replay-supabase-local.mjs"
      - "scripts/sql/clean-replay-*.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syp-phase-a-staging-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-pre-phase-a-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Start disposable Supabase stack
        shell: bash
        run: |
          set -Eeuo pipefail
          supabase stop --no-backup >/dev/null 2>&1 || true

          migration_backup="$RUNNER_TEMP/rawaj-supabase-migrations"
          startup_log="$RUNNER_TEMP/syp-phase-a-snapshot-start.log"
          rm -rf "$migration_backup"
          mv supabase/migrations "$migration_backup"
          mkdir -p supabase/migrations

          restore_migrations() {
            rm -rf supabase/migrations
            mv "$migration_backup" supabase/migrations
          }
          trap restore_migrations EXIT

          if ! supabase start >"$startup_log" 2>&1; then
            echo "Supabase startup failed. Last 80 log lines:"
            tail -n 80 "$startup_log"
            exit 1
          fi

          restore_migrations
          trap - EXIT

      - name: Build canonical pre-Phase-A baseline
        shell: bash
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -Eeuo pipefail
          ledger="docs/production-schema/migration-ledger.json"
          ledger_backup="$RUNNER_TEMP/syp-phase-a-snapshot-ledger.json"
          cp "$ledger" "$ledger_backup"

          restore_ledger() {
            cp "$ledger_backup" "$ledger"
          }
          trap restore_ledger EXIT

          node <<'NODE'
          const fs = require("node:fs");
          const path = "docs/production-schema/migration-ledger.json";
          const target = "202607210001_syp_denomination_phase_a.sql";
          const ledger = JSON.parse(fs.readFileSync(path, "utf8"));
          for (const [key, value] of Object.entries(ledger.classifications ?? {})) {
            if (Array.isArray(value)) {
              ledger.classifications[key] = value.filter((filename) => filename !== target);
            }
          }
          fs.writeFileSync(path, `${JSON.stringify(ledger, null, 2)}\n`);
          NODE

          node scripts/replay-supabase-local.mjs 2>&1 \
            | tee "$RUNNER_TEMP/syp-phase-a-snapshot-replay.log"

          restore_ledger
          trap - EXIT

      - name: Export Supabase-compatible baseline schema
        shell: bash
        run: |
          set -Eeuo pipefail
          supabase db dump \
            --local \
            --file "$RUNNER_TEMP/rawaj-pre-phase-a-schema.sql"
          sha256sum "$RUNNER_TEMP/rawaj-pre-phase-a-schema.sql" \
            | tee "$RUNNER_TEMP/rawaj-pre-phase-a-schema.sha256"
          wc -c "$RUNNER_TEMP/rawaj-pre-phase-a-schema.sql"

      - name: Upload staging schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-pre-phase-a-staging-schema-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rawaj-pre-phase-a-schema.sql
            ${{ runner.temp }}/rawaj-pre-phase-a-schema.sha256
            ${{ runner.temp }}/syp-phase-a-snapshot-start.log
            ${{ runner.temp }}/syp-phase-a-snapshot-replay.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup >/dev/null 2>&1 || true
