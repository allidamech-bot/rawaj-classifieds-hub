name: Temporary listing orphan lint diagnostic

on:
  push:
    branches:
      - feature/listing-image-orphan-recovery

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/listing-image-orphan-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - shell: bash
        run: |
          set +e
          npx eslint --quiet \
            scripts/listing-image-content-reliability.test.mjs \
            src/lib/api/listing-image-upload-guarded.ts \
            src/lib/api/listing-image-upload-journal.ts \
            > listing-orphan-eslint-diagnostic.txt 2>&1
          echo "EXIT_STATUS=$?" >> listing-orphan-eslint-diagnostic.txt
          exit 0
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listing-orphan-eslint-diagnostic.txt
          git commit -m "Capture listing orphan lint diagnostic"
          git push origin HEAD:feature/listing-image-orphan-recovery
