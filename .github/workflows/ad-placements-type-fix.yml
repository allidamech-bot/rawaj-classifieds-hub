name: Ad Placements Type Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/ad-placements-management' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ad-placements-management
          fetch-depth: 0

      - name: Fix stale error code and remove diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/api/ad-placements.ts')
          text = path.read_text()
          text = text.replace('code: "stale_ad_placement"', 'code: "unknown"')
          path.write_text(text)
          PY
          rm -f ad-placements-typecheck-output.txt
          rm .github/workflows/ad-placements-type-fix.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/ad-placements.ts ad-placements-typecheck-output.txt .github/workflows/ad-placements-type-fix.yml
          git commit -m "Fix ad placements stale error typing"
          git push origin HEAD:feature/ad-placements-management
