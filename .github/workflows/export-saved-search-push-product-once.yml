name: Export Saved Search Push Product Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/export-saved-search-push-product-once.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - run: npm install @capacitor/push-notifications@^8.0.0 --save
      - name: Apply validated integration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-saved-search-push-integration.py")
          text = path.read_text(encoding="utf-8")
          old = '''        '      } else if (target.kind === "saved_search") {\\n'
                  '        void navigate({ to: "/saved-searches" });\\n'
          '''
          new = '''        '      } else if (target.kind === "saved_search") {\\n'
                  '        void navigate({\\n'
                  '          to: "/saved-searches",\\n'
                  '          search: {\\n'
                  '            q: "",\\n'
                  '            category: "",\\n'
                  '            subcategory: "",\\n'
                  '            gov: "",\\n'
                  '            district: "",\\n'
                  '            price_min: "",\\n'
                  '            price_max: "",\\n'
                  '            car_make: "",\\n'
                  '            car_model: "",\\n'
                  '            fuel: "",\\n'
                  '            transmission: "",\\n'
                  '            property_purpose: "",\\n'
                  '            property_type: "",\\n'
                  '            rooms: "",\\n'
                  '            rental_duration: "",\\n'
                  '            electronics_brand: "",\\n'
                  '            detail_condition: "",\\n'
                  '            employment_type: "",\\n'
                  '            salary_type: "",\\n'
                  '            sort: "latest",\\n'
                  '          },\\n'
                  '        });\\n'
          '''
          if old not in text:
              raise SystemExit("Saved-search navigation template not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/apply-saved-search-push-integration.py
          mkdir -p .output/public
          printf '<!doctype html><html lang="ar"><body></body></html>\n' > .output/public/index.html
          npx cap sync android
          git ls-files -z android/app/src/main/assets/public | xargs -0 -r git checkout --
          git clean -fd android/app/src/main/assets/public
          rm -rf .output
          npx prettier --write \
            .github/workflows/quality-gate.yml \
            capacitor.config.ts \
            docs/production-schema/migration-ledger.json \
            package.json \
            scripts/saved-search-background-alerts.test.mjs \
            src/lib/native-push.ts \
            src/routes/more.tsx \
            src/routes/notifications.tsx \
            src/routes/saved-searches.tsx
      - name: Verify exported product
        run: |
          npm run test:saved-search-push
          npm run test:activity-center
          npm run typecheck -- --pretty false
          npm run build
          (cd android && bash ./gradlew :app:assembleDebug --no-daemon)
      - name: Package product files
        run: |
          tar -czf saved-search-push-product.tar.gz \
            .github/workflows/quality-gate.yml \
            android/app/capacitor.build.gradle \
            android/app/src/main/assets/capacitor.plugins.json \
            android/capacitor.settings.gradle \
            capacitor.config.ts \
            docs/production-schema/migration-ledger.json \
            package-lock.json \
            package.json \
            scripts/saved-search-background-alerts.test.mjs \
            src/lib/native-push.ts \
            src/routes/more.tsx \
            src/routes/notifications.tsx \
            src/routes/saved-searches.tsx
          git diff --name-status > product-diff.txt
      - uses: actions/upload-artifact@v4
        with:
          name: saved-search-push-product-${{ github.run_id }}
          path: |
            saved-search-push-product.tar.gz
            product-diff.txt
          retention-days: 1
