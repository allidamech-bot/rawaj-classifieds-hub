name: Fix Dynamic Condition Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-dynamic-condition-once.yml"

permissions:
  contents: write

concurrency:
  group: fix-dynamic-condition-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve governed listing condition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/routes/add-listing.tsx")
          source = path.read_text(encoding="utf-8")

          source, count = re.subn(
              r'''  const showGlobalCondition =\n\s+!dynamicSchemaActive && categoryUsesGlobalCondition\(categoryFieldKind\);\n  const requiresPreciseLocation = categoryRequiresPreciseLocation\(categoryFieldKind\);''',
              '''  const dynamicSchemaUsesListingCondition = Boolean(
            dynamicSchemaActive &&
              dynamicSchema?.fields.some((field) => field.key === "listing_condition"),
          );
          const showGlobalCondition =
            !dynamicSchemaActive && categoryUsesGlobalCondition(categoryFieldKind);
          const requiresPreciseLocation = categoryRequiresPreciseLocation(categoryFieldKind);''',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Dynamic condition derived-state replacements: {count}")

          source, count = re.subn(
              r'''  useEffect\(\(\) => \{\n\s+if \(!showGlobalCondition && condition !== "not_applicable"\) \{\n\s+setCondition\("not_applicable"\);\n\s+\}\n  \}, \[condition, showGlobalCondition\]\);''',
              '''  useEffect(() => {
            if (
              !showGlobalCondition &&
              !dynamicSchemaUsesListingCondition &&
              condition !== "not_applicable"
            ) {
              setCondition("not_applicable");
            }
          }, [condition, dynamicSchemaUsesListingCondition, showGlobalCondition]);''',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Dynamic condition reset replacements: {count}")

          source, count = re.subn(
              r'''(  function handleDynamicValuesChange\(nextValues: DynamicListingValues\) \{\n\s+setDynamicValues\(nextValues\);\n)\s+if \(!dynamicSchema\?\.fields\.some\(\(field\) => field\.key === "listing_condition"\)\) return;''',
              r'''\1    if (!dynamicSchemaUsesListingCondition) return;''',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Dynamic condition handler replacements: {count}")

          path.write_text(source, encoding="utf-8")
          PY
          npx prettier --write src/routes/add-listing.tsx
      - name: Commit condition fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/add-listing.tsx
          git commit -m "fix: preserve governed listing condition"
          git push origin HEAD:feature/taxonomy-search-foundation-v1
