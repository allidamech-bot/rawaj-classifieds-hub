name: Fix listing reservation UI lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/listing-reservation-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/listing-reservation-ui

      - name: Apply exact ESLint fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/profile/listings.tsx')
          text = path.read_text()
          old = '!Boolean(listing.reservedAt)'
          new = '!listing.reservedAt'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one redundant Boolean reservation cast.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit lint fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/profile/listings.tsx
          git commit -m "Fix listing reservation UI lint"
          git push origin HEAD:feature/listing-reservation-ui
