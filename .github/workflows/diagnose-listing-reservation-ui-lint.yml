name: Diagnose listing reservation UI lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    if: github.head_ref == 'feature/listing-reservation-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture owner listings ESLint JSON
        shell: bash
        run: |
          npx eslint --format json src/routes/profile/listings.tsx > /tmp/owner-eslint.json || true
          test -s /tmp/owner-eslint.json

      - name: Upload ESLint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: owner-listings-eslint-diagnostics
          path: /tmp/owner-eslint.json
          if-no-files-found: error
