name: Verify Worker 0e223 After Propagation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-worker-0e223.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_RELEASE_SHA: 0e223288e58f34979e080f19dde7d121f88a9e76
      WORKER_BASE_URL: https://rawaj-classifieds-hub.allidamech.workers.dev
    steps:
      - name: Verify propagated release with cache-busting requests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            body=/tmp/health.json
            headers=/tmp/health.headers
            status="$(curl --silent --show-error --max-time 20 \
              --output "$body" \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'Origin: https://rawa-j.com' \
              --header 'Cache-Control: no-cache' \
              "$WORKER_BASE_URL/v1/health?release_probe=$nonce" || true)"
            release="$(node -e "try{const d=require('$body');process.stdout.write(d?.data?.releaseSha??'')}catch{}")"
            environment="$(node -e "try{const d=require('$body');process.stdout.write(d?.data?.environment??'')}catch{}")"
            database="$(node -e "try{const d=require('$body');process.stdout.write(d?.data?.database??'')}catch{}")"
            allow_origin="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/{gsub(/\r/,""); print $2}' "$headers" | tail -1)"
            echo "Attempt $attempt: HTTP $status release=$release environment=$environment database=$database"
            if [[ "$status" == "200" && "$release" == "$EXPECTED_RELEASE_SHA" && "$environment" == "production" && "$database" == "ready" && "$allow_origin" == "https://rawa-j.com" ]]; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              cat "$body" >&2 || true
              exit 1
            fi
            sleep 5
          done

          status_body=/tmp/system-status.json
          status_code="$(curl --silent --show-error --max-time 20 \
            --output "$status_body" \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header 'Origin: https://rawa-j.com' \
            --header 'Cache-Control: no-cache' \
            "$WORKER_BASE_URL/v1/system-status?release_probe=$(date +%s)" || true)"
          test "$status_code" = "200"
          node <<'NODE'
          const data = require("/tmp/system-status.json").data;
          if (data?.maintenanceMode !== false || data?.emergencyReadOnly !== false) {
            throw new Error("Production system controls are not in normal mode.");
          }
          NODE

          for endpoint in "/v1/references" "/v1/listings" "/v1/ad-placements?page=home&device=desktop"; do
            code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
              --header 'Origin: https://rawa-j.com' "$WORKER_BASE_URL$endpoint" || true)"
            test "$code" = "200"
          done
