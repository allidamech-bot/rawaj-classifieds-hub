name: Temporary Listing Studio Typecheck Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'design/listing-studio-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture typecheck output
        run: npm run typecheck -- --pretty false > typecheck.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: listing-studio-typecheck
          path: typecheck.log
          retention-days: 1
