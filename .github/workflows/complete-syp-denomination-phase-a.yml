name: Complete SYP Denomination Phase A

on:
  pull_request:
    types: [synchronize]
    branches:
      - main
    paths:
      - ".github/workflows/complete-syp-denomination-phase-a.yml"

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch agent/syp-denomination-phase-a \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply remaining Phase A integrations
        working-directory: repo
        run: |
          sed -i 's#202607090002_owner_update_rpc_runtime_v2.sql#202607080038_listing_submit_edit_rpc_repair.sql#' scripts/.complete-syp-phase-a.py
          python scripts/.complete-syp-phase-a.py

      - name: Install dependencies
        working-directory: repo
        run: npm ci --silent

      - name: Format TypeScript and documentation
        working-directory: repo
        run: |
          npx prettier --write \
            src/features/listings/SypClassificationQueue.tsx \
            src/routes/profile/listings.tsx \
            'src/routes/profile/listings.$id.tsx' \
            'src/routes/listings.$id.tsx' \
            src/lib/listing-structured-data.ts \
            scripts/syp-denomination-phase-a.test.mjs \
            docs/syp-denomination-phase-a.md >/dev/null

      - name: Verify Phase A contracts
        working-directory: repo
        run: node --test scripts/syp-denomination-phase-a.test.mjs

      - name: Verify TypeScript
        working-directory: repo
        run: npm run typecheck

      - name: Verify production build
        working-directory: repo
        run: npm run build

      - name: Verify generated diff
        working-directory: repo
        run: git diff --check

      - name: Remove one-shot completion machinery
        working-directory: repo
        run: |
          rm -f scripts/.complete-syp-phase-a.py
          rm -f .github/workflows/complete-syp-denomination-phase-a.yml

      - name: Commit completed Phase A implementation
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete governed SYP denomination Phase A"
          git push origin HEAD:agent/syp-denomination-phase-a
