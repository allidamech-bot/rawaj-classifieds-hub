name: One-shot Browser Smoke Supabase

on:
  pull_request:
    branches:
      - feature/cloudflare-full-backend-cutover

permissions:
  contents: read

concurrency:
  group: one-shot-browser-smoke-supabase-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        env:
          RAWAJ_E2E_USE_FIXTURES: "1"
          RAWAJ_E2E_API_PROXY_TARGET: "https://rawaj-classifieds-hub.allidamech.workers.dev"
          VITE_PUBLIC_DATA_API_BASE_URL: "http://127.0.0.1:4173"
          VITE_RAWAJ_E2E_DISABLE_REMOTE_MEDIA: "1"
          VITE_SUPABASE_URL: "https://rawaj-browser-smoke.supabase.co"
          VITE_SUPABASE_ANON_KEY: "browser-smoke-public-anon-key"
        run: npm run test:e2e:smoke

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-supabase-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 2
