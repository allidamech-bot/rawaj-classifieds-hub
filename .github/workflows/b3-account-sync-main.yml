name: B3.1 synchronize main for final integration checks

on:
  push:
    branches:
      - design/20261114-b3-account
    paths:
      - ".github/workflows/b3-account-sync-main.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.ref == 'refs/heads/design/20261114-b3-account'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Integrate main; fail safely if Git reports a conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit origin/main
          git push origin HEAD:design/20261114-b3-account
