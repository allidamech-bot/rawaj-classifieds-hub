name: Egress Lint Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/supabase.ts"
      - ".github/workflows/egress-lint-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture ESLint report
        shell: bash
        run: |
          set +e
          npx eslint --quiet src/lib/supabase.ts --format json > egress-lint-report.json 2> egress-lint-stderr.txt
          code=$?
          printf '%s\n' "$code" > egress-lint-exit-code.txt
          exit 0

      - name: Upload ESLint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: egress-lint-diagnostics-${{ github.run_id }}
          path: |
            egress-lint-report.json
            egress-lint-stderr.txt
            egress-lint-exit-code.txt
          if-no-files-found: error
          retention-days: 1
