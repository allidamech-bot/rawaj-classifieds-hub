name: Apply Chat Image Reliability V2

on:
  push:
    branches: [feature/chat-image-reliability-v2]
    paths:
      - "scripts/apply-chat-image-reliability-v2.mjs"
      - ".github/workflows/apply-chat-image-reliability-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-image-reliability-v2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-chat-image-reliability-v2.mjs
      - run: npx prettier --write src/routes/chats.tsx src/features/communication/ChatAttachmentImage.tsx scripts/chat-image-reliability-v2.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/chats.tsx src/features/communication/ChatAttachmentImage.tsx scripts/chat-image-reliability-v2.test.mjs
          git commit -m "feat: harden private chat image reliability"
          git push origin HEAD:feature/chat-image-reliability-v2
