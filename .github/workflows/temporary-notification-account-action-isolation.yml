name: Temporary notification account action isolation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-notification-account-action-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.head_ref == 'fix/notification-account-action-isolation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/notification-account-action-isolation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded notification isolation
        run: |
          node scripts/apply-notification-account-action-isolation.mjs
          node scripts/apply-notification-preference-account-reset.mjs

      - name: Format and lint changed files
        run: |
          npx prettier --write \
            src/routes/notifications.tsx \
            src/features/notifications/NotificationPreferencesPanel.tsx \
            scripts/notification-account-action-isolation.test.mjs \
            package.json
          npx eslint --fix \
            src/routes/notifications.tsx \
            src/features/notifications/NotificationPreferencesPanel.tsx \
            scripts/notification-account-action-isolation.test.mjs

      - name: Activity center contracts
        run: npm run test:activity-center

      - name: Communication center contract
        run: node --test scripts/communication-center-v2.test.mjs

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck -- --pretty false 2>&1 | tee typecheck-diagnostic.txt

      - name: Commit failing candidate and diagnostic
        if: steps.typecheck.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routes/notifications.tsx \
            src/features/notifications/NotificationPreferencesPanel.tsx \
            scripts/notification-account-action-isolation.test.mjs \
            package.json \
            typecheck-diagnostic.txt
          git commit -m "chore: capture notification typecheck diagnostic"
          git push origin HEAD:fix/notification-account-action-isolation

      - name: Fail after diagnostic capture
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Commit implementation
        if: steps.typecheck.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routes/notifications.tsx \
            src/features/notifications/NotificationPreferencesPanel.tsx \
            scripts/notification-account-action-isolation.test.mjs \
            package.json
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "fix: isolate notification actions by account"
          git push origin HEAD:fix/notification-account-action-isolation
