name: Full Site Actions Integrity

on:
  pull_request:
    paths:
      - "src/routes/**"
      - "src/features/**"
      - "src/components/**"
      - "scripts/*actions*integrity.test.mjs"
      - "scripts/full-site-actions-integrity.test.mjs"
      - ".github/workflows/full-site-actions-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-site-actions-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full-site action contracts
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test \
            scripts/full-site-actions-integrity.test.mjs \
            scripts/public-auth-actions-integrity.test.mjs \
            scripts/listing-actions-runtime-integrity.test.mjs \
            scripts/saved-items-actions-runtime-integrity.test.mjs \
            scripts/listing-detail-actions-runtime-integrity.test.mjs \
            scripts/chat-actions-runtime-integrity.test.mjs \
            scripts/notification-actions-runtime-integrity.test.mjs \
            scripts/trust-actions-runtime-integrity.test.mjs \
            scripts/public-discovery-review-actions-integrity.test.mjs \
            scripts/profile-public-operations-integrity.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/full-site-actions-contracts.log"
      - name: Upload action contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-actions-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/full-site-actions-contracts.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when action contracts failed
        if: steps.contracts.outcome == 'failure'
        run: exit 1
      - name: ESLint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/full-site-actions-lint.log"
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-actions-lint-${{ github.sha }}
          path: ${{ runner.temp }}/full-site-actions-lint.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
