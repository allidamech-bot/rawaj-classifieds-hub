name: Patch Approved Listing Media Route Once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-approved-listing-media-route-once.yml
      - cloudflare/worker/src/marketplace-private.ts
      - scripts/cloudflare-approved-listing-media-route.test.mjs

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply status-aware media route
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("cloudflare/worker/src/marketplace-private.ts")
          source = path.read_text()
          old = '''function mapListingRow(row: Row) {
            return {
          '''
          new = '''function mapListingRow(row: Row) {
            const status = stringValue(row.status);
            const primaryMediaPrefix =
              status === "approved" ? "/v1/media/assets" : "/v1/account/media/assets";
            return {
          '''
          if new not in source:
              if old not in source:
                  raise RuntimeError("mapListingRow opening block was not found")
              source = source.replace(old, new, 1)

          source = source.replace(
              '    status: stringValue(row.status),',
              '    status,',
              1,
          )
          old_url = '''    primaryImageUrl: nullableString(row.primary_media_asset_id)
              ? `/v1/account/media/assets/${encodeURIComponent(String(row.primary_media_asset_id))}`
              : null,'''
          new_url = '''    primaryImageUrl: nullableString(row.primary_media_asset_id)
              ? `${primaryMediaPrefix}/${encodeURIComponent(String(row.primary_media_asset_id))}`
              : null,'''
          if new_url not in source:
              if old_url not in source:
                  raise RuntimeError("primaryImageUrl private route block was not found")
              source = source.replace(old_url, new_url, 1)

          path.write_text(source)
          PY

      - name: Format and verify focused contract
        run: |
          npm ci --ignore-scripts
          npx prettier --write cloudflare/worker/src/marketplace-private.ts scripts/cloudflare-approved-listing-media-route.test.mjs
          node --test scripts/cloudflare-approved-listing-media-route.test.mjs
          npx tsc -p cloudflare/worker/tsconfig.json --noEmit

      - name: Commit patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Status-aware approved media routing is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker/src/marketplace-private.ts scripts/cloudflare-approved-listing-media-route.test.mjs
          git commit -m "fix(worker): expose approved listing images through public media route"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
