name: Apply Nearby Discovery UI

on:
  push:
    branches: [feature/nearby-discovery-ui-v1]
    paths:
      - "scripts/apply-nearby-discovery-ui.mjs"
      - ".github/workflows/apply-nearby-discovery-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nearby-discovery-ui-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-nearby-discovery-ui.mjs
      - run: npx prettier --write src/routes/listings.index.tsx src/features/listings/NearbyDiscoveryControl.tsx src/features/listings/use-nearby-discovery.ts
      - run: |
          rm .github/workflows/apply-nearby-discovery-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate nearby discovery into listing results"
          git push
