name: Store Retention Structure Contract

on:
  pull_request:
    paths:
      - "src/mobile-structural-ui.css"
      - "scripts/store-retention-structure.test.mjs"
      - ".github/workflows/store-retention-structure.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/store-retention-structure.test.mjs
