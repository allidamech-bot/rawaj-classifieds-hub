name: Fix Notification Search Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-notification-search-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch saved-search navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-saved-search-push-integration.py")
          text = path.read_text(encoding="utf-8")
          old = '''        '      } else if (target.kind === "saved_search") {\\n'
        '        void navigate({ to: "/saved-searches" });\\n'
'''
          new = '''        '      } else if (target.kind === "saved_search") {\\n'
        '        void navigate({\\n'
        '          to: "/saved-searches",\\n'
        '          search: {\\n'
        '            q: "",\\n'
        '            category: "",\\n'
        '            subcategory: "",\\n'
        '            gov: "",\\n'
        '            district: "",\\n'
        '            price_min: "",\\n'
        '            price_max: "",\\n'
        '            car_make: "",\\n'
        '            car_model: "",\\n'
        '            fuel: "",\\n'
        '            transmission: "",\\n'
        '            property_purpose: "",\\n'
        '            property_type: "",\\n'
        '            rooms: "",\\n'
        '            rental_duration: "",\\n'
        '            electronics_brand: "",\\n'
        '            detail_condition: "",\\n'
        '            employment_type: "",\\n'
        '            salary_type: "",\\n'
        '            sort: "latest",\\n'
        '          },\\n'
        '        });\\n'
'''
          if old not in text:
              raise SystemExit("Saved-search navigation template not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove helper workflow
        run: rm .github/workflows/fix-notification-search-once.yml
      - name: Commit correction
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: provide saved-search navigation state"
          git push origin HEAD:"$HEAD_REF"
