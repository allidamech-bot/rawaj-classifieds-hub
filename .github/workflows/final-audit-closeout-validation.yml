name: Final Audit Closeout Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/final-audit-closeout-validation.yml
      - package.json
      - package-lock.json
      - e2e/production-smoke.spec.ts

permissions:
  contents: read

jobs:
  security-and-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: https://rawa-j.com
      PRODUCTION_SMOKE: "1"
      EXPECTED_COMMIT_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
    steps:
      - name: Checkout closeout changes
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Require zero high or critical production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run updated live Production smoke on mobile and desktop
        run: >-
          npx playwright test e2e/production-smoke.spec.ts
          --project=mobile-chromium --project=desktop-chromium --workers=1
