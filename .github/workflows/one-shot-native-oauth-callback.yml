name: One-shot native OAuth callback

on:
  pull_request:
    branches:
      - feature/cloudflare-full-backend-cutover

permissions:
  contents: write

concurrency:
  group: one-shot-native-oauth-callback
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/supabase-native-oauth-callback
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Apply scoped native OAuth correction
        run: |
          node --check scripts/.one-shot-native-oauth-callback.mjs
          node scripts/.one-shot-native-oauth-callback.mjs
          npx prettier --write src/lib/auth.tsx scripts/android-deep-link-oauth-readiness.test.mjs

      - name: Run Android contract diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > native-oauth-typecheck.log 2>&1
          echo "$?" > native-oauth-typecheck.exit
          node --test scripts/android-media-location-permissions.test.mjs > android-media-permissions.log 2>&1
          echo "$?" > android-media-permissions.exit
          node --test scripts/android-deep-link-oauth-readiness.test.mjs > android-oauth-readiness.log 2>&1
          echo "$?" > android-oauth-readiness.exit
          node --test scripts/android-release-candidate-integrity.test.mjs > android-rc-integrity.log 2>&1
          echo "$?" > android-rc-integrity.exit
          cat native-oauth-typecheck.log
          cat android-media-permissions.log
          cat android-oauth-readiness.log
          cat android-rc-integrity.log
          exit 0

      - name: Upload Android contract diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: native-oauth-contract-diagnostics-${{ github.run_id }}
          path: |
            native-oauth-typecheck.log
            native-oauth-typecheck.exit
            android-media-permissions.log
            android-media-permissions.exit
            android-oauth-readiness.log
            android-oauth-readiness.exit
            android-rc-integrity.log
            android-rc-integrity.exit
          if-no-files-found: error
          retention-days: 2

      - name: Enforce Android web and native contracts
        shell: bash
        run: |
          test "$(cat native-oauth-typecheck.exit)" = "0"
          test "$(cat android-media-permissions.exit)" = "0"
          test "$(cat android-oauth-readiness.exit)" = "0"
          test "$(cat android-rc-integrity.exit)" = "0"

      - name: Build web assets
        run: npm run build

      - name: Synchronize Android
        run: npx cap sync android

      - name: Build Android candidate
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest bundleRelease assembleRelease --no-daemon --stacktrace --console=plain

      - name: Commit validated correction
        shell: bash
        run: |
          rm -f scripts/.one-shot-native-oauth-callback.mjs
          rm -f .github/workflows/one-shot-native-oauth-callback.yml
          rm -f native-oauth-typecheck.log native-oauth-typecheck.exit
          rm -f android-media-permissions.log android-media-permissions.exit
          rm -f android-oauth-readiness.log android-oauth-readiness.exit
          rm -f android-rc-integrity.log android-rc-integrity.exit
          git config user.name 'allidamech-bot'
          git config user.email '228416871+allidamech-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(auth): use native Supabase OAuth callback on Android'
          git push origin HEAD:fix/supabase-native-oauth-callback