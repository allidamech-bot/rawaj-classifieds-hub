name: Phase 3 Route CSS Isolation Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-3-route-css-isolation
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply route CSS isolation
        run: python3 scripts/apply-phase3-route-css-isolation.py

      - name: Format changed files
        run: |
          npx prettier --write \
            src/routes/__root.tsx \
            src/lib/route-styles.ts \
            scripts/route-css-isolation.test.mjs \
            scripts/home-discovery-v3.test.mjs \
            scripts/adaptive-listing-cards.test.mjs \
            scripts/search-filters-v1.test.mjs \
            scripts/search-filters-v2.test.mjs \
            scripts/listing-detail-v2.test.mjs \
            scripts/listing-detail-v3.test.mjs \
            scripts/seller-storefront-v2.test.mjs \
            e2e/public-initial-html.spec.ts \
            .github/workflows/quality-gate.yml

      - name: Validate focused contracts
        run: |
          node --test scripts/route-css-isolation.test.mjs
          node --test scripts/home-discovery-v3.test.mjs
          node --test scripts/adaptive-listing-cards.test.mjs
          node --test scripts/search-filters-v1.test.mjs
          node --test scripts/search-filters-v2.test.mjs
          node --test scripts/listing-detail-v2.test.mjs
          node --test scripts/listing-detail-v3.test.mjs
          node --test scripts/seller-storefront-v2.test.mjs
          npm run typecheck -- --pretty false

      - name: Stage validated files
        run: |
          mkdir -p phase3-route-css-output/src/routes
          mkdir -p phase3-route-css-output/src/lib
          mkdir -p phase3-route-css-output/scripts
          mkdir -p phase3-route-css-output/e2e
          mkdir -p phase3-route-css-output/.github/workflows
          cp src/routes/__root.tsx phase3-route-css-output/src/routes/__root.tsx
          cp src/lib/route-styles.ts phase3-route-css-output/src/lib/route-styles.ts
          cp scripts/route-css-isolation.test.mjs phase3-route-css-output/scripts/route-css-isolation.test.mjs
          cp scripts/home-discovery-v3.test.mjs phase3-route-css-output/scripts/home-discovery-v3.test.mjs
          cp scripts/adaptive-listing-cards.test.mjs phase3-route-css-output/scripts/adaptive-listing-cards.test.mjs
          cp scripts/search-filters-v1.test.mjs phase3-route-css-output/scripts/search-filters-v1.test.mjs
          cp scripts/search-filters-v2.test.mjs phase3-route-css-output/scripts/search-filters-v2.test.mjs
          cp scripts/listing-detail-v2.test.mjs phase3-route-css-output/scripts/listing-detail-v2.test.mjs
          cp scripts/listing-detail-v3.test.mjs phase3-route-css-output/scripts/listing-detail-v3.test.mjs
          cp scripts/seller-storefront-v2.test.mjs phase3-route-css-output/scripts/seller-storefront-v2.test.mjs
          cp e2e/public-initial-html.spec.ts phase3-route-css-output/e2e/public-initial-html.spec.ts
          cp .github/workflows/quality-gate.yml phase3-route-css-output/.github/workflows/quality-gate.yml

      - name: Upload validated route CSS output
        uses: actions/upload-artifact@v4
        with:
          name: phase3-route-css-output-${{ github.sha }}
          path: phase3-route-css-output
          retention-days: 1
          if-no-files-found: error
