name: Apply Public Auth Integrity

on:
  push:
    branches:
      - agent/full-site-actions-integrity-audit
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-public-auth-integrity.mjs"
      - ".github/workflows/apply-public-auth-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-public-auth-integrity
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-site-actions-integrity-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded auth repair
        shell: bash
        run: |
          set +e
          node scripts/apply-public-auth-integrity.mjs > public-auth-repair.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public-auth-repair.log
            git commit -m "chore: capture public auth repair diagnostic"
            git push origin HEAD:agent/full-site-actions-integrity-audit
            exit "$status"
          fi
          rm -f public-auth-repair.log
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/login.tsx src/routes/reset-password.tsx scripts/apply-public-auth-integrity.mjs
          git commit -m "fix: harden public auth action lifecycle"
          git push origin HEAD:agent/full-site-actions-integrity-audit
