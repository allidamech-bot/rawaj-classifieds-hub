name: Apply Chat Voice Location UI V1

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-chat-voice-location-ui-v1.mjs"
      - "src/features/communication/ChatVoiceRecorder.tsx"
      - "src/features/communication/ChatVoiceAttachment.tsx"
      - ".github/workflows/apply-chat-voice-location-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        id: apply
        continue-on-error: true
        run: node scripts/apply-chat-voice-location-ui-v1.mjs > applicator.log 2>&1
      - name: Upload applicator diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: chat-voice-location-applicator-log
          path: applicator.log
      - name: Stop on applicator failure
        if: steps.apply.outcome == 'failure'
        run: cat applicator.log && exit 1
      - run: npx prettier --write src/lib/classifieds-types.ts src/lib/api/messaging.ts src/routes/chats.tsx src/features/communication/ChatVoiceRecorder.tsx src/features/communication/ChatVoiceAttachment.tsx
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/classifieds-types.ts src/lib/api/messaging.ts src/routes/chats.tsx src/features/communication/ChatVoiceRecorder.tsx src/features/communication/ChatVoiceAttachment.tsx
          git commit -m "feat: add chat voice and location sharing UI"
          git push origin HEAD:${{ github.head_ref }}
