name: R2 Final Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/api/listings.ts"
      - "src/lib/api/listing-owner-delete-guarded.ts"
      - "src/lib/classifieds-api.ts"
      - "src/lib/r2-listing-images-client.ts"
      - "src/routes/api.listing-images.ts"
      - "src/types/r2-listing-images-route.d.ts"
      - ".github/workflows/r2-final-diagnostics.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > r2-typecheck.log 2>&1
          typecheck_status=$?
          npm run build > r2-build.log 2>&1
          build_status=$?
          cat r2-typecheck.log
          cat r2-build.log
          echo "TYPECHECK_EXIT_CODE=$typecheck_status" >> "$GITHUB_ENV"
          echo "BUILD_EXIT_CODE=$build_status" >> "$GITHUB_ENV"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: r2-final-diagnostics-${{ github.sha }}
          path: |
            r2-typecheck.log
            r2-build.log
          retention-days: 1
      - name: Fail when validation failed
        run: |
          test "$TYPECHECK_EXIT_CODE" = "0"
          test "$BUILD_EXIT_CODE" = "0"
