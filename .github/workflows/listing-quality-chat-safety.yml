name: Listing Quality and Chat Safety V1 contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: listing-quality-chat-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Listing Quality and Chat Safety V1 contract
        run: npm run test:listing-quality-chat-safety

      - name: Typecheck affected integration
        run: npm run typecheck -- --pretty false
