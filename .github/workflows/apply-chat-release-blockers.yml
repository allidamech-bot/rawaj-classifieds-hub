name: Apply Chat Release Blockers

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  apply:
    if: github.head_ref == 'fix/chat-release-blockers'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-chat-release-blockers.mjs
      - run: npx prettier --write src/features/communication/ChatVoiceAttachment.tsx src/lib/api/messaging.ts src/lib/api/messaging-guarded.ts src/lib/classifieds-types.ts src/routes/chats.tsx src/communication-center-v2.css scripts/chat-release-blockers.test.mjs .github/workflows/chat-release-blockers.yml docs/production-schema/migration-ledger.json
      - run: node --test scripts/chat-release-blockers.test.mjs
      - run: npx eslint --quiet src/features/communication/ChatVoiceAttachment.tsx src/lib/api/messaging.ts src/lib/api/messaging-guarded.ts src/lib/classifieds-types.ts src/routes/chats.tsx
      - run: node scripts/check-migration-ledger.mjs
      - run: npm run typecheck -- --pretty false
      - name: Stage verified files
        run: |
          mkdir -p verified-patch
          cp --parents \
            src/features/communication/ChatVoiceAttachment.tsx \
            src/lib/api/messaging.ts \
            src/lib/api/messaging-guarded.ts \
            src/lib/classifieds-types.ts \
            src/routes/chats.tsx \
            src/communication-center-v2.css \
            supabase/migrations/202607180001_chat_delivery_read_receipts.sql \
            docs/production-schema/migration-ledger.json \
            scripts/chat-release-blockers.test.mjs \
            .github/workflows/chat-release-blockers.yml \
            verified-patch/
      - uses: actions/upload-artifact@v4
        with:
          name: chat-release-blockers-verified-patch
          path: verified-patch
          if-no-files-found: error
          retention-days: 2
