name: Temporary Format Push Queue

on:
  push:
    branches:
      - fix/phase-2-push-queue-lifecycle

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-2-push-queue-lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/push-delivery-scheduler-v1.test.mjs
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/push-delivery-scheduler-v1.test.mjs
          git commit -m "style: format push queue lifecycle contract"
          git push origin HEAD:fix/phase-2-push-queue-lifecycle
