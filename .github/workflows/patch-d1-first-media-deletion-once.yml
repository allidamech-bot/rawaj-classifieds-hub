name: Patch D1-First Media Deletion Once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-d1-first-media-deletion-once.yml
      - cloudflare/worker/src/marketplace-private.ts
      - scripts/cloudflare-media-deletion-cutover.test.mjs

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch deletion ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("cloudflare/worker/src/marketplace-private.ts")
          source = path.read_text()

          def replace_function(name: str, replacement: str) -> None:
              global source
              start = source.find(f"async function {name}(")
              if start < 0:
                  raise RuntimeError(f"{name} not found")
              end = source.find("\nasync function ", start + 1)
              if end < 0:
                  raise RuntimeError(f"Unable to find end of {name}")
              source = source[:start] + replacement.rstrip() + "\n" + source[end + 1:]

          replace_function("deleteListing", r'''async function deleteListing(request: Request, env: MarketplaceEnv, cors: Headers, id: string) {
            const auth = await requireMutationAuth(request, asAuthEnv(env), cors);
            if (auth instanceof Response) return auth;
            const listing = await env.DB.prepare("SELECT owner_id, status FROM listings WHERE id = ?")
              .bind(id)
              .first<{ owner_id: string; status: string }>();
            if (!listing || listing.owner_id !== auth.userId) return forbidden(cors);
            if (!["draft", "pending_review", "approved", "rejected"].includes(listing.status)) {
              return json(
                { error: { code: "invalid_transition", message: "Listing cannot be deleted." } },
                409,
                cors,
              );
            }
            const assets = await env.DB.prepare(
              `SELECT m.id, m.object_key FROM listing_images li JOIN media_assets m
                ON m.id = li.media_asset_id WHERE li.listing_id = ? AND m.owner_id = ?`,
            )
              .bind(id, auth.userId)
              .all<{ id: string; object_key: string }>();
            if (!assets.success) return databaseError(cors);

            const statements = [
              env.DB.prepare("DELETE FROM listing_images WHERE listing_id = ?").bind(id),
              ...(assets.results ?? []).map((asset) =>
                env.DB.prepare("DELETE FROM media_assets WHERE id = ? AND owner_id = ?").bind(
                  asset.id,
                  auth.userId,
                ),
              ),
              env.DB.prepare("DELETE FROM listings WHERE id = ? AND owner_id = ?").bind(
                id,
                auth.userId,
              ),
            ];
            const results = await env.DB.batch(statements);
            if (results.some((result) => !result.success)) return databaseError(cors);

            for (const asset of assets.results ?? []) {
              await env.MEDIA.delete(asset.object_key).catch((error) =>
                console.error("rawaj_listing_media_orphan_cleanup_failed", {
                  listingId: id,
                  assetId: asset.id,
                  error: error instanceof Error ? error.message : String(error),
                }),
              );
            }
            return json({ data: { success: true } }, 200, cors);
          }''')

          replace_function("deleteImage", r'''async function deleteImage(request: Request, env: MarketplaceEnv, cors: Headers, imageId: string) {
            const auth = await requireMutationAuth(request, asAuthEnv(env), cors);
            if (auth instanceof Response) return auth;
            const row = await env.DB.prepare(
              `SELECT li.listing_id, m.id AS asset_id, m.object_key, m.owner_id, l.owner_id AS listing_owner
                FROM listing_images li JOIN media_assets m ON m.id = li.media_asset_id
                JOIN listings l ON l.id = li.listing_id WHERE li.id = ?`,
            )
              .bind(imageId)
              .first<Row>();
            if (!row || row.owner_id !== auth.userId || row.listing_owner !== auth.userId)
              return forbidden(cors);

            const results = await env.DB.batch([
              env.DB.prepare("DELETE FROM listing_images WHERE id = ?").bind(imageId),
              env.DB.prepare("DELETE FROM media_assets WHERE id = ? AND owner_id = ?").bind(
                String(row.asset_id),
                auth.userId,
              ),
            ]);
            if (results.some((result) => !result.success)) return databaseError(cors);

            await env.MEDIA.delete(String(row.object_key)).catch((error) =>
              console.error("rawaj_listing_image_orphan_cleanup_failed", {
                imageId,
                listingId: String(row.listing_id),
                assetId: String(row.asset_id),
                error: error instanceof Error ? error.message : String(error),
              }),
            );
            return json({ data: { success: true } }, 200, cors);
          }''')

          path.write_text(source)
          PY

      - name: Format and validate focused contract
        run: |
          npm ci --ignore-scripts
          npx prettier --write cloudflare/worker/src/marketplace-private.ts scripts/cloudflare-media-deletion-cutover.test.mjs
          node --test scripts/cloudflare-media-deletion-cutover.test.mjs

      - name: Commit patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "D1-first media deletion is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker/src/marketplace-private.ts scripts/cloudflare-media-deletion-cutover.test.mjs
          git commit -m "fix(worker): commit D1 deletion before R2 cleanup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
