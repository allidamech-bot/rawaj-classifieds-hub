name: Refine Saudi support admin privacy

"on":
  pull_request:
    branches:
      - saudi

permissions:
  contents: write

concurrency:
  group: refine-saudi-support-admin-privacy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refine:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Separate public and admin support fields
        run: node scripts/refine-saudi-admin-support-privacy.mjs

      - name: Validate Worker and privacy regression
        working-directory: cloudflare/worker
        run: |
          npm ci
          npm install --no-save jose@^6
          npm run typecheck
          node --test test/support-admin.test.mjs

      - name: Commit final privacy-safe source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker/src/trust-support.ts cloudflare/worker/test/support-admin.test.mjs
          git add -u scripts/refine-saudi-admin-support-privacy.mjs .github/workflows/refine-saudi-admin-support-privacy.yml
          git commit -m "fix(saudi): keep support admin notes private"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
