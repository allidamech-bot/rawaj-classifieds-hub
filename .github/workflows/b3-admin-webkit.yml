name: B3 Admin iPhone WebKit Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/styles.css"
      - "src/admin-workspaces-v9.css"
      - "src/admin-final-polish.css"
      - "src/rawaj-audit-corrections-v8.css"
      - "src/rawaj-chromatic-premium-system-v17.css"
      - "src/rawaj-chromatic-premium-system-v20-state-consistency.css"
      - "src/routes/admin.tsx"
      - "src/lib/browser-chrome.ts"
      - "src/components/AdminNotificationBell.tsx"
      - "e2e/b3-administration.spec.ts"
      - ".github/workflows/b3-admin-webkit.yml"

concurrency:
  group: b3-admin-webkit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-webkit:
    name: iPhone WebKit (emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Verify signed-out gates, authorized owner routes and Arabic navigation
        env:
          RAWAJ_E2E_USE_FIXTURES: "1"
          RAWAJ_E2E_API_PROXY_TARGET: "https://rawaj-classifieds-hub.allidamech.workers.dev"
          VITE_PUBLIC_DATA_API_BASE_URL: "http://127.0.0.1:4173"
          VITE_RAWAJ_E2E_DISABLE_REMOTE_MEDIA: "1"
        run: >-
          npx playwright test e2e/b3-administration.spec.ts
          --project=mobile-webkit
          --grep 'B3\\.4.*(keeps the signed-out gate|owners can open every documented workspace|RTL administration navigation)'
      - name: Preserve WebKit screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-admin-webkit-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
