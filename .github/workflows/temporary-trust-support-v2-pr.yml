name: Temporary Trust Support V2 Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'design/trust-support-hub-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/trust-support-hub-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align integration script with current routes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/temporary-integrate-trust-support-v2.py")
          source = path.read_text()
          replacements = {
              "'<div className=\"min-h-dvh\">'": "'<div className=\"rawaj-pulse-page min-h-dvh\" dir={isArabic ? \"rtl\" : \"ltr\"}>'",
              "'<div className=\"rawaj-trust-v2 rawaj-more-v2 min-h-dvh\">'": "'<div className=\"rawaj-trust-v2 rawaj-more-v2 min-h-dvh\" dir={isArabic ? \"rtl\" : \"ltr\"}>'",
              "'<main className=\"container-wide mobile-page-bottom space-y-5 pb-8 pt-3 sm:pt-5\">'": "'<main className=\"mobile-page-bottom mx-auto max-w-6xl px-4 pb-8 pt-3 sm:px-6 sm:pt-5 lg:px-8\">'",
              "'          <div className=\"rawaj-storefront-section mb-3\">'": "'          <div className=\"mb-3.5 flex items-end justify-between gap-3\">'",
              "'          </div>\\n          <div className=\"grid grid-cols-2 gap-3\">'": "'          </div>\\n          <div className=\"grid grid-cols-1 gap-3 sm:grid-cols-2\">'",
              "'<div className=\"grid grid-cols-2 gap-3\">'": "'<div className=\"grid grid-cols-1 gap-3 sm:grid-cols-2\">'",
              "'<section className=\"grid grid-cols-3 gap-2.5\">'": "'<section className=\"mt-4 grid grid-cols-3 gap-2.5 sm:gap-3\">'",
              "'<div className=\"space-y-3\">'": "'<div className=\"mt-7 grid gap-4 lg:grid-cols-2\">'",
              "map_end = s.index('        ))}', map_start) + len('        ))}')": "map_start = s.index('        {sections.map((s) => (', hero_start)\nmap_end = s.index('        ))}', map_start) + len('        ))}')",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise RuntimeError(f"Missing script anchor: {old}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
      - name: Integrate Trust Support Hub V2
        run: python scripts/temporary-integrate-trust-support-v2.py
      - name: Format integrated product files
        continue-on-error: true
        run: >-
          npx prettier --write
          scripts/trust-support-hub-v2.test.mjs
          src/features/trust/TrustSupportExperience.tsx
          src/trust-support-hub-v2.css
          src/routes/__root.tsx
          src/routes/more.tsx
          src/routes/support.tsx
          src/routes/safety.tsx
      - name: Commit and push product files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/trust-support-hub-v2.test.mjs
          git add src/features/trust/TrustSupportExperience.tsx
          git add src/trust-support-hub-v2.css
          git add src/routes/__root.tsx
          git add src/routes/more.tsx
          git add src/routes/support.tsx
          git add src/routes/safety.tsx
          git commit -m "Integrate Trust Support Hub V2"
          git push origin HEAD:design/trust-support-hub-v2
