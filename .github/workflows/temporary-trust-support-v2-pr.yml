name: Temporary Trust Support V2 Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'design/trust-support-hub-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/trust-support-hub-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture integration output
        shell: bash
        run: |
          set +e
          python scripts/temporary-integrate-trust-support-v2.py > trust-support-diagnostic.log 2>&1
          echo "status=$?" >> trust-support-diagnostic.log
          cat trust-support-diagnostic.log
      - uses: actions/upload-artifact@v4
        with:
          name: trust-support-integration-diagnostic
          path: trust-support-diagnostic.log
          retention-days: 1
