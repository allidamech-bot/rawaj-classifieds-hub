name: Temporary stale-owner formatter

on:
  push:
    branches:
      - feature/stale-safe-owner-listing-updates

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/stale-safe-owner-listing-updates
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed implementation files
        run: |
          npx prettier --write \
            scripts/listing-owner-stale-write.test.mjs \
            src/lib/api/listing-draft-create-guarded.ts \
            src/lib/api/listing-owner-read-guarded.ts \
            src/lib/api/listing-owner-version.ts \
            src/lib/api/listing-owner-write-guarded.ts \
            src/lib/api/listing-write-contract.ts \
            src/lib/api/listing-write-rpc.ts \
            src/lib/classifieds-api.ts

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Files already match project formatting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/listing-owner-stale-write.test.mjs \
            src/lib/api/listing-draft-create-guarded.ts \
            src/lib/api/listing-owner-read-guarded.ts \
            src/lib/api/listing-owner-version.ts \
            src/lib/api/listing-owner-write-guarded.ts \
            src/lib/api/listing-write-contract.ts \
            src/lib/api/listing-write-rpc.ts \
            src/lib/classifieds-api.ts
          git commit -m "Format stale-safe owner update files"
          git push origin HEAD:feature/stale-safe-owner-listing-updates
