name: Staging Chat Audio Authenticated Diagnostic

on:
  push:
    branches: [audit/chat-audio-production-pipeline]
    paths:
      - "scripts/staging-chat-audio-authenticated-diagnostic.mjs"
      - ".github/workflows/staging-chat-audio-authenticated-diagnostic.yml"
      - "src/lib/api/messaging.ts"
      - "src/lib/supabase.ts"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  authenticated-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rawaj-staging
    env:
      RAWAJ_STAGING_PROJECT_REF: ${{ secrets.RAWAJ_STAGING_PROJECT_REF }}
      RAWAJ_PRODUCTION_PROJECT_REF: ${{ secrets.RAWAJ_PRODUCTION_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ secrets.RAWAJ_STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.RAWAJ_STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RAWAJ_STAGING_SERVICE_ROLE_KEY }}
      RAWAJ_STAGING_USER_A_EMAIL: ${{ secrets.RAWAJ_STAGING_USER_A_EMAIL }}
      RAWAJ_STAGING_USER_A_PASSWORD: ${{ secrets.RAWAJ_STAGING_USER_A_PASSWORD }}
      RAWAJ_STAGING_USER_B_EMAIL: ${{ secrets.RAWAJ_STAGING_USER_B_EMAIL }}
      RAWAJ_STAGING_USER_B_PASSWORD: ${{ secrets.RAWAJ_STAGING_USER_B_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run exact client upload and send path
        id: audio
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/staging-chat-audio-authenticated-diagnostic.mjs > audio-diagnostic.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish sanitized result to issue 459
        shell: bash
        run: |
          result="$(tail -n 40 audio-diagnostic.log | sed -E 's#https://[a-z0-9]+\.supabase\.co#https://<staging>.supabase.co#g' | head -c 5000)"
          if [ "${{ steps.audio.outputs.exit_code }}" = "0" ]; then
            verdict="PASS"
          else
            verdict="FAIL"
          fi
          body=$(printf '### Authenticated staging audio diagnostic — %s\n\nCommit: `%s`\n\n```text\n%s\n```' "$verdict" "$GITHUB_SHA" "$result")
          gh api "repos/$GITHUB_REPOSITORY/issues/459/comments" -f body="$body"
      - name: Enforce authenticated diagnostic
        if: steps.audio.outputs.exit_code != '0'
        run: exit 1
