name: Repair SYP Moderation Guard

on:
  pull_request:
    types: [synchronize]
    branches:
      - main
    paths:
      - ".github/workflows/repair-syp-moderation-guard.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch agent/syp-denomination-phase-a \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Repair moderation guard and rollback baseline
        working-directory: repo
        run: |
          python scripts/.repair-syp-moderation-guard.py
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/syp-denomination-phase-a.test.mjs")
          source = path.read_text()
          old = "  assert.doesNotMatch(rollback, /price_new_syp_normalized/);"
          new = '''  const rollbackGuardStart = rollback.indexOf(
            "create or replace function public.rawaj_protect_listing_moderation_update()",
          );
          const rollbackGuard = rollback.slice(
            rollbackGuardStart,
            rollback.indexOf("\\n$$;", rollbackGuardStart) + 4,
          );
          assert.doesNotMatch(rollbackGuard, /price_new_syp_normalized/);'''
          if source.count(old) != 1:
              raise SystemExit("rollback guard contract anchor missing")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Install dependencies
        working-directory: repo
        run: npm ci --silent

      - name: Format Phase A contracts
        working-directory: repo
        run: npx prettier --write scripts/syp-denomination-phase-a.test.mjs >/dev/null

      - name: Verify Phase A contracts
        working-directory: repo
        run: node --test scripts/syp-denomination-phase-a.test.mjs

      - name: Verify TypeScript and build
        working-directory: repo
        run: |
          npm run typecheck
          npm run build

      - name: Verify generated diff
        working-directory: repo
        run: git diff --check

      - name: Remove one-shot repair machinery
        working-directory: repo
        run: |
          rm -f scripts/.repair-syp-moderation-guard.py
          rm -f .github/workflows/repair-syp-moderation-guard.yml

      - name: Commit replay repair
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve latest listing moderation guard in SYP Phase A"
          git push origin HEAD:agent/syp-denomination-phase-a
