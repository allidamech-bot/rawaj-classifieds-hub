name: Location display runner

on:
  push:
    branches:
      - location-ux-display

permissions:
  contents: write

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message, '[skip display runner]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-ux-display
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-location-display-metadata.mjs
      - run: node scripts/apply-location-display-ui.mjs
      - run: npx prettier --write src/lib/classifieds-types.ts src/lib/api/listings.ts src/features/listings/listings-components.tsx 'src/routes/listings.$id.tsx'
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/classifieds-types.ts src/lib/api/listings.ts src/features/listings/listings-components.tsx 'src/routes/listings.$id.tsx'
          git commit -m "Display canonical listing locations [skip display runner]"
          git push origin HEAD:location-ux-display
