name: Branch Format Repair

on:
  push:
    branches:
      - agent/android-release-readiness-1-0-3

concurrency:
  group: branch-format-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/android-release-readiness-1-0-3
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed implementation and contract files
        run: |
          npx prettier --write \
            capacitor.config.ts \
            scripts/android-release-readiness.test.mjs \
            scripts/chat-workspace.test.mjs \
            scripts/mobile-app-stabilization.test.mjs \
            scripts/communication-center-v2.test.mjs \
            src/routes/chats.tsx \
            src/routes/__root.tsx \
            src/features/communication/CommunicationExperience.tsx \
            src/components/NotificationTrigger.tsx \
            src/components/shell/BottomDock.tsx \
            src/lib/unread-activity.tsx \
            src/lib/use-online-presence.ts

      - name: Commit formatting repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "rawaj-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            capacitor.config.ts \
            scripts/android-release-readiness.test.mjs \
            scripts/chat-workspace.test.mjs \
            scripts/mobile-app-stabilization.test.mjs \
            scripts/communication-center-v2.test.mjs \
            src/routes/chats.tsx \
            src/routes/__root.tsx \
            src/features/communication/CommunicationExperience.tsx \
            src/components/NotificationTrigger.tsx \
            src/components/shell/BottomDock.tsx \
            src/lib/unread-activity.tsx \
            src/lib/use-online-presence.ts
          git commit -m "Format native chat rebuild [format-repair]"
          git push origin HEAD:agent/android-release-readiness-1-0-3
