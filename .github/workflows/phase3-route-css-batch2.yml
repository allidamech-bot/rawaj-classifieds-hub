name: Phase 3 Route CSS Isolation Batch 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-3-route-css-isolation-batch-2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply route CSS batch 2
        run: python3 scripts/apply-phase3-route-css-batch2.py

      - name: Format changed files
        run: |
          npx prettier --write \
            src/routes/__root.tsx \
            src/lib/route-styles.ts \
            scripts/route-css-isolation-batch-2.test.mjs \
            scripts/listing-studio-v2.test.mjs \
            scripts/listing-studio-v3.test.mjs \
            scripts/communication-center-v2.test.mjs \
            e2e/public-initial-html.spec.ts \
            .github/workflows/quality-gate.yml

      - name: Validate focused contracts
        run: |
          npx eslint --quiet \
            src/routes/__root.tsx \
            src/lib/route-styles.ts \
            scripts/route-css-isolation-batch-2.test.mjs \
            scripts/listing-studio-v2.test.mjs \
            scripts/listing-studio-v3.test.mjs \
            scripts/communication-center-v2.test.mjs \
            e2e/public-initial-html.spec.ts
          node --test scripts/route-css-isolation.test.mjs
          node --test scripts/route-css-isolation-batch-2.test.mjs
          node --test scripts/listing-studio-v2.test.mjs
          node --test scripts/listing-studio-v3.test.mjs
          node --test scripts/communication-center-v2.test.mjs
          npm run typecheck -- --pretty false

      - name: Stage validated output
        run: |
          mkdir -p phase3-route-css-batch2/src/routes
          mkdir -p phase3-route-css-batch2/src/lib
          mkdir -p phase3-route-css-batch2/scripts
          mkdir -p phase3-route-css-batch2/e2e
          mkdir -p phase3-route-css-batch2/.github/workflows
          cp src/routes/__root.tsx phase3-route-css-batch2/src/routes/__root.tsx
          cp src/lib/route-styles.ts phase3-route-css-batch2/src/lib/route-styles.ts
          cp scripts/route-css-isolation-batch-2.test.mjs phase3-route-css-batch2/scripts/route-css-isolation-batch-2.test.mjs
          cp scripts/listing-studio-v2.test.mjs phase3-route-css-batch2/scripts/listing-studio-v2.test.mjs
          cp scripts/listing-studio-v3.test.mjs phase3-route-css-batch2/scripts/listing-studio-v3.test.mjs
          cp scripts/communication-center-v2.test.mjs phase3-route-css-batch2/scripts/communication-center-v2.test.mjs
          cp e2e/public-initial-html.spec.ts phase3-route-css-batch2/e2e/public-initial-html.spec.ts
          cp .github/workflows/quality-gate.yml phase3-route-css-batch2/.github/workflows/quality-gate.yml

      - name: Upload validated output
        uses: actions/upload-artifact@v4
        with:
          name: phase3-route-css-batch2-${{ github.sha }}
          path: phase3-route-css-batch2
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
