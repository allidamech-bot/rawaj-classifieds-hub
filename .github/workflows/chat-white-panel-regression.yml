name: Chat White Panel Regression Temporary Gate

on:
  push:
    branches:
      - fix/home-page-navigation-ad-placement-audit
  workflow_dispatch:

concurrency:
  group: chat-white-panel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  quality:
    name: Auth-Stable Surfaces Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused auth-stable surface contracts
        run: node --test scripts/auth-stable-public-surfaces.test.mjs scripts/chats-mobile-list-first.test.mjs
      - name: Full repository check
        run: npm run check
      - name: Publish quality result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'Auth-Stable Surfaces / Quality',
              description: passed ? 'Auth-stable surface quality passed' : 'Auth-stable surface quality failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  browser:
    name: Auth-Stable Surfaces Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run category ad and exact white-panel regression
        run: npx playwright test e2e/current-acceptance-regression.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-stable-surfaces-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish browser result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'Auth-Stable Surfaces / Browser',
              description: passed ? 'Auth-stable browser regression passed' : 'Auth-stable browser regression failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
