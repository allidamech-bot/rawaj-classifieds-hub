name: Repair Dynamic Search SQL V1

on:
  pull_request:
    paths:
      - ".github/workflows/repair-dynamic-search-sql-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-dynamic-search-sql-v1
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - name: Repair JSONB filter count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("supabase/migrations/202607190041_dynamic_listing_facets_repair_v1.sql"),
              Path("supabase/migrations/202607190042_dynamic_listing_search_page_v1.sql"),
          ]
          old = "jsonb_object_length(v_filters) > 50"
          new = "(select count(*) from jsonb_object_keys(v_filters)) > 50"
          for path in paths:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one JSONB count marker, found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          ! grep -R "jsonb_object_length(v_filters)" \
            supabase/migrations/202607190041_dynamic_listing_facets_repair_v1.sql \
            supabase/migrations/202607190042_dynamic_listing_search_page_v1.sql
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              supabase/migrations/202607190041_dynamic_listing_facets_repair_v1.sql \
              supabase/migrations/202607190042_dynamic_listing_search_page_v1.sql
            git commit -m "fix: use portable JSONB filter cardinality"
            git push origin HEAD:feature/taxonomy-search-foundation-v1
          fi
