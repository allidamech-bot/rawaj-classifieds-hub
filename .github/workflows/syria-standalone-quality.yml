name: Syria standalone quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - migration/syria-standalone-hardening

permissions:
  contents: read

concurrency:
  group: syria-standalone-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit Syria runtime boundaries
        run: |
          node scripts/syria-runtime-residual-audit.mjs
          node --test scripts/syria-firebase-isolation.test.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
