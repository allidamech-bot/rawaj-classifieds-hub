name: Format Saudi Closure Gate

"on":
  push:
    branches:
      - agent/close-saudi-infra-admin-20260803
    paths:
      - .github/workflows/format-saudi-closure.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-saudi-infra-admin-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write scripts/saudi-infra-admin-production-e2e.mjs
          rm .github/workflows/format-saudi-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/saudi-infra-admin-production-e2e.mjs .github/workflows/format-saudi-closure.yml
          git commit -m "style(saudi): format infrastructure closure gate"
          git push origin HEAD:agent/close-saudi-infra-admin-20260803
