name: Public Release Candidate Audit Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/public-release-candidate-audit.yml"
      - ".github/workflows/public-release-candidate-audit-contract.yml"
      - "scripts/audit-public-release-candidate.mjs"
      - "scripts/public-release-candidate-audit.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/public-release-candidate-audit.yml"
      - ".github/workflows/public-release-candidate-audit-contract.yml"
      - "scripts/audit-public-release-candidate.mjs"
      - "scripts/public-release-candidate-audit.test.mjs"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify public release audit contract
        run: node --test scripts/public-release-candidate-audit.test.mjs
