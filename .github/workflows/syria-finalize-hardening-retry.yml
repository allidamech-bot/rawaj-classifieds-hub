name: Syria finalize hardening retry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/syria-finalize-hardening-retry.yml"

permissions:
  contents: write

concurrency:
  group: syria-finalize-hardening-retry
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'migration/syria-standalone-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Syria hardening branch
        uses: actions/checkout@v4
        with:
          ref: migration/syria-standalone-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Format standalone hardening files
        run: >-
          npx prettier --write --ignore-unknown
          scripts/syria-runtime-residual-audit.mjs
          scripts/syria-firebase-isolation.test.mjs
          scripts/syria-provider-preflight.mjs
          scripts/syria-provider-preflight.test.mjs
          scripts/syria-secret-hygiene.test.mjs
          scripts/syria-vercel-isolation.test.mjs
          scripts/syria-release-workflow-safety.test.mjs
          scripts/cloudflare-cutover-foundation.test.mjs
          scripts/backend-boundary-hardening.test.mjs
          cloudflare/worker/scripts/render-config.mjs
          cloudflare/worker/scripts/require-production-approval.mjs
          .github/workflows/cloudflare-production-worker-deploy.yml
          .github/workflows/syria-standalone-quality.yml
          .github/workflows/syria-cloudflare-reconcile-production.yml
          .github/workflows/syria-cloudflare-backup-production.yml
          .github/workflows/syria-vercel-preview.yml
          docs/syria-provider-finalization-runbook.md
          docs/syria-separation-evidence-template.md

      - name: Remove all temporary batch workflows
        shell: bash
        run: |
          git rm --ignore-unmatch .github/workflows/syria-finalize-hardening-batch.yml
          git rm --ignore-unmatch .github/workflows/syria-finalize-hardening-retry.yml
          git rm --ignore-unmatch .github/workflows/syria-firebase-isolation-batch.yml
          git rm --ignore-unmatch .github/workflows/syria-firebase-isolation-retry.yml
          git rm --ignore-unmatch scripts/apply-syria-firebase-isolation.py

      - name: Validate all Syria isolation contracts
        run: |
          node scripts/syria-runtime-residual-audit.mjs
          node --test scripts/syria-firebase-isolation.test.mjs
          node --test scripts/syria-provider-preflight.test.mjs
          node --test scripts/syria-secret-hygiene.test.mjs
          node --test scripts/syria-vercel-isolation.test.mjs
          node --test scripts/syria-release-workflow-safety.test.mjs
          node --test scripts/backend-boundary-hardening.test.mjs
          node --test scripts/cloudflare-cutover-foundation.test.mjs

      - name: Type-check application and Worker
        run: |
          npm run typecheck
          npm run typecheck --prefix cloudflare/worker

      - name: Build Syria application
        run: npm run build

      - name: Commit verified finalization
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'chore(syria): finalize standalone release safeguards'
          git push origin HEAD:migration/syria-standalone-hardening
