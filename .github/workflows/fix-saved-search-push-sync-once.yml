name: Fix Saved Search Push Sync Once

on:
  push:
    branches:
      - feature/saved-search-alerts-push-v1

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Capacitor sync step
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/saved-search-push-format-once.yml")
          text = path.read_text(encoding="utf-8")
          old = '''      - name: Update Android Capacitor plugins
        run: npx cap update android
'''
          new = '''      - name: Sync Android Capacitor plugins
        run: |
          mkdir -p .output/public
          printf '<!doctype html><html lang="ar"><body></body></html>\\n' > .output/public/index.html
          npx cap sync android
          git ls-files -z android/app/src/main/assets/public | xargs -0 -r git checkout --
          git clean -fd android/app/src/main/assets/public
          rm -rf .output
'''
          if old not in text:
              raise SystemExit("Capacitor update step not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove helper workflow
        run: rm .github/workflows/fix-saved-search-push-sync-once.yml
      - name: Commit workflow correction
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sync Android push plugin during validation"
          git push origin HEAD:"$HEAD_REF"
