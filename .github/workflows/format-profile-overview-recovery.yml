name: Format profile overview recovery

on:
  push:
    branches:
      - feature/recover-profile-overview-loads

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-profile-overview-loads
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx eslint --fix src/routes/profile.tsx scripts/auth-account-v2.test.mjs
      - name: Commit formatting and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-profile-overview-recovery.yml
          git add src/routes/profile.tsx scripts/auth-account-v2.test.mjs
          git commit -m "Format profile overview recovery files"
          git push origin HEAD:feature/recover-profile-overview-loads
