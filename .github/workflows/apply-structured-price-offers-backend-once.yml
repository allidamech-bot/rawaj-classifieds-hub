name: Apply Structured Price Offers Backend Once

on:
  push:
    branches:
      - feature/structured-listing-price-offers-v1
    paths:
      - .github/workflows/apply-structured-price-offers-backend-once.yml

permissions:
  contents: write

concurrency:
  group: structured-price-offers-backend-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/structured-listing-price-offers-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply backend foundation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          migration = r'''-- Structured buyer/seller listing price offers.
          PRAGMA foreign_keys = ON;

          CREATE TABLE listing_price_offers (
            id TEXT PRIMARY KEY,
            listing_id TEXT NOT NULL,
            conversation_id TEXT NOT NULL,
            buyer_id TEXT NOT NULL,
            seller_id TEXT NOT NULL,
            created_by TEXT NOT NULL,
            parent_offer_id TEXT,
            amount INTEGER NOT NULL CHECK (amount > 0 AND amount <= 9007199254740991),
            currency TEXT NOT NULL CHECK (length(currency) BETWEEN 3 AND 8),
            status TEXT NOT NULL DEFAULT 'pending'
              CHECK (status IN ('pending', 'accepted', 'rejected', 'countered', 'withdrawn', 'expired')),
            expires_at TEXT NOT NULL,
            responded_at TEXT,
            client_request_id TEXT NOT NULL,
            last_action_request_id TEXT,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL,
            CHECK (buyer_id <> seller_id),
            CHECK (created_by = buyer_id OR created_by = seller_id),
            FOREIGN KEY (listing_id) REFERENCES listings(id) ON DELETE CASCADE,
            FOREIGN KEY (conversation_id) REFERENCES conversations(id) ON DELETE CASCADE,
            FOREIGN KEY (buyer_id) REFERENCES auth_users(id) ON DELETE CASCADE,
            FOREIGN KEY (seller_id) REFERENCES auth_users(id) ON DELETE CASCADE,
            FOREIGN KEY (created_by) REFERENCES auth_users(id) ON DELETE CASCADE,
            FOREIGN KEY (parent_offer_id) REFERENCES listing_price_offers(id) ON DELETE SET NULL,
            UNIQUE (created_by, client_request_id)
          );

          CREATE UNIQUE INDEX idx_listing_price_offers_one_pending
            ON listing_price_offers (conversation_id)
            WHERE status = 'pending';

          CREATE INDEX idx_listing_price_offers_conversation_history
            ON listing_price_offers (conversation_id, created_at ASC, id ASC);

          CREATE INDEX idx_listing_price_offers_listing_status
            ON listing_price_offers (listing_id, status, updated_at DESC);

          CREATE INDEX idx_listing_price_offers_expiry
            ON listing_price_offers (status, expires_at)
            WHERE status = 'pending';
          '''
          Path('cloudflare/d1/migrations/0019_structured_listing_price_offers.sql').write_text(migration, encoding='utf-8')

          handler = r'''import {
            authenticate,
            corsHeaders,
            json,
            readJson,
            requireMutationAuth,
            type AuthEnv,
          } from "./auth";

          type Value = string | number | null;
          type Row = Record<string, unknown>;
          interface Result<T = Row> {
            results?: T[];
            success: boolean;
          }
          interface Statement {
            bind(...values: Value[]): Statement;
            first<T = Row>(): Promise<T | null>;
            all<T = Row>(): Promise<Result<T>>;
            run(): Promise<Result>;
          }
          interface Database {
            prepare(query: string): Statement;
            batch(statements: Statement[]): Promise<Result[]>;
          }

          export interface ListingOffersEnv {
            DB: Database;
            API_ALLOWED_ORIGINS?: string;
          }

          interface ConversationContext {
            id: string;
            listing_id: string;
            buyer_id: string;
            seller_id: string;
            status: string;
            listing_status: string;
            archived_at: string | null;
            currency: string;
            listing_title: string;
          }

          interface OfferRow {
            id: string;
            listing_id: string;
            conversation_id: string;
            buyer_id: string;
            seller_id: string;
            created_by: string;
            parent_offer_id: string | null;
            amount: number;
            currency: string;
            status: string;
            expires_at: string;
            responded_at: string | null;
            client_request_id: string;
            last_action_request_id: string | null;
            created_at: string;
            updated_at: string;
          }

          const OFFER_TTL_MS = 72 * 60 * 60 * 1000;
          const MAX_AMOUNT = 9_007_199_254_740_991;
          const ACTIONS = new Set(["accept", "reject", "counter", "withdraw"]);

          export async function handleListingOffers(
            request: Request,
            env: ListingOffersEnv,
          ): Promise<Response | null> {
            const url = new URL(request.url);
            const path = url.pathname;
            if (!isListingOfferPath(path)) return null;
            const cors = corsHeaders(request, env as unknown as AuthEnv);
            if (request.method === "OPTIONS") return new Response(null, { status: 204, headers: cors });

            const conversationOffers = path.match(/^\/v1\/conversations\/([^/]+)\/offers$/);
            if (conversationOffers) {
              const conversationId = decodeURIComponent(conversationOffers[1]);
              if (request.method === "GET") return listOffers(request, env, cors, conversationId);
              if (request.method === "POST") return createOffer(request, env, cors, conversationId);
            }

            const offer = path.match(/^\/v1\/offers\/(?!price-drops$)([^/]+)$/);
            if (offer && request.method === "PATCH") {
              return transitionOffer(request, env, cors, decodeURIComponent(offer[1]));
            }

            return json({ error: { code: "method_not_allowed", message: "Method not allowed." } }, 405, cors);
          }

          function isListingOfferPath(path: string): boolean {
            return (
              /^\/v1\/conversations\/[^/]+\/offers$/.test(path) ||
              /^\/v1\/offers\/(?!price-drops$)[^/]+$/.test(path)
            );
          }

          async function listOffers(
            request: Request,
            env: ListingOffersEnv,
            cors: Headers,
            conversationId: string,
          ) {
            const auth = await authenticate(request, env as unknown as AuthEnv);
            if (!auth) return unauthorized(cors);
            const conversation = await conversationContext(env, conversationId, auth.userId);
            if (!conversation) return notFound(cors);
            await expirePendingOffers(env, conversationId);
            const result = await env.DB.prepare(
              `SELECT id, listing_id, conversation_id, buyer_id, seller_id, created_by,
                parent_offer_id, amount, currency, status, expires_at, responded_at,
                client_request_id, last_action_request_id, created_at, updated_at
               FROM listing_price_offers
               WHERE conversation_id = ?
               ORDER BY created_at ASC, id ASC`,
            )
              .bind(conversationId)
              .all<OfferRow>();
            return result.success
              ? json({ data: { items: (result.results ?? []).map((row) => mapOffer(row, auth.userId)) } }, 200, cors)
              : databaseError(cors);
          }

          async function createOffer(
            request: Request,
            env: ListingOffersEnv,
            cors: Headers,
            conversationId: string,
          ) {
            const auth = await requireMutationAuth(request, env as unknown as AuthEnv, cors);
            if (auth instanceof Response) return auth;
            const body = await readJson(request);
            if (!body.ok) return json({ error: body.error }, body.status, cors);
            const amount = offerAmount(body.data.amount);
            const requestId = clean(body.data.requestId, 80);
            if (amount === null || !requestId || !isUuid(requestId)) {
              return validation(cors, "Invalid price offer.");
            }

            const existing = await offerByRequest(env, auth.userId, requestId);
            if (existing) return json({ data: mapOffer(existing, auth.userId) }, 200, cors);

            const conversation = await conversationContext(env, conversationId, auth.userId);
            if (!conversation) return notFound(cors);
            if (conversation.buyer_id !== auth.userId) {
              return forbidden(cors, "Only the buyer can create the first offer.");
            }
            const readiness = await mutationReadiness(env, conversation, auth.userId);
            if (readiness) return json({ error: readiness.error }, readiness.status, cors);
            await expirePendingOffers(env, conversationId);
            if (await pendingOffer(env, conversationId)) {
              return conflict(cors, "A price offer is already awaiting a response.");
            }

            const timestamp = now();
            const offer: OfferRow = {
              id: crypto.randomUUID(),
              listing_id: conversation.listing_id,
              conversation_id: conversation.id,
              buyer_id: conversation.buyer_id,
              seller_id: conversation.seller_id,
              created_by: auth.userId,
              parent_offer_id: null,
              amount,
              currency: normalizeCurrency(conversation.currency),
              status: "pending",
              expires_at: new Date(Date.now() + OFFER_TTL_MS).toISOString(),
              responded_at: null,
              client_request_id: requestId,
              last_action_request_id: null,
              created_at: timestamp,
              updated_at: timestamp,
            };
            const results = await env.DB.batch([
              insertOfferStatement(env, offer),
              touchConversationStatement(env, conversation.id, timestamp),
              notificationStatement(env, {
                userId: conversation.seller_id,
                type: "offer.received",
                title: "وصل عرض سعر جديد",
                body: `لديك عرض جديد على ${conversation.listing_title}.`,
                offer,
                timestamp,
              }),
            ]);
            return results.every((result) => result.success)
              ? json({ data: mapOffer(offer, auth.userId) }, 201, cors)
              : databaseError(cors);
          }

          async function transitionOffer(
            request: Request,
            env: ListingOffersEnv,
            cors: Headers,
            offerId: string,
          ) {
            const auth = await requireMutationAuth(request, env as unknown as AuthEnv, cors);
            if (auth instanceof Response) return auth;
            const body = await readJson(request);
            if (!body.ok) return json({ error: body.error }, body.status, cors);
            const action = clean(body.data.action, 20);
            const requestId = clean(body.data.requestId, 80);
            const expectedUpdatedAt = clean(body.data.expectedUpdatedAt, 80);
            if (!ACTIONS.has(action) || !requestId || !isUuid(requestId) || !expectedUpdatedAt) {
              return validation(cors, "Invalid price-offer transition.");
            }

            if (action === "counter") {
              const replay = await offerByRequest(env, auth.userId, requestId);
              if (replay) return json({ data: mapOffer(replay, auth.userId) }, 200, cors);
            }

            await expireOffer(env, offerId);
            const current = await offerById(env, offerId);
            if (!current) return notFound(cors);
            if (current.buyer_id !== auth.userId && current.seller_id !== auth.userId) return notFound(cors);
            if (current.last_action_request_id === requestId) {
              return json({ data: mapOffer(current, auth.userId) }, 200, cors);
            }
            if (current.status !== "pending") return conflict(cors, "This offer is no longer pending.");
            if (current.updated_at !== expectedUpdatedAt) {
              return json(
                { error: { code: "stale_write", message: "The offer changed. Refresh and try again." } },
                409,
                cors,
              );
            }

            const conversation = await conversationContext(env, current.conversation_id, auth.userId);
            if (!conversation) return notFound(cors);
            const readiness = await mutationReadiness(env, conversation, auth.userId);
            if (readiness && (action === "accept" || action === "counter")) {
              return json({ error: readiness.error }, readiness.status, cors);
            }

            const isCreator = current.created_by === auth.userId;
            if (action === "withdraw" && !isCreator) return forbidden(cors, "Only the sender can withdraw this offer.");
            if (action !== "withdraw" && isCreator) return forbidden(cors, "Only the recipient can respond to this offer.");

            if (action === "counter") {
              const amount = offerAmount(body.data.amount);
              if (amount === null) return validation(cors, "Invalid counter offer amount.");
              return createCounterOffer(env, cors, current, conversation, auth.userId, amount, requestId);
            }

            const nextStatus = action === "accept" ? "accepted" : action === "reject" ? "rejected" : "withdrawn";
            const timestamp = now();
            const recipient = auth.userId === current.buyer_id ? current.seller_id : current.buyer_id;
            const results = await env.DB.batch([
              env.DB.prepare(
                `UPDATE listing_price_offers
                 SET status = ?, responded_at = ?, last_action_request_id = ?, updated_at = ?
                 WHERE id = ? AND status = 'pending' AND updated_at = ?`,
              ).bind(nextStatus, timestamp, requestId, timestamp, current.id, expectedUpdatedAt),
              touchConversationStatement(env, conversation.id, timestamp),
              notificationStatement(env, {
                userId: recipient,
                type: `offer.${nextStatus}`,
                title: transitionTitle(nextStatus),
                body: transitionBody(nextStatus, conversation.listing_title),
                offer: { ...current, status: nextStatus, responded_at: timestamp, updated_at: timestamp },
                timestamp,
              }),
            ]);
            if (results.some((result) => !result.success)) return databaseError(cors);
            const updated = await offerById(env, current.id);
            return updated
              ? json({ data: mapOffer(updated, auth.userId) }, 200, cors)
              : databaseError(cors);
          }

          async function createCounterOffer(
            env: ListingOffersEnv,
            cors: Headers,
            current: OfferRow,
            conversation: ConversationContext,
            actorId: string,
            amount: number,
            requestId: string,
          ) {
            const timestamp = now();
            const counter: OfferRow = {
              id: crypto.randomUUID(),
              listing_id: current.listing_id,
              conversation_id: current.conversation_id,
              buyer_id: current.buyer_id,
              seller_id: current.seller_id,
              created_by: actorId,
              parent_offer_id: current.id,
              amount,
              currency: current.currency,
              status: "pending",
              expires_at: new Date(Date.now() + OFFER_TTL_MS).toISOString(),
              responded_at: null,
              client_request_id: requestId,
              last_action_request_id: null,
              created_at: timestamp,
              updated_at: timestamp,
            };
            const recipient = actorId === current.buyer_id ? current.seller_id : current.buyer_id;
            const results = await env.DB.batch([
              env.DB.prepare(
                `UPDATE listing_price_offers
                 SET status = 'countered', responded_at = ?, last_action_request_id = ?, updated_at = ?
                 WHERE id = ? AND status = 'pending' AND updated_at = ?`,
              ).bind(timestamp, requestId, timestamp, current.id, current.updated_at),
              insertOfferStatement(env, counter),
              touchConversationStatement(env, conversation.id, timestamp),
              notificationStatement(env, {
                userId: recipient,
                type: "offer.countered",
                title: "وصل عرض مضاد",
                body: `لديك عرض مضاد على ${conversation.listing_title}.`,
                offer: counter,
                timestamp,
              }),
            ]);
            if (results.some((result) => !result.success)) return databaseError(cors);
            return json({ data: mapOffer(counter, actorId) }, 201, cors);
          }

          async function mutationReadiness(
            env: ListingOffersEnv,
            conversation: ConversationContext,
            actorId: string,
          ): Promise<{ status: number; error: { code: string; message: string } } | null> {
            if (conversation.status !== "active") {
              return { status: 409, error: { code: "invalid_transition", message: "Conversation is not active." } };
            }
            if (conversation.listing_status !== "approved" || conversation.archived_at) {
              return { status: 409, error: { code: "status_mismatch", message: "Listing is not available for offers." } };
            }
            const other = actorId === conversation.buyer_id ? conversation.seller_id : conversation.buyer_id;
            if (await usersBlocked(env, actorId, other)) {
              return { status: 403, error: { code: "permission_denied", message: "Offers are blocked for this conversation." } };
            }
            return null;
          }

          async function conversationContext(
            env: ListingOffersEnv,
            conversationId: string,
            userId: string,
          ) {
            return env.DB.prepare(
              `SELECT c.id, c.listing_id, c.buyer_id, c.seller_id, c.status,
                l.status AS listing_status, l.archived_at, l.currency, l.title AS listing_title
               FROM conversations c
               JOIN listings l ON l.id = c.listing_id
               WHERE c.id = ? AND (c.buyer_id = ? OR c.seller_id = ?)`,
            )
              .bind(conversationId, userId, userId)
              .first<ConversationContext>();
          }

          async function usersBlocked(env: ListingOffersEnv, first: string, second: string) {
            const row = await env.DB.prepare(
              `SELECT 1 AS blocked FROM user_blocks
               WHERE (blocker_id = ? AND blocked_id = ?) OR (blocker_id = ? AND blocked_id = ?)
               LIMIT 1`,
            )
              .bind(first, second, second, first)
              .first();
            return Boolean(row);
          }

          async function pendingOffer(env: ListingOffersEnv, conversationId: string) {
            return env.DB.prepare(
              "SELECT id FROM listing_price_offers WHERE conversation_id = ? AND status = 'pending' LIMIT 1",
            )
              .bind(conversationId)
              .first();
          }

          async function expirePendingOffers(env: ListingOffersEnv, conversationId: string) {
            return env.DB.prepare(
              `UPDATE listing_price_offers
               SET status = 'expired', responded_at = COALESCE(responded_at, ?), updated_at = ?
               WHERE conversation_id = ? AND status = 'pending' AND expires_at <= ?`,
            )
              .bind(now(), now(), conversationId, now())
              .run();
          }

          async function expireOffer(env: ListingOffersEnv, offerId: string) {
            const timestamp = now();
            return env.DB.prepare(
              `UPDATE listing_price_offers
               SET status = 'expired', responded_at = COALESCE(responded_at, ?), updated_at = ?
               WHERE id = ? AND status = 'pending' AND expires_at <= ?`,
            )
              .bind(timestamp, timestamp, offerId, timestamp)
              .run();
          }

          async function offerById(env: ListingOffersEnv, id: string) {
            return env.DB.prepare(
              `SELECT id, listing_id, conversation_id, buyer_id, seller_id, created_by,
                parent_offer_id, amount, currency, status, expires_at, responded_at,
                client_request_id, last_action_request_id, created_at, updated_at
               FROM listing_price_offers WHERE id = ?`,
            )
              .bind(id)
              .first<OfferRow>();
          }

          async function offerByRequest(env: ListingOffersEnv, userId: string, requestId: string) {
            return env.DB.prepare(
              `SELECT id, listing_id, conversation_id, buyer_id, seller_id, created_by,
                parent_offer_id, amount, currency, status, expires_at, responded_at,
                client_request_id, last_action_request_id, created_at, updated_at
               FROM listing_price_offers WHERE created_by = ? AND client_request_id = ?`,
            )
              .bind(userId, requestId)
              .first<OfferRow>();
          }

          function insertOfferStatement(env: ListingOffersEnv, offer: OfferRow) {
            return env.DB.prepare(
              `INSERT INTO listing_price_offers
               (id, listing_id, conversation_id, buyer_id, seller_id, created_by,
                parent_offer_id, amount, currency, status, expires_at, responded_at,
                client_request_id, last_action_request_id, created_at, updated_at)
               VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
            ).bind(
              offer.id,
              offer.listing_id,
              offer.conversation_id,
              offer.buyer_id,
              offer.seller_id,
              offer.created_by,
              offer.parent_offer_id,
              offer.amount,
              offer.currency,
              offer.status,
              offer.expires_at,
              offer.responded_at,
              offer.client_request_id,
              offer.last_action_request_id,
              offer.created_at,
              offer.updated_at,
            );
          }

          function touchConversationStatement(env: ListingOffersEnv, conversationId: string, timestamp: string) {
            return env.DB.prepare(
              "UPDATE conversations SET last_message_at = ?, updated_at = ? WHERE id = ?",
            ).bind(timestamp, timestamp, conversationId);
          }

          function notificationStatement(
            env: ListingOffersEnv,
            input: {
              userId: string;
              type: string;
              title: string;
              body: string;
              offer: OfferRow;
              timestamp: string;
            },
          ) {
            return env.DB.prepare(
              `INSERT INTO notifications (id, user_id, type, title, body, data, created_at)
               VALUES (?, ?, ?, ?, ?, ?, ?)`,
            ).bind(
              crypto.randomUUID(),
              input.userId,
              input.type,
              input.title,
              input.body,
              JSON.stringify({
                targetType: "conversation",
                targetId: input.offer.conversation_id,
                conversationId: input.offer.conversation_id,
                listingId: input.offer.listing_id,
                offerId: input.offer.id,
                amount: input.offer.amount,
                currency: input.offer.currency,
                status: input.offer.status,
              }),
              input.timestamp,
            );
          }

          function mapOffer(row: OfferRow, userId: string) {
            return {
              id: row.id,
              listingId: row.listing_id,
              conversationId: row.conversation_id,
              buyerId: row.buyer_id,
              sellerId: row.seller_id,
              createdBy: row.created_by,
              createdByMe: row.created_by === userId,
              parentOfferId: row.parent_offer_id,
              amount: Number(row.amount),
              currency: row.currency,
              status: row.status,
              expiresAt: row.expires_at,
              respondedAt: row.responded_at,
              createdAt: row.created_at,
              updatedAt: row.updated_at,
            };
          }

          function offerAmount(value: unknown): number | null {
            const number = typeof value === "number" ? value : Number(value);
            return Number.isSafeInteger(number) && number > 0 && number <= MAX_AMOUNT ? number : null;
          }

          function normalizeCurrency(value: unknown): string {
            const currency = clean(value, 8).toUpperCase();
            return /^[A-Z]{3,8}$/.test(currency) ? currency : "SYP";
          }

          function clean(value: unknown, limit: number): string {
            return typeof value === "string" ? value.trim().slice(0, limit) : "";
          }

          function isUuid(value: string): boolean {
            return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);
          }

          function now(): string {
            return new Date().toISOString();
          }

          function transitionTitle(status: string): string {
            if (status === "accepted") return "تم قبول عرض السعر";
            if (status === "rejected") return "تم رفض عرض السعر";
            return "تم سحب عرض السعر";
          }

          function transitionBody(status: string, listingTitle: string): string {
            if (status === "accepted") return `تم قبول العرض على ${listingTitle}.`;
            if (status === "rejected") return `تم رفض العرض على ${listingTitle}.`;
            return `تم سحب العرض على ${listingTitle}.`;
          }

          function unauthorized(cors: Headers) {
            return json({ error: { code: "auth_required", message: "Authentication required." } }, 401, cors);
          }

          function forbidden(cors: Headers, message: string) {
            return json({ error: { code: "permission_denied", message } }, 403, cors);
          }

          function notFound(cors: Headers) {
            return json({ error: { code: "not_found", message: "Resource not found." } }, 404, cors);
          }

          function validation(cors: Headers, message: string) {
            return json({ error: { code: "validation_error", message } }, 400, cors);
          }

          function conflict(cors: Headers, message: string) {
            return json({ error: { code: "status_mismatch", message } }, 409, cors);
          }

          function databaseError(cors: Headers) {
            return json({ error: { code: "database_error", message: "Database operation failed." } }, 500, cors);
          }
          '''
          Path('cloudflare/worker/src/listing-offers.ts').write_text(handler, encoding='utf-8')

          entry_path = Path('cloudflare/worker/src/entry.ts')
          entry = entry_path.read_text(encoding='utf-8')
          entry = entry.replace(
              'import { handleListingOperations, type ListingOperationsEnv } from "./listing-operations";\n',
              'import { handleListingOperations, type ListingOperationsEnv } from "./listing-operations";\nimport { handleListingOffers, type ListingOffersEnv } from "./listing-offers";\n',
          )
          entry = entry.replace(
              '  ListingOperationsEnv &\n  DiscoveryEnv &',
              '  ListingOperationsEnv &\n  ListingOffersEnv &\n  DiscoveryEnv &',
          )
          marker = '''  if (isListingOperationsPath(path)) {
              return required(await handleListingOperations(request, env));
            }
          '''
          replacement = marker + '''  if (isListingOfferPath(path)) {
              return required(await handleListingOffers(request, env));
            }
          '''
          if marker not in entry:
              raise SystemExit('entry listing operations marker missing')
          entry = entry.replace(marker, replacement, 1)
          helper_marker = 'function isTrustSupportPath(path: string): boolean {'
          helper = '''function isListingOfferPath(path: string): boolean {
            return (
              /^\\/v1\\/conversations\\/[^/]+\\/offers$/.test(path) ||
              /^\\/v1\\/offers\\/(?!price-drops$)[^/]+$/.test(path)
            );
          }

          '''
          if helper_marker not in entry:
              raise SystemExit('entry helper marker missing')
          entry = entry.replace(helper_marker, helper + helper_marker, 1)
          entry_path.write_text(entry, encoding='utf-8')

          test_file = r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { DatabaseSync } from "node:sqlite";
          import test from "node:test";

          const [migration, handler, entry, packageJson] = await Promise.all([
            readFile("cloudflare/d1/migrations/0019_structured_listing_price_offers.sql", "utf8"),
            readFile("cloudflare/worker/src/listing-offers.ts", "utf8"),
            readFile("cloudflare/worker/src/entry.ts", "utf8"),
            readFile("package.json", "utf8"),
          ]);

          function database() {
            const db = new DatabaseSync(":memory:");
            db.exec(`
              PRAGMA foreign_keys = ON;
              CREATE TABLE auth_users (id TEXT PRIMARY KEY);
              CREATE TABLE listings (id TEXT PRIMARY KEY);
              CREATE TABLE conversations (id TEXT PRIMARY KEY);
              CREATE TABLE notifications (
                id TEXT PRIMARY KEY, user_id TEXT NOT NULL, type TEXT NOT NULL,
                title TEXT NOT NULL, body TEXT NOT NULL, data TEXT NOT NULL,
                read_at TEXT, created_at TEXT NOT NULL
              );
            `);
            db.exec(migration);
            for (const id of ["buyer", "seller"]) db.prepare("INSERT INTO auth_users (id) VALUES (?)").run(id);
            db.prepare("INSERT INTO listings (id) VALUES ('listing')").run();
            db.prepare("INSERT INTO conversations (id) VALUES ('conversation')").run();
            return db;
          }

          function insertPending(db, overrides = {}) {
            const row = {
              id: crypto.randomUUID(),
              listingId: "listing",
              conversationId: "conversation",
              buyerId: "buyer",
              sellerId: "seller",
              createdBy: "buyer",
              parentId: null,
              amount: 1000,
              currency: "SYP",
              requestId: crypto.randomUUID(),
              createdAt: "2026-08-01T00:00:00.000Z",
              ...overrides,
            };
            db.prepare(`INSERT INTO listing_price_offers
              (id, listing_id, conversation_id, buyer_id, seller_id, created_by,
               parent_offer_id, amount, currency, status, expires_at, client_request_id,
               created_at, updated_at)
              VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, 'pending', ?, ?, ?, ?)`)
              .run(row.id, row.listingId, row.conversationId, row.buyerId, row.sellerId,
                row.createdBy, row.parentId, row.amount, row.currency,
                "2026-08-04T00:00:00.000Z", row.requestId, row.createdAt, row.createdAt);
            return row;
          }

          test("migration stores immutable offer history with one pending offer per conversation", () => {
            const db = database();
            insertPending(db);
            assert.throws(() => insertPending(db), /UNIQUE constraint failed/);
            db.exec("UPDATE listing_price_offers SET status = 'countered' WHERE status = 'pending'");
            insertPending(db, { createdBy: "seller" });
            assert.equal(db.prepare("SELECT count(*) AS count FROM listing_price_offers").get().count, 2);
          });

          test("migration rejects self offers, unsafe amounts, and duplicate request ids", () => {
            const db = database();
            assert.throws(() => insertPending(db, { sellerId: "buyer" }), /CHECK constraint failed/);
            assert.throws(() => insertPending(db, { amount: 0 }), /CHECK constraint failed/);
            const requestId = crypto.randomUUID();
            insertPending(db, { requestId });
            db.exec("UPDATE listing_price_offers SET status = 'rejected' WHERE status = 'pending'");
            assert.throws(() => insertPending(db, { requestId }), /UNIQUE constraint failed/);
          });

          test("Worker contract enforces auth, participant ownership, blocking, idempotency and stale writes", () => {
            assert.match(handler, /requireMutationAuth/);
            assert.match(handler, /c\.buyer_id = \? OR c\.seller_id = \?/);
            assert.match(handler, /user_blocks/);
            assert.match(handler, /client_request_id/);
            assert.match(handler, /last_action_request_id/);
            assert.match(handler, /expectedUpdatedAt/);
            assert.match(handler, /stale_write/);
            assert.match(handler, /Only the buyer can create the first offer/);
            assert.match(handler, /Only the recipient can respond/);
            assert.match(handler, /offer\.received/);
            assert.match(handler, /offer\.countered/);
            assert.match(handler, /offer\.accepted/);
          });

          test("offer routes do not capture the existing price-drop endpoint", () => {
            assert.match(entry, /handleListingOffers/);
            assert.match(entry, /\(\?!price-drops\$\)/);
            const operationsIndex = entry.indexOf("isListingOperationsPath(path)");
            const offersIndex = entry.indexOf("isListingOfferPath(path)");
            assert.ok(operationsIndex >= 0 && offersIndex > operationsIndex);
          });

          test("focused contract is permanently included in precheck", () => {
            const parsed = JSON.parse(packageJson);
            assert.equal(
              parsed.scripts["test:listing-price-offers"],
              "node --test scripts/structured-listing-price-offers-v1.test.mjs",
            );
            assert.match(parsed.scripts.precheck, /test:listing-price-offers/);
          });
          '''
          Path('scripts/structured-listing-price-offers-v1.test.mjs').write_text(test_file, encoding='utf-8')

          package_path = Path('package.json')
          package_text = package_path.read_text(encoding='utf-8')
          package_text = package_text.replace(
              'npm run test:owner-listing-performance && npm run test:messaging-v4',
              'npm run test:owner-listing-performance && npm run test:listing-price-offers && npm run test:messaging-v4',
          )
          package_text = package_text.replace(
              '    "test:owner-listing-performance": "node --test scripts/owner-listing-performance-dashboard-v1.test.mjs"\n',
              '    "test:owner-listing-performance": "node --test scripts/owner-listing-performance-dashboard-v1.test.mjs",\n    "test:listing-price-offers": "node --test scripts/structured-listing-price-offers-v1.test.mjs"\n',
          )
          package_path.write_text(package_text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: npx prettier --write cloudflare/d1/migrations/0019_structured_listing_price_offers.sql cloudflare/worker/src/listing-offers.ts cloudflare/worker/src/entry.ts scripts/structured-listing-price-offers-v1.test.mjs package.json

      - name: Validate backend foundation
        run: |
          npm run test:listing-price-offers
          npm run test:d1-migrations
          npx tsc -p cloudflare/worker/tsconfig.json --noEmit
          npm run typecheck

      - name: Commit backend foundation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-structured-price-offers-backend-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/d1/migrations/0019_structured_listing_price_offers.sql \
            cloudflare/worker/src/listing-offers.ts \
            cloudflare/worker/src/entry.ts \
            scripts/structured-listing-price-offers-v1.test.mjs \
            package.json
          git commit -m "feat(offers): add structured price offer backend foundation"
          git push origin HEAD:feature/structured-listing-price-offers-v1
