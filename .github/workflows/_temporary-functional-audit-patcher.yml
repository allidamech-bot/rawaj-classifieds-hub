name: Temporary functional audit patcher

on:
  push:
    branches:
      - fix/ad-promotion-functional-audit-20260819

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ad-promotion-functional-audit-20260819
          fetch-depth: 0
      - name: Apply verified functional fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              p.write_text(text.replace(old, new))

          admin = "cloudflare/worker/src/admin.ts"
          replace_exact(
              admin,
              '''  const pendingListings = await env.DB.prepare(
            "SELECT count(*) AS count FROM listings WHERE status = 'pending_review'",
          ).first<{ count: number }>();
          const openListingReports = await env.DB.prepare(''',
              '''  const pendingListings = await env.DB.prepare(
            "SELECT count(*) AS count FROM listings WHERE status = 'pending_review'",
          ).first<{ count: number }>();
          const pendingPromotions = await env.DB.prepare(
            "SELECT count(*) AS count FROM listing_promotion_requests WHERE status = 'pending_review'",
          ).first<{ count: number }>();
          const openListingReports = await env.DB.prepare(''',
          )
          replace_exact(
              admin,
              "        pendingPromotions: 0,",
              "        pendingPromotions: numberValue(pendingPromotions?.count),",
          )
          old_query = '''    `SELECT l.id, l.owner_id, l.title, l.status, l.category_id, l.governorate_id,
            l.expires_at, l.published_at, l.archived_at, l.created_at, l.updated_at
       FROM listings l
      WHERE l.status IN ('pending_review', 'approved', 'rejected', 'archived', 'expired')
      ORDER BY l.updated_at DESC
      LIMIT 250`,'''
          new_query = '''    `SELECT l.id, l.owner_id, l.title, l.status, l.category_id, l.governorate_id,
            l.expires_at, l.published_at, l.archived_at, l.created_at, l.updated_at,
            (SELECT a.reason FROM listing_moderation_actions a
              WHERE a.listing_id = l.id
              ORDER BY a.created_at DESC, a.id DESC LIMIT 1) AS rejection_reason,
            (SELECT a.created_at FROM listing_moderation_actions a
              WHERE a.listing_id = l.id
              ORDER BY a.created_at DESC, a.id DESC LIMIT 1) AS reviewed_at
       FROM listings l
      WHERE l.status IN ('pending_review', 'approved', 'rejected', 'archived', 'expired')
      ORDER BY l.updated_at DESC
      LIMIT 250`,'''
          replace_exact(admin, old_query, new_query, expected=2)
          old_map = '''    rejectionReason: null,
    expiresAt: nullableString(row.expires_at),
    reviewedAt: null,'''
          new_map = '''    rejectionReason: nullableString(row.rejection_reason),
    expiresAt: nullableString(row.expires_at),
    reviewedAt: nullableString(row.reviewed_at),'''
          replace_exact(admin, old_map, new_map, expected=2)

          private = "cloudflare/worker/src/marketplace-private.ts"
          replace_exact(
              private,
              "      VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, 'SAR', ?, ?, ?, ?, ?, ?, ?, 0, ?, ?, ?)",
              "      VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, 'SYP', ?, ?, ?, ?, ?, ?, ?, 0, ?, ?, ?)",
          )

          Path(".github/workflows/_temporary-functional-audit-patcher.yml").unlink()
      - name: Commit functional fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: repair listing and admin promotion flows"
          git push origin HEAD:fix/ad-promotion-functional-audit-20260819
