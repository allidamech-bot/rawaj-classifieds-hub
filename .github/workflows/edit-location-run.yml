name: Edit location integration runner

on:
  push:
    branches:
      - location-ux-edit-integration

permissions:
  contents: write

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message, '[skip edit runner]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-ux-edit-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-edit-location.mjs
      - run: npx prettier --write 'src/routes/profile/listings.$id.tsx' src/lib/api/listing-location-read.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'src/routes/profile/listings.$id.tsx' src/lib/api/listing-location-read.ts
          git commit -m "Integrate canonical location into listing edit [skip edit runner]"
          git push origin HEAD:location-ux-edit-integration
