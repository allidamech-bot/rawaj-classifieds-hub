name: Format location branch

on:
  push:
    branches:
      - location-ux-integration

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-ux-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed source files
        run: |
          npx prettier --write \
            src/features/listings/listings-search-schema.ts \
            src/features/locations/CanonicalLocationSelector.tsx \
            src/features/locations/use-location-levels.ts \
            src/lib/api/canonical-location-filter.ts \
            src/lib/api/location-aware-listings-v2.ts \
            src/lib/api/location-taxonomy.ts \
            src/lib/classifieds-api.ts
          rm -f src/features/locations/z.txt
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format canonical location integration [skip format]"
          git push origin HEAD:location-ux-integration
