name: Run Syria routing image parity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/syria-match-saudi-owner-listings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/syria-match-saudi-owner-listings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-syria-routing-image-parity.py
      - run: npm ci
      - run: npx prettier --write 'src/routes/profile/listings_.$id.tsx' src/features/listing-studio/DraftRecoveryBanner.tsx src/features/storefront/StorefrontIdentityHero.tsx src/lib/listing-image-processing.ts scripts/listing-image-content-reliability.test.mjs
      - name: Build and regenerate TanStack route tree
        run: npm run build
      - run: npm run typecheck
      - run: npm run test:listing-image-content-reliability
      - run: npm run test:listings-filters
      - run: npm run test:mobile-ux-polish
      - run: npm run test:cloudflare-cutover
      - name: Worker typecheck
        working-directory: cloudflare/worker
        run: npm run typecheck
      - name: Verify independent editor route and fresh navigation
        run: |
          test ! -e 'src/routes/profile/listings.$id.tsx'
          test -e 'src/routes/profile/listings_.$id.tsx'
          grep -Fq "./routes/profile/listings_.\$id" src/routeTree.gen.ts
          grep -Fq "id: '/listings_/\$id'" src/routeTree.gen.ts
          grep -Fq "getParentRoute: () => ProfileRoute" src/routeTree.gen.ts
          grep -Fq 'window.location.assign(destination.href)' src/features/storefront/StorefrontIdentityHero.tsx
          grep -Fq 'href={`/profile/listings/${encodeURIComponent(draft.listing.id)}`}' src/features/listing-studio/DraftRecoveryBanner.tsx
      - name: Reject Saudi runtime identity
        run: |
          if grep -RInE 'sa\.rawa-j\.com|rawaj-saudi|SAUDI_|Saudi Arabia|السعودية|\bSAR\b' 'src/routes/profile/listings_.$id.tsx' src/features/listing-studio/DraftRecoveryBanner.tsx src/features/storefront/StorefrontIdentityHero.tsx src/lib/listing-image-processing.ts; then
            exit 1
          fi
      - name: Commit result and remove one-shot files
        run: |
          git rm .github/workflows/run-syria-routing-image-parity.yml scripts/apply-syria-routing-image-parity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/routes/profile src/routeTree.gen.ts src/features/listing-studio/DraftRecoveryBanner.tsx src/features/storefront/StorefrontIdentityHero.tsx src/lib/listing-image-processing.ts scripts/listing-image-content-reliability.test.mjs
          git commit -m "fix(syria): complete listing route and image parity"
          git push origin HEAD:feat/syria-match-saudi-owner-listings
