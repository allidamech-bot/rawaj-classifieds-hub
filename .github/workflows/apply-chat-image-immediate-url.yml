name: Apply Chat Image Immediate URL

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-chat-image-immediate-url.mjs"
      - ".github/workflows/apply-chat-image-immediate-url.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-image-attachments-ui-v1
          fetch-depth: 1
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/apply-chat-image-immediate-url.mjs
      - run: npx prettier --write src/lib/api/messaging.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show sent chat images immediately"
          git push origin HEAD:feature/chat-image-attachments-ui-v1
