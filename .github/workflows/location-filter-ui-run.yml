name: Listings location filter runner

on:
  push:
    branches:
      - location-ux-filter-ui

permissions:
  contents: write

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message, '[skip filter runner]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-ux-filter-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-listings-location-filter-ui.mjs
      - run: npx prettier --write src/routes/listings.index.tsx
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/listings.index.tsx
          git commit -m "Integrate canonical location into listing filters [skip filter runner]"
          git push origin HEAD:location-ux-filter-ui
