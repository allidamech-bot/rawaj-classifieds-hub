name: Patch Saudi first-load API gateway

"on":
  pull_request:
    branches:
      - saudi

permissions:
  contents: write

concurrency:
  group: patch-saudi-first-load-api-gateway-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'fix/saudi-first-load-api-gateway-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Saudi gateway and analytics fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          vite = Path('vite.config.ts')
          text = vite.read_text()
          old = 'const rawajSaudiApiBaseUrl = "https://rawaj-saudi-classifieds.allidamech.workers.dev";'
          new = 'const rawajSaudiApiBaseUrl = "https://sa.rawa-j.com";'
          if old not in text and new not in text:
              raise SystemExit('Saudi API base declaration was not found')
          vite.write_text(text.replace(old, new))

          server = Path('src/server-cloudflare.ts')
          text = server.read_text()
          text = text.replace(
              'type SaudiCloudflareEnv = {\n  ASSETS?: WorkerFetcher;\n};',
              'type SaudiCloudflareEnv = {\n  ASSETS?: WorkerFetcher;\n  SAUDI_API?: WorkerFetcher;\n};',
          )
          pattern = re.compile(
              r'async function proxySaudiApi\(request: Request\): Promise<Response> \{.*?\n\}\n\nfunction applyProductionHeaders',
              re.S,
          )
          replacement = '''async function proxySaudiApi(
            request: Request,
            env: SaudiCloudflareEnv,
          ): Promise<Response> {
            const incomingUrl = new URL(request.url);
            const serviceBinding = env.SAUDI_API;
            const targetOrigin = serviceBinding
              ? "https://sa.rawa-j.com"
              : saudiApiOrigin;
            const targetUrl = new URL(`${incomingUrl.pathname}${incomingUrl.search}`, targetOrigin);
            const headers = new Headers(request.headers);

            for (const name of [
              "host",
              "origin",
              "referer",
              "cf-connecting-ip",
              "x-forwarded-for",
              "x-forwarded-host",
              "x-forwarded-proto",
              "x-real-ip",
            ]) {
              headers.delete(name);
            }
            headers.set("x-rawaj-proxy-market", "saudi");

            const proxiedRequest = new Request(targetUrl, {
              method: request.method,
              headers,
              body: request.method === "GET" || request.method === "HEAD" ? undefined : request.body,
              redirect: "manual",
            });

            return serviceBinding ? serviceBinding.fetch(proxiedRequest) : fetch(proxiedRequest);
          }

          function applyProductionHeaders'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one proxySaudiApi function, replaced {count}')
          old_call = 'return applyProductionHeaders(await proxySaudiApi(request), request);'
          new_call = 'return applyProductionHeaders(await proxySaudiApi(request, env), request);'
          if old_call not in text and new_call not in text:
              raise SystemExit('Saudi API proxy call was not found')
          server.write_text(text.replace(old_call, new_call))

          root = Path('src/routes/__root.tsx')
          text = root.read_text()
          old = '        <Analytics />'
          new = '        {rawajBuildInfo.provider === "vercel" ? <Analytics /> : null}'
          if old not in text and new not in text:
              raise SystemExit('Vercel Analytics render was not found')
          root.write_text(text.replace(old, new))

          test = Path('scripts/saudi-first-load-api-gateway.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { readFile } from "node:fs/promises";\n\ntest("Saudi browser and SSR data use the custom-domain gateway", async () => {\n  const vite = await readFile("vite.config.ts", "utf8");\n  assert.match(vite, /const rawajSaudiApiBaseUrl = "https:\\/\\/sa\\.rawa-j\\.com";/);\n});\n\ntest("Saudi Cloudflare server delegates v1 requests through SAUDI_API", async () => {\n  const server = await readFile("src/server-cloudflare.ts", "utf8");\n  assert.match(server, /SAUDI_API\\?: WorkerFetcher/);\n  assert.match(server, /const serviceBinding = env\\.SAUDI_API/);\n  assert.match(server, /serviceBinding \\? serviceBinding\\.fetch\\(proxiedRequest\\) : fetch\\(proxiedRequest\\)/);\n  assert.match(server, /proxySaudiApi\\(request, env\\)/);\n});\n\ntest("Cloudflare Saudi builds do not load Vercel Analytics", async () => {\n  const root = await readFile("src/routes/__root.tsx", "utf8");\n  assert.match(root, /rawajBuildInfo\\.provider === "vercel" \\? <Analytics \\/> : null/);\n});\n''')

          Path('.github/workflows/patch-saudi-first-load-api-gateway.yml').unlink()
          PY

      - name: Validate source and production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test scripts/saudi-first-load-api-gateway.test.mjs
          npm run typecheck
          npm run build
          grep -R -q 'https://sa.rawa-j.com' .output/public .output/server
          if grep -R -q '/_vercel/insights/script.js' .output/public/assets; then
            echo 'Saudi Cloudflare bundle still contains Vercel Analytics script loading.' >&2
            exit 1
          fi

      - name: Commit permanent fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vite.config.ts src/server-cloudflare.ts src/routes/__root.tsx scripts/saudi-first-load-api-gateway.test.mjs .github/workflows/patch-saudi-first-load-api-gateway.yml
          git commit -m "fix(saudi): load marketplace data on first visit"
          git push origin HEAD:${{ github.head_ref }}
