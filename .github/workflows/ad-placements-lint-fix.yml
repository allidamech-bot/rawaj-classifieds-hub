name: Ad Placements Lint Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/ad-placements-management' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ad-placements-management
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix changed source files
        run: >-
          npx eslint --fix
          src/lib/api/ad-placements.ts
          src/lib/classifieds-api.ts
          src/routes/admin.tsx
          src/routes/admin.ad-placements.tsx
          src/routeTree.gen.ts

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/ad-placements-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/ad-placements.ts src/lib/classifieds-api.ts src/routes/admin.tsx src/routes/admin.ad-placements.tsx src/routeTree.gen.ts .github/workflows/ad-placements-lint-fix.yml
          if git diff --cached --quiet; then
            echo "No lint fixes needed."
            exit 0
          fi
          git commit -m "Fix ad placements lint issues"
          git push origin HEAD:feature/ad-placements-management
