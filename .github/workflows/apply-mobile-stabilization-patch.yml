name: Apply Mobile Stabilization Patch

on:
  push:
    branches:
      - agent/android-release-readiness-1-0-3
    paths:
      - scripts/apply-mobile-stabilization.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/android-release-readiness-1-0-3
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic mobile stabilization patch
        run: node scripts/apply-mobile-stabilization.mjs

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize RAWAJ mobile launch and core journeys"
          git push origin HEAD:agent/android-release-readiness-1-0-3
