name: Temporary Search Filters Finalize

on:
  push:
    branches: [design/search-filters-v1]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/search-filters-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clean route remnants and contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/listings.index.tsx')
          s = p.read_text()
          s = s.replace('  GovernorateChip,\n', '')
          s = s.replace('  const [open, setOpen] = useState(false);\n', '')
          start = s.find('  const sortChips = [')
          end = s.find('  const fuelTypeLabels:', start)
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
          s = s.replace('className="grid gap-3 lg:grid-cols-[220px_1fr]"', 'className="grid gap-4"')
          old = '''                      query: q,
                      sort,
                    })}'''
          new = '''                      query: q,
                      sort,
                      view,
                      withPhotos,
                    })}'''
          s = s.replace(old, new)
          legacy = s.find('        {open && (')
          count = s.find('        <div className="mt-4 flex items-center justify-between text-xs text-muted-foreground">', legacy)
          if legacy >= 0 and count > legacy:
              s = s[:legacy] + s[count:]
          p.write_text(s)

          p = Path('src/routes/categories.tsx')
          s = p.read_text()
          s = s.replace('className="rawaj-hero-surface rounded-[1.55rem] sm:rounded-[1.9rem]"', 'className="rawaj-categories-v2__hero rounded-[1.55rem] sm:rounded-[1.9rem]"')
          s = s.replace('className="border-t border-border/60 p-3 sm:p-4"', 'className="rawaj-categories-v2__hero-search p-3 sm:p-4"')
          p.write_text(s)

          p = Path('src/search-filters-v1.css')
          s = p.read_text()
          old = '''  .rawaj-search-results-v1 > .rawaj-search-toolbar,
  .rawaj-search-results-v1 > .rawaj-quick-filter-rail,
  .rawaj-search-results-v1 > .rawaj-search-results-v1__content,
  .rawaj-search-results-v1 > .rawaj-search-results-v1__states {
    grid-column: 2;
  }'''
          s = s.replace(old, '''  .rawaj-search-results-v1 > :not(.rawaj-search-results-v1__sidebar) {
    grid-column: 2;
  }''')
          s = s.replace('''    inset-inline: 50%;
    transform: translateX(-50%);
''', '''    margin-inline: auto;
''')
          rtl = '''
  [dir="rtl"] .rawaj-filter-sheet {
    transform: translateX(50%);
  }
'''
          s = s.replace(rtl, '')
          if '.rawaj-search-empty-state {' not in s:
              s += '''
.rawaj-search-empty-state {
  display: grid;
  justify-items: center;
  border: 1px dashed color-mix(in srgb, var(--color-primary) 18%, var(--color-border));
  border-radius: 1.5rem;
  background: var(--rawaj-surface-warm);
  padding: clamp(2rem, 7vw, 4rem) 1rem;
  text-align: center;
}
.rawaj-search-empty-state__icon {
  display: grid;
  width: 3.5rem;
  height: 3.5rem;
  place-items: center;
  border-radius: 1.15rem;
  background: color-mix(in srgb, var(--rawaj-orange) 11%, white);
  color: var(--rawaj-orange);
}
.rawaj-search-empty-state__icon svg { width: 1.5rem; height: 1.5rem; }
.rawaj-search-empty-state h2 { margin-top: .9rem; color: var(--color-primary); font-size: 1rem; font-weight: 850; }
.rawaj-search-empty-state p { max-width: 34rem; margin-top: .45rem; color: var(--color-muted-foreground); font-size: .72rem; line-height: 1.8; }
.rawaj-search-empty-state .rawaj-category-empty-actions button,
.rawaj-search-empty-state .rawaj-category-empty-actions a {
  display: inline-flex;
  min-height: 2.7rem;
  align-items: center;
  gap: .35rem;
  border-radius: 999px;
  background: var(--rawaj-surface-card);
  padding-inline: .9rem;
  color: var(--color-primary);
  font-size: .65rem;
  font-weight: 800;
  box-shadow: var(--shadow-xs);
}
.rawaj-search-empty-state .rawaj-category-empty-actions [data-tone="primary"] { background: var(--rawaj-orange); color: white; }
.rawaj-search-empty-state .rawaj-category-empty-actions svg { width: .9rem; height: .9rem; }
'''
          p.write_text(s)

          p = Path('scripts/listings-mobile-category-switch.test.mjs')
          s = p.read_text()
          if 'withPhotos: false' not in s:
              s = s.replace('  salaryType: "",\n  debouncedQ: "",\n  sort: "latest",', '  salaryType: "",\n  withPhotos: false,\n  debouncedQ: "",\n  sort: "latest",\n  view: "grid",')
          if 'presentation and image filters survive URL synchronization' not in s:
              s += '''

test("presentation and image filters survive URL synchronization", () => {
  const search = buildListingsSyncSearch({ ...syncSearchInputs, withPhotos: true, view: "list" });
  assert.equal(search.with_photos, true);
  assert.equal(search.view, "list");
});

test("image-only filter reaches listing fetch inputs", () => {
  const filters = buildListingFilters({ ...listingFilterInputs, withPhotos: true });
  assert.equal(filters.withPhotos, true);
});
'''
          p.write_text(s)

          p = Path('.github/workflows/quality-gate.yml')
          s = p.read_text()
          anchor = '      - name: Adaptive Listing Cards contract\n        run: node --test scripts/adaptive-listing-cards.test.mjs\n'
          if 'Search and Filters V1 contract' not in s:
              s = s.replace(anchor, anchor + '\n      - name: Search and Filters V1 contract\n        run: node --test scripts/search-filters-v1.test.mjs\n')
          p.write_text(s)
          PY
      - name: Format changed files
        run: npx prettier --write .github/workflows/quality-gate.yml scripts/listings-mobile-category-switch.test.mjs scripts/search-filters-v1.test.mjs src/features/search src/routes/categories.tsx src/routes/listings.index.tsx src/search-filters-v1.css
      - name: Commit and self-delete
        run: |
          rm .github/workflows/temporary-search-filters-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize search and filter experience"
          git push origin HEAD:design/search-filters-v1
