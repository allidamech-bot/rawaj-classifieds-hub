name: Finalize Saudi Marketplace Production

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/saudi-finalize-production.yml
      - scripts/saudi-production-e2e.sh
      - scripts/saudi-finalizer-first-load.test.mjs
      - scripts/saudi-firebase-cloudflare-production-e2e.mjs
      - scripts/saudi-production-auth-gate.test.mjs
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FIREBASE_API_KEY: AIzaSyCEx7XMl1vsLU3cvoDjrPav5WF54MFkn1U
  FIREBASE_PROJECT_ID: project-af18fcaf-c46e-4ec5-93a
  D1_NAME: rawaj-saudi-production
  D1_EXPECTED_ID: 3f40cae9-c3a4-47ea-80a1-2f9a78915b2c
  R2_NAME: rawaj-saudi-media-production
  API_WORKER_NAME: rawaj-saudi-classifieds
  WEB_WORKER_NAME: rawaj-saudi-web
  API_URL: https://rawaj-saudi-classifieds.allidamech.workers.dev
  SITE_URL: https://rawaj-saudi-web.allidamech.workers.dev
  FINAL_SITE_URL: https://sa.rawa-j.com

jobs:
  finalize:
    name: Deploy and verify Saudi production
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v4
        with:
          path: main-repo
          fetch-depth: 1

      - name: Check out current Saudi application
        uses: actions/checkout@v4
        with:
          ref: saudi
          path: saudi-repo
          fetch-depth: 1

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            saudi-repo/package-lock.json
            saudi-repo/cloudflare/worker/package-lock.json

      - name: Validate Saudi deployment control contracts
        working-directory: main-repo
        run: |
          node --check scripts/saudi-firebase-cloudflare-production-e2e.mjs
          node --test scripts/saudi-production-auth-gate.test.mjs

      - name: Validate and build current Saudi frontend
        working-directory: saudi-repo
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:runtime-boundary
          node --test scripts/saudi-first-load-api-gateway.test.mjs scripts/saudi-auth-stability.test.mjs
          npm run typecheck
          npm run build
          grep -R -q "https://sa.rawa-j.com" .output/public .output/server

      - name: Install and validate current Saudi API Worker
        working-directory: saudi-repo/cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save jose@^6
          node --test test/listing-media-cache-invalidation.test.mjs
          if grep -RIn 'SYP' src; then
            echo "Syrian currency remains in Saudi Worker runtime" >&2
            exit 1
          fi
          npm run typecheck

      - name: Resolve pinned Saudi Cloudflare resources
        id: resources
        working-directory: saudi-repo/cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json >/tmp/rawaj-saudi-d1-list.json
          d1_id="$(node - <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync("/tmp/rawaj-saudi-d1-list.json", "utf8"));
          const rows = Array.isArray(value) ? value : value.result || [];
          const match = rows.find((row) => row.name === process.env.D1_NAME);
          const actual = match?.uuid || match?.id || "";
          if (actual !== process.env.D1_EXPECTED_ID) {
            throw new Error(`Saudi D1 identity mismatch: ${actual}`);
          }
          process.stdout.write(actual);
          NODE
          )"
          test -n "$d1_id"
          npx wrangler r2 bucket info "$R2_NAME" >/tmp/rawaj-saudi-r2-info.txt
          echo "d1_id=$d1_id" >> "$GITHUB_OUTPUT"

      - name: Render current Saudi API configuration
        working-directory: saudi-repo/cloudflare/worker
        shell: bash
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.resources.outputs.d1_id }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_D1_DATABASE_NAME="$D1_NAME"
          export CLOUDFLARE_R2_BUCKET_NAME="$R2_NAME"
          export RAWAJ_WORKER_RELEASE_SHA="$(git rev-parse HEAD)"
          export RAWAJ_WORKER_ENVIRONMENT=production
          node scripts/render-config.mjs
          node <<'NODE'
          const fs = require("node:fs");
          const path = "wrangler.generated.jsonc";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          const allowedOrigins = [process.env.FINAL_SITE_URL, process.env.SITE_URL].join(",");
          config.name = process.env.API_WORKER_NAME;
          config.vars = {
            ...(config.vars || {}),
            FIREBASE_PROJECT_ID: process.env.FIREBASE_PROJECT_ID,
            API_ALLOWED_ORIGINS: allowedOrigins,
          };
          if (config.d1_databases?.[0]?.database_id !== process.env.CLOUDFLARE_D1_DATABASE_ID) {
            throw new Error("Unexpected Saudi D1 binding");
          }
          if (config.r2_buckets?.[0]?.bucket_name !== process.env.R2_NAME) {
            throw new Error("Unexpected Saudi R2 binding");
          }
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Apply migrations and deploy current Saudi API Worker
        working-directory: saudi-repo/cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$D1_NAME" --remote --config wrangler.generated.jsonc
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.generated.jsonc \
            --command "UPDATE listings SET currency='SAR' WHERE currency IS NULL OR currency <> 'SAR';"
          npx wrangler deploy --config wrangler.generated.jsonc

      - name: Prepare Saudi frontend Worker with API service binding
        working-directory: saudi-repo
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/server/wrangler.json
          node <<'NODE'
          const fs = require("node:fs");
          const path = ".output/server/wrangler.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.name = process.env.WEB_WORKER_NAME;
          config.assets = { ...(config.assets || {}), run_worker_first: true };
          config.services = [{ binding: "SAUDI_API", service: "rawaj-saudi-classifieds" }];
          config.observability = { enabled: true };
          if (config.services?.[0]?.binding !== "SAUDI_API") {
            throw new Error("Saudi API service binding is missing");
          }
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Deploy Saudi frontend Worker
        working-directory: saudi-repo
        run: npx --yes wrangler@4.118.0 deploy --config .output/server/wrangler.json

      - name: Verify direct Saudi API and CORS
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
            "$API_URL/v1/health" >/tmp/rawaj-saudi-health.json
          curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
            "$API_URL/v1/references" >/tmp/rawaj-saudi-references.json
          for origin in "$SITE_URL" "$FINAL_SITE_URL"; do
            key="$(echo "$origin" | tr -cd '[:alnum:]')"
            curl --silent --show-error --fail \
              -H "Origin: $origin" -D "/tmp/cors-$key.headers" \
              "$API_URL/v1/health" > "/tmp/cors-$key.json"
            grep -qi "^access-control-allow-origin: $origin" "/tmp/cors-$key.headers"
          done
          node <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("/tmp/rawaj-saudi-health.json", "utf8"));
          const refs = JSON.parse(fs.readFileSync("/tmp/rawaj-saudi-references.json", "utf8"));
          if (health.data?.database !== "ready") throw new Error("Saudi API health failed");
          if ((refs.data?.categories?.length || 0) !== 12) throw new Error("Saudi category count mismatch");
          if ((refs.data?.taxonomyNodes?.length || 0) !== 117) throw new Error("Saudi taxonomy count mismatch");
          if ((refs.data?.governorates?.length || 0) !== 13) throw new Error("Saudi region count mismatch");
          NODE

      - name: Verify first load and same-origin API on Worker and custom domain
        shell: bash
        run: |
          set -euo pipefail
          for origin in "$SITE_URL" "$FINAL_SITE_URL"; do
            cache_bust="finalizer-$(date +%s%N)"
            key="$(echo "$origin" | tr -cd '[:alnum:]')"
            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/?release=$cache_bust" > "/tmp/home-$key.html"
            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/login?release=$cache_bust" > "/tmp/login-$key.html"
            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/add-listing?release=$cache_bust" > "/tmp/add-listing-$key.html"
            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/v1/health?release=$cache_bust" > "/tmp/gateway-health-$key.json"
            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/v1/references?release=$cache_bust" > "/tmp/gateway-references-$key.json"
            grep -q "سوق إعلانات مبوبة في السعودية" "/tmp/home-$key.html"
            grep -q "سيارات ومركبات" "/tmp/home-$key.html"
            grep -q "عقارات" "/tmp/home-$key.html"
            grep -q "تسجيل الدخول" "/tmp/login-$key.html"
            grep -q "أضف إعلان" "/tmp/add-listing-$key.html"
            if grep -q '/_vercel/insights/script.js' "/tmp/home-$key.html"; then
              echo "Vercel Analytics rendered on Cloudflare Saudi origin: $origin" >&2
              exit 1
            fi
            ORIGIN="$origin" KEY="$key" node <<'NODE'
          const fs = require("node:fs");
          const origin = process.env.ORIGIN;
          const key = process.env.KEY;
          const health = JSON.parse(fs.readFileSync(`/tmp/gateway-health-${key}.json`, "utf8"));
          const refs = JSON.parse(fs.readFileSync(`/tmp/gateway-references-${key}.json`, "utf8"));
          if (health.data?.database !== "ready") throw new Error(`Same-origin health failed on ${origin}`);
          if ((refs.data?.categories?.length || 0) !== 12) throw new Error(`Categories failed on ${origin}`);
          if ((refs.data?.taxonomyNodes?.length || 0) !== 117) throw new Error(`Taxonomy failed on ${origin}`);
          if ((refs.data?.governorates?.length || 0) !== 13) throw new Error(`Regions failed on ${origin}`);
          NODE
          done

      - name: Install Chromium for Firebase Cloudflare production gate
        working-directory: saudi-repo
        run: npx playwright install --with-deps chromium

      - name: Run Firebase Cloudflare production dependency gate
        shell: bash
        env:
          SAUDI_APP_DIR: ${{ github.workspace }}/saudi-repo
        run: node main-repo/scripts/saudi-firebase-cloudflare-production-e2e.mjs

      - name: Clean disposable Firebase Cloudflare gate data
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          profile_id=""
          firebase_uid=""
          [ -s /tmp/rawaj-saudi-auth-profile-id ] && profile_id="$(cat /tmp/rawaj-saudi-auth-profile-id)"
          [ -s /tmp/rawaj-saudi-auth-firebase-uid ] && firebase_uid="$(cat /tmp/rawaj-saudi-auth-firebase-uid)"
          if [ -z "$profile_id" ] && [ -z "$firebase_uid" ]; then
            echo "No disposable auth identity requires D1 cleanup."
            exit 0
          fi
          escaped_profile="${profile_id//\'/\'\'}"
          escaped_firebase="${firebase_uid//\'/\'\'}"
          sql="DELETE FROM seller_follows WHERE follower_id='$escaped_profile' OR seller_id='$escaped_profile'; DELETE FROM seller_reviews WHERE reviewer_id='$escaped_profile' OR seller_id='$escaped_profile'; DELETE FROM notification_preferences WHERE user_id='$escaped_profile'; DELETE FROM notifications WHERE user_id='$escaped_profile'; DELETE FROM media_assets WHERE owner_id='$escaped_profile'; DELETE FROM user_roles WHERE user_id='$escaped_profile'; DELETE FROM public_profiles WHERE id='$escaped_profile'; DELETE FROM auth_users WHERE id='$escaped_profile' OR auth_user_id='$escaped_firebase';"
          cd saudi-repo/cloudflare/worker
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.generated.jsonc --command "$sql" || true

      - name: Upload Firebase Cloudflare gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saudi-firebase-cloudflare-production-gate
          path: artifacts
          if-no-files-found: ignore
          retention-days: 3

      - name: Run disposable Firebase D1 R2 listing journey
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ github.workspace }}/saudi-repo/cloudflare/worker/wrangler.generated.jsonc
        run: bash main-repo/scripts/saudi-production-e2e.sh

      - name: Record successful Saudi production journey
        shell: bash
        run: |
          saudi_sha="$(git -C saudi-repo rev-parse HEAD)"
          gh issue comment 602 --repo "$GITHUB_REPOSITORY" \
            --body "Saudi production journey passed on **$FINAL_SITE_URL** and **$SITE_URL** from Saudi commit \`$saudi_sha\`: current API and frontend deployment, SAUDI_API service binding, first-load categories, same-origin health/references, Firebase email/password, persisted sessions, password reset, Google OAuth, authenticated /api and /v1 Service Binding routes, D1 profile/preferences, R2 media, the D1/R2 listing journey, CORS, SAR enforcement, and automatic cleanup all succeeded."
