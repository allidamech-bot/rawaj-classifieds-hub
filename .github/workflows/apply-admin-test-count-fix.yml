name: Apply Admin Rollback Count Fix

on:
  push:
    branches:
      - agent/admin-actions-rollback-integration
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-admin-test-count-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-actions-rollback-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correct verified action count
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/sql/admin-actions-rollback-local-verification.sql")
          text = path.read_text()
          text = text.replace("IF v_count <> 16 THEN", "IF v_count <> 18 THEN")
          text = text.replace("passed: 16 action groups", "passed: 18 action groups")
          path.write_text(text)
          PY
      - name: Commit count correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sql/admin-actions-rollback-local-verification.sql
          git commit -m "test: correct admin rollback action count"
          git push origin HEAD:agent/admin-actions-rollback-integration
