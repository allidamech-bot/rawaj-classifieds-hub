name: Format Batch 9 final

on:
  push:
    branches:
      - agent/launch-readiness-batch-9

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness-batch-9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write e2e/marketplace-smoke.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/marketplace-smoke.spec.ts
          git commit -m "Format final Batch 9 browser smoke fix"
          git push origin HEAD:agent/launch-readiness-batch-9
