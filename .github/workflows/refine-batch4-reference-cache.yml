name: Refine Batch 4 reference cache

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - .github/workflows/refine-batch4-reference-cache.yml
      - scripts/refine-batch4-reference-cache.mjs
      - scripts/refine-batch4-governorate-reader.mjs

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness-batch-4
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply cache refinement
        run: |
          node scripts/refine-batch4-reference-cache.mjs
          node scripts/refine-batch4-governorate-reader.mjs

      - name: Format and lint refined cache
        run: |
          npx eslint --fix src/lib/api/references.ts scripts/launch-readiness-batch-4.test.mjs
          npx eslint --quiet src/lib/api/references.ts scripts/launch-readiness-batch-4.test.mjs

      - name: Primary image selection contract
        run: node --test --test-name-pattern="primary image selection" scripts/launch-readiness-batch-4.test.mjs

      - name: Listing collection signing contract
        run: node --test --test-name-pattern="listing collections" scripts/launch-readiness-batch-4.test.mjs

      - name: Listing gallery signing contract
        run: node --test --test-name-pattern="listing detail gallery" scripts/launch-readiness-batch-4.test.mjs

      - name: Separate public reference cache contract
        run: node --test --test-name-pattern="public categories and governorates" scripts/launch-readiness-batch-4.test.mjs

      - name: Shared subset request contract
        run: node --test --test-name-pattern="combined references" scripts/launch-readiness-batch-4.test.mjs

      - name: Quality Gate wiring contract
        run: node --test --test-name-pattern="part of local and GitHub" scripts/launch-readiness-batch-4.test.mjs

      - name: Home SSR compatibility
        run: npm run test:home-ssr

      - name: Typecheck refined cache
        run: npm run typecheck -- --pretty false

      - name: Commit cache refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/references.ts scripts/launch-readiness-batch-4.test.mjs
          git commit -m "Refine public reference request caching"
          git push origin HEAD:agent/launch-readiness-batch-4
