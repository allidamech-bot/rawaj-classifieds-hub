name: Admin Runtime Repair V1

on:
  pull_request:
    paths:
      - "src/lib/supabase.ts"
      - "src/server.ts"
      - "supabase/migrations/202607200001_fix_owner_system_control_version_ambiguity.sql"
      - "supabase/migrations/202607200002_admin_runtime_capability_gate_v1.sql"
      - "scripts/admin-runtime-repair-v1.test.mjs"
      - ".github/workflows/admin-runtime-repair-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-runtime-repair-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Admin runtime repair contract
        run: node --test scripts/admin-runtime-repair-v1.test.mjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
