name: Apply edit listing image resilience

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/edit-listing-image-resilience' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/edit-listing-image-resilience

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded image resilience patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one anchor in {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1))

          route = 'src/routes/profile/listings.$id.tsx'

          replace_once(
              route,
              'import { useCallback, useEffect, useMemo, useState } from "react";\n',
              'import { useCallback, useEffect, useMemo, useRef, useState } from "react";\n',
          )
          replace_once(
              route,
              'import { Camera, Trash2 } from "lucide-react";\n',
              'import { Camera, RefreshCw, Trash2, X } from "lucide-react";\n',
          )
          replace_once(
              route,
              'import type { PriceType } from "@/types";\n\nexport const Route',
              'import type { PriceType } from "@/types";\n\n'
              'type EditImageUploadState = "pending" | "uploading" | "failed";\n\n'
              'interface EditUploadImageEntry {\n'
              '  id: string;\n'
              '  file: File;\n'
              '  state: EditImageUploadState;\n'
              '  error?: string;\n'
              '  url: string;\n'
              '}\n\n'
              'const MAX_IMAGES = 6;\n\n'
              'function fileFingerprint(file: File) {\n'
              '  return `${file.name}:${file.size}:${file.lastModified}`;\n'
              '}\n\n'
              'export const Route',
          )
          replace_once(
              route,
              '  const [selectedImages, setSelectedImages] = useState<File[]>([]);\n'
              '  const [uploading, setUploading] = useState(false);\n',
              '  const [selectedImages, setSelectedImages] = useState<EditUploadImageEntry[]>([]);\n'
              '  const [uploading, setUploading] = useState(false);\n'
              '  const selectedImagesRef = useRef<EditUploadImageEntry[]>([]);\n'
              '  const imagesRef = useRef<ListingImage[]>([]);\n',
          )
          replace_once(
              route,
              '  const selectedImagePreviews = useMemo(\n'
              '    () =>\n'
              '      selectedImages.map((file, index) => ({\n'
              '        id: `${file.name}-${file.size}-${file.lastModified}-${index}`,\n'
              '        file,\n'
              '        url: URL.createObjectURL(file),\n'
              '      })),\n'
              '    [selectedImages],\n'
              '  );\n',
              '',
          )
          replace_once(
              route,
              '  useEffect(\n'
              '    () => () => {\n'
              '      selectedImagePreviews.forEach((preview) => URL.revokeObjectURL(preview.url));\n'
              '    },\n'
              '    [selectedImagePreviews],\n'
              '  );\n',
              '  useEffect(() => {\n'
              '    selectedImagesRef.current = selectedImages;\n'
              '  }, [selectedImages]);\n\n'
              '  useEffect(() => {\n'
              '    imagesRef.current = images;\n'
              '  }, [images]);\n\n'
              '  useEffect(\n'
              '    () => () => {\n'
              '      selectedImagesRef.current.forEach((entry) => URL.revokeObjectURL(entry.url));\n'
              '    },\n'
              '    [],\n'
              '  );\n',
          )
          replace_once(
              route,
              '  async function handleUploadImages() {\n'
              '    if (!listing || selectedImages.length === 0) return;\n'
              '    setUploading(true);\n'
              '    setUploadError(null);\n'
              '    const errors: string[] = [];\n'
              '    for (const [index, file] of selectedImages.entries()) {\n'
              '      const result = await uploadListingImage({\n'
              '        userId: auth.profile?.id ?? null,\n'
              '        listing,\n'
              '        file,\n'
              '        sortOrder: images.length + index,\n'
              '        altAr: title.trim() || listing.title,\n'
              '      });\n'
              '      if (!result.ok) errors.push(result.error.message);\n'
              '      else if (result.data) setImages((value) => [...value, result.data]);\n'
              '    }\n'
              '    setSelectedImages([]);\n'
              '    setUploading(false);\n'
              '    if (errors.length > 0) setUploadError(errors[0]);\n'
              '  }\n',
              '  function handleImageSelection(files: FileList | null) {\n'
              '    const nextFiles = Array.from(files ?? []);\n'
              '    setSelectedImages((current) => {\n'
              '      const capacity = Math.max(0, MAX_IMAGES - images.length - current.length);\n'
              '      const existing = new Set(current.map((entry) => fileFingerprint(entry.file)));\n'
              '      const unique = nextFiles\n'
              '        .filter(\n'
              '          (file, index, files) =>\n'
              '            !existing.has(fileFingerprint(file)) &&\n'
              '            files.findIndex((item) => fileFingerprint(item) === fileFingerprint(file)) === index,\n'
              '        )\n'
              '        .slice(0, capacity)\n'
              '        .map((file) => ({\n'
              '          id: `${fileFingerprint(file)}-${crypto.randomUUID()}`,\n'
              '          file,\n'
              '          state: "pending" as const,\n'
              '          url: URL.createObjectURL(file),\n'
              '        }));\n'
              '      const next = [...current, ...unique];\n'
              '      selectedImagesRef.current = next;\n'
              '      return next;\n'
              '    });\n'
              '    if (images.length + selectedImagesRef.current.length + nextFiles.length > MAX_IMAGES) {\n'
              '      setUploadError(text("الحد الأقصى 6 صور للإعلان.", "A listing can have up to 6 photos."));\n'
              '    } else {\n'
              '      setUploadError(null);\n'
              '    }\n'
              '  }\n\n'
              '  function removeSelectedImage(entryId: string) {\n'
              '    const entry = selectedImagesRef.current.find((item) => item.id === entryId);\n'
              '    if (!entry || entry.state === "uploading") return;\n'
              '    URL.revokeObjectURL(entry.url);\n'
              '    const next = selectedImagesRef.current.filter((item) => item.id !== entryId);\n'
              '    selectedImagesRef.current = next;\n'
              '    setSelectedImages(next);\n'
              '  }\n\n'
              '  function clearSelectedImages() {\n'
              '    selectedImagesRef.current.forEach((entry) => URL.revokeObjectURL(entry.url));\n'
              '    selectedImagesRef.current = [];\n'
              '    setSelectedImages([]);\n'
              '    setUploadError(null);\n'
              '  }\n\n'
              '  async function uploadSelectedImage(entryId: string) {\n'
              '    if (!listing) return;\n'
              '    const entry = selectedImagesRef.current.find((item) => item.id === entryId);\n'
              '    if (!entry || entry.state === "uploading") return;\n'
              '    const uploadingEntries = selectedImagesRef.current.map((item) =>\n'
              '      item.id === entryId ? { ...item, state: "uploading" as const, error: undefined } : item,\n'
              '    );\n'
              '    selectedImagesRef.current = uploadingEntries;\n'
              '    setSelectedImages(uploadingEntries);\n'
              '    const result = await uploadListingImage({\n'
              '      userId: auth.profile?.id ?? null,\n'
              '      listing,\n'
              '      file: entry.file,\n'
              '      sortOrder: imagesRef.current.length,\n'
              '      altAr: title.trim() || listing.title,\n'
              '    });\n'
              '    const latest = selectedImagesRef.current.find((item) => item.id === entryId);\n'
              '    if (!latest) return;\n'
              '    if (!result.ok) {\n'
              '      const failed = selectedImagesRef.current.map((item) =>\n'
              '        item.id === entryId\n'
              '          ? { ...item, state: "failed" as const, error: result.error.message }\n'
              '          : item,\n'
              '      );\n'
              '      selectedImagesRef.current = failed;\n'
              '      setSelectedImages(failed);\n'
              '      setUploadError(result.error.message);\n'
              '      return;\n'
              '    }\n'
              '    const nextImages = [...imagesRef.current, result.data];\n'
              '    imagesRef.current = nextImages;\n'
              '    setImages(nextImages);\n'
              '    URL.revokeObjectURL(latest.url);\n'
              '    const remaining = selectedImagesRef.current.filter((item) => item.id !== entryId);\n'
              '    selectedImagesRef.current = remaining;\n'
              '    setSelectedImages(remaining);\n'
              '  }\n\n'
              '  async function retrySelectedImage(entryId: string) {\n'
              '    await uploadSelectedImage(entryId);\n'
              '  }\n\n'
              '  async function handleUploadImages() {\n'
              '    if (!listing || selectedImagesRef.current.length === 0) return;\n'
              '    setUploading(true);\n'
              '    setUploadError(null);\n'
              '    for (const entry of [...selectedImagesRef.current]) {\n'
              '      await uploadSelectedImage(entry.id);\n'
              '    }\n'
              '    setUploading(false);\n'
              '  }\n',
          )
          replace_once(
              route,
              '                      onChange={(e) =>\n'
              '                        setSelectedImages(Array.from(e.target.files ?? []).slice(0, 6))\n'
              '                      }\n',
              '                      onChange={(e) => {\n'
              '                        handleImageSelection(e.target.files);\n'
              '                        e.target.value = "";\n'
              '                      }}\n',
          )
          replace_once(
              route,
              '                      onClick={() => setSelectedImages([])}\n',
              '                      onClick={clearSelectedImages}\n',
          )
          replace_once(
              route,
              '                    {selectedImagePreviews.map((preview, index) => (\n'
              '                      <div\n'
              '                        key={preview.id}\n'
              '                        className="overflow-hidden rounded-[1rem] border border-border/70 bg-card text-[10px] shadow-soft"\n'
              '                      >\n'
              '                        <img\n'
              '                          src={preview.url}\n'
              '                          alt={preview.file.name}\n'
              '                          loading="lazy"\n'
              '                          decoding="async"\n'
              '                          className="aspect-[4/3] w-full object-cover"\n'
              '                        />\n'
              '                        <div className="p-2">\n'
              '                          <p className="truncate font-bold">{preview.file.name}</p>\n'
              '                          <p className="text-muted-foreground">\n'
              '                            {(preview.file.size / 1024 / 1024).toFixed(1)} MB\n'
              '                          </p>\n'
              '                          {index === 0 && (\n'
              '                            <p className="mt-1 font-bold text-gold">\n'
              '                              {text("ستظهر أولاً بعد الرفع", "Will appear first after upload")}\n'
              '                            </p>\n'
              '                          )}\n'
              '                        </div>\n'
              '                      </div>\n'
              '                    ))}\n',
              '                    {selectedImages.map((preview, index) => (\n'
              '                      <div\n'
              '                        key={preview.id}\n'
              '                        className="overflow-hidden rounded-[1rem] border border-border/70 bg-card text-[10px] shadow-soft"\n'
              '                      >\n'
              '                        <div className="relative">\n'
              '                          <img\n'
              '                            src={preview.url}\n'
              '                            alt={preview.file.name}\n'
              '                            loading="lazy"\n'
              '                            decoding="async"\n'
              '                            className="aspect-[4/3] w-full object-cover"\n'
              '                          />\n'
              '                          <button\n'
              '                            type="button"\n'
              '                            disabled={preview.state === "uploading"}\n'
              '                            onClick={() => removeSelectedImage(preview.id)}\n'
              '                            className="absolute end-2 top-2 grid min-h-11 min-w-11 place-items-center rounded-xl bg-card/90 text-destructive shadow-soft disabled:opacity-50"\n'
              '                            aria-label={text("إزالة الصورة المختارة", "Remove selected photo")}\n'
              '                          >\n'
              '                            <X className="h-4 w-4" />\n'
              '                          </button>\n'
              '                        </div>\n'
              '                        <div className="p-2">\n'
              '                          <p className="truncate font-bold">{preview.file.name}</p>\n'
              '                          <p className="text-muted-foreground">\n'
              '                            {(preview.file.size / 1024 / 1024).toFixed(1)} MB\n'
              '                          </p>\n'
              '                          {preview.state === "uploading" ? (\n'
              '                            <p className="mt-1 font-bold text-primary">\n'
              '                              {text("جارٍ رفع هذه الصورة", "Uploading this photo")}\n'
              '                            </p>\n'
              '                          ) : null}\n'
              '                          {preview.state === "failed" ? (\n'
              '                            <div className="mt-2">\n'
              '                              <p className="line-clamp-2 text-destructive">{preview.error}</p>\n'
              '                              <button\n'
              '                                type="button"\n'
              '                                onClick={() => void retrySelectedImage(preview.id)}\n'
              '                                className="mt-2 inline-flex min-h-11 items-center gap-1 rounded-xl bg-destructive/10 px-3 py-2 font-bold text-destructive"\n'
              '                              >\n'
              '                                <RefreshCw className="h-3.5 w-3.5" />\n'
              '                                {text("إعادة المحاولة", "Retry")}\n'
              '                              </button>\n'
              '                            </div>\n'
              '                          ) : null}\n'
              '                          {index === 0 && preview.state === "pending" ? (\n'
              '                            <p className="mt-1 font-bold text-gold">\n'
              '                              {text("ستظهر أولاً بعد الرفع", "Will appear first after upload")}\n'
              '                            </p>\n'
              '                          ) : null}\n'
              '                        </div>\n'
              '                      </div>\n'
              '                    ))}\n',
          )

          replace_once(
              'package.json',
              '&& npm run test:chat-workspace && npm run lint',
              '&& npm run test:chat-workspace && npm run test:listing-studio-images && npm run lint',
          )
          replace_once(
              'package.json',
              '    "test:chat-workspace": "node --test scripts/chat-workspace.test.mjs",\n',
              '    "test:chat-workspace": "node --test scripts/chat-workspace.test.mjs",\n'
              '    "test:listing-studio-images": "node --test scripts/listing-studio-image-parity.test.mjs",\n',
          )
          replace_once(
              '.github/workflows/quality-gate.yml',
              '      - name: Chat workspace contract\n'
              '        run: npm run test:chat-workspace\n\n'
              '      - name: Typecheck\n',
              '      - name: Chat workspace contract\n'
              '        run: npm run test:chat-workspace\n\n'
              '      - name: Listing studio image parity contract\n'
              '        run: npm run test:listing-studio-images\n\n'
              '      - name: Typecheck\n',
          )
          PY

      - name: Format changed files
        run: npx prettier --write 'src/routes/profile/listings.$id.tsx' package.json .github/workflows/quality-gate.yml scripts/listing-studio-image-parity.test.mjs

      - name: Run focused regression and lint
        run: |
          npm run test:listing-studio-images
          npx eslint --quiet 'src/routes/profile/listings.$id.tsx' scripts/listing-studio-image-parity.test.mjs

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/profile/listings.$id.tsx' package.json .github/workflows/quality-gate.yml scripts/listing-studio-image-parity.test.mjs
          git commit -m "Harden edit listing image upload resilience"
          git push origin HEAD:feature/edit-listing-image-resilience
