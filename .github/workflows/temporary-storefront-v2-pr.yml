name: Temporary Seller Storefront V2 Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'design/seller-storefront-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/seller-storefront-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate Seller Storefront V2
        run: python scripts/temporary-integrate-storefront-v2.py
      - name: Format integrated product files
        run: >-
          npx prettier --write
          scripts/seller-storefront-v2.test.mjs
          src/features/storefront/StorefrontIdentityHero.tsx
          src/seller-storefront-v2.css
          src/routes/__root.tsx
          'src/routes/seller.$id.tsx'
          src/routes/profile/listings.tsx
      - name: Commit and push product files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/seller-storefront-v2.test.mjs
          git add src/features/storefront/StorefrontIdentityHero.tsx
          git add src/seller-storefront-v2.css
          git add src/routes/__root.tsx
          git add 'src/routes/seller.$id.tsx'
          git add src/routes/profile/listings.tsx
          git commit -m "Integrate Seller Storefront V2"
          git push origin HEAD:design/seller-storefront-v2
