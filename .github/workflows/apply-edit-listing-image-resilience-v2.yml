name: Apply edit listing image resilience v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/edit-listing-image-resilience' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/edit-listing-image-resilience

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reuse guarded patch body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-edit-listing-image-resilience.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          body = textwrap.dedent(source[start:end])
          Path('/tmp/apply_edit_image_patch.py').write_text(body)
          PY
          python /tmp/apply_edit_image_patch.py

      - name: Keep Quality Gate update for connector step
        run: git checkout -- .github/workflows/quality-gate.yml

      - name: Format changed files
        run: npx prettier --write 'src/routes/profile/listings.$id.tsx' package.json scripts/listing-studio-image-parity.test.mjs

      - name: Run focused regression and lint
        run: |
          npm run test:listing-studio-images
          npx eslint --quiet 'src/routes/profile/listings.$id.tsx' scripts/listing-studio-image-parity.test.mjs

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/profile/listings.$id.tsx' package.json scripts/listing-studio-image-parity.test.mjs
          git commit -m "Harden edit listing image upload resilience"
          git push origin HEAD:feature/edit-listing-image-resilience
