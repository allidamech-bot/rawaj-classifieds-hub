name: Phase 57-70 Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed sources
        run: npx prettier --write e2e/release-core-journeys.spec.ts e2e/production-acceptance.spec.ts playwright.config.ts scripts/copy-quality.mjs scripts/phases-57-69-release-readiness.test.mjs scripts/release-candidate-manifest.mjs
      - name: Capture lint result
        shell: bash
        run: npx eslint --quiet e2e/release-core-journeys.spec.ts e2e/production-acceptance.spec.ts playwright.config.ts scripts/copy-quality.mjs scripts/phases-57-69-release-readiness.test.mjs scripts/release-candidate-manifest.mjs > lint-result.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase-57-70-probe
          path: |
            e2e/release-core-journeys.spec.ts
            e2e/production-acceptance.spec.ts
            playwright.config.ts
            scripts/copy-quality.mjs
            scripts/phases-57-69-release-readiness.test.mjs
            scripts/release-candidate-manifest.mjs
            lint-result.txt
