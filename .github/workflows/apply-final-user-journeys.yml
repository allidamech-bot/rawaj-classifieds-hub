name: Apply final user journeys

on:
  pull_request:
    branches:
      - main

concurrency:
  group: final-user-journeys-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/close-final-user-journey-gaps
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply and validate final user journey batch
        id: apply
        shell: bash
        run: |
          set +e
          {
            python .github/final-user-journeys-patch.py
            npx prettier --write \
              src/routes/more.tsx \
              src/routes/add-listing.tsx \
              'src/routes/profile/listings.$id.tsx' \
              'src/routes/listings.$id.tsx' \
              'src/routes/seller.$id.tsx' \
              src/routes/chats.tsx \
              scripts/final-user-journeys.test.mjs \
              package.json \
              .github/workflows/quality-gate.yml
            npx eslint --quiet \
              src/routes/more.tsx \
              src/routes/add-listing.tsx \
              'src/routes/profile/listings.$id.tsx' \
              'src/routes/listings.$id.tsx' \
              'src/routes/seller.$id.tsx' \
              src/routes/chats.tsx \
              scripts/final-user-journeys.test.mjs
            npm run test:final-user-journeys
            npm run typecheck -- --pretty false
          } > final-user-journeys.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload failure diagnostics
        if: steps.apply.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: final-user-journeys-failure
          path: final-user-journeys.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail invalid batch
        if: steps.apply.outputs.status != '0'
        run: |
          cat final-user-journeys.log
          exit 1
      - name: Upload validated source bundle
        if: steps.apply.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: final-user-journeys-validated
          path: |
            src/routes/more.tsx
            src/routes/add-listing.tsx
            src/routes/profile/listings.$id.tsx
            src/routes/listings.$id.tsx
            src/routes/seller.$id.tsx
            src/routes/chats.tsx
            scripts/final-user-journeys.test.mjs
            package.json
            .github/workflows/quality-gate.yml
          if-no-files-found: error
          retention-days: 1
