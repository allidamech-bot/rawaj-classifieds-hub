name: Apply Chat Image UI V1

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-chat-image-ui-v1.mjs
      - scripts/fix-chat-image-patcher.mjs
      - .github/workflows/apply-chat-image-ui-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-image-attachments-ui-v1
          fetch-depth: 1
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        id: patch
        shell: bash
        run: |
          set +e
          node scripts/fix-chat-image-patcher.mjs
          node scripts/apply-chat-image-ui-v1.mjs > patch.log 2>&1
          status=$?
          echo "$status" > patch.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: chat-image-ui-patch-log
          path: |
            patch.log
            patch.status
      - name: Verify patch
        run: |
          cat patch.log
          test "$(cat patch.status)" = "0"
          rm -f scripts/fix-chat-image-patcher.mjs
      - run: npx prettier --write src/lib/classifieds-types.ts src/lib/api/messaging.ts src/lib/api/messaging-guarded.ts src/routes/chats.tsx scripts/conversations-messaging-realtime-integrity.test.mjs scripts/chat-image-attachments-ui-v1.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add chat image attachment UI"
          git push origin HEAD:feature/chat-image-attachments-ui-v1
