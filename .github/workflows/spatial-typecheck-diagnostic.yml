name: Temporary Spatial Typecheck Diagnostic

on:
  push:
    branches:
      - design/spatial-app-shell-v1

permissions:
  contents: read

concurrency:
  group: spatial-typecheck-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript diagnostics
        shell: bash
        run: npm run typecheck -- --pretty false > typecheck.log 2>&1 || true

      - name: Upload TypeScript diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: spatial-typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 1
