name: Temporary listing regression formatter

on:
  push:
    branches:
      - feature/stale-safe-owner-listing-updates

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/stale-safe-owner-listing-updates
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format regression contract
        run: npx prettier --write scripts/listing-system-regression.mjs

      - name: Commit formatted contract
        shell: bash
        run: |
          if git diff --quiet; then
            echo "File already matches project formatting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/listing-system-regression.mjs
          git commit -m "Format listing system regression contract"
          git push origin HEAD:feature/stale-safe-owner-listing-updates
