name: Format admin recovery

on:
  push:
    branches:
      - feature/recover-admin-core-queues

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-admin-core-queues
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format admin files
        run: npx eslint --fix src/routes/admin.index.tsx src/routes/admin.pending.tsx src/routes/admin.reports.tsx src/routes/admin.reviews.tsx src/routes/admin.message-reports.tsx src/routes/admin.users.tsx scripts/admin-security-regression.mjs
      - name: Commit formatting and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-admin-recovery.yml
          git add src/routes/admin.index.tsx src/routes/admin.pending.tsx src/routes/admin.reports.tsx src/routes/admin.reviews.tsx src/routes/admin.message-reports.tsx src/routes/admin.users.tsx scripts/admin-security-regression.mjs
          git commit -m "Format admin recovery files"
          git push origin HEAD:feature/recover-admin-core-queues
