name: Apply semantic SEO foundation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/semantic-seo-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/semantic-seo-foundation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded listing structured-data patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one anchor in {path}: {old[:180]!r}")
              file.write_text(text.replace(old, new, 1))

          path = 'src/routes/listings.$id.tsx'

          replace_once(
              path,
              'import { absoluteUrl, createSeo, jsonLdScript, plainText } from "@/lib/seo";\n',
              'import {\n'
              '  absoluteUrl,\n'
              '  buildBreadcrumbStructuredData,\n'
              '  createSeo,\n'
              '  jsonLdScript,\n'
              '  plainText,\n'
              '} from "@/lib/seo";\n',
          )

          replace_once(
              path,
              '  const listingCategory = categoryName(\n'
              '    listing.categoryId,\n'
              '    listing.categoryNameAr ?? undefined,\n'
              '    language,\n'
              '  );\n\n'
              '  return (\n',
              '  const listingCategory = categoryName(\n'
              '    listing.categoryId,\n'
              '    listing.categoryNameAr ?? undefined,\n'
              '    language,\n'
              '  );\n'
              '  const listingBreadcrumbs = buildBreadcrumbStructuredData([\n'
              '    { name: "RAWAJ / رواج", path: "/" },\n'
              '    { name: text("الإعلانات", "Listings"), path: "/listings" },\n'
              '    {\n'
              '      name: listing.categoryNameAr ?? listingCategory,\n'
              '      path: `/listings?category=${encodeURIComponent(listing.categoryId)}`,\n'
              '    },\n'
              '    { name: listing.title, path: `/listings/${listing.id}` },\n'
              '  ]);\n\n'
              '  return (\n',
          )

          replace_once(
              path,
              '        <script {...jsonLdScript(buildListingStructuredData(listing))} />\n',
              '        <script {...jsonLdScript(buildListingStructuredData(listing))} />\n'
              '        <script {...jsonLdScript(listingBreadcrumbs)} />\n',
          )

          replace_once(
              path,
              '      priceCurrency: listing.currency,\n'
              '      url: absoluteUrl(`/listings/${listing.id}`),\n',
              '      priceCurrency: listing.currency,\n'
              '      availability: listing.reservedAt\n'
              '        ? "https://schema.org/LimitedAvailability"\n'
              '        : "https://schema.org/InStock",\n'
              '      url: absoluteUrl(`/listings/${listing.id}`),\n',
          )
          PY

      - name: Format semantic SEO sources
        run: npx prettier --write src/lib/seo.ts src/routes/__root.tsx 'src/routes/listings.$id.tsx' scripts/semantic-seo.test.mjs

      - name: Validate focused semantic SEO package
        run: |
          node --test scripts/semantic-seo.test.mjs
          npx eslint --quiet src/lib/seo.ts src/routes/__root.tsx 'src/routes/listings.$id.tsx' scripts/semantic-seo.test.mjs
          npm run typecheck -- --pretty false
          npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/seo.ts src/routes/__root.tsx 'src/routes/listings.$id.tsx' scripts/semantic-seo.test.mjs
          git commit -m "Add semantic site and listing SEO structure"
          git push origin HEAD:feature/semantic-seo-foundation
