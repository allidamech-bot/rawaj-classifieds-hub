name: Android Build Diagnostic

on:
  push:
    branches:
      - agent/android-release-readiness-1-0-3
    paths:
      - scripts/android-build-diagnostic.trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/android-release-readiness-1-0-3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build web bundle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Capture Android resource references
        run: |
          {
            echo "=== RAWAJ resource references ==="
            grep -R -n -E 'rawaj_logo_foreground|@drawable/splash|rawaj_splash_transparent|rawaj_launcher_foreground' android/app/src/main/res || true
            echo
            echo "=== Resource file inventory ==="
            find android/app/src/main/res -maxdepth 3 -type f | sort
          } > android-resource-diagnostic.log

      - name: Capture Gradle failure with stacktrace
        run: |
          set +e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace --no-daemon > ../android-build-diagnostic.log 2>&1
          status=$?
          echo "GRADLE_EXIT_STATUS=$status" >> ../android-build-diagnostic.log
          exit 0

      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-android-build-diagnostic
          path: |
            android-build-diagnostic.log
            android-resource-diagnostic.log
          if-no-files-found: error
          retention-days: 3
