name: Persist Saved Search Push Once

on:
  push:
    branches:
      - feature/saved-search-alerts-push-v1
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/persist-saved-search-push-once.yml"

permissions:
  contents: write

concurrency:
  group: persist-saved-search-push-once
  cancel-in-progress: true

jobs:
  persist:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/saved-search-alerts-push-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: npm ci

      - name: Install official Capacitor push plugin
        run: npm install @capacitor/push-notifications@^8.0.0 --save

      - name: Patch required saved-search navigation state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-saved-search-push-integration.py")
          text = path.read_text(encoding="utf-8")
          old = '''        '      } else if (target.kind === "saved_search") {\\n'
                  '        void navigate({ to: "/saved-searches" });\\n'
          '''
          new = '''        '      } else if (target.kind === "saved_search") {\\n'
                  '        void navigate({\\n'
                  '          to: "/saved-searches",\\n'
                  '          search: {\\n'
                  '            q: "",\\n'
                  '            category: "",\\n'
                  '            subcategory: "",\\n'
                  '            gov: "",\\n'
                  '            district: "",\\n'
                  '            price_min: "",\\n'
                  '            price_max: "",\\n'
                  '            car_make: "",\\n'
                  '            car_model: "",\\n'
                  '            fuel: "",\\n'
                  '            transmission: "",\\n'
                  '            property_purpose: "",\\n'
                  '            property_type: "",\\n'
                  '            rooms: "",\\n'
                  '            rental_duration: "",\\n'
                  '            electronics_brand: "",\\n'
                  '            detail_condition: "",\\n'
                  '            employment_type: "",\\n'
                  '            salary_type: "",\\n'
                  '            sort: "latest",\\n'
                  '          },\\n'
                  '        });\\n'
          '''
          if old not in text:
              raise SystemExit("Saved-search navigation template not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply deterministic integration
        run: python scripts/apply-saved-search-push-integration.py

      - name: Sync Android native project
        run: |
          mkdir -p .output/public
          printf '<!doctype html><html lang="ar"><body></body></html>\n' > .output/public/index.html
          npx cap sync android
          git ls-files -z android/app/src/main/assets/public | xargs -0 -r git checkout --
          git clean -fd android/app/src/main/assets/public
          rm -rf .output

      - name: Format package
        run: |
          npx prettier --write \
            .github/workflows/quality-gate.yml \
            capacitor.config.ts \
            docs/production-schema/migration-ledger.json \
            package.json \
            scripts/saved-search-push-v1.test.mjs \
            scripts/saved-search-background-alerts.test.mjs \
            src/features/notifications/NotificationPreferencesPanel.tsx \
            src/features/notifications/PushNotificationBridge.tsx \
            src/features/saved-searches/SavedSearchAlertBackgroundScanner.tsx \
            src/lib/api/notification-preferences.ts \
            src/lib/api/notification-target-resolution.ts \
            src/lib/api/push-notifications.ts \
            src/lib/api/saved-search-alerts.ts \
            src/lib/classifieds-api.ts \
            src/lib/native-push.ts \
            src/routes/more.tsx \
            src/routes/notifications.tsx \
            src/routes/saved-searches.tsx \
            supabase/functions/send-push-notifications/index.ts

      - name: Validate package
        run: |
          npm run test:saved-search-push
          npm run test:activity-center
          npx eslint --quiet \
            scripts/saved-search-push-v1.test.mjs \
            scripts/saved-search-background-alerts.test.mjs \
            src/features/notifications/NotificationPreferencesPanel.tsx \
            src/features/notifications/PushNotificationBridge.tsx \
            src/features/saved-searches/SavedSearchAlertBackgroundScanner.tsx \
            src/lib/api/notification-preferences.ts \
            src/lib/api/notification-target-resolution.ts \
            src/lib/api/push-notifications.ts \
            src/lib/api/saved-search-alerts.ts \
            src/lib/classifieds-api.ts \
            src/lib/native-push.ts \
            src/routes/more.tsx \
            src/routes/notifications.tsx \
            src/routes/saved-searches.tsx
          npm run typecheck -- --pretty false
          npm run build
          (cd android && bash ./gradlew :app:assembleDebug --no-daemon)

      - name: Remove one-shot integration files
        run: |
          rm .github/workflows/persist-saved-search-push-once.yml
          rm scripts/apply-saved-search-push-integration.py

      - name: Commit and push validated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete saved-search alerts and native push delivery"
          git push origin HEAD:feature/saved-search-alerts-push-v1
