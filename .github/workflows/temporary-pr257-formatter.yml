name: Temporary PR 257 Formatter

on:
  push:
    branches:
      - design/search-filters-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/search-filters-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format PR files
        run: >-
          npx prettier --write
          .github/workflows/quality-gate.yml
          scripts/listings-mobile-category-switch.test.mjs
          scripts/search-filters-v1.test.mjs
          src/features/listings/listings-filters.ts
          src/features/listings/listings-search-schema.ts
          src/features/listings/use-listings-pagination.ts
          src/features/listings/use-listings-results.ts
          src/features/search
          src/lib/api/listings.ts
          src/lib/classifieds-types.ts
          src/routes/__root.tsx
          src/routes/categories.tsx
          src/routes/listings.index.tsx
          src/search-filters-v1.css

      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-pr257-formatter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format search and filter experience"
          git push origin HEAD:design/search-filters-v1
