name: Locate Public Private Media Leak Once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/locate-public-private-media-leak-once.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Locate private media URL construction
        shell: bash
        run: |
          set -euo pipefail
          echo '=== private media path references ==='
          rg -n -C 10 'account/media/assets|primaryImageUrl|primary_image' cloudflare/worker/src src scripts || true
