name: Chat Image Reliability V2

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/chats.tsx"
      - "src/features/communication/ChatAttachmentImage.tsx"
      - "scripts/chat-image-reliability-v2.test.mjs"
      - ".github/workflows/chat-image-reliability-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chat image reliability contract
        run: node --test scripts/chat-image-reliability-v2.test.mjs
      - name: Lint changed sources
        run: npx eslint --quiet src/routes/chats.tsx src/features/communication/ChatAttachmentImage.tsx
      - name: Typecheck
        run: npm run typecheck -- --pretty false
