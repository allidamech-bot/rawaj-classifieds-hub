name: Syria Cloudflare Encrypted D1 Backup

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact main commit SHA approved for backup evidence
        required: true
        type: string
      approval_phrase:
        description: Type BACKUP_RAWAJ_SYRIA_PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: syria-cloudflare-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    environment: syria-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
      VITE_SITE_URL: https://rawa-j.com
      VITE_PUBLIC_DATA_API_BASE_URL: https://rawaj-classifieds-hub.allidamech.workers.dev
      VITE_SYRIA_FIREBASE_PROJECT_ID: ${{ vars.SYRIA_FIREBASE_PROJECT_ID }}
      SYRIA_FIREBASE_PROJECT_ID: ${{ vars.SYRIA_FIREBASE_PROJECT_ID }}
      RAWAJ_WORKER_ENVIRONMENT: production
      RAWAJ_WORKER_RELEASE_SHA: ${{ inputs.expected_commit_sha }}

    steps:
      - name: Verify explicit approval
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ inputs.approval_phrase }}" = "BACKUP_RAWAJ_SYRIA_PRODUCTION"
          test "${{ inputs.expected_commit_sha }}" = "$GITHUB_SHA"
          test "${#GITHUB_SHA}" -eq 40
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"

      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          fetch-depth: 1
          show-progress: false

      - name: Verify checked-out identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit_sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Validate Syria provider bindings
        run: node scripts/syria-provider-preflight.mjs

      - name: Render exact Wrangler configuration
        run: npm run render:production --prefix cloudflare/worker

      - name: Export and encrypt D1 backup
        id: encrypt
        shell: bash
        working-directory: cloudflare/worker
        run: |
          set -Eeuo pipefail
          umask 077
          output_directory="$GITHUB_WORKSPACE/backup-output"
          mkdir -p "$output_directory"
          plain="$output_directory/rawaj-syria-production-${GITHUB_SHA}.sql"
          encrypted="${plain}.enc"
          checksum="${encrypted}.sha256"

          cleanup() {
            rm -f "$plain"
          }
          trap cleanup EXIT

          npx wrangler d1 export "$CLOUDFLARE_D1_DATABASE_NAME" \
            --remote \
            --skip-confirmation \
            --output="$plain" \
            --config wrangler.generated.jsonc

          test -s "$plain"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$plain" \
            -out "$encrypted" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          test -s "$encrypted"
          sha256sum "$encrypted" > "$checksum"
          rm -f "$plain"
          test ! -e "$plain"

          echo "encrypted_path=$encrypted" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup evidence
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-syria-d1-encrypted-${{ inputs.expected_commit_sha }}
          path: |
            ${{ steps.encrypt.outputs.encrypted_path }}
            ${{ steps.encrypt.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Verify plaintext cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if find "$GITHUB_WORKSPACE/backup-output" -type f -name '*.sql' -print -quit | grep -q .; then
            echo "Plaintext D1 backup remained on the runner." >&2
            exit 1
          fi

      - name: Record backup evidence
        shell: bash
        run: |
          {
            echo "## Syria encrypted D1 backup completed"
            echo "- Commit: $GITHUB_SHA"
            echo "- Database variable: CLOUDFLARE_D1_DATABASE_NAME"
            echo "- Only encrypted SQL and its checksum were uploaded."
            echo "- Artifact retention: 7 days"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
