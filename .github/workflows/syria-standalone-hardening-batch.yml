name: Syria standalone hardening batch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/syria-standalone-hardening-batch.yml"

permissions:
  contents: write

concurrency:
  group: syria-standalone-hardening-batch
  cancel-in-progress: false

jobs:
  harden:
    if: github.head_ref == 'migration/syria-standalone-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: migration/syria-standalone-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Remove Saudi and embedded gateway surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -r --ignore-unmatch rawaj-market-gateway
          git rm --ignore-unmatch src/market-server.ts

          while IFS= read -r -d '' file; do
            git rm --ignore-unmatch "$file"
          done < <(find .github/workflows -maxdepth 1 -type f \
            \( -iname '*saudi*' -o -name 'rawaj-market-gateway-quality-gate.yml' \) \
            ! -name 'syria-standalone-hardening-batch.yml' -print0)

          while IFS= read -r -d '' file; do
            git rm --ignore-unmatch "$file"
          done < <(find scripts -maxdepth 1 -type f -iname '*saudi*' -print0)

          while IFS= read -r -d '' file; do
            git rm --ignore-unmatch "$file"
          done < <(find docs -type f -iname '*saudi*' -print0)

      - name: Restore Syria-owned server entry
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('vite.config.ts')
          text = path.read_text(encoding='utf-8')
          market_entry = 'server: { entry: "market-server" },'
          syria_entry = 'server: { entry: "server" },'
          if market_entry in text:
              text = text.replace(market_entry, syria_entry)
              text = text.replace(
                  '// Route custom market hosts before delegating to the existing SSR wrapper.\n'
                  '        // nitro/vite builds from this',
                  '// Syria owns the production SSR wrapper directly. Market routing is external.',
              )
          elif syria_entry not in text:
              raise SystemExit('Neither market-server nor Syria server entry was found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify obvious Saudi filenames are gone
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -d rawaj-market-gateway
          test ! -e src/market-server.ts
          grep -q 'entry: "server"' vite.config.ts
          if find .github/workflows scripts docs -type f -iname '*saudi*' -print -quit | grep -q .; then
            echo 'Saudi-named files remain after cleanup.' >&2
            find .github/workflows scripts docs -type f -iname '*saudi*' -print >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check Syria application
        run: npm run typecheck

      - name: Build Syria application
        run: npm run build

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'chore(syria): remove Saudi and embedded gateway surfaces'
          git push origin HEAD:migration/syria-standalone-hardening
