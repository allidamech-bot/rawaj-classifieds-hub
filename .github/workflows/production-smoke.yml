name: Production Smoke

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: https://rawa-j.com
      PRODUCTION_SMOKE: "1"
      EXPECTED_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for matching production deployment
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "EXPECTED_COMMIT_SHA must be an exact 40-character commit SHA." >&2
            exit 1
          fi

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --compressed --max-time 15 \
              --dump-header /tmp/rawaj-production-headers.txt \
              --output /tmp/rawaj-production-index.html \
              https://rawa-j.com/; then
              deployed_sha="$(grep -oE 'name="rawaj-build-commit" content="[0-9a-f]{40}"' /tmp/rawaj-production-index.html | head -n 1 | cut -d '"' -f 4 || true)"
            else
              deployed_sha=""
            fi
            if [ "$deployed_sha" = "$EXPECTED_COMMIT_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "RAWAJ production did not deploy the expected commit in time." >&2
          echo "Expected: $EXPECTED_COMMIT_SHA" >&2
          echo "Observed: ${deployed_sha:-missing build metadata}" >&2
          exit 1

      - name: Run production smoke tests
        run: npx playwright test e2e/production-smoke.spec.ts

      - name: Upload production diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            /tmp/rawaj-production-index.html
            /tmp/rawaj-production-headers.txt
          if-no-files-found: ignore
          retention-days: 14
