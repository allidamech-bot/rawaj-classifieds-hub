name: Format Batch 8

on:
  push:
    branches:
      - agent/launch-readiness-batch-8

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness-batch-8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/home/CategoryWorlds.tsx src/features/seo/MarketplaceLandingPage.tsx src/routes/category.\$slug.tsx src/routes/syria.\$slug.tsx 'src/routes/sitemap[.]xml.ts' scripts/launch-readiness-batch-8.test.mjs package.json .github/workflows/quality-gate.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/CategoryWorlds.tsx src/features/seo/MarketplaceLandingPage.tsx src/routes/category.\$slug.tsx src/routes/syria.\$slug.tsx 'src/routes/sitemap[.]xml.ts' scripts/launch-readiness-batch-8.test.mjs package.json .github/workflows/quality-gate.yml
          git commit -m "Format Batch 8 SEO landing pages"
          git push origin HEAD:agent/launch-readiness-batch-8
