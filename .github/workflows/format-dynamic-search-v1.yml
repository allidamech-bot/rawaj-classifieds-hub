name: Format Dynamic Search V1

on:
  pull_request:
    paths:
      - ".github/workflows/format-dynamic-search-v1.yml"
      - "src/features/listings/DynamicListingFacetFilters.tsx"
      - "src/features/listings/listing-attribute-filter-state.ts"
      - "src/features/listings/use-listing-facets.ts"
      - "src/lib/api/dynamic-listing-search.ts"
      - "src/lib/api/listing-attributes.ts"
      - "src/lib/api/listing-facets.ts"
      - "src/types/dynamic-listing-filters.d.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-dynamic-search-v1
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format dynamic search files
        run: |
          set -euo pipefail
          npx prettier --write \
            src/features/listings/DynamicListingFacetFilters.tsx \
            src/features/listings/listing-attribute-filter-state.ts \
            src/features/listings/use-listing-facets.ts \
            src/lib/api/dynamic-listing-search.ts \
            src/lib/api/listing-attributes.ts \
            src/lib/api/listing-facets.ts \
            src/types/dynamic-listing-filters.d.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/features/listings/DynamicListingFacetFilters.tsx \
              src/features/listings/listing-attribute-filter-state.ts \
              src/features/listings/use-listing-facets.ts \
              src/lib/api/dynamic-listing-search.ts \
              src/lib/api/listing-attributes.ts \
              src/lib/api/listing-facets.ts \
              src/types/dynamic-listing-filters.d.ts
            git commit -m "style: format dynamic search foundation"
            git push origin HEAD:feature/taxonomy-search-foundation-v1
          fi
