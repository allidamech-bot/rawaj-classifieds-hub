name: Apply admin extended recovery V2

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-admin-extended-queues-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply and validate recovery batch
        shell: bash
        run: |
          cat \
            .github/admin-extended-v2-part1.py \
            .github/admin-extended-v2-part2.py \
            .github/admin-extended-v2-part3.py \
            .github/admin-extended-v2-part4.py \
            > /tmp/admin-extended-v2.py
          set +e
          python /tmp/admin-extended-v2.py > /tmp/admin-extended-v2-output.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/admin-extended-v2-output.txt .github/admin-extended-v2-error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/admin-extended-v2-error.txt
            git commit -m "Record admin extended V2 failure"
            git push origin HEAD:feature/recover-admin-extended-queues-v2
            cat /tmp/admin-extended-v2-output.txt
            exit "$status"
          fi
