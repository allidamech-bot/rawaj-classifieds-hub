name: Temporary PR 257 Category Hero Fix

on:
  push:
    branches:
      - design/search-filters-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/search-filters-v1
          fetch-depth: 0
      - name: Align category hero selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/categories.tsx')
          source = path.read_text()
          source = source.replace(
              'className="rawaj-hero-surface rounded-[1.55rem] sm:rounded-[1.9rem]"',
              'className="rawaj-categories-v2__hero rounded-[1.55rem] sm:rounded-[1.9rem]"',
          )
          source = source.replace(
              'className="border-t border-border/60 p-3 sm:p-4"',
              'className="rawaj-categories-v2__hero-search p-3 sm:p-4"',
          )
          path.write_text(source)
          PY
      - name: Commit and self-delete
        shell: bash
        run: |
          rm .github/workflows/temporary-pr257-category-hero-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align spatial category hero selectors"
          git push origin HEAD:design/search-filters-v1
