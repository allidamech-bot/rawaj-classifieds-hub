name: Admin Safety Format Diagnostic

on:
  pull_request:
    paths:
      - "src/lib/api/safety-cases.ts"
      - "src/routes/admin.tsx"
      - ".github/workflows/admin-safety-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/api/safety-cases.ts src/routes/admin.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: admin-safety-formatted
          path: |
            src/lib/api/safety-cases.ts
            src/routes/admin.tsx
