name: Temporary PR 258 Formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'design/listing-detail-contact-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/listing-detail-contact-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format PR files
        run: >-
          npx prettier --write
          .github/workflows/quality-gate.yml
          scripts/listing-detail-v2.test.mjs
          src/features/listing-detail/ListingContactDock.tsx
          src/features/listing-detail/ListingMediaExperience.tsx
          src/features/listing-detail/ListingSafetyAndAlert.tsx
          src/features/listing-detail/ListingSellerProfileCard.tsx
          src/features/listing-detail/SimilarListingsRail.tsx
          src/listing-detail-v2.css
          src/routes/__root.tsx
          'src/routes/listings.$id.tsx'
      - name: Commit formatting and self-delete
        shell: bash
        run: |
          rm .github/workflows/temporary-pr258-formatter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format listing detail V2"
          git push origin HEAD:design/listing-detail-contact-v1
