name: Temporary Chat Auth Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/android-release-readiness-1-0-3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture Android contract
        shell: bash
        run: |
          set +e
          node --test scripts/android-release-readiness.test.mjs > /tmp/android-contract.log 2>&1
          echo $? > /tmp/android-contract.exit
          exit 0

      - name: Capture ESLint
        shell: bash
        run: |
          set +e
          npx eslint \
            src/components/shell/BottomDock.tsx \
            src/components/native/NativeAppRuntime.tsx \
            src/lib/journey-target-resolution.ts \
            src/lib/native-runtime.ts \
            src/lib/supabase.ts \
            scripts/chat-workspace.test.mjs \
            scripts/android-release-readiness.test.mjs > /tmp/eslint.log 2>&1
          echo $? > /tmp/eslint.exit
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-chat-auth-diagnostics
          path: |
            /tmp/android-contract.log
            /tmp/android-contract.exit
            /tmp/eslint.log
            /tmp/eslint.exit
          if-no-files-found: error
          retention-days: 1
