name: Phase 3 Design Contract Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'agent/phase-3-route-css-isolation-batch-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and validate
        run: |
          npx prettier --write scripts/design-system-v2.test.mjs
          npx eslint --quiet scripts/design-system-v2.test.mjs
          node --test scripts/design-system-v2.test.mjs
      - name: Upload formatted file
        uses: actions/upload-artifact@v4
        with:
          name: phase3-design-contract-${{ github.sha }}
          path: scripts/design-system-v2.test.mjs
          retention-days: 1
