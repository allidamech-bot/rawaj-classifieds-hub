name: Apply listing reservation UI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/listing-reservation-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/listing-reservation-ui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded reservation UI patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one UI anchor in {path}: {old[:140]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/routes/profile/listings.tsx',
              'import { BadgePercent, Eye, Pencil, Plus, Star, Trash2 } from "lucide-react";\n',
              'import { BadgePercent, BookmarkCheck, Eye, Pencil, Plus, Star, Trash2 } from "lucide-react";\n',
          )
          replace_once(
              'src/routes/profile/listings.tsx',
              '  reduceOwnerListingPrice,\n  setOwnerListingExpiry,\n',
              '  reduceOwnerListingPrice,\n  setOwnerListingExpiry,\n  setOwnerListingReserved,\n',
          )
          replace_once(
              'src/routes/profile/listings.tsx',
              '  const [priceDropBusy, setPriceDropBusy] = useState(false);\n  const [priceDropError, setPriceDropError] = useState("");\n',
              '  const [priceDropBusy, setPriceDropBusy] = useState(false);\n'
              '  const [priceDropError, setPriceDropError] = useState("");\n'
              '  const [reservationBusy, setReservationBusy] = useState(false);\n'
              '  const [reservationError, setReservationError] = useState("");\n',
          )
          replace_once(
              'src/routes/profile/listings.tsx',
              '  const canClose = listing.status === "approved";\n  const canReducePrice =\n',
              '  const canClose = listing.status === "approved";\n'
              '  const canManageReservation = listing.status === "approved";\n'
              '  const canReducePrice =\n',
          )
          replace_once(
              'src/routes/profile/listings.tsx',
              '  async function handlePriceDrop() {\n',
              '  async function handleReservationToggle() {\n'
              '    if (reservationBusy || !canManageReservation) return;\n'
              '    setReservationError("");\n'
              '    setReservationBusy(true);\n'
              '    const result = await setOwnerListingReserved(\n'
              '      userId,\n'
              '      listing.id,\n'
              '      !Boolean(listing.reservedAt),\n'
              '    );\n'
              '    setReservationBusy(false);\n'
              '    if (!result.ok) {\n'
              '      setReservationError(result.error.message);\n'
              '      return;\n'
              '    }\n'
              '    onChanged(result.data);\n'
              '  }\n\n'
              '  async function handlePriceDrop() {\n',
          )
          replace_once(
              'src/routes/profile/listings.tsx',
              '          {listing.status === "approved" && (\n            <p className="rounded-lg bg-emerald-trust/10 p-2 text-[11px] font-semibold text-foreground">\n',
              '          {listing.reservedAt ? (\n'
              '            <p className="rounded-lg bg-warning/10 p-2 text-[11px] font-semibold text-foreground">\n'
              '              {text("هذا الإعلان محجوز حالياً.", "This listing is currently reserved.")}\n'
              '            </p>\n'
              '          ) : null}\n'
              '          {listing.status === "approved" && (\n'
              '            <p className="rounded-lg bg-emerald-trust/10 p-2 text-[11px] font-semibold text-foreground">\n',
          )
          replace_once(
              'src/routes/profile/listings.tsx',
              '          {priceDropError && (\n            <p className="rounded-lg bg-destructive/10 p-2 text-[11px] text-destructive">\n              {priceDropError}\n            </p>\n          )}\n',
              '          {priceDropError && (\n'
              '            <p className="rounded-lg bg-destructive/10 p-2 text-[11px] text-destructive">\n'
              '              {priceDropError}\n'
              '            </p>\n'
              '          )}\n'
              '          {reservationError && (\n'
              '            <p className="rounded-lg bg-destructive/10 p-2 text-[11px] text-destructive">\n'
              '              {reservationError}\n'
              '            </p>\n'
              '          )}\n',
          )
          replace_once(
              'src/routes/profile/listings.tsx',
              '            {canClose && (\n              <>\n                <select\n',
              '            {canManageReservation ? (\n'
              '              <button\n'
              '                type="button"\n'
              '                disabled={reservationBusy}\n'
              '                onClick={() => void handleReservationToggle()}\n'
              '                className={`inline-flex min-h-11 items-center gap-1.5 rounded-xl px-3 py-2 text-[10px] font-bold disabled:opacity-60 ${\n'
              '                  listing.reservedAt\n'
              '                    ? "bg-warning/12 text-warning"\n'
              '                    : "bg-primary/8 text-primary"\n'
              '                }`}\n'
              '              >\n'
              '                <BookmarkCheck className="h-3.5 w-3.5" />\n'
              '                {reservationBusy\n'
              '                  ? text("جارٍ التحديث", "Updating")\n'
              '                  : listing.reservedAt\n'
              '                    ? text("إلغاء الحجز", "Clear reservation")\n'
              '                    : text("وضع محجوز", "Mark reserved")}\n'
              '              </button>\n'
              '            ) : null}\n'
              '            {canClose && (\n'
              '              <>\n'
              '                <select\n',
          )

          replace_once(
              'src/features/listings/listings-components.tsx',
              '        {listing.isFeatured ? (\n          <span className="absolute start-2 top-2 rounded-full bg-primary/92 px-2 py-1 text-[9px] font-extrabold text-primary-foreground shadow-soft backdrop-blur-sm">\n            {text("مميز", "Featured")}\n          </span>\n        ) : null}\n',
              '        {listing.reservedAt ? (\n'
              '          <span className="absolute start-2 top-2 rounded-full bg-warning/92 px-2 py-1 text-[9px] font-extrabold text-warning-foreground shadow-soft backdrop-blur-sm">\n'
              '            {text("محجوز", "Reserved")}\n'
              '          </span>\n'
              '        ) : listing.isFeatured ? (\n'
              '          <span className="absolute start-2 top-2 rounded-full bg-primary/92 px-2 py-1 text-[9px] font-extrabold text-primary-foreground shadow-soft backdrop-blur-sm">\n'
              '            {text("مميز", "Featured")}\n'
              '          </span>\n'
              '        ) : null}\n',
          )

          replace_once(
              'src/routes/listings.$id.tsx',
              '      <main className="container-wide listing-detail-mobile-bottom pb-8 pt-3 sm:pt-5">\n        <div className="grid items-start gap-4 lg:grid-cols-12 lg:gap-6">\n',
              '      <main className="container-wide listing-detail-mobile-bottom pb-8 pt-3 sm:pt-5">\n'
              '        {listing.reservedAt ? (\n'
              '          <section className="mb-4 flex items-start gap-3 rounded-2xl border border-warning/20 bg-warning/8 p-3.5 sm:p-4">\n'
              '            <span className="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-warning/12 text-warning">\n'
              '              <Clock className="h-5 w-5" />\n'
              '            </span>\n'
              '            <div className="min-w-0 flex-1">\n'
              '              <p className="text-sm font-extrabold text-foreground">\n'
              '                {text("هذا الإعلان محجوز حالياً", "This listing is currently reserved")}\n'
              '              </p>\n'
              '              <p className="mt-1 text-xs leading-5 text-muted-foreground">\n'
              '                {text(\n'
              '                  "أبقاه المعلن ظاهراً للمرجعية، لكن قد تكون السلعة ملتزماً بها لمشترٍ آخر. يمكنك الاستفسار من البائع عن آخر حالة.",\n'
              '                  "The seller kept it public for reference, but the item may be committed to another buyer. You can ask the seller for the latest status.",\n'
              '                )}\n'
              '              </p>\n'
              '            </div>\n'
              '          </section>\n'
              '        ) : null}\n'
              '        <div className="grid items-start gap-4 lg:grid-cols-12 lg:gap-6">\n',
          )
          PY

      - name: Format reservation UI sources
        run: npx prettier --write src/routes/profile/listings.tsx src/features/listings/listings-components.tsx 'src/routes/listings.$id.tsx'

      - name: Commit reservation UI implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/profile/listings.tsx src/features/listings/listings-components.tsx 'src/routes/listings.$id.tsx'
          git commit -m "Add listing reservation UI"
          git push origin HEAD:feature/listing-reservation-ui
