name: Server Account Bootstrap Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/202607170006_server_account_bootstrap_integrity.sql"
      - "scripts/server-account-bootstrap-integrity.test.mjs"
      - "docs/production-schema/migration-ledger.json"
      - ".github/workflows/server-account-bootstrap-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check scripts/server-account-bootstrap-integrity.test.mjs .github/workflows/server-account-bootstrap-integrity.yml docs/production-schema/migration-ledger.json
      - run: node --test scripts/server-account-bootstrap-integrity.test.mjs
      - run: node scripts/check-migration-ledger.mjs
