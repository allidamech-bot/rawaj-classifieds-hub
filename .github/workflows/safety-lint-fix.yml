name: Safety Case Lint Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/safety-case-management' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/safety-case-management
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix changed source files
        run: >-
          npx eslint --fix
          src/lib/api/safety-cases.ts
          src/lib/api/safety-case-details.ts
          src/lib/classifieds-api.ts
          src/routes/admin.safety.tsx
          src/components/admin/SafetyCaseEvidencePanel.tsx
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/safety-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/safety-cases.ts src/lib/api/safety-case-details.ts src/lib/classifieds-api.ts src/routes/admin.safety.tsx src/components/admin/SafetyCaseEvidencePanel.tsx .github/workflows/safety-lint-fix.yml
          if git diff --cached --quiet; then
            echo "No lint fixes needed."
            exit 0
          fi
          git commit -m "Fix safety case lint issues"
          git push origin HEAD:feature/safety-case-management
