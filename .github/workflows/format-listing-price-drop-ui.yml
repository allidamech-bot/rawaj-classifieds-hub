name: Format listing price drop UI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/listing-price-drop-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/listing-price-drop-ui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format price drop UI sources
        run: npx prettier --write src/routes/offers.tsx scripts/listing-price-drop.test.mjs

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- src/routes/offers.tsx scripts/listing-price-drop.test.mjs; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/offers.tsx scripts/listing-price-drop.test.mjs
          git commit -m "Format listing price drop UI"
          git push origin HEAD:feature/listing-price-drop-ui
