name: Patch Saudi listing media cache

"on":
  pull_request:
    branches:
      - saudi
    paths:
      - .github/workflows/patch-saudi-listing-media-cache.yml
  push:
    branches:
      - fix/saudi-listing-media-cache-invalidation-20260803
    paths:
      - .github/workflows/patch-saudi-listing-media-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saudi-listing-media-cache-invalidation-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch public listing media revalidation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('cloudflare/worker/src/index.ts')
          text = path.read_text(encoding='utf-8')
          handler = text.index('async function mediaAsset(')
          start = text.index('  const object = await env.MEDIA.get(stringValue(asset.object_key));', handler)
          end_marker = '  return new Response(object.body, { status: 200, headers });'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''  const storedEtag = stringValue(asset.etag);
          const ifNoneMatch = request.headers.get("If-None-Match");
          if (ifNoneMatch && ifNoneMatch === storedEtag) {
            const headers = new Headers(cors);
            headers.set("ETag", storedEtag);
            applyRevalidatingMediaCacheHeaders(headers);
            return new Response(null, { status: 304, headers });
          }

          const object = await env.MEDIA.get(stringValue(asset.object_key));
          if (!object) {
            console.error("rawaj_media_object_missing", { assetId, objectKey: asset.object_key });
            return json({ error: { code: "not_found", message: "Media not found." } }, 404, cors);
          }

          const headers = new Headers(cors);
          object.writeHttpMetadata(headers);
          headers.set("Content-Type", stringValue(asset.content_type, "application/octet-stream"));
          headers.set("ETag", object.httpEtag || storedEtag);
          applyRevalidatingMediaCacheHeaders(headers);
          headers.set("X-Content-Type-Options", "nosniff");
          headers.set("Content-Security-Policy", "default-src 'none'; sandbox");

          return new Response(object.body, { status: 200, headers });'''
          text = text[:start] + replacement + text[end:]
          marker = 'function mapCategory(row: JsonRecord): JsonRecord {'
          if text.count(marker) != 1:
              raise SystemExit('mapCategory marker mismatch')
          helper = '''function applyRevalidatingMediaCacheHeaders(headers: Headers): void {
            headers.set("Cache-Control", "public, max-age=0, must-revalidate");
            headers.set("CDN-Cache-Control", "no-store");
            headers.set("Cloudflare-CDN-Cache-Control", "no-store");
            headers.delete("Expires");
          }

          '''
          path.write_text(text.replace(marker, helper + marker), encoding='utf-8')

          path = Path('cloudflare/worker/src/marketplace-private.ts')
          text = path.read_text(encoding='utf-8')
          upload_start = text.index('async function uploadImage(')
          upload_end = text.index('async function listImages(', upload_start)
          old = 'httpMetadata: { contentType: file.type, cacheControl: "public, max-age=31536000, immutable" },'
          new = 'httpMetadata: { contentType: file.type, cacheControl: "public, max-age=0, must-revalidate" },'
          target = text.find(old, upload_start, upload_end)
          if target < 0 or text.find(old, target + 1, upload_end) >= 0:
              raise SystemExit('listing upload cache metadata target mismatch')
          text = text[:target] + new + text[target + len(old):]
          path.write_text(text, encoding='utf-8')
          PY

          cat > cloudflare/worker/test/listing-media-cache-invalidation.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          const publicCore = fs.readFileSync(new URL("../src/index.ts", import.meta.url), "utf8");
          const privateCore = fs.readFileSync(new URL("../src/marketplace-private.ts", import.meta.url), "utf8");

          test("public listing media revalidates D1 before cached bytes", () => {
            assert.match(publicCore, /public, max-age=0, must-revalidate/);
            assert.match(publicCore, /Cloudflare-CDN-Cache-Control", "no-store"/);
            assert.match(publicCore, /CDN-Cache-Control", "no-store"/);
            const mediaHandler = publicCore.indexOf("async function mediaAsset(");
            const authorizationLookup = publicCore.indexOf("FROM media_assets m", mediaHandler);
            const conditional = publicCore.indexOf('request.headers.get("If-None-Match")', authorizationLookup);
            const r2Read = publicCore.indexOf("await env.MEDIA.get", conditional);
            assert.ok(mediaHandler >= 0 && authorizationLookup > mediaHandler);
            assert.ok(conditional > authorizationLookup);
            assert.ok(r2Read > conditional);
          });

          test("new listing media is never marked immutable", () => {
            const uploadStart = privateCore.indexOf("async function uploadImage(");
            const uploadEnd = privateCore.indexOf("async function listImages(", uploadStart);
            const listingUpload = privateCore.slice(uploadStart, uploadEnd);
            assert.match(listingUpload, /public, max-age=0, must-revalidate/);
            assert.doesNotMatch(listingUpload, /max-age=31536000, immutable/);
          });
          EOF

          npx prettier --write cloudflare/worker/src/index.ts cloudflare/worker/src/marketplace-private.ts cloudflare/worker/test/listing-media-cache-invalidation.test.mjs
          node --test cloudflare/worker/test/listing-media-cache-invalidation.test.mjs
          npm ci --prefix cloudflare/worker --ignore-scripts
          npm run typecheck --prefix cloudflare/worker
          rm .github/workflows/patch-saudi-listing-media-cache.yml
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare/worker/src/index.ts cloudflare/worker/src/marketplace-private.ts cloudflare/worker/test/listing-media-cache-invalidation.test.mjs .github/workflows/patch-saudi-listing-media-cache.yml
          git commit -m "fix(saudi): revalidate public listing media"
          git push origin HEAD:fix/saudi-listing-media-cache-invalidation-20260803
