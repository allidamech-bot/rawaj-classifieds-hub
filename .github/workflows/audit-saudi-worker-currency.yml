name: Verify Saudi Worker currency

"on":
  pull_request:
    branches:
      - saudi

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject Syrian runtime currency assumptions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude='*.test.*' --exclude='*.spec.*' --exclude-dir=test --exclude-dir=tests 'SYP' cloudflare/worker/src; then
            echo 'Saudi Worker runtime must not contain SYP defaults or fallbacks.' >&2
            exit 1
          fi
          grep -RIn 'SAR' cloudflare/worker/src >/tmp/saudi-sar-references.txt
          test "$(wc -l </tmp/saudi-sar-references.txt | tr -d ' ')" -ge 11
          echo 'Saudi Worker currency contract passed.'
