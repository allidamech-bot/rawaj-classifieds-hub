name: Safety Case Sync Main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feature/safety-case-management' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/safety-case-management
          fetch-depth: 0
      - name: Merge latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/safety-sync-main.yml
          git add .github/workflows/safety-sync-main.yml
          git commit --amend --no-edit
          git push origin HEAD:feature/safety-case-management
