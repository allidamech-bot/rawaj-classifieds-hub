name: Apply Native Auth Release Audit Retry Once

on:
  push:
    branches:
      - agent/android-release-candidate-audit-1-0-3
    paths:
      - ".github/workflows/apply-native-auth-release-audit-retry-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/android-release-candidate-audit-1-0-3
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply audited native auth patch
        run: python scripts/apply-native-auth-release-audit.py

      - name: Install dependencies
        run: npm ci

      - name: Format changed sources
        run: npx eslint --fix src/lib/native-auth.ts src/lib/auth.tsx src/routes/login.tsx scripts/native-mobile-auth.test.mjs

      - name: Run native auth contract
        run: npm run test:native-mobile-auth

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-native-auth-release-audit.py
          rm .github/workflows/apply-native-auth-release-audit-once.yml
          rm .github/workflows/apply-native-auth-release-audit-retry-once.yml

      - name: Commit audited native auth implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix native authentication return flow"
          git push origin HEAD:agent/android-release-candidate-audit-1-0-3
