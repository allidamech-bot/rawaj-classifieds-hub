name: Patch Saudi strict isolation closeout

"on":
  push:
    branches:
      - test/saudi-strict-isolation-closeout-20260803
    paths:
      - .github/workflows/patch-saudi-strict-isolation-closeout.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-saudi-strict-isolation-closeout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/saudi-strict-isolation-closeout-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require exact Syrian isolation responses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/saudi-infra-admin-production-e2e.mjs')
          lines = path.read_text(encoding='utf-8').splitlines()

          pre_target = 'const syria = await request(SYRIA_SITE_URL, `/v1/listings/${listingId}`);'
          approved_target = 'const syriaApproved = await request(SYRIA_SITE_URL, `/v1/listings/${approved.id}`);'
          pre_matches = [index for index, line in enumerate(lines) if line.strip() == pre_target]
          approved_matches = [index for index, line in enumerate(lines) if line.strip() == approved_target]
          if len(pre_matches) != 1 or len(approved_matches) != 1:
              raise SystemExit(
                  f'isolation markers mismatch: pre={len(pre_matches)}, approved={len(approved_matches)}'
              )

          pre = pre_matches[0]
          pre_indent = lines[pre][:len(lines[pre]) - len(lines[pre].lstrip())]
          if pre + 1 >= len(lines) or 'syria.response.status === 200' not in lines[pre + 1]:
              raise SystemExit('unexpected pre-approval isolation guard')
          lines[pre + 1] = f'{pre_indent}expectStatus(syria, 404, `${{suffix}} Syrian market isolation`);'

          approved = approved_matches[0]
          approved_indent = lines[approved][:len(lines[approved]) - len(lines[approved].lstrip())]
          if (
              approved + 2 >= len(lines)
              or 'syriaApproved.response.status === 200' not in lines[approved + 1]
              or 'Approved Saudi listing leaked into Syria' not in lines[approved + 2]
          ):
              raise SystemExit('unexpected approved isolation guard')
          lines[approved + 1:approved + 3] = [
              f'{approved_indent}expectStatus(syriaApproved, 404, "approved Saudi listing Syrian isolation");'
          ]

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          npx prettier --write scripts/saudi-infra-admin-production-e2e.mjs
          node --check scripts/saudi-infra-admin-production-e2e.mjs
          rm .github/workflows/patch-saudi-strict-isolation-closeout.yml
      - name: Commit strict isolation contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/saudi-infra-admin-production-e2e.mjs .github/workflows/patch-saudi-strict-isolation-closeout.yml
          git commit -m "test(saudi): require exact Syrian isolation status"
          git push origin HEAD:test/saudi-strict-isolation-closeout-20260803
