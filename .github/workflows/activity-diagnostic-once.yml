name: Activity Diagnostic Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/activity-diagnostic-once.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install @capacitor/push-notifications@^8.0.0 --save
      - run: python scripts/apply-saved-search-push-integration.py
      - name: Account activity contract
        run: node --test scripts/account-activity-center.test.mjs
      - name: Saved-search background contract
        run: node --test scripts/saved-search-background-alerts.test.mjs
      - name: Unread live contract
        run: node --test scripts/unread-activity-live.test.mjs
