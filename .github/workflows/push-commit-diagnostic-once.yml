name: Push Commit Diagnostic Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/push-commit-diagnostic-once.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install @capacitor/push-notifications@^8.0.0 --save
      - name: Apply validated integration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-saved-search-push-integration.py")
          text = path.read_text(encoding="utf-8")
          old = '''        '      } else if (target.kind === "saved_search") {\\n'
                  '        void navigate({ to: "/saved-searches" });\\n'
          '''
          new = '''        '      } else if (target.kind === "saved_search") {\\n'
                  '        void navigate({ to: "/saved-searches", search: { q: "", category: "", subcategory: "", gov: "", district: "", price_min: "", price_max: "", car_make: "", car_model: "", fuel: "", transmission: "", property_purpose: "", property_type: "", rooms: "", rental_duration: "", electronics_brand: "", detail_condition: "", employment_type: "", salary_type: "", sort: "latest" } });\\n'
          '''
          if old not in text:
              raise SystemExit("Saved-search navigation template not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/apply-saved-search-push-integration.py
          mkdir -p .output/public
          printf '<!doctype html><html lang="ar"><body></body></html>\n' > .output/public/index.html
          npx cap sync android
          git ls-files -z android/app/src/main/assets/public | xargs -0 -r git checkout --
          git clean -fd android/app/src/main/assets/public
          rm -rf .output
      - name: Capture git add and commit
        run: |
          set +e
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo '--- status before add ---'
            git status --short
            echo '--- add ---'
            git add \
              .github/workflows/quality-gate.yml \
              android \
              capacitor.config.ts \
              docs/production-schema/migration-ledger.json \
              package.json \
              package-lock.json \
              scripts/saved-search-push-v1.test.mjs \
              scripts/saved-search-background-alerts.test.mjs \
              src \
              supabase/migrations/202607150002_saved_search_alerts_push_v1.sql \
              supabase/functions/send-push-notifications/index.ts
            add_status=$?
            echo "add_status=$add_status"
            echo '--- staged files ---'
            git diff --cached --name-status
            echo '--- commit ---'
            git commit -m "feat: complete saved-search alerts and native push delivery"
            commit_status=$?
            echo "commit_status=$commit_status"
            echo '--- status after commit ---'
            git status --short
          } > git-commit-diagnostics.txt 2>&1
          cat git-commit-diagnostics.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: push-commit-diagnostics-${{ github.run_id }}
          path: git-commit-diagnostics.txt
          retention-days: 1
