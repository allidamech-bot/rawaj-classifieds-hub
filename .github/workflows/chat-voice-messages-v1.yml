name: Chat Voice Messages V1

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/202607170008_chat_voice_messages_v1.sql"
      - "docs/production-schema/migration-ledger.json"
      - "scripts/chat-voice-messages-v1.test.mjs"
      - ".github/workflows/chat-voice-messages-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chat voice message contract
        run: node --test scripts/chat-voice-messages-v1.test.mjs
      - name: Migration ledger collision check
        run: node scripts/check-migration-ledger.mjs
