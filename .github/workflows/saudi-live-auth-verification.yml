name: Saudi Live Auth Verification

"on":
  pull_request:
    paths:
      - .github/workflows/saudi-live-auth-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SITE_URL: https://rawaj-saudi-web.allidamech.workers.dev
      API_URL: https://rawaj-saudi-classifieds.allidamech.workers.dev
      FIREBASE_API_KEY: AIzaSyCEx7XMl1vsLU3cvoDjrPav5WF54MFkn1U
      FIREBASE_PROJECT_ID: project-af18fcaf-c46e-4ec5-93a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Cloudflare Saudi services
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services" \
            > /tmp/services.json
          node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/services.json", "utf8"));
          if (payload.success !== true) throw new Error("Unable to list Cloudflare Workers services");
          const names = (payload.result || []).map((item) => item.id || item.name).filter(Boolean);
          const saudi = names.filter((name) => String(name).includes("saudi"));
          console.log(`Saudi Worker services: ${saudi.join(", ") || "none"}`);
          if (!saudi.includes("rawaj-saudi-classifieds")) throw new Error("Saudi API Worker service is missing");
          if (!saudi.includes("rawaj-saudi-web")) throw new Error("Saudi frontend Worker service is missing");
          NODE

      - name: Verify direct Saudi backend
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors --silent --show-error --fail "$API_URL/v1/health" > /tmp/health.json
          curl --retry 5 --retry-delay 2 --retry-all-errors --silent --show-error --fail "$API_URL/v1/references" > /tmp/references.json
          node <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
          const refs = JSON.parse(fs.readFileSync("/tmp/references.json", "utf8"));
          if (health.data?.service !== "rawaj-saudi-classifieds" || health.data?.database !== "ready") {
            throw new Error("Saudi backend health is not ready");
          }
          if ((refs.data?.categories?.length || 0) < 12) throw new Error("Saudi categories are incomplete");
          if ((refs.data?.governorates?.length || 0) !== 13) throw new Error("Saudi regions are incomplete");
          console.log(`Saudi backend ready: ${refs.data.categories.length} categories, ${refs.data.governorates.length} regions.`);
          NODE

      - name: Verify Firebase email authentication endpoint
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/firebase-password.json --write-out '%{http_code}' \
            -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$FIREBASE_API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"email":"rawaj-live-verification@example.com","password":"invalid-password","returnSecureToken":true}')"
          test "$status" = "400"
          node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/firebase-password.json", "utf8"));
          const message = payload?.error?.message || "";
          if (!message || /API_KEY_INVALID|PROJECT_NOT_FOUND|OPERATION_NOT_ALLOWED/.test(message)) {
            throw new Error(`Firebase email auth unavailable: ${message || "unknown error"}`);
          }
          console.log(`Firebase email auth endpoint active: ${message}`);
          NODE

      - name: Verify Firebase Google OAuth domain
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/firebase-google.json --write-out '%{http_code}' \
            -X POST "https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=$FIREBASE_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "{\"identifier\":\"rawaj-live-verification@example.com\",\"continueUri\":\"$SITE_URL/login\",\"providerId\":\"google.com\"}")"
          GOOGLE_STATUS="$status" node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/firebase-google.json", "utf8"));
          const status = process.env.GOOGLE_STATUS;
          const message = payload?.error?.message || "";
          if (status !== "200") throw new Error(`Firebase Google OAuth unavailable: ${message || `HTTP ${status}`}`);
          if (!payload.authUri) throw new Error("Firebase Google OAuth did not return an auth URI");
          console.log("Firebase Google OAuth accepts the Saudi Worker origin.");
          NODE

      - name: Probe Saudi frontend Worker
        shell: bash
        run: |
          set -euo pipefail
          home_status="$(curl --silent --show-error --output /tmp/home.html --write-out '%{http_code}' "$SITE_URL/")"
          login_status="$(curl --silent --show-error --output /tmp/login.html --write-out '%{http_code}' "$SITE_URL/login")"
          echo "Saudi frontend HTTP: home=$home_status login=$login_status"
          test "$home_status" = "200"
          test "$login_status" = "200"
          grep -q "سوق إعلانات مبوبة في السعودية" /tmp/home.html
          grep -q "تسجيل الدخول" /tmp/login.html
