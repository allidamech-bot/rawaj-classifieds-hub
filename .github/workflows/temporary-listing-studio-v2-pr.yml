name: Temporary Listing Studio V2 PR Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'design/listing-studio-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/listing-studio-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate Listing Studio V2
        run: python scripts/temporary-integrate-listing-studio-v2.py
      - name: Format integrated files
        run: >-
          npx prettier --write
          .github/workflows/quality-gate.yml
          scripts/listing-studio-v2.test.mjs
          src/features/listing-studio/listing-studio.tsx
          src/listing-studio-v2.css
          src/routes/__root.tsx
          src/routes/add-listing.tsx
          'src/routes/profile/listings.$id.tsx'
      - name: Stage artifact directory
        shell: bash
        run: |
          mkdir -p studio-artifact/.github/workflows
          mkdir -p studio-artifact/scripts
          mkdir -p studio-artifact/src/features/listing-studio
          mkdir -p studio-artifact/src/routes/profile
          cp .github/workflows/quality-gate.yml studio-artifact/.github/workflows/quality-gate.yml
          cp scripts/listing-studio-v2.test.mjs studio-artifact/scripts/listing-studio-v2.test.mjs
          cp src/features/listing-studio/listing-studio.tsx studio-artifact/src/features/listing-studio/listing-studio.tsx
          cp src/listing-studio-v2.css studio-artifact/src/listing-studio-v2.css
          cp src/routes/__root.tsx studio-artifact/src/routes/__root.tsx
          cp src/routes/add-listing.tsx studio-artifact/src/routes/add-listing.tsx
          cp 'src/routes/profile/listings.$id.tsx' 'studio-artifact/src/routes/profile/listings.$id.tsx'
      - uses: actions/upload-artifact@v4
        with:
          name: listing-studio-v2-integrated
          path: studio-artifact
          retention-days: 1
