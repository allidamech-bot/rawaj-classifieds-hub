name: Temporary Listing Studio V2 PR Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'design/listing-studio-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/listing-studio-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate Listing Studio V2
        run: python scripts/temporary-integrate-listing-studio-v2.py
      - name: Format integrated files
        run: >-
          npx prettier --write
          .github/workflows/quality-gate.yml
          scripts/listing-studio-v2.test.mjs
          src/features/listing-studio/listing-studio.tsx
          src/listing-studio-v2.css
          src/routes/__root.tsx
          src/routes/add-listing.tsx
          'src/routes/profile/listings.$id.tsx'
      - name: Capture git publish diagnostic
        shell: bash
        run: |
          set +e
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo '--- status before add ---'
            git status --short
            git add .github/workflows/quality-gate.yml
            git add scripts/listing-studio-v2.test.mjs
            git add src/features/listing-studio/listing-studio.tsx
            git add src/listing-studio-v2.css
            git add src/routes/__root.tsx
            git add src/routes/add-listing.tsx
            git add 'src/routes/profile/listings.$id.tsx'
            echo '--- staged diff ---'
            git diff --cached --stat
            echo '--- commit ---'
            git commit -m "Integrate Listing Studio V2"
            commit_status=$?
            echo "commit_status=$commit_status"
            if [ "$commit_status" -eq 0 ]; then
              echo '--- push ---'
              git push origin HEAD:design/listing-studio-v1
              echo "push_status=$?"
            fi
          } > git-publish-diagnostic.log 2>&1
          cat git-publish-diagnostic.log
      - uses: actions/upload-artifact@v4
        with:
          name: listing-studio-v2-git-diagnostic
          path: git-publish-diagnostic.log
          retention-days: 1
