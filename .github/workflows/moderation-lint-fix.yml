name: Moderation Console Lint Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/moderation-console-final-integration' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/moderation-console-final-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix changed source files
        run: >-
          npx eslint --fix
          src/routes/admin.tsx
          src/routes/admin.pending.tsx
          src/routes/admin.listings.tsx
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/moderation-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx src/routes/admin.pending.tsx src/routes/admin.listings.tsx .github/workflows/moderation-lint-fix.yml
          if git diff --cached --quiet; then
            echo "No lint fixes needed."
            exit 0
          fi
          git commit -m "Fix moderation console lint issues"
          git push origin HEAD:feature/moderation-console-final-integration
