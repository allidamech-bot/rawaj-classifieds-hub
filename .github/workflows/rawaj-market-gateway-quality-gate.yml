name: RAWAJ Market Gateway Quality Gate

on:
  pull_request:
    paths:
      - "rawaj-market-gateway/**"
      - ".github/workflows/rawaj-market-gateway-quality-gate.yml"
  push:
    paths:
      - "rawaj-market-gateway/**"
      - ".github/workflows/rawaj-market-gateway-quality-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rawaj-market-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rawaj-market-gateway/package-lock.json
      - run: npm ci
      - run: npm run check
