name: Inspect Latest Saudi Finalization

on:
  pull_request:
    paths:
      - .github/workflows/inspect-saudi-finalize-latest.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: bd73d98522c093d2850c7a3c9653d2a17f85abe5
    steps:
      - name: Locate and wait
        shell: bash
        run: |
          set -euo pipefail
          for locate_attempt in $(seq 1 30); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/saudi-finalize-production.yml/runs?branch=main&event=push&per_page=20" > /tmp/runs.json
            run_id=$(node -e 'const p=require("/tmp/runs.json"); const t=(p.workflow_runs||[]).find(r=>r.head_sha===process.env.TARGET_SHA); if(t) process.stdout.write(String(t.id));')
            if [ -n "$run_id" ]; then break; fi
            echo "Waiting for Saudi production run to register: $locate_attempt"
            sleep 5
          done
          test -n "${run_id:-}"
          echo "Tracking Saudi run $run_id"
          for attempt in $(seq 1 120); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/run.json
            status=$(node -e 'const r=require("/tmp/run.json"); process.stdout.write(r.status)')
            conclusion=$(node -e 'const r=require("/tmp/run.json"); process.stdout.write(r.conclusion||"pending")')
            echo "Attempt $attempt: $status/$conclusion"
            if [ "$status" = completed ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > /tmp/jobs.json
              node -e 'const p=require("/tmp/jobs.json"); for(const j of p.jobs||[]){console.log(`Job ${j.id} ${j.name}: ${j.status}/${j.conclusion||"pending"}`); for(const s of j.steps||[]) console.log(`- ${s.name}: ${s.status}/${s.conclusion||"pending"}`)}'
              if [ "$conclusion" != success ]; then gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true; exit 1; fi
              exit 0
            fi
            sleep 15
          done
          exit 1
