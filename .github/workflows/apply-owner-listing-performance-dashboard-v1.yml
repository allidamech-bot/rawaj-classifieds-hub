name: Apply Owner Listing Performance Dashboard V1

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/apply-owner-listing-performance-dashboard-v1.yml"
      - "scripts/apply-owner-listing-performance-dashboard-v1.mjs"

permissions:
  contents: write

concurrency:
  group: apply-owner-listing-performance-dashboard-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply owner performance dashboard batch
        run: node scripts/apply-owner-listing-performance-dashboard-v1.mjs
      - name: Format changed files
        run: >-
          npx prettier --write
          src/lib/classifieds-types.ts
          src/lib/api/listings.ts
          cloudflare/worker/src/marketplace-private.ts
          src/routes/profile/listings.tsx
          e2e/rawaj-e2e-owner-listing-lifecycle-fixture.ts
          e2e/authenticated-owner-listing-lifecycle-journey.spec.ts
          scripts/owner-listing-performance-dashboard-v1.test.mjs
          package.json
      - name: Verify focused owner performance contract
        run: node --test scripts/owner-listing-performance-dashboard-v1.test.mjs
      - name: Lint changed TypeScript and tests
        run: >-
          npx eslint --quiet
          src/lib/classifieds-types.ts
          src/lib/api/listings.ts
          cloudflare/worker/src/marketplace-private.ts
          src/routes/profile/listings.tsx
          e2e/rawaj-e2e-owner-listing-lifecycle-fixture.ts
          e2e/authenticated-owner-listing-lifecycle-journey.spec.ts
          scripts/owner-listing-performance-dashboard-v1.test.mjs
      - name: Typecheck application
        run: npm run typecheck
      - name: Typecheck Worker
        run: npx tsc -p cloudflare/worker/tsconfig.json --noEmit
      - name: Commit generated batch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No owner performance changes were produced."
            exit 0
          fi
          git commit -m "feat(listing): add owner performance dashboard"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
