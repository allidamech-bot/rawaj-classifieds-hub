name: Temporary draft idempotency formatter

on:
  push:
    branches:
      - feature/idempotent-owner-draft-creation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/idempotent-owner-draft-creation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format idempotent draft files
        run: |
          npx prettier --write \
            .github/workflows/quality-gate.yml \
            docs/production-schema/migration-ledger.json \
            scripts/listing-draft-create-guard.test.mjs \
            src/lib/api/listing-draft-create-guarded.ts \
            src/lib/api/listing-draft-create-rpc.ts \
            src/lib/api/listing-draft-creation-flow.ts \
            src/lib/api/listing-owner-write-guarded.ts \
            src/lib/classifieds-api.ts
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/quality-gate.yml \
            docs/production-schema/migration-ledger.json \
            scripts/listing-draft-create-guard.test.mjs \
            src/lib/api/listing-draft-create-guarded.ts \
            src/lib/api/listing-draft-create-rpc.ts \
            src/lib/api/listing-draft-creation-flow.ts \
            src/lib/api/listing-owner-write-guarded.ts \
            src/lib/classifieds-api.ts
          git commit -m "Format idempotent draft creation files"
          git push origin HEAD:feature/idempotent-owner-draft-creation
