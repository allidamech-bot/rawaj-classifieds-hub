name: Apply Structured Price Offers UI Once

on:
  push:
    branches:
      - feature/structured-listing-price-offers-v1
    paths:
      - .github/workflows/apply-structured-price-offers-ui-once.yml

permissions:
  contents: write

concurrency:
  group: structured-price-offers-ui-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/structured-listing-price-offers-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply UI and contract integration
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker missing in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'cloudflare/worker/src/listing-offers.ts',
              '''  return result.success
            ? json(
                { data: { items: (result.results ?? []).map((row) => mapOffer(row, auth.userId)) } },
                200,
                cors,
              )
            : databaseError(cors);''',
              '''  return result.success
            ? json(
                {
                  data: {
                    items: (result.results ?? []).map((row) => mapOffer(row, auth.userId)),
                    role: conversation.buyer_id === auth.userId ? "buyer" : "seller",
                    listingAvailable:
                      conversation.status === "active" &&
                      conversation.listing_status === "approved" &&
                      !conversation.archived_at,
                  },
                },
                200,
                cors,
              )
            : databaseError(cors);''',
          )

          replace_once(
              'src/routes/chats.tsx',
              '''import { ChatAttachmentImage } from "@/features/communication/ChatAttachmentImage";
          import { ChatVoiceAttachment } from "@/features/communication/ChatVoiceAttachment";''',
              '''import { ChatAttachmentImage } from "@/features/communication/ChatAttachmentImage";
          import { ConversationPriceOffers } from "@/features/communication/ConversationPriceOffers";
          import { ChatVoiceAttachment } from "@/features/communication/ChatVoiceAttachment";''',
          )
          replace_once(
              'src/routes/chats.tsx',
              '''                </header>

                          <div className="rawaj-message-stream">''',
              '''                </header>

                          <ConversationPriceOffers
                            conversationId={selectedConversation.id}
                            enabled={
                              selectedConversation.status === "active" &&
                              Boolean(selectedConversation.listingId)
                            }
                          />

                          <div className="rawaj-message-stream">''',
          )

          replace_once(
              'src/features/communication/ConversationPriceOffers.tsx',
              '''              busy={Boolean(busyAction)}
                        busyAction={busyAction}
                        counterInput={counterInput}''',
              '''              busy={Boolean(busyAction)}
                        busyAction={busyAction}
                        enabled={enabled}
                        listingAvailable={snapshot?.listingAvailable === true}
                        counterInput={counterInput}''',
          )
          replace_once(
              'src/features/communication/ConversationPriceOffers.tsx',
              '''  busyAction,
            counterInput,
            setCounterInput,
            onTransition,''',
              '''  busyAction,
            enabled,
            listingAvailable,
            counterInput,
            setCounterInput,
            onTransition,''',
          )
          replace_once(
              'src/features/communication/ConversationPriceOffers.tsx',
              '''  busyAction: string | null;
            counterInput: string;''',
              '''  busyAction: string | null;
            enabled: boolean;
            listingAvailable: boolean;
            counterInput: string;''',
          )
          replace_once(
              'src/features/communication/ConversationPriceOffers.tsx',
              '''      {isPending && offer.createdByMe ? (''',
              '''      {isPending && offer.createdByMe && enabled ? (''',
          )
          replace_once(
              'src/features/communication/ConversationPriceOffers.tsx',
              '''      {isPending && !offer.createdByMe ? (''',
              '''      {isPending && !offer.createdByMe && enabled ? (''',
          )
          replace_once(
              'src/features/communication/ConversationPriceOffers.tsx',
              '''              disabled={busy}
                        onClick={() => void onTransition(offer, "accept")}''',
              '''              disabled={busy || !listingAvailable}
                        onClick={() => void onTransition(offer, "accept")}''',
          )
          replace_once(
              'src/features/communication/ConversationPriceOffers.tsx',
              '''              value={counterInput}
                        onChange={(event) => setCounterInput(event.target.value)}''',
              '''              value={counterInput}
                        disabled={busy || !listingAvailable}
                        onChange={(event) => setCounterInput(event.target.value)}''',
          )
          replace_once(
              'src/features/communication/ConversationPriceOffers.tsx',
              '''              disabled={busy}
                        onClick={() => void onTransition(offer, "counter")}''',
              '''              disabled={busy || !listingAvailable}
                        onClick={() => void onTransition(offer, "counter")}''',
          )

          test_path = Path('scripts/structured-listing-price-offers-v1.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          old_head = '''const [migration, handler, entry, packageJson] = await Promise.all([
            readFile("cloudflare/d1/migrations/0019_structured_listing_price_offers.sql", "utf8"),
            readFile("cloudflare/worker/src/listing-offers.ts", "utf8"),
            readFile("cloudflare/worker/src/entry.ts", "utf8"),
            readFile("package.json", "utf8"),
          ]);'''
          new_head = '''const [migration, handler, entry, api, component, chats, barrel, packageJson] =
            await Promise.all([
              readFile("cloudflare/d1/migrations/0019_structured_listing_price_offers.sql", "utf8"),
              readFile("cloudflare/worker/src/listing-offers.ts", "utf8"),
              readFile("cloudflare/worker/src/entry.ts", "utf8"),
              readFile("src/lib/api/listing-price-offers.ts", "utf8"),
              readFile("src/features/communication/ConversationPriceOffers.tsx", "utf8"),
              readFile("src/routes/chats.tsx", "utf8"),
              readFile("src/lib/classifieds-api.ts", "utf8"),
              readFile("package.json", "utf8"),
            ]);'''
          if old_head not in test_text:
              raise SystemExit('test promise marker missing')
          test_text = test_text.replace(old_head, new_head, 1)

          old_notifications = '''test("offer lifecycle creates actionable conversation notifications", () => {
            for (const event of [
              "offer.received",
              "offer.countered",
              "offer.accepted",
              "offer.rejected",
              "offer.withdrawn",
            ]) {
              assert.match(handler, new RegExp(event.replace(".", "\\\\.")));
            }
            assert.match(handler, /targetType: "conversation"/);
            assert.match(handler, /offerId:/);
            assert.match(handler, /amount:/);
          });'''
          new_notifications = '''test("offer lifecycle creates actionable conversation notifications", () => {
            assert.match(handler, /offer\\.received/);
            assert.match(handler, /offer\\.countered/);
            assert.match(handler, /`offer\\.\\$\\{nextStatus\\}`/);
            for (const status of ["accepted", "rejected", "withdrawn"]) {
              assert.match(handler, new RegExp(`action === "${status === "accepted" ? "accept" : status === "rejected" ? "reject" : "withdraw"}"`));
            }
            assert.match(handler, /targetType: "conversation"/);
            assert.match(handler, /offerId:/);
            assert.match(handler, /amount:/);
          });'''
          if old_notifications not in test_text:
              raise SystemExit('notification test marker missing')
          test_text = test_text.replace(old_notifications, new_notifications, 1)

          insert_marker = '''test("focused contract is permanently included in precheck", () => {'''
          frontend_test = '''test("typed client and chat UI expose the structured offer journey", () => {
            assert.match(api, /fetchConversationPriceOffers/);
            assert.match(api, /createConversationPriceOffer/);
            assert.match(api, /transitionListingPriceOffer/);
            assert.match(api, /expectedUpdatedAt/);
            assert.match(api, /\\/v1\\/conversations\\/\\$\\{encodeURIComponent\\(conversationId\\)\\}\\/offers/);
            assert.match(component, /data-price-offer-panel="true"/);
            for (const action of ["create", "accept", "reject", "counter", "withdraw"]) {
              assert.match(component, new RegExp(`data-price-offer-action="${action}"`));
            }
            assert.match(component, /does not automatically mark the listing sold/);
            assert.match(component, /listingAvailable/);
            assert.match(component, /enabled/);
            assert.match(chats, /ConversationPriceOffers/);
            assert.match(chats, /selectedConversation\\.status === "active"/);
            assert.match(barrel, /api\\/listing-price-offers/);
            assert.match(handler, /role: conversation\\.buyer_id === auth\\.userId/);
            assert.match(handler, /listingAvailable:/);
          });

          '''
          if insert_marker not in test_text:
              raise SystemExit('frontend test insertion marker missing')
          test_text = test_text.replace(insert_marker, frontend_test + insert_marker, 1)
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: npx prettier --write cloudflare/worker/src/listing-offers.ts src/routes/chats.tsx src/features/communication/ConversationPriceOffers.tsx scripts/structured-listing-price-offers-v1.test.mjs

      - name: Validate focused integration
        run: |
          npm run test:listing-price-offers
          npm run typecheck
          npx tsc -p cloudflare/worker/tsconfig.json --noEmit
          npm run build

      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-structured-price-offers-ui-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker/src/listing-offers.ts \
            src/routes/chats.tsx \
            src/features/communication/ConversationPriceOffers.tsx \
            scripts/structured-listing-price-offers-v1.test.mjs
          git commit -m "feat(offers): integrate structured offers into conversations"
          git push origin HEAD:feature/structured-listing-price-offers-v1
