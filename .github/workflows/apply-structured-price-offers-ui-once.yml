name: Apply Structured Price Offers UI Once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-structured-price-offers-ui-once.yml
      - scripts/apply-structured-price-offers-ui-once.py

permissions:
  contents: write

concurrency:
  group: structured-price-offers-ui-once
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/structured-listing-price-offers-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/structured-listing-price-offers-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply UI and contract integration
        run: python scripts/apply-structured-price-offers-ui-once.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: npx prettier --write cloudflare/worker/src/listing-offers.ts src/routes/chats.tsx src/features/communication/ConversationPriceOffers.tsx scripts/structured-listing-price-offers-v1.test.mjs

      - name: Validate focused integration
        run: |
          npm run test:listing-price-offers
          npm run typecheck
          npx tsc -p cloudflare/worker/tsconfig.json --noEmit
          npm run build

      - name: Commit integration and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-structured-price-offers-ui-once.yml
          git rm scripts/apply-structured-price-offers-ui-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker/src/listing-offers.ts \
            src/routes/chats.tsx \
            src/features/communication/ConversationPriceOffers.tsx \
            scripts/structured-listing-price-offers-v1.test.mjs
          git commit -m "feat(offers): integrate structured offers into conversations"
          git push origin HEAD:feature/structured-listing-price-offers-v1
