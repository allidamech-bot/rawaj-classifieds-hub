name: Search Results Taxonomy Integrity Contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run contract
        run: node --test scripts/search-results-taxonomy-integrity.test.mjs
