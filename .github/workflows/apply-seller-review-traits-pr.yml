name: Apply seller review traits on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/seller-review-traits' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/seller-review-traits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract and apply guarded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-seller-review-traits.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script_lines = source[start:end]
          nonempty = [line for line in script_lines if line.strip()]
          indent = min(len(line) - len(line.lstrip()) for line in nonempty)
          script = '\n'.join(line[indent:] if line.strip() else '' for line in script_lines) + '\n'
          Path('/tmp/apply-seller-review-traits.py').write_text(script)
          PY
          python /tmp/apply-seller-review-traits.py

      - name: Format changed sources
        run: npx prettier --write src/lib/classifieds-types.ts src/lib/api/reviews.ts src/features/reviews/SellerReviewCard.tsx 'src/routes/seller.$id.tsx' package.json scripts/seller-review-traits.test.mjs .github/workflows/quality-gate.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/classifieds-types.ts src/lib/api/reviews.ts src/features/reviews/SellerReviewCard.tsx 'src/routes/seller.$id.tsx' package.json scripts/seller-review-traits.test.mjs .github/workflows/quality-gate.yml
          git commit -m "Implement seller review quick traits"
          git push origin HEAD:feature/seller-review-traits
