name: Format Production Acceptance Once

on:
  push:
    branches:
      - agent/production-auth-acceptance
    paths:
      - ".github/workflows/format-production-acceptance-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-auth-acceptance
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply project lint fixes
        run: npx eslint --fix e2e/production-acceptance.spec.ts scripts/production-acceptance-contract.test.mjs

      - name: Remove one-time workflow
        run: rm .github/workflows/format-production-acceptance-once.yml

      - name: Commit formatted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/production-acceptance.spec.ts scripts/production-acceptance-contract.test.mjs .github/workflows/format-production-acceptance-once.yml
          git commit -m "Format production acceptance files"
          git push origin HEAD:agent/production-auth-acceptance
