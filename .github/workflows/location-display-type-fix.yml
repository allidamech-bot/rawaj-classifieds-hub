name: Location display type fix

on:
  push:
    branches:
      - location-ux-display

permissions:
  contents: write

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message, '[skip type fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-ux-display
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fix-location-display-types.mjs
      - run: npx prettier --write src/lib/classifieds-types.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/classifieds-types.ts
          git commit -m "Preserve ClassifiedListing location compatibility [skip type fix]"
          git push origin HEAD:location-ux-display
