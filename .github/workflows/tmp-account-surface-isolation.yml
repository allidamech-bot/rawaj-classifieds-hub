name: Temporary Account Surface Isolation Patcher

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/tmp-apply-account-surface-isolation.mjs"
      - ".github/workflows/tmp-account-surface-isolation.yml"
  push:
    branches:
      - audit/account-surface-stale-data-isolation
    paths:
      - "scripts/tmp-apply-account-surface-isolation.mjs"
      - ".github/workflows/tmp-account-surface-isolation.yml"

concurrency:
  group: temporary-account-surface-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'audit/account-surface-stale-data-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/account-surface-stale-data-isolation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply, format, and validate
        id: apply
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/tmp-apply-account-surface-isolation.mjs")
          lines = path.read_text(encoding="utf-8").splitlines()
          replacement = r'''  source = replaceExact(source, `<SellerReviewCard key={review.id} review={review} canManageResponse={isOwnProfile} />`, '<SellerReviewCard\n                key={`${profileId ?? "signed-out"}:${review.id}`}\n                review={review}\n                canManageResponse={isOwnProfile}\n              />', "seller review account key");'''
          matches = [index for index, line in enumerate(lines) if "seller review account key" in line]
          if len(matches) != 1:
              raise SystemExit(f"Expected one seller review account key line, found {len(matches)}")
          lines[matches[0]] = replacement
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          : > tmp-account-surface-isolation.log
          node scripts/tmp-apply-account-surface-isolation.mjs >> tmp-account-surface-isolation.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npx prettier --write \
              src/routes/favorites.tsx \
              src/routes/saved-searches.tsx \
              src/routes/profile/listings.tsx \
              src/features/reviews/SellerReviewCard.tsx \
              'src/routes/seller.$id.tsx' \
              src/routes/profile.tsx \
              scripts/account-surface-action-isolation.test.mjs \
              package.json >> tmp-account-surface-isolation.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run test:activity-center >> tmp-account-surface-isolation.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run typecheck >> tmp-account-surface-isolation.log 2>&1
            status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit implementation
        if: steps.apply.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tmp-account-surface-isolation-diagnostic.txt
          git add \
            src/routes/favorites.tsx \
            src/routes/saved-searches.tsx \
            src/routes/profile/listings.tsx \
            src/features/reviews/SellerReviewCard.tsx \
            'src/routes/seller.$id.tsx' \
            src/routes/profile.tsx \
            scripts/account-surface-action-isolation.test.mjs \
            package.json \
            tmp-account-surface-isolation-diagnostic.txt
          git commit -m "fix: isolate account surface actions"
          git push origin HEAD:audit/account-surface-stale-data-isolation

      - name: Persist diagnostic text
        if: steps.apply.outputs.status != '0'
        run: |
          cat tmp-account-surface-isolation.log
          cp tmp-account-surface-isolation.log tmp-account-surface-isolation-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-account-surface-isolation-diagnostic.txt
          git commit -m "diagnostic: capture account isolation patch failure"
          git push origin HEAD:audit/account-surface-stale-data-isolation

      - name: Fail diagnostic run
        if: steps.apply.outputs.status != '0'
        run: exit 1
