name: Temporary Account Surface Isolation Patcher

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/tmp-apply-account-surface-isolation.mjs"
      - ".github/workflows/tmp-account-surface-isolation.yml"
  push:
    branches:
      - audit/account-surface-stale-data-isolation
    paths:
      - "scripts/tmp-apply-account-surface-isolation.mjs"
      - ".github/workflows/tmp-account-surface-isolation.yml"

concurrency:
  group: temporary-account-surface-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'audit/account-surface-stale-data-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/account-surface-stale-data-isolation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply, format, and validate
        id: apply
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/tmp-apply-account-surface-isolation.mjs")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()

          seller_replacement = r'''  source = replaceExact(source, `<SellerReviewCard key={review.id} review={review} canManageResponse={isOwnProfile} />`, '<SellerReviewCard\n                key={`${profileId ?? "signed-out"}:${review.id}`}\n                review={review}\n                canManageResponse={isOwnProfile}\n              />', "seller review account key");'''
          seller_matches = [index for index, line in enumerate(lines) if "seller review account key" in line]
          if len(seller_matches) != 1:
              raise SystemExit(
                  f"Expected one seller review account key line, found {len(seller_matches)}"
              )
          lines[seller_matches[0]] = seller_replacement

          local_key_matches = [index for index, line in enumerate(lines) if "local saved search key" in line]
          server_key_matches = [index for index, line in enumerate(lines) if "server saved search key" in line]
          if len(local_key_matches) != 1 or len(server_key_matches) != 1:
              raise SystemExit(
                  "Expected one local and one server saved-search key patch line"
              )
          saved_key_replacement = r'''  source = replaceCount(source, "key={item.id}\n                    id={item.id}", "key={`${profileId ?? \"signed-out\"}:${item.id}`}\n                    id={item.id}", 2, "saved search account keys");'''
          local_key_index = local_key_matches[0]
          server_key_index = server_key_matches[0]
          lines[local_key_index] = saved_key_replacement
          lines.pop(server_key_index)

          text = "\n".join(lines) + "\n"
          assertion_start_marker = "  assert.match(ownerListings, /key="
          assertion_end_marker = ");\\n"
          assertion_start = text.find(assertion_start_marker)
          if assertion_start < 0:
              raise SystemExit("Owner listing key assertion start was not found")
          assertion_end = text.find(assertion_end_marker, assertion_start)
          if assertion_end < 0:
              raise SystemExit("Owner listing key assertion end was not found")
          assertion_end += len(assertion_end_marker)
          assertion_replacement = (
              r'  assert.match(ownerListings, /profileId \?\? "signed-out".*listing\.id/);\n'
          )
          text = text[:assertion_start] + assertion_replacement + text[assertion_end:]
          path.write_text(text, encoding="utf-8")
          PY

          : > tmp-account-surface-isolation.log
          node scripts/tmp-apply-account-surface-isolation.mjs >> tmp-account-surface-isolation.log 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            python - <<'PY' >> tmp-account-surface-isolation.log 2>&1
          from pathlib import Path

          saved_search_test = Path("scripts/saved-search-background-alerts.test.mjs")
          saved_search_source = saved_search_test.read_text(encoding="utf-8")
          old_saved_search_assertion = (
              r"  assert.match(routeSource, /currentProfileId !== auth\.profile\?\.id/);"
          )
          new_saved_search_assertion = (
              r"  assert.match(routeSource, /currentProfileId !== profileIdRef\.current/);"
          )
          if saved_search_source.count(old_saved_search_assertion) != 1:
              raise SystemExit("Expected one legacy saved-search stale-account assertion")
          saved_search_test.write_text(
              saved_search_source.replace(
                  old_saved_search_assertion,
                  new_saved_search_assertion,
              ),
              encoding="utf-8",
          )

          account_surface_test = Path("scripts/account-surface-action-isolation.test.mjs")
          account_surface_lines = account_surface_test.read_text(encoding="utf-8").splitlines()
          key_assertion_matches = [
              index
              for index, line in enumerate(account_surface_lines)
              if "assert.match(ownerListings" in line and "signed-out" in line
          ]
          if len(key_assertion_matches) != 1:
              raise SystemExit(
                  f"Expected one owner-listing key assertion, found {len(key_assertion_matches)}"
              )
          account_surface_lines[key_assertion_matches[0]] = (
              "  assert.ok("
              "ownerListings.includes('key={`${profileId ?? \"signed-out\"}:${listing.id}`}')"
              ");"
          )
          account_surface_test.write_text(
              "\n".join(account_surface_lines) + "\n",
              encoding="utf-8",
          )
          PY
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            npx prettier --write \
              src/routes/favorites.tsx \
              src/routes/saved-searches.tsx \
              src/routes/profile/listings.tsx \
              src/features/reviews/SellerReviewCard.tsx \
              'src/routes/seller.$id.tsx' \
              src/routes/profile.tsx \
              scripts/account-surface-action-isolation.test.mjs \
              scripts/saved-search-background-alerts.test.mjs \
              package.json >> tmp-account-surface-isolation.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run test:activity-center >> tmp-account-surface-isolation.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run typecheck >> tmp-account-surface-isolation.log 2>&1
            status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit implementation
        if: steps.apply.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tmp-account-surface-isolation-diagnostic.txt
          git add \
            src/routes/favorites.tsx \
            src/routes/saved-searches.tsx \
            src/routes/profile/listings.tsx \
            src/features/reviews/SellerReviewCard.tsx \
            'src/routes/seller.$id.tsx' \
            src/routes/profile.tsx \
            scripts/account-surface-action-isolation.test.mjs \
            scripts/saved-search-background-alerts.test.mjs \
            package.json \
            tmp-account-surface-isolation-diagnostic.txt
          git commit -m "fix: isolate account surface actions"
          git push origin HEAD:audit/account-surface-stale-data-isolation

      - name: Persist diagnostic text
        if: steps.apply.outputs.status != '0'
        run: |
          cat tmp-account-surface-isolation.log
          cp tmp-account-surface-isolation.log tmp-account-surface-isolation-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-account-surface-isolation-diagnostic.txt
          git commit -m "diagnostic: capture account isolation patch failure"
          git push origin HEAD:audit/account-surface-stale-data-isolation

      - name: Fail diagnostic run
        if: steps.apply.outputs.status != '0'
        run: exit 1
