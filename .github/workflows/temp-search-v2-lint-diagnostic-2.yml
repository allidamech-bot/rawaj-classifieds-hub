name: Temporary Search V2 Lint Diagnostic 2

on:
  push:
    branches:
      - design/search-filters-v2
    paths:
      - .github/workflows/temp-search-v2-lint-diagnostic-2.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/search-filters-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture current lint output
        run: |
          npx eslint --quiet src/features/search/SearchResultsToolbar.tsx scripts/search-filters-v2.test.mjs src/routes/__root.tsx > search-v2-lint-current.txt 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-v2-lint-current.txt
          git commit -m "Capture current Search V2 lint diagnostic"
          git push origin HEAD:design/search-filters-v2
