name: Materialize SYP Denomination Phase A

on:
  pull_request:
    types: [synchronize]
    branches:
      - main
    paths:
      - ".github/workflows/apply-syp-denomination-phase-a.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch agent/syp-denomination-phase-a \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Reconstruct patch payload
        working-directory: repo
        run: |
          cat scripts/.apply-syp-phase-a.prefix.b64 scripts/.apply-syp-phase-a.mjs.gz.b64 \
            | base64 -d \
            | gunzip > /tmp/apply-syp-phase-a.mjs

      - name: Apply complete Phase A patch
        working-directory: repo
        run: |
          python scripts/.syp-phase-a-preflight.py >/tmp/phase-a-apply.log 2>&1
          python scripts/.syp-phase-a-contract-adjust.py >>/tmp/phase-a-apply.log 2>&1
          python scripts/.syp-phase-a-typescript-adjust.py >>/tmp/phase-a-apply.log 2>&1
          tail -n 5 /tmp/phase-a-apply.log

      - name: Install dependencies
        working-directory: repo
        run: npm ci --silent

      - name: Format implementation
        working-directory: repo
        run: |
          npx prettier --write \
            src/lib/syp-denomination.ts \
            src/features/listings/SypPriceDisplay.tsx \
            src/lib/api/syp-denomination.ts \
            src/lib/classifieds-types.ts \
            src/lib/api/public-fields.ts \
            src/lib/api/listings.ts \
            src/lib/api/listing-draft-create-rpc.ts \
            src/lib/api/listing-write-rpc.ts \
            src/lib/api/reports.ts \
            src/lib/classifieds-api.ts \
            src/features/listings/cards/ListingCardShared.tsx \
            src/routes/add-listing.tsx \
            scripts/syp-denomination-phase-a.test.mjs \
            docs/syp-denomination-phase-a.md >/dev/null

      - name: Verify implementation
        working-directory: repo
        run: |
          node --test scripts/syp-denomination-phase-a.test.mjs
          npm run typecheck
          git diff --check

      - name: Remove one-shot machinery
        working-directory: repo
        run: |
          rm -f .github/workflows/apply-syp-denomination-phase-a.yml
          rm -f scripts/.apply-syp-phase-a.prefix.b64
          rm -f scripts/.apply-syp-phase-a.mjs.gz.b64
          rm -f scripts/.syp-phase-a-preflight.py
          rm -f scripts/.syp-phase-a-contract-adjust.py
          rm -f scripts/.syp-phase-a-typescript-adjust.py

      - name: Commit generated implementation
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add SYP denomination Phase A foundation"
          git push origin HEAD:agent/syp-denomination-phase-a
