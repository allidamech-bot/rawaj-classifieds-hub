name: Apply SYP Denomination Phase A

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "scripts/.apply-syp-phase-a.prefix.b64"
      - "scripts/.apply-syp-phase-a.mjs.gz.b64"
      - "scripts/.syp-phase-a-preflight.py"
      - "scripts/.syp-phase-a-contract-adjust.py"
      - ".github/workflows/apply-syp-denomination-phase-a.yml"

permissions:
  contents: read

jobs:
  phase-a-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Clone feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch agent/syp-denomination-phase-a \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Reconstruct patch payload
        working-directory: repo
        run: |
          cat scripts/.apply-syp-phase-a.prefix.b64 scripts/.apply-syp-phase-a.mjs.gz.b64 \
            | base64 -d \
            | gunzip > /tmp/apply-syp-phase-a.mjs

      - name: Apply complete Phase A preflight patch
        working-directory: repo
        run: |
          python scripts/.syp-phase-a-preflight.py >/tmp/phase-a-apply.log 2>&1
          python scripts/.syp-phase-a-contract-adjust.py >>/tmp/phase-a-apply.log 2>&1
          tail -n 4 /tmp/phase-a-apply.log

      - name: Install dependencies
        working-directory: repo
        run: npm ci --silent

      - name: Format generated implementation
        working-directory: repo
        run: |
          npx prettier --write \
            src/lib/syp-denomination.ts \
            src/features/listings/SypPriceDisplay.tsx \
            src/lib/api/syp-denomination.ts \
            src/lib/classifieds-types.ts \
            src/lib/api/public-fields.ts \
            src/lib/api/listings.ts \
            src/lib/api/listing-draft-create-rpc.ts \
            src/lib/api/listing-write-rpc.ts \
            src/lib/classifieds-api.ts \
            src/features/listings/cards/ListingCardShared.tsx \
            src/routes/add-listing.tsx \
            scripts/syp-denomination-phase-a.test.mjs \
            docs/syp-denomination-phase-a.md >/dev/null
          echo "Prettier completed."

      - name: Run Phase A contract tests
        working-directory: repo
        run: |
          set +e
          node --test scripts/syp-denomination-phase-a.test.mjs >/tmp/contracts.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/contracts.log
            exit "$status"
          fi
          echo "All Phase A contracts passed."

      - name: Run TypeScript
        working-directory: repo
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/typecheck.log
            exit "$status"
          fi
          echo "TypeScript passed."

      - name: Check generated diff
        working-directory: repo
        run: git diff --check
