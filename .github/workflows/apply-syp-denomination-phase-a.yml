name: Apply SYP Denomination Phase A

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "scripts/.apply-syp-phase-a.prefix.b64"
      - "scripts/.apply-syp-phase-a.mjs.gz.b64"
      - ".github/workflows/apply-syp-denomination-phase-a.yml"

permissions:
  contents: read

jobs:
  apply-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Run deterministic patch preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch agent/syp-denomination-phase-a \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          cat scripts/.apply-syp-phase-a.prefix.b64 scripts/.apply-syp-phase-a.mjs.gz.b64 \
            | base64 -d \
            | gunzip > /tmp/apply-syp-phase-a.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-syp-phase-a.mjs')
          source = path.read_text()

          cursor_old = 'replaceExact("src/lib/api/listings.ts", "              ? { price: listings[safePageSize - 1].price }", "              ? { price: listings[safePageSize - 1].priceNewSypNormalized }", 1);'
          cursor_new = 'replaceExact("src/lib/api/listings.ts", "? { price: listings[safePageSize - 1].price }", "? { price: listings[safePageSize - 1].priceNewSypNormalized }", 1);'
          write_old = 'replaceExact("src/lib/api/listing-write-rpc.ts", "  if (payload.price !== undefined) patch.price = payload.price;\\n  if (payload.priceType !== undefined) patch.price_type = payload.priceType;", "  if (payload.price !== undefined) patch.price = payload.price;\\n  if (payload.priceDenomination !== undefined) {\\n    patch.price_denomination = payload.priceDenomination;\\n  }\\n  if (payload.priceType !== undefined) patch.price_type = payload.priceType;", 1);'
          write_new = 'replaceExact("src/lib/api/listing-write-rpc.ts", "  if (payload.price !== undefined) patch.price = payload.price;\\n  if (payload.priceType) patch.price_type = payload.priceType;", "  if (payload.price !== undefined) patch.price = payload.price;\\n  if (payload.priceDenomination !== undefined) {\\n    patch.price_denomination = payload.priceDenomination;\\n  }\\n  if (payload.priceType) patch.price_type = payload.priceType;", 1);'
          export_old = 'replaceExact("src/lib/classifieds-api.ts", "export * from \\\"@/lib/api/listing-write-rpc\\\";", "export * from \\\"@/lib/api/listing-write-rpc\\\";\\nexport * from \\\"@/lib/api/syp-denomination\\\";", 1);'
          export_new = 'replaceExact("src/lib/classifieds-api.ts", "export * from \\\"@/lib/api/listings\\\";", "export * from \\\"@/lib/api/listings\\\";\\nexport * from \\\"@/lib/api/syp-denomination\\\";", 1);'
          assertion_old = '  if (occurrences !== expected) throw new Error(`${path}: expected ${expected} exact matches, found ${occurrences}`);'
          assertion_new = '''  if (occurrences !== expected) {
            console.error(`MISMATCH ${path}: expected ${expected} exact matches, found ${occurrences}; anchor=${JSON.stringify(oldText)}`);
            globalThis.__phaseAAnchorFailure = true;
            return;
          }'''

          for old, new, label in [
              (cursor_old, cursor_new, 'cursor'),
              (write_old, write_new, 'listing-write'),
              (export_old, export_new, 'classifieds export'),
              (assertion_old, assertion_new, 'assertion collector'),
          ]:
              if old not in source:
                  raise SystemExit(f'{label} hotfix anchor missing')
              source = source.replace(old, new, 1)

          source += '\nif (globalThis.__phaseAAnchorFailure) process.exit(2);\n'
          path.write_text(source)
          PY
          node /tmp/apply-syp-phase-a.mjs
