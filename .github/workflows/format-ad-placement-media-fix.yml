name: Format ad placement media fix

on:
  push:
    branches:
      - fix/ad-placement-media-contract-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ad-placement-media-contract-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/api/storage.ts src/lib/api/ad-placements.ts docs/production-schema/migration-ledger.json
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/storage.ts src/lib/api/ad-placements.ts docs/production-schema/migration-ledger.json
          git commit -m "Format ad placement media contract"
          git push origin HEAD:fix/ad-placement-media-contract-v2
