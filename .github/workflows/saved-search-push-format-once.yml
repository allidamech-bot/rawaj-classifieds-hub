name: Saved Search Push Format Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/saved-search-push-format-once.yml"

permissions:
  contents: write

concurrency:
  group: saved-search-push-format-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Capacitor push plugin
        run: npm install @capacitor/push-notifications@^8.0.0 --save

      - name: Apply integration patches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["scripts"]["test:saved-search-push"] = "node --test scripts/saved-search-push-v1.test.mjs"
          check = package["scripts"]["check"]
          marker = "npm run test:retention-discovery &&"
          if "npm run test:saved-search-push" not in check:
              check = check.replace(marker, f"{marker} npm run test:saved-search-push &&", 1)
          package["scripts"]["check"] = check
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          ledger_path = Path("docs/production-schema/migration-ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          migrations = ledger["classifications"]["canonical"]
          migration_name = "202607150002_saved_search_alerts_push_v1.sql"
          if migration_name not in migrations:
              migrations.append(migration_name)
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_once(
              ".github/workflows/quality-gate.yml",
              "      - name: Retention and Discovery V1 contract\n        run: npm run test:retention-discovery\n\n",
              "      - name: Retention and Discovery V1 contract\n        run: npm run test:retention-discovery\n\n      - name: Saved Search Alerts and Push V1 contract\n        run: npm run test:saved-search-push\n\n",
          )

          replace_once(
              "src/routes/notifications.tsx",
              "      } else if (target.kind === \"seller\") {\n        void navigate({ to: \"/seller/$id\", params: { id: target.sellerId } });\n      } else if (target.kind === \"browse_listings\") {",
              "      } else if (target.kind === \"seller\") {\n        void navigate({ to: \"/seller/$id\", params: { id: target.sellerId } });\n      } else if (target.kind === \"saved_search\") {\n        void navigate({ to: \"/saved-searches\" });\n      } else if (target.kind === \"browse_listings\") {",
          )
          replace_once(
              "src/routes/notifications.tsx",
              "    (target === \"listing\" || target === \"conversation\" || target === \"seller\"),",
              "    (target === \"listing\" ||\n      target === \"conversation\" ||\n      target === \"seller\" ||\n      target === \"saved_search\"),",
          )

          replace_once(
              "src/routes/more.tsx",
              'import { TrustHubHero, TrustSectionHeader } from "@/features/trust/TrustSupportExperience";\n',
              'import { TrustHubHero, TrustSectionHeader } from "@/features/trust/TrustSupportExperience";\nimport { disableNativePush } from "@/lib/native-push";\n',
          )
          replace_once(
              "src/routes/more.tsx",
              "    try {\n      const result = await auth.signOut();",
              "    try {\n      if (auth.profile?.id) {\n        await disableNativePush(auth.profile.id, false).catch(() => undefined);\n      }\n      const result = await auth.signOut();",
          )

          replace_once(
              "src/routes/saved-searches.tsx",
              "أنشئ بحثاً باسم واضح واضبط تكرار تنبيه حقيقي داخل رواج. يتم الفحص بشكل محدود عند استخدامك لرواج، مع منع تكرار نفس الإعلان.",
              "أنشئ بحثاً باسم واضح واضبط تكرار التنبيه. يطابق الخادم الإعلانات الجديدة عند اعتمادها ويجمع النتائج دون تكرار.",
          )
          replace_once(
              "src/routes/saved-searches.tsx",
              "Create a clearly named search and set a real in-app alert cadence. RAWAJ runs bounded checks while you use the app and deduplicates the same listing.",
              "Create a clearly named search and choose an alert cadence. The server matches newly approved listings and aggregates results without duplicates.",
          )

          Path("capacitor.config.ts").write_text(
              '''/// <reference types="@capacitor/push-notifications" />\n\nimport type { CapacitorConfig } from "@capacitor/cli";\n\nconst config: CapacitorConfig = {\n  appId: "com.rawaj.marketplace",\n  appName: "RAWAJ",\n  webDir: ".output/public",\n  server: {\n    url: "https://rawa-j.com",\n    cleartext: false,\n    allowNavigation: ["rawa-j.com", "*.rawa-j.com"],\n  },\n  plugins: {\n    PushNotifications: {\n      presentationOptions: ["sound", "alert"],\n    },\n  },\n};\n\nexport default config;\n''',
              encoding="utf-8",
          )

          native_path = Path("src/lib/native-push.ts")
          native = native_path.read_text(encoding="utf-8")
          native = native.replace(
              "    await ensureNativePushListeners(userId);\n    const tokenResult",
              "    if (capability.platform === \"android\") {\n      await PushNotifications.createChannel({\n        id: \"rawaj_activity\",\n        name: \"تنبيهات رواج\",\n        description: \"الرسائل ونتائج البحث وتحديثات الحساب\",\n        importance: 4,\n        vibration: true,\n      });\n    }\n\n    await ensureNativePushListeners(userId);\n    const tokenResult",
              1,
          )
          native = native.replace(
              "export async function disableNativePush(\n  userId: string | null,\n): Promise<ClassifiedsResult<boolean>> {\n  const deviceKey = getOrCreatePushDeviceKey();\n  const result = await disablePushDevice(userId, deviceKey, true);\n  if (result.ok) await clearNativePushListeners();\n  return result;\n}",
              "export async function disableNativePush(\n  userId: string | null,\n  disableChannel = true,\n): Promise<ClassifiedsResult<boolean>> {\n  const deviceKey = getOrCreatePushDeviceKey();\n  const result = await disablePushDevice(userId, deviceKey, disableChannel);\n  if (result.ok) {\n    try {\n      const { PushNotifications } = await import(\"@capacitor/push-notifications\");\n      await PushNotifications.unregister();\n    } catch {\n      // Database unlink remains authoritative when the native plugin is unavailable.\n    }\n    await clearNativePushListeners();\n  }\n  return result;\n}",
              1,
          )
          function_start = native.index("async function waitForRegistrationToken(")
          function_end = native.index("async function ensureNativePushListeners", function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit("Native registration function markers not found")
          replacement = '''async function waitForRegistrationToken(\n  PushNotifications: typeof import("@capacitor/push-notifications").PushNotifications,\n): Promise<ClassifiedsResult<string>> {\n  let registrationHandle: PluginListenerHandle | null = null;\n  let errorHandle: PluginListenerHandle | null = null;\n  let timeoutHandle: ReturnType<typeof setTimeout> | null = null;\n\n  return new Promise<ClassifiedsResult<string>>((resolve) => {\n    let finished = false;\n    const finish = (result: ClassifiedsResult<string>) => {\n      if (finished) return;\n      finished = true;\n      if (timeoutHandle) clearTimeout(timeoutHandle);\n      void registrationHandle?.remove();\n      void errorHandle?.remove();\n      resolve(result);\n    };\n\n    void (async () => {\n      registrationHandle = await PushNotifications.addListener("registration", (token) => {\n        const value = token.value?.trim();\n        if (!value) {\n          finish({\n            ok: false,\n            error: { code: "unknown", message: "لم يُرجع الهاتف رمز الإشعارات." },\n          });\n          return;\n        }\n        finish({ ok: true, data: value });\n      });\n\n      errorHandle = await PushNotifications.addListener("registrationError", (error) => {\n        finish({\n          ok: false,\n          error: {\n            code: "unknown",\n            message: "فشل تسجيل الهاتف للإشعارات الفورية.",\n            details: JSON.stringify(error),\n          },\n        });\n      });\n\n      timeoutHandle = setTimeout(() => {\n        finish({\n          ok: false,\n          error: { code: "unknown", message: "انتهت مهلة تسجيل الإشعارات على الهاتف." },\n        });\n      }, REGISTRATION_TIMEOUT_MS);\n\n      await PushNotifications.register();\n    })().catch((error) => {\n      finish({\n        ok: false,\n        error: {\n          code: "unknown",\n          message: "فشل بدء تسجيل الإشعارات الفورية.",\n          details: error instanceof Error ? error.message : String(error),\n        },\n      });\n    });\n  });\n}\n\n'''
          native = native[:function_start] + replacement + native[function_end:]
          native_path.write_text(native, encoding="utf-8")

          migration_path = Path("supabase/migrations/202607150002_saved_search_alerts_push_v1.sql")
          migration = migration_path.read_text(encoding="utf-8")
          migration = migration.replace(
              "      search.alert_frequency,\n      search.last_alert_checked_at,",
              "      search.alert_frequency,\n      search.created_at,\n      search.last_alert_checked_at,",
              1,
          )
          migration = migration.replace(
              "    group by search.id, search.name_ar, search.alert_frequency, search.last_alert_checked_at",
              "    group by search.id, search.name_ar, search.alert_frequency, search.created_at, search.last_alert_checked_at",
              1,
          )
          migration = migration.replace(
              "         (v_search.alert_frequency = 'daily' and v_search.last_alert_checked_at > v_now - interval '1 day')\n         or (v_search.alert_frequency = 'weekly' and v_search.last_alert_checked_at > v_now - interval '7 days')",
              "         (v_search.alert_frequency = 'daily' and coalesce(v_search.last_alert_checked_at, v_search.created_at) > v_now - interval '1 day')\n         or (v_search.alert_frequency = 'weekly' and coalesce(v_search.last_alert_checked_at, v_search.created_at) > v_now - interval '7 days')",
              1,
          )
          migration = migration.replace(
              "        'latest_listing_id', v_search.latest_listing_id\n      )",
              "        'latest_listing_id', v_search.latest_listing_id,\n        'title_en', 'New saved-search results',\n        'body_en', v_search.pending_count::text || ' new listings match \"' || v_search.name_ar || '\"'\n      )",
              1,
          )
          migration = migration.replace(
              "  notification_id uuid,\n  device_id uuid,",
              "  notification_id uuid,\n  notification_type text,\n  device_id uuid,",
              1,
          )
          migration = migration.replace(
              "    claimed.notification_id,\n    claimed.device_id,",
              "    claimed.notification_id,\n    notification.type,\n    claimed.device_id,",
              1,
          )
          migration_path.write_text(migration, encoding="utf-8")

          edge_path = Path("supabase/functions/send-push-notifications/index.ts")
          edge = edge_path.read_text(encoding="utf-8")
          edge = edge.replace(
              "  notification_id: string;\n  device_id: string;",
              "  notification_id: string;\n  notification_type: string;\n  device_id: string;",
              1,
          )
          edge = edge.replace(
              '              body: delivery.body_ar || "لديك تحديث جديد في رواج",',
              "              body: safePushBody(delivery),",
              1,
          )
          marker = "function isPermanentTokenError(status: number, body: string): boolean {"
          safe_body = '''function safePushBody(delivery: PushDelivery): string {\n  const type = delivery.notification_type.toLowerCase();\n  if (type.includes("message") || type.includes("conversation")) {\n    return "لديك رسالة جديدة على رواج";\n  }\n  if (type === "saved_search_match") return "توجد نتائج جديدة تطابق أحد بحوثك المحفوظة";\n  if (type.includes("price")) return "تغيّر سعر إعلان تتابعه على رواج";\n  if (type.includes("review")) return "لديك تحديث جديد متعلق بالتقييمات";\n  if (type.includes("promotion")) return "لديك تحديث جديد متعلق بالترويج";\n  if (type.includes("listing") || type === "approved" || type === "rejected" || type === "expired") {\n    return "لديك تحديث جديد على أحد إعلاناتك";\n  }\n  return "لديك تحديث جديد في رواج";\n}\n\n'''
          if marker not in edge:
              raise SystemExit("FCM permanent-error marker not found")
          edge = edge.replace(marker, safe_body + marker, 1)
          edge_path.write_text(edge, encoding="utf-8")
          PY

      - name: Update Android Capacitor plugins
        run: npx cap update android

      - name: Format changed package
        run: |
          npx prettier --write \
            .github/workflows/quality-gate.yml \
            .github/workflows/saved-search-push-format-once.yml \
            capacitor.config.ts \
            docs/production-schema/migration-ledger.json \
            package.json \
            scripts/saved-search-push-v1.test.mjs \
            src/features/notifications/NotificationPreferencesPanel.tsx \
            src/features/notifications/PushNotificationBridge.tsx \
            src/features/saved-searches/SavedSearchAlertBackgroundScanner.tsx \
            src/lib/api/notification-preferences.ts \
            src/lib/api/notification-target-resolution.ts \
            src/lib/api/push-notifications.ts \
            src/lib/api/saved-search-alerts.ts \
            src/lib/classifieds-api.ts \
            src/lib/native-push.ts \
            src/routes/more.tsx \
            src/routes/notifications.tsx \
            src/routes/saved-searches.tsx \
            supabase/functions/send-push-notifications/index.ts

      - name: Saved Search Push contract
        run: npm run test:saved-search-push

      - name: Existing activity contracts
        run: npm run test:activity-center

      - name: Changed-file ESLint
        run: |
          npx eslint --quiet \
            scripts/saved-search-push-v1.test.mjs \
            src/features/notifications/NotificationPreferencesPanel.tsx \
            src/features/notifications/PushNotificationBridge.tsx \
            src/features/saved-searches/SavedSearchAlertBackgroundScanner.tsx \
            src/lib/api/notification-preferences.ts \
            src/lib/api/notification-target-resolution.ts \
            src/lib/api/push-notifications.ts \
            src/lib/api/saved-search-alerts.ts \
            src/lib/classifieds-api.ts \
            src/lib/native-push.ts \
            src/routes/more.tsx \
            src/routes/notifications.tsx \
            src/routes/saved-searches.tsx

      - name: TypeScript
        run: npm run typecheck -- --pretty false

      - name: Production build
        run: npm run build

      - name: Remove one-shot workflow
        run: rm .github/workflows/saved-search-push-format-once.yml

      - name: Commit validated package
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: validate saved-search alerts and push package"
          git push origin HEAD:"$HEAD_REF"
