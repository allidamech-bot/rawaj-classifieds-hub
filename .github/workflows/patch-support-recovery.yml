name: Patch support recovery

on:
  push:
    branches:
      - feature/recover-support-history

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-support-history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch support recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('src/routes/support.tsx')
          source = route.read_text()
          source = source.replace(
              'import { useEffect, useState, type FormEvent } from "react";',
              'import { useCallback, useEffect, useRef, useState, type FormEvent } from "react";',
          )
          source = source.replace(
              '  const [requestsError, setRequestsError] = useState<ClassifiedsError | null>(null);\n  const [submitting, setSubmitting] = useState(false);',
              '  const [requestsError, setRequestsError] = useState<ClassifiedsError | null>(null);\n  const [requestsLoading, setRequestsLoading] = useState(false);\n  const [requestsHasLoaded, setRequestsHasLoaded] = useState(false);\n  const [submitting, setSubmitting] = useState(false);',
          )
          source = source.replace(
              '  const [notice, setNotice] = useState("");\n\n  useEffect(() => {\n    if (auth.status !== "signedIn") return;\n    let cancelled = false;\n\n    async function loadRequests() {\n      setRequestsError(null);\n      const result = await fetchMySupportRequests(auth.profile?.id ?? null);\n      if (cancelled) return;\n      if (result.ok) setRequests(result.data);\n      else {\n        setRequests([]);\n        setRequestsError(result.error);\n      }\n    }\n\n    void loadRequests();\n    return () => {\n      cancelled = true;\n    };\n  }, [auth.profile?.id, auth.status]);',
              '''  const [notice, setNotice] = useState("");
  const requestsRequestIdRef = useRef(0);
  const submitInFlightRef = useRef(false);
  const profileId = auth.profile?.id ?? null;

  const loadRequests = useCallback(async () => {
    if (!profileId) return;
    const currentProfileId = profileId;
    const requestId = ++requestsRequestIdRef.current;
    setRequestsLoading(true);
    setRequestsError(null);
    const result = await fetchMySupportRequests(currentProfileId);
    if (requestId !== requestsRequestIdRef.current || currentProfileId !== auth.profile?.id) return;
    if (result.ok) {
      setRequests(result.data);
      setRequestsHasLoaded(true);
    } else {
      setRequestsError(result.error);
    }
    setRequestsLoading(false);
  }, [auth.profile?.id, profileId]);

  useEffect(() => {
    requestsRequestIdRef.current += 1;
    if (auth.status !== "signedIn" || !profileId) {
      setRequests([]);
      setRequestsError(null);
      setRequestsLoading(false);
      setRequestsHasLoaded(false);
      submitInFlightRef.current = false;
      return;
    }
    setRequests([]);
    setRequestsError(null);
    setRequestsLoading(false);
    setRequestsHasLoaded(false);
    void loadRequests();
    return () => {
      requestsRequestIdRef.current += 1;
      submitInFlightRef.current = false;
    };
  }, [auth.status, loadRequests, profileId]);''',
          )
          source = source.replace(
              '  async function submitRequest(event: FormEvent<HTMLFormElement>) {\n    event.preventDefault();\n    setNotice("");\n    setSubmitting(true);\n    const result = await createSupportRequest(auth.profile?.id ?? null, {\n      type: requestType,\n      subject,\n      message,\n      relatedListingId: relatedListingId || null,\n    });\n    setSubmitting(false);\n\n    if (!result.ok) {\n      setNotice(result.error.message);\n      return;\n    }',
              '''  async function submitRequest(event: FormEvent<HTMLFormElement>) {
    event.preventDefault();
    if (submitInFlightRef.current) return;
    submitInFlightRef.current = true;
    setNotice("");
    setSubmitting(true);
    const currentProfileId = profileId;
    try {
      const result = await createSupportRequest(currentProfileId, {
        type: requestType,
        subject,
        message,
        relatedListingId: relatedListingId || null,
      });

      if (currentProfileId !== auth.profile?.id) return;
      if (!result.ok) {
        setNotice(result.error.message);
        return;
      }''',
          )
          source = source.replace(
              '    setNotice(text("تم إرسال طلب الدعم للمراجعة.", "Support request submitted for review."));\n  }',
              '''      setNotice(text("تم إرسال طلب الدعم للمراجعة.", "Support request submitted for review."));
    } finally {
      submitInFlightRef.current = false;
      if (currentProfileId === auth.profile?.id) setSubmitting(false);
    }
  }''',
          )
          source = source.replace(
              '''                {requestsError ? (
                  <p className="rawaj-support-notice">{requestsError.message}</p>
                ) : (
                  <SupportRequestTimeline requests={requests} language={language} />
                )}''',
              '''                {requestsLoading && !requestsHasLoaded ? (
                  <p className="rawaj-support-notice">
                    {text("جارٍ تحميل طلبات الدعم", "Loading support requests")}
                  </p>
                ) : requestsError && !requestsHasLoaded ? (
                  <div className="rawaj-support-notice">
                    <p>{requestsError.message}</p>
                    <button type="button" onClick={() => void loadRequests()}>
                      {text("إعادة المحاولة", "Try again")}
                    </button>
                  </div>
                ) : (
                  <>
                    {requestsError ? (
                      <div className="rawaj-support-notice">
                        <p>{requestsError.message}</p>
                        <button type="button" onClick={() => void loadRequests()}>
                          {text("إعادة المحاولة", "Try again")}
                        </button>
                      </div>
                    ) : null}
                    <SupportRequestTimeline requests={requests} language={language} />
                  </>
                )}''',
          )
          route.write_text(source)

          test_file = Path('scripts/trust-support-hub-v2.test.mjs')
          test_source = test_file.read_text()
          anchor = 'test("safety uses shared factual guide cards and keeps platform payment disclaimer", () => {'
          addition = '''test("support history recovers without erasing successful requests or duplicating submissions", () => {
  assert.match(support, /const \[requestsHasLoaded, setRequestsHasLoaded\]/);
  assert.match(support, /const requestsRequestIdRef = useRef\(0\)/);
  assert.match(support, /const submitInFlightRef = useRef\(false\)/);
  assert.match(support, /const loadRequests = useCallback/);
  assert.match(support, /requestsError && !requestsHasLoaded/);
  assert.match(support, /onClick=\{\(\) => void loadRequests\(\)\}/);
  assert.match(support, /if \(submitInFlightRef\.current\) return/);
  assert.match(support, /finally \{[\s\S]*submitInFlightRef\.current = false/);
  assert.doesNotMatch(support, /setRequests\(\[\]\);[\s\S]{0,100}setRequestsError\(result\.error\)/);
});

'''
          test_source = test_source.replace(anchor, addition + anchor)
          test_file.write_text(test_source)
          PY
          npx eslint --fix src/routes/support.tsx scripts/trust-support-hub-v2.test.mjs
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-support-recovery.yml
          git add src/routes/support.tsx scripts/trust-support-hub-v2.test.mjs
          git commit -m "Recover support history and submission state"
          git push origin HEAD:feature/recover-support-history
