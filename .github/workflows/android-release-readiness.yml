name: Android Release Readiness

on:
  pull_request:
    branches:
      - main

concurrency:
  group: android-release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAWAJ_ANDROID_PREVIEW_URL: https://rawaj-classifieds-hub-git-agent-and-f3d17b-alidaamishs-projects.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Android release readiness contract
        run: npm run test:android-release-readiness

      - name: Mobile app stabilization contract
        run: npm run test:mobile-app-stabilization

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Production web build
        run: npm run build

      - name: Sync branch preview into Android debug configuration
        env:
          RAWAJ_ANDROID_SERVER_URL: ${{ env.RAWAJ_ANDROID_PREVIEW_URL }}
        run: npx cap sync android

      - name: Assemble branch-preview debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Restore production Android configuration
        run: npx cap sync android

      - name: Build production release AAB readiness artifact
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload branch-preview APK for real-device testing
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-android-1.0.3-preview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
