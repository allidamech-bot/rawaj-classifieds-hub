name: Android Release Readiness

on:
  pull_request:
    branches:
      - main

concurrency:
  group: android-release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Android release readiness contract
        run: npm run test:android-release-readiness

      - name: Mobile app stabilization contract
        run: npm run test:mobile-app-stabilization

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Production web build
        run: npm run build

      - name: Create self-contained branch preview shell
        shell: bash
        run: |
          set -euo pipefail
          find .output -maxdepth 5 -type f | sort > /tmp/rawaj-output-files.txt
          npx --yes wrangler@latest dev \
            --config .output/server/wrangler.json \
            --port 4173 \
            --ip 127.0.0.1 \
            > /tmp/rawaj-preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=""
          for attempt in $(seq 1 75); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/rawaj-index.html; then
              ready="yes"
              break
            fi
            sleep 1
          done

          if [ "$ready" != "yes" ]; then
            cat /tmp/rawaj-preview.log
            exit 1
          fi

          test -s /tmp/rawaj-index.html
          grep -q '<html' /tmp/rawaj-index.html
          grep -q '/assets/' /tmp/rawaj-index.html
          cp /tmp/rawaj-index.html .output/public/index.html

          for route in auth/callback login chats profile more notifications activity add-listing; do
            mkdir -p ".output/public/$route"
            cp /tmp/rawaj-index.html ".output/public/$route/index.html"
          done

      - name: Upload bundled preview diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-bundled-preview-diagnostics
          path: |
            /tmp/rawaj-preview.log
            /tmp/rawaj-output-files.txt
            /tmp/rawaj-index.html
            .output/server/wrangler.json
            .output/server/index.mjs
          if-no-files-found: warn
          retention-days: 1

      - name: Sync bundled branch preview into Android debug configuration
        env:
          RAWAJ_ANDROID_BUNDLED_PREVIEW: "1"
        run: npx cap sync android

      - name: Lock bundled preview to local origin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/rawaj/marketplace/MainActivity.java")
          source = path.read_text(encoding="utf-8")

          production_origin = 'private static final String RAWAJ_ORIGIN = "https://rawa-j.com";'
          preview_origin = 'private static final String RAWAJ_ORIGIN = "https://localhost";'
          if production_origin not in source:
              raise SystemExit("RAWAJ_ORIGIN production constant was not found")
          source = source.replace(production_origin, preview_origin, 1)

          create_marker = '''        super.onCreate(savedInstanceState);

        routeIncomingIntent(getIntent());'''
          create_replacement = '''        super.onCreate(savedInstanceState);

        forceBundledPreviewOrigin();
        routeIncomingIntent(getIntent());'''
          if create_marker not in source:
              raise SystemExit("MainActivity onCreate marker was not found")
          source = source.replace(create_marker, create_replacement, 1)

          intent_marker = '''    @Override
    protected void onNewIntent(Intent intent) {'''
          intent_replacement = '''    @Override
    protected void onResume() {
        super.onResume();
        forceBundledPreviewOrigin();
    }

    @Override
    protected void onNewIntent(Intent intent) {'''
          if intent_marker not in source:
              raise SystemExit("MainActivity onNewIntent marker was not found")
          source = source.replace(intent_marker, intent_replacement, 1)

          route_marker = '''    private void routeIncomingIntent(Intent intent) {'''
          helpers = '''    private String localPreviewUrl(Uri uri) {
        final Uri.Builder builder = Uri.parse(RAWAJ_ORIGIN).buildUpon();
        final String path = uri.getEncodedPath();
        builder.encodedPath(path == null || path.isEmpty() ? "/" : path);
        builder.encodedQuery(uri.getEncodedQuery());
        builder.encodedFragment(uri.getEncodedFragment());
        return builder.build().toString();
    }

    private void forceBundledPreviewOrigin() {
        final WebView webView = getBridge() == null ? null : getBridge().getWebView();
        if (webView == null) {
            return;
        }

        final long[] delays = new long[] { 0L, 250L, 750L, 1500L };
        for (long delay : delays) {
            webView.postDelayed(
                () -> {
                    final String currentUrl = webView.getUrl();
                    if (currentUrl == null || currentUrl.trim().isEmpty()) {
                        return;
                    }

                    final Uri currentUri = Uri.parse(currentUrl);
                    final String host = currentUri.getHost() == null
                        ? ""
                        : currentUri.getHost().toLowerCase(Locale.ROOT);
                    if (!RAWAJ_HOST.equals(host) && !host.endsWith("." + RAWAJ_HOST)) {
                        return;
                    }

                    final String localUrl = localPreviewUrl(currentUri);
                    if (!localUrl.equals(currentUrl)) {
                        webView.stopLoading();
                        webView.loadUrl(localUrl);
                        webView.postDelayed(webView::clearHistory, 350L);
                    }
                },
                delay
            );
        }
    }

    private void routeIncomingIntent(Intent intent) {'''
          if route_marker not in source:
              raise SystemExit("MainActivity routeIncomingIntent marker was not found")
          source = source.replace(route_marker, helpers, 1)

          remote_return = '''            return uri.toString();'''
          local_return = '''            return localPreviewUrl(uri);'''
          if remote_return not in source:
              raise SystemExit("MainActivity HTTPS deep-link return was not found")
          source = source.replace(remote_return, local_return, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify bundled preview identity and payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("android/app/src/main/assets/capacitor.config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          server = config.get("server", {})
          if "url" in server:
              raise SystemExit("Bundled preview unexpectedly contains server.url")

          main_activity = Path(
              "android/app/src/main/java/com/rawaj/marketplace/MainActivity.java"
          ).read_text(encoding="utf-8")
          required_native = [
              'RAWAJ_ORIGIN = "https://localhost"',
              "forceBundledPreviewOrigin()",
              "localPreviewUrl(Uri uri)",
          ]
          for marker in required_native:
              if marker not in main_activity:
                  raise SystemExit(f"Bundled MainActivity is missing {marker}")
          if "clearCache(true)" in main_activity:
              raise SystemExit("Bundled preview must not clear WebView storage or auth state")

          assets = Path("android/app/src/main/assets/public/assets")
          javascript = "\n".join(
              path.read_text(encoding="utf-8", errors="ignore")
              for path in assets.glob("*.js")
          )
          if "rawaj-chat-inbox" not in javascript:
              raise SystemExit("Bundled APK does not contain the new chat inbox UI")
          if "rawaj-message-workspace" in javascript:
              raise SystemExit("Bundled APK still contains the retired chat workspace UI")
          if "getAuthStorage" not in javascript or "rawajAuthStorage" not in javascript:
              raise SystemExit("Bundled APK does not contain durable native auth storage")
          PY

      - name: Assemble bundled branch-preview debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify debug APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "Android SDK apksigner was not found." >&2
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk" | tee /tmp/rawaj-debug-apk-signature.txt
          grep -Eq 'Verified using v[23] scheme .*: true' /tmp/rawaj-debug-apk-signature.txt

      - name: Restore production Android configuration
        shell: bash
        run: |
          git checkout -- android/app/src/main/java/com/rawaj/marketplace/MainActivity.java
          npx cap sync android

      - name: Build production release AAB readiness artifact
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify release AAB exists without publishing
        shell: bash
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          echo "Release AAB created at $aab ($(wc -c < "$aab") bytes)."
          jarsigner -verify -verbose "$aab" > /tmp/rawaj-release-aab-signature.txt 2>&1 || true
          if grep -qi 'jar is unsigned' /tmp/rawaj-release-aab-signature.txt; then
            echo "Release AAB is unsigned; signing remains an external release gate."
          else
            echo "Release AAB contains a verifiable signature."
          fi

      - name: Upload bundled branch-preview APK for real-device testing
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-android-1.0.3-bundled-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
