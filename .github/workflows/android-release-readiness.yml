name: Android Release Readiness

on:
  pull_request:
    branches:
      - main

concurrency:
  group: android-release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Android release readiness contract
        run: npm run test:android-release-readiness

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Lint Android readiness source
        id: readiness_lint
        continue-on-error: true
        shell: bash
        run: |
          npx eslint --quiet \
            capacitor.config.ts \
            scripts/android-release-readiness.test.mjs \
            src/components/native/NativeAppRuntime.tsx \
            src/lib/auth.tsx \
            src/lib/native-runtime.ts \
            src/lib/supabase.ts \
            src/routes/auth.callback.tsx \
            src/routes/login.tsx \
            > android-readiness-lint.log 2>&1

      - name: Upload lint diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-readiness-lint
          path: android-readiness-lint.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce lint result
        if: steps.readiness_lint.outcome == 'failure'
        run: exit 1

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Production web build
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble debug APK and release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
