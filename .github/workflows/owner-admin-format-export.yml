name: Owner Admin Temporary Format Export
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/owner-admin-format-export.yml"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export canonical prettier formatting for changed source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import prettier from 'prettier';
          const files = [
            'cloudflare/worker/src/admin-user-actions.ts',
            'cloudflare/worker/src/admin.ts',
            'cloudflare/worker/src/auth.ts',
            'cloudflare/worker/test/marketplace.integration.test.mjs',
            'src/routes/admin.owner-controls.tsx',
            'src/routes/admin.users.tsx'
          ];
          for (const path of files) {
            const source = await fs.readFile(path,'utf8');
            const config = await prettier.resolveConfig(path);
            const formatted = await prettier.format(source,{...config,filepath:path});
            const pieceSize = 1500;
            const count = Math.ceil(formatted.length / pieceSize);
            for(let i=0;i<count;i++) {
              console.log('##RAWAJ_FORMAT##'+JSON.stringify({path,index:i,count,chunk:formatted.slice(i*pieceSize,(i+1)*pieceSize)}));
            }
          }
          NODE
