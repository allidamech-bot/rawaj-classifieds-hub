name: Temporary Trust Support Lint Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'design/trust-support-hub-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/trust-support-hub-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove stale symbols and restore unread total
        run: |
          python - <<'PY'
          from pathlib import Path

          more = Path('src/routes/more.tsx')
          source = more.read_text()
          for stale in ['  FileText,\n', '  LogIn,\n', '  Sparkles,\n']:
              source = source.replace(stale, '')
          source = source.replace(
              '  const { counts } = useUnreadActivityCounts();\n',
              '  const { counts } = useUnreadActivityCounts();\n  const unreadTotal = counts.messages + counts.notifications;\n',
              1,
          )
          source = source.replace(
              '  const location = profile?.cityArea || profile?.governorate || text("سوريا", "Syria");\n',
              '',
              1,
          )
          more.write_text(source)

          support = Path('src/routes/support.tsx')
          source = support.read_text()
          source = source.replace(
              'import { ChevronDown, LifeBuoy, ShieldAlert } from "lucide-react";',
              'import { ChevronDown, ShieldAlert } from "lucide-react";',
              1,
          )
          source = source.replace('import { supportStatusLabel } from "@/lib/status-labels";\n', '', 1)
          support.write_text(source)
          PY
      - name: Format and lint changed routes
        run: |
          npx prettier --write src/routes/more.tsx src/routes/support.tsx src/routes/safety.tsx
          npx eslint src/routes/more.tsx src/routes/support.tsx src/routes/safety.tsx src/features/trust/TrustSupportExperience.tsx
      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/temporary-trust-support-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/more.tsx src/routes/support.tsx src/routes/safety.tsx
          git add -u .github/workflows/temporary-trust-support-lint-fix.yml
          git commit -m "Fix Trust Support Hub lint integration"
          git push origin HEAD:design/trust-support-hub-v2
