name: Apply SYP Schema Compatibility

on:
  pull_request:
    types: [synchronize]
    branches:
      - main
    paths:
      - ".github/workflows/apply-syp-schema-compatibility.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch agent/syp-denomination-phase-a \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply schema compatibility
        working-directory: repo
        run: |
          python scripts/.apply-syp-schema-compatibility.py
          python - <<'PY'
          from pathlib import Path

          contract_path = Path("scripts/syp-denomination-phase-a.test.mjs")
          contract = contract_path.read_text()
          contract_old = r'assert.match(listings, /query\.order\("price", \{ ascending: true/);'
          contract_new = r'assert.match(listings, /\.order\("price", \{ ascending: true/);'
          if contract.count(contract_old) != 1:
              raise SystemExit("legacy price-order contract anchor missing")
          contract_path.write_text(contract.replace(contract_old, contract_new, 1))

          dynamic_path = Path("src/lib/api/dynamic-filtered-listings.ts")
          dynamic = dynamic_path.read_text()
          declaration_old = "  const supportsSypDenomination = await supportsSypDenominationSchema(client);\n"
          declaration_new = (
              declaration_old
              + '  const listingSelect = publicListingSelectForSchema(supportsSypDenomination) as "*";\n'
          )
          select_old = ".select(publicListingSelectForSchema(supportsSypDenomination))"
          if dynamic.count(declaration_old) != 1:
              raise SystemExit("dynamic schema declaration anchor missing")
          if dynamic.count(select_old) != 1:
              raise SystemExit("dynamic select expression anchor missing")
          dynamic = dynamic.replace(declaration_old, declaration_new, 1)
          dynamic = dynamic.replace(select_old, ".select(listingSelect)", 1)
          dynamic_path.write_text(dynamic)
          PY

      - name: Install dependencies
        working-directory: repo
        run: npm ci --silent

      - name: Format changed files
        working-directory: repo
        run: |
          npx prettier --write \
            src/lib/api/syp-denomination-schema.ts \
            src/lib/api/public-fields.ts \
            src/lib/api/listings.ts \
            src/lib/api/dynamic-filtered-listings.ts \
            src/lib/api/syp-denomination.ts \
            scripts/syp-denomination-phase-a.test.mjs >/dev/null

      - name: Verify contracts quietly
        working-directory: repo
        run: |
          node --test scripts/syp-denomination-phase-a.test.mjs >/tmp/phase-a.log 2>&1
          node --test scripts/search-results-taxonomy-integrity.test.mjs >/tmp/search.log 2>&1
          node --test scripts/public-listing-detail-integrity.test.mjs >/tmp/detail.log 2>&1
          echo "Compatibility contracts passed."

      - name: Verify TypeScript
        working-directory: repo
        run: |
          set +e
          npm run typecheck >/tmp/typecheck.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/typecheck.log
            exit "$status"
          fi
          echo "TypeScript passed."

      - name: Verify production build
        working-directory: repo
        run: |
          set +e
          npm run build >/tmp/build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 200 /tmp/build.log
            exit "$status"
          fi
          echo "Production build passed."

      - name: Verify generated diff
        working-directory: repo
        run: git diff --check

      - name: Remove one-shot compatibility machinery
        working-directory: repo
        run: |
          rm -f scripts/.apply-syp-schema-compatibility.py
          rm -f .github/workflows/apply-syp-schema-compatibility.yml

      - name: Commit schema compatibility
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep public reads safe before SYP Phase A migration"
          git push origin HEAD:agent/syp-denomination-phase-a
