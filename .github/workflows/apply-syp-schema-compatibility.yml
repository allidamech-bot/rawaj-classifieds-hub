name: Apply SYP Schema Compatibility

on:
  pull_request:
    types: [synchronize]
    branches:
      - main
    paths:
      - ".github/workflows/apply-syp-schema-compatibility.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch agent/syp-denomination-phase-a \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply schema compatibility
        working-directory: repo
        run: |
          python scripts/.apply-syp-schema-compatibility.py
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/syp-denomination-phase-a.test.mjs")
          source = path.read_text()
          old = r'assert.match(listings, /query\.order\("price", \{ ascending: true/);'
          new = r'assert.match(listings, /\.order\("price", \{ ascending: true/);'
          if source.count(old) != 1:
              raise SystemExit("legacy price-order contract anchor missing")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Install dependencies
        working-directory: repo
        run: npm ci --silent

      - name: Format changed files
        working-directory: repo
        run: |
          npx prettier --write \
            src/lib/api/syp-denomination-schema.ts \
            src/lib/api/public-fields.ts \
            src/lib/api/listings.ts \
            src/lib/api/dynamic-filtered-listings.ts \
            src/lib/api/syp-denomination.ts \
            scripts/syp-denomination-phase-a.test.mjs >/dev/null

      - name: Verify Phase A contracts
        working-directory: repo
        run: node --test scripts/syp-denomination-phase-a.test.mjs

      - name: Verify search and public detail contracts
        working-directory: repo
        run: |
          node --test scripts/search-results-taxonomy-integrity.test.mjs
          node --test scripts/public-listing-detail-integrity.test.mjs

      - name: Verify TypeScript and production build
        working-directory: repo
        run: |
          npm run typecheck
          npm run build

      - name: Verify generated diff
        working-directory: repo
        run: git diff --check

      - name: Remove one-shot compatibility machinery
        working-directory: repo
        run: |
          rm -f scripts/.apply-syp-schema-compatibility.py
          rm -f .github/workflows/apply-syp-schema-compatibility.yml

      - name: Commit schema compatibility
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep public reads safe before SYP Phase A migration"
          git push origin HEAD:agent/syp-denomination-phase-a
