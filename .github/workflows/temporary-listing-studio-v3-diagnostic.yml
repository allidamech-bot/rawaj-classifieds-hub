name: Temporary Listing Studio V3 diagnostic

on:
  push:
    branches:
      - feature/stale-safe-owner-listing-updates

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/stale-safe-owner-listing-updates
          fetch-depth: 0

      - name: Capture isolated contract output
        shell: bash
        run: |
          set +e
          node --test scripts/listing-studio-v3.test.mjs > listing-studio-v3-diagnostic.txt 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> listing-studio-v3-diagnostic.txt
          exit 0

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listing-studio-v3-diagnostic.txt
          git commit -m "Capture Listing Studio V3 diagnostic"
          git push origin HEAD:feature/stale-safe-owner-listing-updates
