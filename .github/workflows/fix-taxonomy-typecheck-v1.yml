name: Fix Taxonomy Typecheck V1

on:
  pull_request:
    paths:
      - ".github/workflows/fix-taxonomy-typecheck-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-taxonomy-typecheck-v1
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix TypeScript diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          attributes = Path("src/lib/api/listing-attributes.ts")
          source = attributes.read_text(encoding="utf-8")
          old = '      code: "forbidden",\n'
          if source.count(old) != 1:
              raise SystemExit(f"listing attribute permission marker count: {source.count(old)}")
          attributes.write_text(source.replace(old, '      code: "permission_denied",\n', 1), encoding="utf-8")

          route = Path("src/routes/profile/listings.$id.tsx")
          source = route.read_text(encoding="utf-8")
          old_validation = "        if (!dynamicValidation.ok) {"
          if source.count(old_validation) != 1:
              raise SystemExit(f"dynamic validation marker count: {source.count(old_validation)}")
          source = source.replace(old_validation, "        if (dynamicValidation.summary.length > 0) {", 1)

          old_condition = "setCondition(categoryDetailsGlobalCondition(categoryFieldKind, nextDetails));"
          new_condition = "setCondition(resolveLegacyDetailCondition(categoryFieldKind, nextDetails));"
          if source.count(old_condition) != 1:
              raise SystemExit(f"legacy condition marker count: {source.count(old_condition)}")
          source = source.replace(old_condition, new_condition, 1)

          marker = "\nfunction fileFingerprint(file: File) {"
          helper = '''
function resolveLegacyDetailCondition(
  kind: CategoryFieldKind,
  details: CategorySpecificDetails,
): ListingCondition {
  const value = kind === "vehicles" ? details.vehicle_condition ?? details.condition : details.condition;
  if (value === "new") return "new";
  if (value === "excellent" || value === "good") return "like_new";
  if (value === "needs_work") return "for_parts";
  if (value === "used") return "used";
  return "not_applicable";
}
'''
          if "function resolveLegacyDetailCondition(" not in source:
              if source.count(marker) != 1:
                  raise SystemExit(f"helper insertion marker count: {source.count(marker)}")
              source = source.replace(marker, helper + marker, 1)
          route.write_text(source, encoding="utf-8")
          PY
          npx prettier --write src/lib/api/listing-attributes.ts 'src/routes/profile/listings.$id.tsx'
          npm run typecheck
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/listing-attributes.ts 'src/routes/profile/listings.$id.tsx'
          git commit -m "fix: resolve taxonomy foundation type errors"
          git push origin HEAD:feature/taxonomy-search-foundation-v1
