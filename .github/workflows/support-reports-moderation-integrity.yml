name: Support, Reports & Moderation Integrity Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/support.tsx"
      - "src/routes/listings.$id.tsx"
      - "src/routes/admin*.tsx"
      - "src/features/trust/**"
      - "src/features/reviews/**"
      - "src/lib/api/support*.ts"
      - "src/lib/api/reports*.ts"
      - "src/lib/api/messaging.ts"
      - "src/lib/api/review-reports.ts"
      - "src/lib/moderation-contract.ts"
      - "src/lib/classifieds-types.ts"
      - "supabase/migrations/**"
      - "scripts/support-reports-moderation-integrity.test.mjs"
      - ".github/workflows/support-reports-moderation-integrity.yml"
      - ".github/workflows/quality-gate.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Support, Reports & Moderation Integrity contract
        run: npm run test:support-reports-moderation

      - name: Typecheck
        run: npm run typecheck -- --pretty false
