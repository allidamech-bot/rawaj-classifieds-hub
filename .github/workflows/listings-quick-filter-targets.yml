name: Listings Quick Filter Targets

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/search/QuickFilterRail.tsx"
      - "scripts/listings-quick-filter-targets.test.mjs"
      - ".github/workflows/listings-quick-filter-targets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/listings-quick-filter-targets.test.mjs
      - run: npm run test:listings-filters
      - name: Lint quick-filter source
        id: lint
        continue-on-error: true
        run: >-
          npx eslint --quiet --format json
          --output-file eslint-quick-filter.json
          src/features/search/QuickFilterRail.tsx
      - name: Upload lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: listings-quick-filter-lint
          path: eslint-quick-filter.json
          if-no-files-found: error
          retention-days: 3
      - name: Enforce lint result
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - run: npm run typecheck -- --pretty false
      - run: npm run build
