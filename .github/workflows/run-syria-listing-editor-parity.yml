name: Run Syria listing editor parity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/syria-match-saudi-owner-listings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/syria-match-saudi-owner-listings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-syria-listing-editor-parity.py
      - name: Align Syria review status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/routes/add-listing.tsx')
          source = path.read_text()
          replacement = '  const submissionSucceeded = draftListing?.status === "pending_review";\n'
          source, count = re.subn(r'^\s*const submissionSucceeded = .*?;\s*$', replacement.rstrip(), source, count=1, flags=re.MULTILINE)
          if count == 0:
              anchor = '  const canSubmit = step === 3;\n'
              if anchor not in source:
                  raise SystemExit('missing Syria canSubmit anchor')
              source = source.replace(anchor, anchor + replacement, 1)
          path.write_text(source)
          PY
      - run: npm ci
      - run: npx prettier --write 'src/routes/profile/listings.$id.tsx' src/routes/add-listing.tsx src/lib/api/listings.ts cloudflare/worker/src/marketplace-private.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:cloudflare-cutover
      - name: Worker typecheck
        working-directory: cloudflare/worker
        run: npm run typecheck
      - name: Reject Saudi runtime identity
        run: |
          if grep -RInE 'sa\.rawa-j\.com|rawaj-saudi|SAUDI_|Saudi Arabia|السعودية|\bSAR\b' 'src/routes/profile/listings.$id.tsx' src/routes/add-listing.tsx src/lib/api/listings.ts cloudflare/worker/src/marketplace-private.ts; then
            exit 1
          fi
      - name: Commit result and remove one-shot files
        run: |
          git rm .github/workflows/run-syria-listing-editor-parity.yml scripts/apply-syria-listing-editor-parity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/profile/listings.$id.tsx' src/routes/add-listing.tsx src/lib/api/listings.ts cloudflare/worker/src/marketplace-private.ts
          git commit -m "feat(syria): match Saudi listing editor workflow"
          git push origin HEAD:feat/syria-match-saudi-owner-listings
