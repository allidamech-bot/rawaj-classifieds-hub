name: Nearby Location & Radius Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/nearby-location.ts"
      - "src/lib/nearby-geolocation.ts"
      - "src/lib/api/nearby-listings.ts"
      - "supabase/migrations/202607170005_nearby_location_radius_integrity.sql"
      - "scripts/nearby-location-radius-integrity.test.mjs"
      - "docs/production-schema/migration-ledger.json"
      - ".github/workflows/nearby-location-radius-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-17-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Phase 17 changes
        run: >-
          npx eslint --quiet
          src/lib/nearby-location.ts
          src/lib/nearby-geolocation.ts
          src/lib/api/nearby-listings.ts
          scripts/nearby-location-radius-integrity.test.mjs

      - name: Nearby location and radius contract
        run: node --test scripts/nearby-location-radius-integrity.test.mjs

      - name: Migration ledger check
        run: node scripts/check-migration-ledger.mjs

      - name: Typecheck
        run: npm run typecheck -- --pretty false
