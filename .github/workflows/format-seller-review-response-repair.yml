name: Format seller review response repair

on:
  push:
    branches:
      - fix/seller-review-response-trigger-path

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/seller-review-response-trigger-path

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format response repair contract
        run: npx prettier --write scripts/seller-review-response.test.mjs

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- scripts/seller-review-response.test.mjs; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/seller-review-response.test.mjs
          git commit -m "Format seller review response repair contract"
          git push origin HEAD:fix/seller-review-response-trigger-path
