name: Fix Batch 3 lint

on:
  push:
    branches:
      - agent/launch-readiness-batch-3
    paths:
      - .github/workflows/fix-batch3-lint.yml
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - .github/workflows/fix-batch3-lint.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness-batch-3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix and verify changed source
        run: |
          npx eslint --fix \
            scripts/home-discovery-v3.test.mjs \
            src/features/home/home-listing-selection.ts \
            src/routes/__root.tsx \
            src/routes/index.tsx
          npx eslint --quiet \
            scripts/home-discovery-v3.test.mjs \
            src/features/home/home-listing-selection.ts \
            src/routes/__root.tsx \
            src/routes/index.tsx

      - name: Run Home Discovery V3 regression
        run: node --test scripts/home-discovery-v3.test.mjs

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/home-discovery-v3.test.mjs src/features/home/home-listing-selection.ts src/routes/__root.tsx src/routes/index.tsx
          git diff --cached --quiet || git commit -m "Fix Batch 3 lint findings"
          git push origin HEAD:agent/launch-readiness-batch-3
