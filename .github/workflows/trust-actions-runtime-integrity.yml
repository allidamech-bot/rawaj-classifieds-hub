name: Trust Actions Runtime Integrity

on:
  pull_request:
    paths:
      - "src/routes/support.tsx"
      - "src/routes/verification.tsx"
      - "src/routes/promotion.tsx"
      - "scripts/trust-actions-runtime-integrity.test.mjs"
      - ".github/workflows/trust-actions-runtime-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-actions-runtime-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/trust-actions-runtime-integrity.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
