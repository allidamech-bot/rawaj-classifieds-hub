name: Implement production deployment truth

on:
  push:
    branches:
      - chore/production-deployment-truth

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/production-deployment-truth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Implement build metadata and owner diagnostics
        shell: bash
        run: |
          cat > src/lib/build-info.ts <<'EOF'
          export interface RawajBuildInfo {
            commitSha: string;
            branch: string;
            environment: string;
            target: string;
            builtAt: string;
            deploymentUrl: string;
            provider: string;
          }

          declare const __RAWAJ_BUILD_INFO__: RawajBuildInfo;

          export const rawajBuildInfo = __RAWAJ_BUILD_INFO__;
          EOF

          cat > src/components/DeploymentTruthPanel.tsx <<'EOF'
          import {
            Clock3,
            Cloud,
            GitBranch,
            GitCommitHorizontal,
            Server,
          } from "lucide-react";
          import { rawajBuildInfo } from "@/lib/build-info";
          import { useUiPreferences } from "@/lib/ui-preferences";

          export function DeploymentTruthPanel() {
            const { language, text } = useUiPreferences();
            const isProduction =
              rawajBuildInfo.environment === "production" || rawajBuildInfo.target === "production";
            const commit =
              rawajBuildInfo.commitSha === "unknown"
                ? text("غير متاح", "Unavailable")
                : rawajBuildInfo.commitSha;
            const deploymentUrl = rawajBuildInfo.deploymentUrl || text("غير متاح", "Unavailable");

            return (
              <section className="rounded-2xl bg-card p-5 hairline shadow-soft">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div className="flex items-start gap-3">
                    <span className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-primary/10 text-primary">
                      <Cloud className="h-5 w-5" />
                    </span>
                    <div>
                      <p className="text-[11px] font-bold text-muted-foreground">
                        {text("حقيقة النسخة المنشورة", "Deployment truth")}
                      </p>
                      <h3 className="mt-1 text-base font-extrabold">
                        {text("هوية البناء الحالي", "Current build identity")}
                      </h3>
                      <p className="mt-1 max-w-2xl text-xs leading-6 text-muted-foreground">
                        {text(
                          "هذه القيم مضمّنة وقت البناء، وتكشف بدقة أي Commit وبيئة وفرع تخدم الصفحة الحالية.",
                          "These values are embedded at build time and identify the exact commit, environment, and branch serving this page.",
                        )}
                      </p>
                    </div>
                  </div>
                  <span
                    className={`rounded-full px-3 py-1.5 text-[10px] font-extrabold ${
                      isProduction
                        ? "bg-success/12 text-success"
                        : "bg-warning/12 text-warning"
                    }`}
                  >
                    {isProduction
                      ? text("Production", "Production")
                      : text("ليست Production", "Not production")}
                  </span>
                </div>

                <div className="mt-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                  <DeploymentFact
                    icon={GitCommitHorizontal}
                    label={text("Commit", "Commit")}
                    value={commit}
                    mono
                  />
                  <DeploymentFact
                    icon={GitBranch}
                    label={text("الفرع", "Branch")}
                    value={rawajBuildInfo.branch}
                    mono
                  />
                  <DeploymentFact
                    icon={Server}
                    label={text("البيئة / الهدف", "Environment / target")}
                    value={`${rawajBuildInfo.environment} / ${rawajBuildInfo.target}`}
                    mono
                  />
                  <DeploymentFact
                    icon={Clock3}
                    label={text("وقت البناء", "Built at")}
                    value={formatBuildTime(rawajBuildInfo.builtAt, language)}
                  />
                  <DeploymentFact
                    icon={Cloud}
                    label={text("المزوّد", "Provider")}
                    value={rawajBuildInfo.provider}
                    mono
                  />
                  <DeploymentFact
                    icon={Cloud}
                    label={text("عنوان النشر", "Deployment host")}
                    value={deploymentUrl}
                    mono
                  />
                </div>
              </section>
            );
          }

          function DeploymentFact({
            icon: Icon,
            label,
            value,
            mono = false,
          }: {
            icon: typeof Cloud;
            label: string;
            value: string;
            mono?: boolean;
          }) {
            return (
              <div className="rounded-xl bg-muted-surface/60 p-3 hairline">
                <div className="flex items-center gap-2 text-[10px] font-bold text-muted-foreground">
                  <Icon className="h-3.5 w-3.5 text-primary" />
                  {label}
                </div>
                <div
                  dir={mono ? "ltr" : undefined}
                  className={`mt-2 break-all text-xs font-extrabold ${mono ? "font-mono text-left" : ""}`}
                >
                  {value}
                </div>
              </div>
            );
          }

          function formatBuildTime(value: string, language: string): string {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return new Intl.DateTimeFormat(language === "ar" ? "ar-SY" : "en-US", {
              dateStyle: "medium",
              timeStyle: "medium",
            }).format(date);
          }
          EOF

          python <<'PY'
          from pathlib import Path

          vite = Path("vite.config.ts")
          text = vite.read_text()
          anchor = 'import { defineConfig } from "@lovable.dev/vite-tanstack-config";\n\n'
          metadata = '''import { defineConfig } from "@lovable.dev/vite-tanstack-config";\n\nconst rawajBuildInfo = {\n  commitSha: process.env.VERCEL_GIT_COMMIT_SHA ?? process.env.GITHUB_SHA ?? "unknown",\n  branch: process.env.VERCEL_GIT_COMMIT_REF ?? process.env.GITHUB_REF_NAME ?? "unknown",\n  environment: process.env.VERCEL_ENV ?? (process.env.CI ? "ci" : "development"),\n  target: process.env.VERCEL_TARGET_ENV ?? process.env.VERCEL_ENV ?? "unknown",\n  builtAt: new Date().toISOString(),\n  deploymentUrl:\n    process.env.VERCEL_PROJECT_PRODUCTION_URL ?? process.env.VERCEL_URL ?? "",\n  provider: process.env.VERCEL\n    ? "vercel"\n    : process.env.GITHUB_ACTIONS\n      ? "github-actions"\n      : "local",\n};\n\n'''
          if anchor not in text:
              raise SystemExit("vite import anchor not found")
          text = text.replace(anchor, metadata, 1)
          config_anchor = 'export default defineConfig({\n  tanstackStart:'
          config_replacement = '''export default defineConfig({\n  vite: {\n    define: {\n      __RAWAJ_BUILD_INFO__: JSON.stringify(rawajBuildInfo),\n    },\n  },\n  tanstackStart:'''
          if config_anchor not in text:
              raise SystemExit("vite config anchor not found")
          vite.write_text(text.replace(config_anchor, config_replacement, 1))

          route = Path("src/routes/admin.owner-controls.tsx")
          text = route.read_text()
          import_anchor = 'import { useEffect, useState } from "react";\n'
          import_replacement = (
              'import { useEffect, useState } from "react";\n'
              'import { DeploymentTruthPanel } from "@/components/DeploymentTruthPanel";\n'
          )
          if import_anchor not in text:
              raise SystemExit("owner route import anchor not found")
          text = text.replace(import_anchor, import_replacement, 1)
          panel_anchor = '''      </section>\n\n      {error && <Notice tone="error">{error}</Notice>}'''
          panel_replacement = '''      </section>\n\n      <DeploymentTruthPanel />\n\n      {error && <Notice tone="error">{error}</Notice>}'''
          if panel_anchor not in text:
              raise SystemExit("owner route panel anchor not found")
          route.write_text(text.replace(panel_anchor, panel_replacement, 1))
          PY

          cat > scripts/production-deployment-truth.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const [viteConfig, buildInfo, panel, ownerRoute] = await Promise.all([
            readFile(new URL("../vite.config.ts", import.meta.url), "utf8"),
            readFile(new URL("../src/lib/build-info.ts", import.meta.url), "utf8"),
            readFile(new URL("../src/components/DeploymentTruthPanel.tsx", import.meta.url), "utf8"),
            readFile(new URL("../src/routes/admin.owner-controls.tsx", import.meta.url), "utf8"),
          ]);

          test("build metadata is embedded from Vercel or CI truth", () => {
            assert.match(viteConfig, /VERCEL_GIT_COMMIT_SHA/);
            assert.match(viteConfig, /VERCEL_GIT_COMMIT_REF/);
            assert.match(viteConfig, /VERCEL_ENV/);
            assert.match(viteConfig, /__RAWAJ_BUILD_INFO__/);
            assert.match(buildInfo, /rawajBuildInfo/);
          });

          test("owner controls expose the build identity panel", () => {
            assert.match(ownerRoute, /DeploymentTruthPanel/);
            assert.match(panel, /Current build identity/);
            assert.match(panel, /Environment \/ target/);
            assert.match(panel, /Deployment host/);
          });
          EOF

          python <<'PY'
          import json
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          scripts = package["scripts"]
          scripts["test:deployment-truth"] = "node --test scripts/production-deployment-truth.test.mjs"
          check = scripts["check"]
          marker = "npm run test:verification-documents && npm run lint"
          replacement = "npm run test:verification-documents && npm run test:deployment-truth && npm run lint"
          if marker not in check:
              raise SystemExit("package check anchor not found")
          scripts["check"] = check.replace(marker, replacement, 1)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")

          workflow = Path(".github/workflows/quality-gate.yml")
          text = workflow.read_text()
          anchor = '''      - name: Typecheck\n        run: npm run typecheck -- --pretty false\n'''
          replacement = '''      - name: Production deployment truth contract\n        run: npm run test:deployment-truth\n\n      - name: Typecheck\n        run: npm run typecheck -- --pretty false\n'''
          if anchor not in text:
              raise SystemExit("quality gate anchor not found")
          workflow.write_text(text.replace(anchor, replacement, 1))
          PY

          npx prettier --write \
            vite.config.ts \
            src/lib/build-info.ts \
            src/components/DeploymentTruthPanel.tsx \
            src/routes/admin.owner-controls.tsx \
            scripts/production-deployment-truth.test.mjs \
            package.json \
            .github/workflows/quality-gate.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.ts src/lib/build-info.ts src/components/DeploymentTruthPanel.tsx src/routes/admin.owner-controls.tsx scripts/production-deployment-truth.test.mjs package.json .github/workflows/quality-gate.yml
          git commit -m "Expose production deployment build identity"
          git push origin HEAD:chore/production-deployment-truth
