name: Chat Image Attachments V1

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/api/messaging.ts"
      - "supabase/migrations/202607170007_chat_image_attachments_v1.sql"
      - "docs/production-schema/migration-ledger.json"
      - "scripts/chat-image-attachments-v1.test.mjs"
      - ".github/workflows/chat-image-attachments-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint --quiet src/lib/api/messaging.ts
      - run: node --test scripts/chat-image-attachments-v1.test.mjs
      - run: node scripts/check-migration-ledger.mjs
      - run: npm run typecheck -- --pretty false
