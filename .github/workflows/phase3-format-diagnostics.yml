name: Phase 3 Formatting Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format and commit Phase 3 files
        run: |
          npx prettier --write \
            e2e/production-smoke.spec.ts \
            scripts/dynamic-sitemap.test.mjs \
            scripts/performance-budget.mjs \
            scripts/phases-54-56-performance-observability.test.mjs \
            src/lib/client-error-monitoring.ts \
            src/routes/sitemap[.]xml.ts \
            src/server.ts
          if git diff --quiet; then
            echo "Phase 3 files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/production-smoke.spec.ts \
            scripts/dynamic-sitemap.test.mjs \
            scripts/performance-budget.mjs \
            scripts/phases-54-56-performance-observability.test.mjs \
            src/lib/client-error-monitoring.ts \
            src/routes/sitemap[.]xml.ts \
            src/server.ts
          git commit -m "Format Phase 3 public discovery changes"
          git push origin HEAD:${{ github.head_ref }}
