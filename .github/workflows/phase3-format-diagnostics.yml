name: Phase 3 Typecheck Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false > phase3-typecheck.log 2>&1
          status=$?
          echo "TYPECHECK_EXIT_CODE=$status" >> phase3-typecheck.log
          exit 0

      - name: Upload TypeScript diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase3-typecheck-${{ github.sha }}
          path: phase3-typecheck.log
          if-no-files-found: error
          retention-days: 1
