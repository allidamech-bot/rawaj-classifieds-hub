name: Phase 3 Formatting Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 3 files
        run: |
          npx prettier --write \
            e2e/production-smoke.spec.ts \
            scripts/dynamic-sitemap.test.mjs \
            scripts/performance-budget.mjs \
            scripts/phases-54-56-performance-observability.test.mjs \
            src/lib/client-error-monitoring.ts \
            src/routes/sitemap[.]xml.ts \
            src/server.ts
          git diff --binary > phase3-prettier.patch

      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: phase3-prettier-${{ github.sha }}
          path: phase3-prettier.patch
          if-no-files-found: error
          retention-days: 1
