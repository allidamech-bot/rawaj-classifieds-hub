name: Syria Launch Tooling

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/syria-launch-closure.md"
      - "scripts/summarize-supabase-storage-logs.mjs"
      - "scripts/supabase-storage-log-summary.test.mjs"
      - "scripts/syria-launch-closure-contract.test.mjs"
      - "scripts/sql/listing-images-storage-integrity-audit.sql"
      - ".github/workflows/syria-launch-closure.yml"
      - ".github/workflows/syria-lint-diagnostic.yml"
  push:
    branches:
      - main
    paths:
      - "docs/syria-launch-closure.md"
      - "scripts/summarize-supabase-storage-logs.mjs"
      - "scripts/supabase-storage-log-summary.test.mjs"
      - "scripts/syria-launch-closure-contract.test.mjs"
      - "scripts/sql/listing-images-storage-integrity-audit.sql"
      - ".github/workflows/syria-launch-closure.yml"
      - ".github/workflows/syria-lint-diagnostic.yml"

concurrency:
  group: syria-launch-tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Lint Storage Egress tooling
        run: npx eslint --quiet scripts/summarize-supabase-storage-logs.mjs

      - name: Verify canonical formatting
        run: npx prettier --check scripts/summarize-supabase-storage-logs.mjs

      - name: Run Syria launch tooling contracts
        run: |
          node --test scripts/supabase-storage-log-summary.test.mjs
          node --test scripts/syria-launch-closure-contract.test.mjs
