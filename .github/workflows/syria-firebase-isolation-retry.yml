name: Syria Firebase isolation retry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/syria-firebase-isolation-retry.yml"

permissions:
  contents: write

concurrency:
  group: syria-firebase-isolation-retry
  cancel-in-progress: false

jobs:
  isolate:
    if: github.head_ref == 'migration/syria-standalone-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Syria hardening branch
        uses: actions/checkout@v4
        with:
          ref: migration/syria-standalone-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Firebase isolation
        run: python scripts/apply-syria-firebase-isolation.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Validate Firebase and market isolation
        run: |
          node --test scripts/syria-firebase-isolation.test.mjs
          node scripts/syria-runtime-residual-audit.mjs
          node --test scripts/backend-boundary-hardening.test.mjs
          node --test scripts/cloudflare-cutover-foundation.test.mjs

      - name: Type-check application and Worker
        run: |
          npm run typecheck
          npm run typecheck --prefix cloudflare/worker

      - name: Build application
        run: npm run build

      - name: Commit verified Firebase isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch scripts/apply-syria-firebase-isolation.py
          git rm --ignore-unmatch .github/workflows/syria-firebase-isolation-retry.yml
          git add -A
          git commit -m 'chore(syria): isolate Firebase configuration'
          git push origin HEAD:migration/syria-standalone-hardening
