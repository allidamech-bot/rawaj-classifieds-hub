name: Android Media and Location Permissions

on:
  pull_request:
    paths:
      - "android/app/src/main/AndroidManifest.xml"
      - "scripts/android-media-location-permissions.test.mjs"
      - ".github/workflows/android-media-location-permissions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Android media and location permission contract
        run: node --test scripts/android-media-location-permissions.test.mjs
