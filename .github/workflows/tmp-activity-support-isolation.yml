name: Temporary Activity Support Isolation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - ".github/workflows/tmp-activity-support-isolation.yml"

concurrency:
  group: temporary-activity-support-isolation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/activity-support-account-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/activity-support-account-isolation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply account isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"Expected one {label}, found {count}")
              return text.replace(before, after)

          activity_path = Path("src/routes/activity.tsx")
          activity = activity_path.read_text(encoding="utf-8")
          activity = replace_exact(
              activity,
              '  const profileId = auth.profile?.id ?? null;\n  const activeTab: ActivityTab = search.tab ?? "notifications";',
              '  const profileId = auth.profile?.id ?? null;\n  const profileIdRef = useRef<string | null>(profileId);\n  profileIdRef.current = profileId;\n  const activeTab: ActivityTab = search.tab ?? "notifications";',
              "activity live profile ref",
          )
          old_guard = "currentProfileId !== auth.profile?.id"
          if activity.count(old_guard) != 2:
              raise SystemExit(f"Expected two activity stale guards, found {activity.count(old_guard)}")
          activity = activity.replace(old_guard, "currentProfileId !== profileIdRef.current")
          if activity.count("}, [auth.profile?.id, profileId]);") != 2:
              raise SystemExit("Expected two activity callback dependency lists")
          activity = activity.replace("}, [auth.profile?.id, profileId]);", "}, [profileId]);")
          activity_path.write_text(activity, encoding="utf-8")

          support_path = Path("src/routes/support.tsx")
          support = support_path.read_text(encoding="utf-8")
          support = replace_exact(
              support,
              '  const requestsRequestIdRef = useRef(0);\n  const submitInFlightRef = useRef(false);\n  const profileId = auth.profile?.id ?? null;',
              '  const requestsRequestIdRef = useRef(0);\n  const loadedProfileIdRef = useRef<string | null>(null);\n  const profileId = auth.profile?.id ?? null;\n  const profileIdRef = useRef<string | null>(profileId);\n  const submitScopesRef = useRef<Set<string>>(new Set());\n  profileIdRef.current = profileId;',
              "support action refs",
          )
          support = replace_exact(
              support,
              '    if (requestId !== requestsRequestIdRef.current || currentProfileId !== auth.profile?.id) return;',
              '    if (requestId !== requestsRequestIdRef.current || currentProfileId !== profileIdRef.current)\n      return;',
              "support load stale guard",
          )
          support = replace_exact(
              support,
              '  }, [auth.profile?.id, profileId]);',
              '  }, [profileId]);',
              "support callback dependencies",
          )
          old_effect = '''  useEffect(() => {
    requestsRequestIdRef.current += 1;
    if (auth.status !== "signedIn" || !profileId) {
      setRequests([]);
      setRequestsError(null);
      setRequestsLoading(false);
      setRequestsHasLoaded(false);
      submitInFlightRef.current = false;
      return;
    }

    setRequests([]);
    setRequestsError(null);
    setRequestsLoading(false);
    setRequestsHasLoaded(false);
    void loadRequests();

    return () => {
      requestsRequestIdRef.current += 1;
      submitInFlightRef.current = false;
    };
  }, [auth.status, loadRequests, profileId]);'''
          new_effect = '''  useEffect(() => {
    requestsRequestIdRef.current += 1;
    if (auth.status !== "signedIn" || !profileId) {
      loadedProfileIdRef.current = null;
      setRequests([]);
      setRequestsError(null);
      setRequestsLoading(false);
      setRequestsHasLoaded(false);
      setRequestType("technical_issue");
      setSubject("");
      setMessage("");
      setRelatedListingId("");
      setSubmitting(false);
      setNotice("");
      return;
    }

    const accountChanged = loadedProfileIdRef.current !== profileId;
    loadedProfileIdRef.current = profileId;
    setRequests([]);
    setRequestsError(null);
    setRequestsLoading(false);
    setRequestsHasLoaded(false);
    if (accountChanged) {
      setRequestType("technical_issue");
      setSubject("");
      setMessage("");
      setRelatedListingId("");
      setSubmitting(false);
      setNotice("");
    }
    void loadRequests();

    return () => {
      requestsRequestIdRef.current += 1;
    };
  }, [auth.status, loadRequests, profileId]);'''
          support = replace_exact(support, old_effect, new_effect, "support account reset effect")
          old_submit = '''  async function submitRequest(event: FormEvent<HTMLFormElement>) {
    event.preventDefault();
    if (submitInFlightRef.current) return;
    submitInFlightRef.current = true;
    setNotice("");
    setSubmitting(true);
    const currentProfileId = profileId;

    try {
      const result = await createSupportRequest(currentProfileId, {
        type: requestType,
        subject,
        message,
        relatedListingId: relatedListingId || null,
      });

      if (currentProfileId !== auth.profile?.id) return;
      if (!result.ok) {
        setNotice(result.error.message);
        return;
      }

      setRequests((current) => [
        result.data,
        ...current.filter((item) => item.id !== result.data.id),
      ]);
      setRequestsHasLoaded(true);
      setSubject("");
      setMessage("");
      setRelatedListingId("");
      setRequestType("technical_issue");
      setNotice(text("تم إرسال طلب الدعم للمراجعة.", "Support request submitted for review."));
    } finally {
      submitInFlightRef.current = false;
      if (currentProfileId === auth.profile?.id) setSubmitting(false);
    }
  }'''
          new_submit = '''  async function submitRequest(event: FormEvent<HTMLFormElement>) {
    event.preventDefault();
    const currentProfileId = profileId;
    if (!currentProfileId || submitScopesRef.current.has(currentProfileId)) return;

    const payload = {
      type: requestType,
      subject,
      message,
      relatedListingId: relatedListingId || null,
    };
    submitScopesRef.current.add(currentProfileId);
    setNotice("");
    setSubmitting(true);

    try {
      const result = await createSupportRequest(currentProfileId, payload);
      if (currentProfileId !== profileIdRef.current) return;
      if (!result.ok) {
        setNotice(result.error.message);
        return;
      }

      setRequests((current) => [
        result.data,
        ...current.filter((item) => item.id !== result.data.id),
      ]);
      setRequestsHasLoaded(true);
      setSubject("");
      setMessage("");
      setRelatedListingId("");
      setRequestType("technical_issue");
      setNotice(text("تم إرسال طلب الدعم للمراجعة.", "Support request submitted for review."));
    } finally {
      submitScopesRef.current.delete(currentProfileId);
      if (currentProfileId === profileIdRef.current) setSubmitting(false);
    }
  }'''
          support = replace_exact(support, old_submit, new_submit, "support account-scoped submit")
          support_path.write_text(support, encoding="utf-8")
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/account-surface-action-isolation.test.mjs")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "  authProvider,\n  offers,",
              "  authProvider,\n  activity,\n  support,\n  offers,",
          )
          source = source.replace(
              '  readFile(new URL("../src/lib/auth.tsx", import.meta.url), "utf8"),\n  readFile(new URL("../src/routes/offers.tsx", import.meta.url), "utf8"),',
              '  readFile(new URL("../src/lib/auth.tsx", import.meta.url), "utf8"),\n  readFile(new URL("../src/routes/activity.tsx", import.meta.url), "utf8"),\n  readFile(new URL("../src/routes/support.tsx", import.meta.url), "utf8"),\n  readFile(new URL("../src/routes/offers.tsx", import.meta.url), "utf8"),',
          )
          marker = '''test("offers stay public and outside account isolation state", () => {'''
          inserted = '''test("activity center reads compare results with the live account", () => {
            assert.match(activity, /profileIdRef = useRef<string \\| null>/);
            assert.equal((activity.match(/currentProfileId !== profileIdRef\\.current/g) ?? []).length, 2);
            assert.doesNotMatch(activity, /currentProfileId !== auth\\.profile\\?\\.id/);
          });

          test("support reads, form state, writes, and finalizers are account-scoped", () => {
            assert.match(support, /loadedProfileIdRef = useRef<string \\| null>/);
            assert.match(support, /submitScopesRef = useRef<Set<string>>/);
            assert.match(support, /submitScopesRef\\.current\\.has\\(currentProfileId\\)/);
            assert.match(support, /const payload = \\{/);
            assert.match(support, /currentProfileId !== profileIdRef\\.current/);
            assert.match(support, /submitScopesRef\\.current\\.delete\\(currentProfileId\\)/);
            assert.match(support, /if \\(accountChanged\\) \\{[\\s\\S]*setSubject\\(""\\)/);
            assert.doesNotMatch(support, /submitInFlightRef/);
          });

          '''
          if source.count(marker) != 1:
              raise SystemExit("Offers test marker not found exactly once")
          source = source.replace(marker, inserted + marker)
          path.write_text(source, encoding="utf-8")
          PY

          npx prettier --write \
            src/routes/activity.tsx \
            src/routes/support.tsx \
            scripts/account-surface-action-isolation.test.mjs
          npm run test:activity-center
          npm run typecheck

      - name: Commit implementation and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-activity-support-isolation.yml tmp-activity-support-trigger.txt
          git add src/routes/activity.tsx src/routes/support.tsx scripts/account-surface-action-isolation.test.mjs
          git commit -m "fix: isolate activity and support by account"
          git push origin HEAD:audit/activity-support-account-isolation
