name: Fix SYP Compatibility Lint

on:
  push:
    branches:
      - agent/syp-denomination-phase-a-compat-fix
    paths:
      - ".github/workflows/fix-syp-compat-lint.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/syp-denomination-phase-a-compat-fix
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Apply lint and formatting fixes
        run: |
          npx eslint --fix \
            scripts/public-data-security.test.mjs \
            src/lib/api/location-aware-listings.ts \
            src/lib/api/price-drops.ts \
            src/lib/api/seller.ts
          npx prettier --write \
            scripts/public-data-security.test.mjs \
            src/lib/api/location-aware-listings.ts \
            src/lib/api/price-drops.ts \
            src/lib/api/seller.ts >/dev/null

      - name: Verify focused security contract
        run: node --test scripts/public-data-security.test.mjs

      - name: Verify lint
        run: npx eslint --quiet scripts/public-data-security.test.mjs src/lib/api/location-aware-listings.ts src/lib/api/price-drops.ts src/lib/api/seller.ts

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Verify production build
        run: npm run build

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-syp-compat-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate remaining SYP compatibility readers"
          git push origin HEAD:agent/syp-denomination-phase-a-compat-fix
