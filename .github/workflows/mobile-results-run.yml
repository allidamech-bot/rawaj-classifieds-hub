name: Mobile results redesign runner

on:
  push:
    branches:
      - mobile-results-filters-redesign

permissions:
  contents: write

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message, '[skip mobile results runner]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-results-filters-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-mobile-results-redesign.mjs
      - run: npx prettier --write src/routes/listings.index.tsx
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/listings.index.tsx
          git commit -m "Redesign mobile listing results [skip mobile results runner]"
          git push origin HEAD:mobile-results-filters-redesign
