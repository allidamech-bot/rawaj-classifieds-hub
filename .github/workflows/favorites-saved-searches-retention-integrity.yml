name: Favorites, Saved Searches & Retention Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/api/favorites.ts"
      - "src/lib/api/saved-searches.ts"
      - "src/routes/favorites.tsx"
      - "src/routes/saved-searches.tsx"
      - "src/lib/api/notification-target-resolution.ts"
      - "supabase/migrations/**"
      - "scripts/favorites-saved-searches-retention-integrity.test.mjs"
      - "scripts/search-results-taxonomy-integrity.test.mjs"
      - ".github/workflows/favorites-saved-searches-retention-integrity.yml"
      - ".github/workflows/quality-gate.yml"
      - "package.json"
      - "docs/production-schema/migration-ledger.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-15-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture saved-search lint report
        shell: bash
        run: |
          set +e
          npx eslint src/lib/api/saved-searches.ts > saved-search-lint.txt 2>&1
          echo $? > saved-search-lint-status.txt
          exit 0

      - name: Upload saved-search lint report
        uses: actions/upload-artifact@v4
        with:
          name: phase-15-lint-report
          path: |
            saved-search-lint.txt
            saved-search-lint-status.txt
          if-no-files-found: error

      - name: Enforce saved-search lint
        shell: bash
        run: |
          cat saved-search-lint.txt
          test "$(cat saved-search-lint-status.txt)" = "0"

      - name: Lint Phase 15 contract
        run: npx eslint --quiet scripts/favorites-saved-searches-retention-integrity.test.mjs

      - name: Lint taxonomy compatibility contract
        run: npx eslint --quiet scripts/search-results-taxonomy-integrity.test.mjs

      - name: Phase 15 focused contract
        run: npm run test:favorites-saved-searches-retention

      - name: Typecheck
        run: npm run typecheck -- --pretty false
