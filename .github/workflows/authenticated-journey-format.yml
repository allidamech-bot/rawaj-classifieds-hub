name: Authenticated Journey Format

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authenticated-journey-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/critical-authenticated-journey'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-authenticated-journey
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format maintenance files
        run: |
          npx prettier --write \
            e2e/authenticated-critical-journey.spec.ts \
            e2e/firebase-auth-fixture.ts \
            e2e/rawaj-e2e-private-fixtures.ts \
            scripts/authenticated-e2e-isolation.test.mjs \
            scripts/backend-boundary-hardening.test.mjs \
            vite.config.ts
      - name: Commit formatting to the maintenance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/authenticated-critical-journey.spec.ts \
            e2e/firebase-auth-fixture.ts \
            e2e/rawaj-e2e-private-fixtures.ts \
            scripts/authenticated-e2e-isolation.test.mjs \
            scripts/backend-boundary-hardening.test.mjs \
            vite.config.ts
          if git diff --cached --quiet; then
            echo "Files are already formatted."
          else
            git commit -m "style: format authenticated journey fixtures"
            git push origin HEAD:fix/critical-authenticated-journey
          fi
