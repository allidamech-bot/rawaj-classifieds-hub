name: Campaign Manager Route Generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'feature/campaign-manager' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-manager
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route tree through build
        run: npm run build || true
      - name: Verify generated route contains campaign route
        shell: bash
        run: grep -q 'admin/campaigns' src/routeTree.gen.ts
      - name: Remove diagnostics and workflow then commit
        shell: bash
        run: |
          rm -f campaign-typecheck-output.txt
          rm .github/workflows/campaign-routegen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts campaign-typecheck-output.txt .github/workflows/campaign-routegen.yml
          git commit -m "Generate campaign manager route tree"
          git push origin HEAD:feature/campaign-manager
