name: Nearby Discovery UI V1

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/listings.index.tsx"
      - "src/features/listings/NearbyDiscoveryControl.tsx"
      - "src/features/listings/use-nearby-discovery.ts"
      - "scripts/nearby-discovery-ui-v1.test.mjs"
      - ".github/workflows/nearby-discovery-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check src/routes/listings.index.tsx src/features/listings/NearbyDiscoveryControl.tsx src/features/listings/use-nearby-discovery.ts scripts/nearby-discovery-ui-v1.test.mjs .github/workflows/nearby-discovery-ui-v1.yml
      - run: npx eslint --quiet src/routes/listings.index.tsx src/features/listings/NearbyDiscoveryControl.tsx src/features/listings/use-nearby-discovery.ts scripts/nearby-discovery-ui-v1.test.mjs
      - run: node --test scripts/nearby-discovery-ui-v1.test.mjs
      - run: npm run typecheck -- --pretty false
