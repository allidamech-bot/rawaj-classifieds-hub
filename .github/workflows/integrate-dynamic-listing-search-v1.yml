name: Integrate Dynamic Listing Search V1

on:
  pull_request:
    paths:
      - "scripts/integrate-dynamic-listing-search-v1.py"
      - ".github/workflows/integrate-dynamic-listing-search-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-dynamic-listing-search-v1
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate dynamic listing search
        run: |
          set -euo pipefail
          python scripts/integrate-dynamic-listing-search-v1.py
          npx prettier --write src/lib/api/listings.ts
          grep -q 'fetchDynamicFilteredPublicListings' src/lib/api/listings.ts
          grep -q 'hasDynamicListingFilters' src/lib/api/listings.ts
          if ! git diff --quiet -- src/lib/api/listings.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/api/listings.ts
            git commit -m "feat: route governed filters through dynamic search"
            git push origin HEAD:feature/taxonomy-search-foundation-v1
          fi
