name: Apply Saudi support admin fix

"on":
  pull_request:
    branches:
      - saudi

permissions:
  contents: write

concurrency:
  group: apply-saudi-support-admin-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply focused patch
        run: node scripts/apply-saudi-admin-support-fix.mjs

      - name: Validate Worker and regression test
        working-directory: cloudflare/worker
        run: |
          npm ci
          npm install --no-save jose@^6
          npm run typecheck
          node --test test/support-admin.test.mjs

      - name: Commit final source and test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker/src/trust-support.ts cloudflare/worker/test/support-admin.test.mjs
          git add -u scripts/apply-saudi-admin-support-fix.mjs .github/workflows/apply-saudi-admin-support-fix.yml
          git commit -m "fix(saudi): add admin support request workflow"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
