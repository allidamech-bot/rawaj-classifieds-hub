name: Temporary listing orphan format

on:
  push:
    branches:
      - feature/listing-image-orphan-recovery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/listing-image-orphan-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            scripts/listing-image-content-reliability.test.mjs \
            src/lib/api/listing-image-upload-guarded.ts \
            src/lib/api/listing-image-upload-journal.ts
      - shell: bash
        run: |
          if git diff --quiet; then
            echo "FORMAT_NO_CHANGES" > formatter-result.txt
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              scripts/listing-image-content-reliability.test.mjs \
              src/lib/api/listing-image-upload-guarded.ts \
              src/lib/api/listing-image-upload-journal.ts
            git commit -m "Format listing image orphan recovery"
            git push origin HEAD:feature/listing-image-orphan-recovery
          fi
