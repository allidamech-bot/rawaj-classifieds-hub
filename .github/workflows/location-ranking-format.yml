name: Format location search ranking

on:
  push:
    branches:
      - location-search-ranking

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip ranking format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-search-ranking
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/api/location-taxonomy.ts src/features/locations/CanonicalLocationSelector.tsx
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api/location-taxonomy.ts src/features/locations/CanonicalLocationSelector.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format location search ranking [skip ranking format]"
          git push origin HEAD:location-search-ranking
