name: Rendered Visual QA

on:
  pull_request:
    branches:
      - main
      - review/firebase-design-baseline
    paths:
      - "src/**"
      - "e2e/rendered-visual-qa.spec.ts"
      - "e2e/authenticated-rendered-visual-qa.spec.ts"
      - "e2e/layout-audit.ts"
      - ".github/workflows/rendered-visual-qa.yml"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Audit and capture rendered surfaces
        env:
          RAWAJ_E2E_USE_FIXTURES: "1"
          RAWAJ_E2E_API_PROXY_TARGET: "https://rawaj-classifieds-hub.allidamech.workers.dev"
          VITE_PUBLIC_DATA_API_BASE_URL: "http://127.0.0.1:4173"
          VITE_RAWAJ_E2E_DISABLE_REMOTE_MEDIA: "1"
        run: npx playwright test e2e/rendered-visual-qa.spec.ts e2e/authenticated-rendered-visual-qa.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Upload rendered screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-visual-qa-${{ github.run_id }}
          path: test-results
          if-no-files-found: error
          retention-days: 7
