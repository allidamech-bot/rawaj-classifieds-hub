name: Capture Listing Delete Typecheck

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture typecheck output
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false > typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 120 typecheck.log
          exit 0
      - name: Upload typecheck log
        uses: actions/upload-artifact@v4
        with:
          name: listing-delete-typecheck-log
          path: typecheck.log
          if-no-files-found: error
      - name: Fail when typecheck failed
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
