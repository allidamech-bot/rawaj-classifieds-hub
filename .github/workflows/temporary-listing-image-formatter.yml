name: Temporary listing image formatter

on:
  push:
    branches:
      - feature/listing-image-content-reliability

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/listing-image-content-reliability
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            package.json \
            scripts/listing-image-content-reliability.test.mjs \
            src/lib/api/listing-image-upload-guarded.ts \
            src/lib/api/listing-image-upload-retry.ts \
            src/lib/classifieds-api.ts \
            src/lib/listing-image-processing.ts

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Files already match project formatting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            scripts/listing-image-content-reliability.test.mjs \
            src/lib/api/listing-image-upload-guarded.ts \
            src/lib/api/listing-image-upload-retry.ts \
            src/lib/classifieds-api.ts \
            src/lib/listing-image-processing.ts
          git commit -m "Format listing image reliability files"
          git push origin HEAD:feature/listing-image-content-reliability
