name: Android Release Candidate

on:
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Validate web and native contracts
        run: |
          npm run typecheck
          node --test scripts/android-media-location-permissions.test.mjs
          node --test scripts/android-deep-link-oauth-readiness.test.mjs
      - name: Build web assets
        run: npm run build
      - name: Synchronize Capacitor Android project
        run: npx cap sync android
      - name: Build Android release candidate
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest bundleRelease assembleRelease --stacktrace --console=plain
      - name: Collect release candidate metadata
        run: |
          mkdir -p android-rc
          cp android/app/build/outputs/bundle/release/app-release.aab android-rc/rawaj-1.0.4-rc1-unsigned.aab
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-rc/rawaj-1.0.4-rc1-unsigned.apk
          sha256sum android-rc/* > android-rc/SHA256SUMS.txt
          printf '%s\n' \
            'RAWAJ Android Release Candidate' \
            'Version name: 1.0.4' \
            'Version code: 5' \
            'Signing: unsigned CI candidate; Play signing remains an external acceptance gate' \
            "Source commit: $GITHUB_SHA" \
            > android-rc/README.txt
      - name: Upload Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-android-1.0.4-rc1
          path: android-rc/
          if-no-files-found: error
          retention-days: 14
