name: Format notification recovery

on:
  push:
    branches:
      - feature/preserve-notification-snapshots

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/preserve-notification-snapshots
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx eslint --fix src/routes/notifications.tsx scripts/communication-center-v2.test.mjs
      - name: Commit formatting and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-notification-recovery.yml
          git add src/routes/notifications.tsx scripts/communication-center-v2.test.mjs
          git commit -m "Format notification recovery files"
          git push origin HEAD:feature/preserve-notification-snapshots
