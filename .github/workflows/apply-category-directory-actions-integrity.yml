name: Apply Category Directory Actions Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-category-directory-actions-integrity.mjs"
      - ".github/workflows/apply-category-directory-actions-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-site-actions-integrity-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded category repair
        id: repair
        continue-on-error: true
        run: node scripts/apply-category-directory-actions-integrity.mjs > category-repair.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-repair-${{ github.sha }}
          path: category-repair.log
          retention-days: 7
      - if: steps.repair.outcome == 'failure'
        run: exit 1
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/categories.tsx scripts/apply-category-directory-actions-integrity.mjs
          git commit -m "fix: harden category retry lifecycle"
          git push origin HEAD:agent/full-site-actions-integrity-audit
