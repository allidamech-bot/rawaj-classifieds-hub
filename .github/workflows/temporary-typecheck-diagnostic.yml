name: Temporary Typecheck Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'design/trust-support-hub-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/trust-support-hub-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture typecheck output
        shell: bash
        run: |
          npm run typecheck -- --pretty false > typecheck-diagnostic.txt 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-diagnostic.txt
          git commit -m "Capture Trust Support Hub typecheck diagnostics"
          git push origin HEAD:design/trust-support-hub-v2
