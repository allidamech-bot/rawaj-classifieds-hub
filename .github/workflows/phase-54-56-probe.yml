name: Phase 54-56 Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed sources
        run: npx prettier --write src/lib/lovable-error-reporting.ts src/lib/client-error-monitoring.ts src/router.tsx scripts/performance-budget.mjs scripts/phases-54-56-performance-observability.test.mjs
      - name: Capture lint result
        shell: bash
        run: npx eslint --quiet src/lib/lovable-error-reporting.ts src/lib/client-error-monitoring.ts src/router.tsx scripts/performance-budget.mjs scripts/phases-54-56-performance-observability.test.mjs > lint-result.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase-54-56-probe
          path: |
            src/lib/lovable-error-reporting.ts
            src/lib/client-error-monitoring.ts
            src/router.tsx
            scripts/performance-budget.mjs
            scripts/phases-54-56-performance-observability.test.mjs
            lint-result.txt
