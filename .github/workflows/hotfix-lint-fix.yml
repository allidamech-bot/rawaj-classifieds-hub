name: Hotfix Lint Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'hotfix/location-submit-listing-visibility' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/location-submit-listing-visibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix changed source files
        run: >-
          npx eslint --fix
          src/lib/api/listing-location-write.ts
          src/lib/api/listings.ts
          src/routes/add-listing.tsx
          src/routes/listings.index.tsx
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/hotfix-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/listing-location-write.ts src/lib/api/listings.ts src/routes/add-listing.tsx src/routes/listings.index.tsx .github/workflows/hotfix-lint-fix.yml
          if git diff --cached --quiet; then
            echo "No lint fixes needed."
            exit 0
          fi
          git commit -m "Fix hotfix lint issues"
          git push origin HEAD:hotfix/location-submit-listing-visibility
