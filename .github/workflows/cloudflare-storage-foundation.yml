name: Cloudflare Storage Foundation

on:
  pull_request:
  push:
    branches:
      - feature/cloudflare-storage-migration-continuation

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate migration tool syntax
        run: node --check scripts/migrate-supabase-listing-images-to-r2.mjs

      - name: Validate Cloudflare storage foundation
        run: node --test scripts/cloudflare-storage-foundation.test.mjs
