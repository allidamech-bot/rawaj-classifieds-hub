name: Deploy Worker 3b04 Media Fix Monitor

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-worker-3b04-media-fix.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAIN_SHA: 3b04eded7bbc5631391a0bb2bb07e4b1264f72bd
      REVIEWED_RELEASE_SHA: 3b04eded7bbc5631391a0bb2bb07e4b1264f72bd
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Confirm exact main HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).object.sha))')"
          test "$actual" = "$MAIN_SHA"

      - name: Dispatch permanent official Worker workflow
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          started_epoch="$(date +%s)"
          echo "started_epoch=$started_epoch" >> "$GITHUB_OUTPUT"
          payload="$(MAIN_SHA="$MAIN_SHA" REVIEWED_RELEASE_SHA="$REVIEWED_RELEASE_SHA" node -e 'process.stdout.write(JSON.stringify({ref:"main",inputs:{approval_phrase:"DEPLOY_RAWAJ_WORKER_PRODUCTION",expected_commit_sha:process.env.MAIN_SHA,reviewed_release_sha:process.env.REVIEWED_RELEASE_SHA}}))')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cloudflare-production-worker-deploy.yml/dispatches" \
            --data "$payload"

      - name: Locate official deployment run
        id: locate
        shell: bash
        env:
          STARTED_EPOCH: ${{ steps.dispatch.outputs.started_epoch }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cloudflare-production-worker-deploy.yml/runs?event=workflow_dispatch&branch=main&per_page=30" \
              > /tmp/worker-runs.json
            run_id="$(node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("/tmp/worker-runs.json","utf8"));const cutoff=Number(process.env.STARTED_EPOCH)*1000-60000;const run=(p.workflow_runs||[]).filter(r=>r.head_sha===process.env.MAIN_SHA&&new Date(r.created_at).getTime()>=cutoff).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];if(run?.id)process.stdout.write(String(run.id));')"
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Located official deployment run $run_id."
              exit 0
            fi
            sleep 5
          done
          echo "Could not locate official deployment run." >&2
          exit 1

      - name: Monitor official deployment run
        shell: bash
        env:
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        run: |
          set -euo pipefail
          for attempt in {1..180}; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              > /tmp/worker-run.json
            status="$(node -e 'const r=require("/tmp/worker-run.json");process.stdout.write(r.status||"")')"
            conclusion="$(node -e 'const r=require("/tmp/worker-run.json");process.stdout.write(r.conclusion||"pending")')"
            echo "Official Worker deployment: $status / $conclusion"
            if [[ "$status" == "completed" ]]; then
              test "$conclusion" = "success"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out monitoring official Worker deployment." >&2
          exit 1
