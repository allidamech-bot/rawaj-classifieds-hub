name: Check Saudi Vercel credentials

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-saudi-vercel-credentials.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    name: Check deploy credentials without disclosure
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_PR: "593"
      VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN_VALUE: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_ORG_ID_VALUE: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEAM_ID_VALUE: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID_VALUE: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SAUDI_PROJECT_ID_VALUE: ${{ secrets.VERCEL_SAUDI_PROJECT_ID }}
    steps:
      - name: Report credential availability only
        shell: bash
        run: |
          set -euo pipefail
          present() {
            if [ -n "$1" ]; then printf 'present'; else printf 'missing'; fi
          }
          {
            echo "## Saudi Vercel credential availability"
            echo
            echo "No secret values are displayed."
            echo
            echo "- VERCEL_TOKEN: \`$(present "${VERCEL_TOKEN_VALUE:-}")\`"
            echo "- VERCEL_ACCESS_TOKEN: \`$(present "${VERCEL_ACCESS_TOKEN_VALUE:-}")\`"
            echo "- VERCEL_ORG_ID: \`$(present "${VERCEL_ORG_ID_VALUE:-}")\`"
            echo "- VERCEL_TEAM_ID: \`$(present "${VERCEL_TEAM_ID_VALUE:-}")\`"
            echo "- VERCEL_PROJECT_ID: \`$(present "${VERCEL_PROJECT_ID_VALUE:-}")\`"
            echo "- VERCEL_SAUDI_PROJECT_ID: \`$(present "${VERCEL_SAUDI_PROJECT_ID_VALUE:-}")\`"
          } > /tmp/vercel-credential-report.md
          gh pr comment "$REPORT_PR" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/vercel-credential-report.md
