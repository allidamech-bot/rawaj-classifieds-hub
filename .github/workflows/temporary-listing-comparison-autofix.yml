name: Temporary listing comparison autofix

on:
  push:
    branches:
      - feature/listing-comparison-v1

permissions:
  contents: write

concurrency:
  group: temporary-listing-comparison-autofix
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/listing-comparison-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply safe formatter and lint fixes
        run: |
          npx prettier --write \
            src/features/comparison/listing-comparison.tsx \
            src/features/listings/RealListingCard.tsx \
            src/routes/__root.tsx \
            scripts/listing-comparison-v1.test.mjs \
            .github/workflows/quality-gate.yml
          npx eslint --fix \
            src/features/comparison/listing-comparison.tsx \
            src/features/listings/RealListingCard.tsx \
            src/routes/__root.tsx \
            scripts/listing-comparison-v1.test.mjs

      - name: Commit fixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/comparison/listing-comparison.tsx \
            src/features/listings/RealListingCard.tsx \
            src/routes/__root.tsx \
            scripts/listing-comparison-v1.test.mjs \
            .github/workflows/quality-gate.yml
          git commit -m "chore: format listing comparison implementation"
          git push origin HEAD:feature/listing-comparison-v1
