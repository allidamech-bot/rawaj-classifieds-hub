name: Security Regression Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'feature/final-admin-security-e2e-audit' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-admin-security-e2e-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture security regression output
        shell: bash
        run: node scripts/admin-security-regression.mjs > security-regression-output.txt 2>&1 || true
      - name: Remove workflow and commit diagnostics
        shell: bash
        run: |
          rm .github/workflows/security-regression-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-regression-output.txt .github/workflows/security-regression-diagnostics.yml
          git commit -m "Capture admin security regression diagnostics"
          git push origin HEAD:feature/final-admin-security-e2e-audit
