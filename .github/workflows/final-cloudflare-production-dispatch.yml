name: Final Cloudflare Post-Deploy Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/final-cloudflare-production-dispatch.yml

permissions:
  contents: read

jobs:
  probe:
    name: Probe deployed Worker endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify workers.dev release and system status
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
        run: |
          set -euo pipefail
          for path in /v1/health /v1/system-status; do
            body_file="/tmp/$(echo "$path" | tr '/' '_').json"
            status="$(curl --silent --show-error --max-time 20 \
              --output "$body_file" \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'Origin: https://rawa-j.com' \
              "https://rawaj-classifieds-hub.allidamech.workers.dev${path}" || true)"
            echo "workers.dev ${path}: HTTP ${status}"
            cat "$body_file" || true
            echo
            test "$status" = "200"
          done
          release="$(node -e "try{const d=require('/tmp/_v1_health.json');process.stdout.write(d?.data?.releaseSha??'')}catch{}")"
          environment="$(node -e "try{const d=require('/tmp/_v1_health.json');process.stdout.write(d?.data?.environment??'')}catch{}")"
          test "$release" = "$EXPECTED_RELEASE_SHA"
          test "$environment" = "production"

      - name: Report custom API domain state without mutation
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          for path in /v1/health /v1/system-status; do
            body_file="/tmp/api$(echo "$path" | tr '/' '_').json"
            status="$(curl --silent --show-error --max-time 20 \
              --output "$body_file" \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'Origin: https://rawa-j.com' \
              "https://api.rawa-j.com${path}" || true)"
            echo "api.rawa-j.com ${path}: HTTP ${status}"
            cat "$body_file" || true
            echo
          done
