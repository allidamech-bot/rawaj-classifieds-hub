name: SYP Redenomination Readiness

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/syp-redenomination.ts"
      - "scripts/syp-redenomination-readiness.test.mjs"
      - "scripts/sql/syp-redenomination-production-audit.sql"
      - "docs/syp-redenomination-readiness.md"
      - ".github/workflows/syp-redenomination-readiness.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/syp-redenomination.ts"
      - "scripts/syp-redenomination-readiness.test.mjs"
      - "scripts/sql/syp-redenomination-production-audit.sql"
      - "docs/syp-redenomination-readiness.md"
      - ".github/workflows/syp-redenomination-readiness.yml"

concurrency:
  group: syp-redenomination-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SYP redenomination readiness contract
        run: node --test scripts/syp-redenomination-readiness.test.mjs

      - name: TypeScript
        run: npm run typecheck -- --pretty false
