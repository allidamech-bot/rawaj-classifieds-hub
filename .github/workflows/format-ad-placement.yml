name: Format ad placement changes

on:
  push:
    branches:
      - feature/upload-ad-placement-images

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/upload-ad-placement-images
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/api/ad-placements.ts src/routes/admin.ad-placements.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/ad-placements.ts src/routes/admin.ad-placements.tsx
          git commit -m "Format ad placement image upload"
          git push origin HEAD:feature/upload-ad-placement-images
