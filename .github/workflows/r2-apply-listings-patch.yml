name: Apply R2 Listings Patch

on:
  push:
    branches:
      - agent/r2-listing-images-phase-1
    paths:
      - ".github/workflows/r2-apply-listings-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r2-listing-images-phase-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic R2 signing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/api/listings.ts")
          text = path.read_text(encoding="utf-8")

          import_anchor = 'import { prepareListingImageForUpload } from "@/lib/listing-image-processing";\n'
          r2_import = '''import {
            isR2ListingImagePath,
            readSupabaseAccessToken,
            signR2ListingImagePaths,
          } from "@/lib/r2-listing-images-client";
          '''
          if 'from "@/lib/r2-listing-images-client";' not in text:
              if import_anchor not in text:
                  raise SystemExit("R2 import anchor not found")
              text = text.replace(import_anchor, import_anchor + r2_import, 1)

          old = '''async function signListingImages(
            client: SupabaseClient,
            images: ListingImage[],
          ): Promise<ListingImage[]> {
            const paths = [...new Set(images.map((image) => image.storagePath).filter(Boolean))] as string[];
            if (paths.length === 0) return images;

            try {
              const { data, error } = await client.storage
                .from(listingImagesBucket)
                .createSignedUrls(paths, signedImageUrlExpiresInSeconds);

              if (error || !data) return images;

              const urlsByPath = new Map(
                data.filter((item) => item.signedUrl).map((item) => [item.path, item.signedUrl] as const),
              );

              return images.map((image) => {
                const signedUrl = image.storagePath ? urlsByPath.get(image.storagePath) : null;
                return signedUrl
                  ? { ...image, publicUrl: signedUrl, signedUrlExpiresIn: signedImageUrlExpiresInSeconds }
                  : image;
              });
            } catch {
              return images;
            }
          }
          '''

          new = '''async function signListingImages(
            client: SupabaseClient,
            images: ListingImage[],
          ): Promise<ListingImage[]> {
            const paths = [...new Set(images.map((image) => image.storagePath).filter(Boolean))] as string[];
            if (paths.length === 0) return images;

            const r2Paths = paths.filter(isR2ListingImagePath);
            const supabasePaths = paths.filter((path) => !isR2ListingImagePath(path));
            const urlsByPath = new Map<string, string>();

            if (supabasePaths.length > 0) {
              try {
                const { data, error } = await client.storage
                  .from(listingImagesBucket)
                  .createSignedUrls(supabasePaths, signedImageUrlExpiresInSeconds);

                if (!error && data) {
                  for (const item of data) {
                    if (item.signedUrl) urlsByPath.set(item.path, item.signedUrl);
                  }
                }
              } catch {
                // Preserve any R2 URLs resolved below when legacy signing is unavailable.
              }
            }

            if (r2Paths.length > 0) {
              const accessToken = await readSupabaseAccessToken(client);
              const r2Urls = await signR2ListingImagePaths(r2Paths, accessToken);
              for (const [path, url] of r2Urls) urlsByPath.set(path, url);
            }

            return images.map((image) => {
              const signedUrl = image.storagePath ? urlsByPath.get(image.storagePath) : null;
              return signedUrl
                ? { ...image, publicUrl: signedUrl, signedUrlExpiresIn: signedImageUrlExpiresInSeconds }
                : image;
            });
          }
          '''

          if old in text:
              text = text.replace(old, new, 1)
          elif "const r2Paths = paths.filter(isR2ListingImagePath);" not in text:
              raise SystemExit("Legacy signListingImages block not found")

          path.write_text(text, encoding="utf-8")
          PY
          npx prettier --write src/lib/api/listings.ts
          git diff --check
      - name: Commit central R2 signing
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "rawaj-r2-agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/api/listings.ts
          git commit -m "feat: sign R2 images across listing surfaces"
          git push origin HEAD:agent/r2-listing-images-phase-1
