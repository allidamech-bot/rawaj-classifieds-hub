name: RAWAJ One-Shot Production Release With D1

on:
  push:
    branches:
      - main
    paths:
      - "vercel.json"
      - ".github/workflows/one-shot-production-release-with-d1.yml"

permissions:
  contents: read

concurrency:
  group: rawaj-one-shot-production-release-with-d1
  cancel-in-progress: false

jobs:
  deploy-production-backend:
    name: Apply D1 migration and deploy current main Worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      REVIEWED_RELEASE_SHA: d268b4753781cbb38a11747fc02d3162896fc52e
      RAWAJ_WORKER_RELEASE_SHA: ${{ github.sha }}
      RAWAJ_WORKER_ENVIRONMENT: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: d0e6496c-9f63-48d3-beeb-d2e219500f6a
      CLOUDFLARE_D1_DATABASE_NAME: rawaj-staging
      CLOUDFLARE_R2_BUCKET_NAME: rawaj-listing-images-production
      CLOUDFLARE_WORKER_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_WORKER_CUSTOM_DOMAIN }}

    steps:
      - name: Validate controlled release context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This one-shot release may run only for a push to main." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release SHA is invalid." >&2
            exit 1
          fi
          if [[ ! "$REVIEWED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The reviewed release SHA is invalid." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Dedicated Cloudflare Production credentials are missing." >&2
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit and reviewed runtime
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_COMMIT_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          MAIN_HEAD_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$ACTUAL_COMMIT_SHA" != "$EXPECTED_COMMIT_SHA" || "$MAIN_HEAD_SHA" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "The selected release is not the current main HEAD." >&2
            exit 1
          fi
          git cat-file -e "$REVIEWED_RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$REVIEWED_RELEASE_SHA" "$EXPECTED_COMMIT_SHA"
          mapfile -t changed_files < <(git diff --name-only "$REVIEWED_RELEASE_SHA" "$EXPECTED_COMMIT_SHA")
          for path in "${changed_files[@]}"; do
            case "$path" in
              vercel.json|.github/workflows/one-shot-production-release-with-d1.yml)
                ;;
              *)
                echo "Unexpected runtime drift after the reviewed release: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/worker/package-lock.json

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Revalidate release and D1 migration ledger
        run: |
          npm run test:cloudflare-deployment-safety
          npm run test:d1-migrations
          npm run test:listing-price-offers
          npx tsc -p cloudflare/worker/tsconfig.json --noEmit

      - name: Render exact Production Worker configuration
        run: npm --prefix cloudflare/worker run render:production

      - name: Apply pending D1 migrations remotely
        working-directory: cloudflare/worker
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.generated.jsonc

      - name: Verify structured-offer migration on Production D1
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler d1 execute DB --remote --config wrangler.generated.jsonc --command "SELECT name FROM sqlite_schema WHERE type='table' AND name='listing_price_offers';")"
          printf '%s\n' "$output"
          if ! printf '%s' "$output" | grep -Fq "listing_price_offers"; then
            echo "Production D1 does not expose listing_price_offers after migration." >&2
            exit 1
          fi

      - name: Deploy matching Worker version
        working-directory: cloudflare/worker
        run: npx wrangler deploy --config wrangler.generated.jsonc

      - name: Verify deployed Worker release and read-only routes
        env:
          RAWAJ_WORKER_EXPECTED_RELEASE_SHA: ${{ github.sha }}
          RAWAJ_WORKER_BASE_URL: https://rawaj-classifieds-hub.allidamech.workers.dev
        run: npm --prefix cloudflare/worker run smoke:production:read-only

  production-acceptance:
    name: Verify matching Vercel Production release
    needs: deploy-production-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://rawa-j.com
      PRODUCTION_ACCEPTANCE: "1"
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RAWAJ_ACCEPTANCE_EMAIL: ${{ secrets.RAWAJ_ACCEPTANCE_EMAIL }}
      RAWAJ_ACCEPTANCE_PASSWORD: ${{ secrets.RAWAJ_ACCEPTANCE_PASSWORD }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate dedicated acceptance credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RAWAJ_ACCEPTANCE_EMAIL" || -z "$RAWAJ_ACCEPTANCE_PASSWORD" ]]; then
            echo "Production acceptance credentials are not configured." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for matching Vercel Production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            html="$(curl --fail --silent --show-error --max-time 15 https://rawa-j.com/ || true)"
            if printf '%s' "$html" | grep -Fq "name=\"rawaj-build-commit\" content=\"$EXPECTED_COMMIT_SHA\""; then
              echo "Vercel Production is serving $EXPECTED_COMMIT_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "RAWAJ Production did not deploy commit $EXPECTED_COMMIT_SHA in time." >&2
          exit 1

      - name: Run authenticated mobile Production Acceptance
        run: npx playwright test e2e/production-acceptance.spec.ts --project=mobile-chromium --workers=1

      - name: Upload acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: structured-offers-production-acceptance-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
