name: Format Marketplace Core V2

on:
  push:
    branches:
      - design/marketplace-core-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/marketplace-core-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            .github/workflows/quality-gate.yml \
            scripts/marketplace-core-v2.test.mjs \
            src/home-marketplace-v2.css \
            src/routes/__root.tsx \
            src/routes/index.tsx \
            src/features/listings/RealListingCard.tsx
          npx eslint --fix \
            scripts/marketplace-core-v2.test.mjs \
            src/routes/__root.tsx \
            src/routes/index.tsx \
            src/features/listings/RealListingCard.tsx

      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/format-marketplace-core-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format marketplace core V2"
          git push origin HEAD:design/marketplace-core-v2
