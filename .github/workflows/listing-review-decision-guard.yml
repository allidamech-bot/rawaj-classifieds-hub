name: Listing Review Decision Guard

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/listing-review-decision-guard.test.mjs"
      - ".github/workflows/listing-review-decision-guard.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --silent

      - name: Validate listing review decision guard
        run: node --test scripts/listing-review-decision-guard.test.mjs
