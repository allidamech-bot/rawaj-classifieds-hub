name: Apply Structured Offer Race Guard Once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-structured-offer-race-guard-once.yml
      - scripts/apply-structured-offer-race-guard-once.py
      - scripts/fix-structured-price-offer-contract-regex-once.py

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/structured-listing-price-offers-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/structured-listing-price-offers-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply contract correction and race guard
        run: |
          python scripts/fix-structured-price-offer-contract-regex-once.py
          python scripts/apply-structured-offer-race-guard-once.py

      - run: npm ci --ignore-scripts

      - name: Format and validate race guard
        run: |
          npx prettier --write cloudflare/worker/src/listing-offers.ts scripts/structured-listing-price-offers-v1.test.mjs
          npm run test:listing-price-offers
          npx tsc -p cloudflare/worker/tsconfig.json --noEmit
          npm run typecheck
          npm run build

      - name: Commit race guard and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-structured-offer-race-guard-once.yml
          git rm scripts/apply-structured-offer-race-guard-once.py
          git rm scripts/fix-structured-price-offer-contract-regex-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker/src/listing-offers.ts scripts/structured-listing-price-offers-v1.test.mjs
          git commit -m "fix(offers): guard concurrent offer transitions"
          git push origin HEAD:feature/structured-listing-price-offers-v1
