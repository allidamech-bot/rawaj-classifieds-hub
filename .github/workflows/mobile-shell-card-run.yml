name: Mobile shell card runner

on:
  push:
    branches:
      - mobile-shell-redesign

permissions:
  contents: write

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message, '[skip mobile card runner]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-shell-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-mobile-card-redesign.mjs
      - run: npx prettier --write src/features/listings/listings-components.tsx src/routes/index.tsx src/components/AppHeader.tsx src/components/BottomNav.tsx
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/listings/listings-components.tsx src/routes/index.tsx src/components/AppHeader.tsx src/components/BottomNav.tsx
          git commit -m "Redesign RAWAJ mobile shell [skip mobile card runner]"
          git push origin HEAD:mobile-shell-redesign
