name: Restore Syria parity baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'feat/syria-match-saudi-owner-listings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/syria-match-saudi-owner-listings
          fetch-depth: 0
      - name: Restore large Syria files from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- src/routes/profile/listings.tsx src/owner-listings-workspace-v9.css
          git rm .github/workflows/restore-syria-parity-baseline.yml
          if git diff --cached --quiet; then
            echo "Nothing to restore"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(syria): restore parity baseline files"
          git push origin HEAD:feat/syria-match-saudi-owner-listings
