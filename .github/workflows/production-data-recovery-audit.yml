name: Production Data and Auth Service Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-data-recovery-audit.yml

permissions:
  contents: read

jobs:
  cloudflare-data-integrity:
    name: D1 integrity, Time Travel, and R2 reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: d0e6496c-9f63-48d3-beeb-d2e219500f6a
      R2_BUCKET_NAME: rawaj-listing-images-production
    steps:
      - name: Verify Time Travel and application-level relational integrity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.D1_DATABASE_ID;
          const bucket = process.env.R2_BUCKET_NAME;
          if (!accountId || !token || !databaseId || !bucket) {
            throw new Error("Production Cloudflare audit credentials or fixed bindings are missing.");
          }

          const root = `https://api.cloudflare.com/client/v4/accounts/${accountId}`;
          const headers = { Authorization: `Bearer ${token}`, Accept: "application/json" };

          async function api(path, init = {}) {
            const response = await fetch(`${root}${path}`, {
              ...init,
              headers: {
                ...headers,
                ...(init.body ? { "Content-Type": "application/json" } : {}),
                ...(init.headers ?? {}),
              },
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
              const summary = Array.isArray(payload.errors)
                ? payload.errors.map((item) => item?.message).filter(Boolean).join("; ")
                : `HTTP ${response.status}`;
              throw new Error(`${path}: ${summary}`);
            }
            return payload.result;
          }

          async function query(sql) {
            const result = await api(`/d1/database/${databaseId}/query`, {
              method: "POST",
              body: JSON.stringify({ sql }),
            });
            const statement = Array.isArray(result) ? result[0] : result;
            if (!statement?.success) throw new Error(`D1 query failed: ${sql}`);
            return Array.isArray(statement.results) ? statement.results : [];
          }

          async function expectZero(label, sql) {
            const rows = await query(sql);
            const count = Number(rows[0]?.count ?? -1);
            if (count !== 0) throw new Error(`${label}: found ${count}.`);
          }

          const database = await api(`/d1/database/${databaseId}`);
          if (database?.name !== "rawaj-staging") throw new Error("Unexpected D1 database binding.");

          const bookmark = await api(`/d1/database/${databaseId}/time_travel/bookmark`);
          if (typeof bookmark?.bookmark !== "string" || bookmark.bookmark.length < 16) {
            throw new Error("D1 Time Travel did not return a usable recovery bookmark.");
          }
          console.log("D1 Time Travel bookmark is available.");

          await expectZero(
            "Retired authentication-provider rows remain active",
            "SELECT COUNT(*) AS count FROM auth_users WHERE auth_provider = 'supabase';",
          );
          await expectZero(
            "Duplicate Firebase identity links",
            `SELECT COUNT(*) AS count FROM (
               SELECT auth_user_id
               FROM auth_users
               WHERE auth_provider = 'firebase' AND auth_user_id IS NOT NULL
               GROUP BY auth_user_id
               HAVING COUNT(*) > 1
             )`,
          );
          await expectZero(
            "Auth users without profiles",
            `SELECT COUNT(*) AS count
             FROM auth_users AS au
             LEFT JOIN public_profiles AS pp ON pp.id = au.id
             WHERE pp.id IS NULL`,
          );
          await expectZero(
            "Orphan listing-image references",
            `SELECT COUNT(*) AS count
             FROM listing_images AS li
             LEFT JOIN listings AS l ON l.id = li.listing_id
             LEFT JOIN media_assets AS ma ON ma.id = li.media_asset_id
             WHERE l.id IS NULL OR ma.id IS NULL`,
          );
          await expectZero(
            "Orphan conversation participants",
            `SELECT COUNT(*) AS count
             FROM conversations AS c
             LEFT JOIN auth_users AS buyer ON buyer.id = c.buyer_id
             LEFT JOIN auth_users AS seller ON seller.id = c.seller_id
             WHERE buyer.id IS NULL OR seller.id IS NULL`,
          );
          await expectZero(
            "Orphan conversation messages",
            `SELECT COUNT(*) AS count
             FROM conversation_messages AS m
             LEFT JOIN conversations AS c ON c.id = m.conversation_id
             LEFT JOIN auth_users AS sender ON sender.id = m.sender_id
             WHERE c.id IS NULL OR sender.id IS NULL`,
          );
          await expectZero(
            "Orphan favorites",
            `SELECT COUNT(*) AS count
             FROM favorites AS f
             LEFT JOIN auth_users AS u ON u.id = f.user_id
             LEFT JOIN listings AS l ON l.id = f.listing_id
             WHERE u.id IS NULL OR l.id IS NULL`,
          );

          const counts = {};
          for (const table of [
            "auth_users",
            "public_profiles",
            "listings",
            "media_assets",
            "listing_images",
            "conversations",
            "conversation_messages",
          ]) {
            const rows = await query(`SELECT COUNT(*) AS count FROM ${table};`);
            counts[table] = Number(rows[0]?.count ?? 0);
          }
          console.log("D1 aggregate counts:", JSON.stringify(counts));

          const samples = await query(`
            SELECT ma.object_key
            FROM media_assets AS ma
            INNER JOIN listing_images AS li ON li.media_asset_id = ma.id
            WHERE ma.status = 'ready'
            ORDER BY ma.updated_at DESC
            LIMIT 5
          `);
          if (samples.length === 0) throw new Error("No ready listing media exists for R2 reconciliation.");

          for (const row of samples) {
            const key = row?.object_key;
            if (typeof key !== "string" || !key) throw new Error("Invalid media object key in D1.");
            const encoded = key.split("/").map(encodeURIComponent).join("/");
            const response = await fetch(
              `${root}/r2/buckets/${encodeURIComponent(bucket)}/objects/${encoded}`,
              { headers: { ...headers, Range: "bytes=0-0" } },
            );
            if (response.status !== 200 && response.status !== 206) {
              throw new Error(`A sampled D1 media object is missing from R2: HTTP ${response.status}`);
            }
            await response.body?.cancel().catch(() => undefined);
          }
          console.log(`Reconciled ${samples.length} recent D1 media object(s) with R2.`);
          NODE

  firebase-public-service:
    name: Firebase password and Google provider availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_WEB_API_KEY: AIzaSyCEx7XMl1vsLU3cvoDjrPav5WF54MFkn1U
    steps:
      - name: Verify email-password authentication service without creating data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const key = process.env.FIREBASE_WEB_API_KEY;
          const email = `rawaj-audit-${Date.now()}@example.invalid`;
          const response = await fetch(
            `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(key)}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password: "InvalidAuditPassword-9x!", returnSecureToken: true }),
            },
          );
          const payload = await response.json().catch(() => ({}));
          const message = payload?.error?.message ?? "";
          const expected = new Set(["INVALID_LOGIN_CREDENTIALS", "EMAIL_NOT_FOUND", "INVALID_PASSWORD"]);
          if (response.status !== 400 || !expected.has(message)) {
            throw new Error(`Firebase password service is not healthy: HTTP ${response.status} ${message}`);
          }
          console.log(`Firebase password provider responded with expected safe rejection: ${message}`);
          NODE

      - name: Verify Google provider can create an authorization URI
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const key = process.env.FIREBASE_WEB_API_KEY;
          const response = await fetch(
            `https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=${encodeURIComponent(key)}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                providerId: "google.com",
                continueUri: "https://rawa-j.com/login",
              }),
            },
          );
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload?.providerId !== "google.com" || typeof payload?.authUri !== "string") {
            throw new Error(
              `Firebase Google provider is unavailable: HTTP ${response.status} ${payload?.error?.message ?? ""}`,
            );
          }
          const authUri = new URL(payload.authUri);
          if (!authUri.hostname.endsWith("google.com")) {
            throw new Error("Firebase returned an unexpected Google authorization host.");
          }
          console.log("Firebase Google provider returned a valid authorization URI.");
          NODE

  production-dependency-audit:
    name: Runtime dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit application and Worker production dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/root-audit.json || true
          npm audit --prefix cloudflare/worker --omit=dev --json > /tmp/worker-audit.json || true
          node <<'NODE'
          const root = require("/tmp/root-audit.json");
          const worker = require("/tmp/worker-audit.json");

          function inspect(label, report) {
            const counts = report?.metadata?.vulnerabilities ?? {};
            console.log(`${label} production vulnerability counts:`, JSON.stringify(counts));
            const affected = Object.entries(report.vulnerabilities ?? {})
              .filter(([, item]) => item?.severity === "high" || item?.severity === "critical")
              .map(([name, item]) => ({
                name,
                severity: item.severity,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: (Array.isArray(item.via) ? item.via : [])
                  .map((entry) =>
                    typeof entry === "string"
                      ? entry
                      : `${entry?.title ?? "advisory"} (${entry?.url ?? "no-url"})`,
                  )
                  .slice(0, 5),
              }));
            if (affected.length > 0) console.log(`${label} findings:`, JSON.stringify(affected));
            return affected;
          }

          const affected = [...inspect("Application", root), ...inspect("Worker", worker)];
          if (affected.length > 0) {
            throw new Error(
              `High/critical production dependency findings: ${affected
                .map((item) => `${item.name}:${item.severity}`)
                .join(", ")}`,
            );
          }
          NODE
