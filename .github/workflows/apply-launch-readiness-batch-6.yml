name: Apply launch readiness Batch 6

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/apply-launch-readiness-batch-6.yml
      - scripts/apply-launch-readiness-batch-6.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness-batch-6
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply launch patch
        run: node scripts/apply-launch-readiness-batch-6.mjs

      - name: Generate route tree and production bundles
        run: npm run build

      - name: Format and lint Batch 6 source
        run: |
          npx eslint --fix \
            scripts/launch-readiness-batch-6.test.mjs \
            src/features/home/CategoryWorlds.tsx \
            src/lib/api/listings.ts \
            src/lib/seo.ts \
            src/routes/categories.tsx \
            'src/routes/categories.$slug.tsx' \
            src/routes/governorates.tsx \
            'src/routes/governorates.$slug.tsx' \
            'src/routes/sitemap[.]xml.ts'
          npx prettier --write package.json public/robots.txt
          npx eslint --quiet \
            scripts/launch-readiness-batch-6.test.mjs \
            src/features/home/CategoryWorlds.tsx \
            src/lib/api/listings.ts \
            src/lib/seo.ts \
            src/routes/categories.tsx \
            'src/routes/categories.$slug.tsx' \
            src/routes/governorates.tsx \
            'src/routes/governorates.$slug.tsx' \
            'src/routes/sitemap[.]xml.ts'

      - name: Run launch and SEO regressions
        run: |
          npm run test:launch-readiness-batch-6
          npm run test:seo-discovery
          npm run test:semantic-seo
          node --test scripts/dynamic-sitemap.test.mjs
          npm run test:deployment-truth
          npm run typecheck -- --pretty false

      - name: Commit source implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/robots.txt scripts/launch-readiness-batch-6.test.mjs src
          git commit -m "Complete public launch SEO readiness"
          git push origin HEAD:agent/launch-readiness-batch-6
