name: Apply launch readiness Batch 6

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/apply-launch-readiness-batch-6.yml
      - scripts/apply-launch-readiness-batch-6.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness-batch-6
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply launch patch
        run: node scripts/apply-launch-readiness-batch-6.mjs

      - name: Generate route tree and production bundles
        run: npm run build

      - name: Apply automatic formatting
        run: |
          npx eslint --fix \
            scripts/home-discovery-v3.test.mjs \
            scripts/launch-readiness-batch-6.test.mjs \
            src/features/home/CategoryWorlds.tsx \
            src/lib/api/listings.ts \
            src/lib/seo.ts \
            src/routes/categories.tsx \
            'src/routes/categories.$slug.tsx' \
            src/routes/governorates.tsx \
            'src/routes/governorates.$slug.tsx' \
            'src/routes/sitemap[.]xml.ts' || true
          npx prettier --write package.json

      - name: Lint Batch 6 tests
        run: npx eslint --quiet scripts/home-discovery-v3.test.mjs scripts/launch-readiness-batch-6.test.mjs

      - name: Lint Batch 6 API and SEO
        run: npx eslint --quiet src/lib/api/listings.ts src/lib/seo.ts

      - name: Lint Batch 6 route components
        run: |
          npx eslint --quiet \
            src/features/home/CategoryWorlds.tsx \
            src/routes/categories.tsx \
            'src/routes/categories.$slug.tsx' \
            src/routes/governorates.tsx \
            'src/routes/governorates.$slug.tsx' \
            'src/routes/sitemap[.]xml.ts'

      - name: Home discovery compatibility
        run: node --test scripts/home-discovery-v3.test.mjs

      - name: Social sharing contract
        run: node --test --test-name-pattern="all indexable pages" scripts/launch-readiness-batch-6.test.mjs

      - name: Public SEO landing contract
        run: node --test --test-name-pattern="category and governorate SEO pages" scripts/launch-readiness-batch-6.test.mjs

      - name: Governorate query boundary contract
        run: node --test --test-name-pattern="governorate landing listings" scripts/launch-readiness-batch-6.test.mjs

      - name: Canonical category links contract
        run: node --test --test-name-pattern="canonical category pages" scripts/launch-readiness-batch-6.test.mjs

      - name: Sitemap launch contract
        run: node --test --test-name-pattern="sitemap covers" scripts/launch-readiness-batch-6.test.mjs

      - name: Robots privacy contract
        run: node --test --test-name-pattern="robots keeps" scripts/launch-readiness-batch-6.test.mjs

      - name: Analytics and Android contract
        run: node --test --test-name-pattern="production analytics" scripts/launch-readiness-batch-6.test.mjs

      - name: Batch 6 gate wiring contract
        run: node --test --test-name-pattern="permanent in local and GitHub" scripts/launch-readiness-batch-6.test.mjs

      - name: SEO discovery compatibility
        run: npm run test:seo-discovery

      - name: Semantic SEO compatibility
        run: npm run test:semantic-seo

      - name: Dynamic sitemap compatibility
        run: node --test scripts/dynamic-sitemap.test.mjs

      - name: Deployment truth compatibility
        run: npm run test:deployment-truth

      - name: Typecheck launch routes
        run: npm run typecheck -- --pretty false

      - name: Commit source implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/robots.txt scripts/home-discovery-v3.test.mjs scripts/launch-readiness-batch-6.test.mjs src
          git commit -m "Complete public launch SEO readiness"
          git push origin HEAD:agent/launch-readiness-batch-6
