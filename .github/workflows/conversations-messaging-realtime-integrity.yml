name: Conversations Messaging Realtime Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/chats.tsx"
      - "src/routes/listings.$id.tsx"
      - "src/features/communication/**"
      - "src/lib/api/messaging*.ts"
      - "src/lib/api/message-send-request.ts"
      - "src/lib/chat-integrity.ts"
      - "src/lib/classifieds-types.ts"
      - "scripts/conversations-messaging-realtime-integrity.test.mjs"
      - ".github/workflows/conversations-messaging-realtime-integrity.yml"
      - ".github/workflows/quality-gate.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Conversations, Messaging & Realtime Integrity contract
        run: npm run test:conversations-messaging-realtime

      - name: Typecheck
        run: npm run typecheck -- --pretty false
