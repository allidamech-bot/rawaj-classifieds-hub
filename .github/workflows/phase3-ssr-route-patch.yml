name: Phase 3 SSR Route Patch

on:
  push:
    branches:
      - agent/phase-3-public-ssr-html
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-3-public-ssr-html

      - name: Patch large public routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/routes/categories.tsx",
              'import { PageHeader } from "@/components/PageHeader";\n',
              'import { PageHeader } from "@/components/PageHeader";\nimport { loadPublicCategoriesPageData } from "@/features/categories/public-categories-page-data";\n',
          )
          replace_once(
              "src/routes/categories.tsx",
              'export const Route = createFileRoute("/categories")({\n  validateSearch: categoriesSearchSchema,\n',
              'export const Route = createFileRoute("/categories")({\n  validateSearch: categoriesSearchSchema,\n  loader: loadPublicCategoriesPageData,\n',
          )
          replace_once(
              "src/routes/categories.tsx",
              'function CategoriesPage() {\n  const search = Route.useSearch();\n',
              'function CategoriesPage() {\n  const initialData = Route.useLoaderData();\n  const search = Route.useSearch();\n',
          )
          replace_once(
              "src/routes/categories.tsx",
              '''  const [taxonomyNodes, setTaxonomyNodes] = useState<TaxonomyNode[]>([]);
  const [taxonomyAvailable, setTaxonomyAvailable] = useState(false);
  const [categories, setCategories] = useState<ClassifiedCategory[]>([]);
  const [subcategories, setSubcategories] = useState<ClassifiedSubcategory[]>([]);
  const [query, setQuery] = useState(search.q ?? "");
  const [loading, setLoading] = useState(true);
  const [fetchError, setFetchError] = useState<ClassifiedsError | null>(null);
''',
              '''  const [taxonomyNodes, setTaxonomyNodes] = useState<TaxonomyNode[]>(
    initialData.taxonomyNodes,
  );
  const [taxonomyAvailable, setTaxonomyAvailable] = useState(initialData.taxonomyAvailable);
  const [categories, setCategories] = useState<ClassifiedCategory[]>(initialData.categories);
  const [subcategories, setSubcategories] = useState<ClassifiedSubcategory[]>(
    initialData.subcategories,
  );
  const [query, setQuery] = useState(search.q ?? "");
  const [loading, setLoading] = useState(false);
  const [fetchError, setFetchError] = useState<ClassifiedsError | null>(initialData.error);
''',
          )
          replace_once(
              "src/routes/categories.tsx",
              '''  useEffect(() => {
    let cancelled = false;

    async function load() {
''',
              '''  useEffect(() => {
    if (loadAttempt === 0) return;
    let cancelled = false;

    async function load() {
''',
          )

          replace_once(
              "src/routes/listings.index.tsx",
              '''import {
  listingsSearchSchema,
  type ListingsSort,
  type ListingsView,
} from "@/features/listings/listings-search-schema";
''',
              '''import {
  listingsSearchSchema,
  type ListingsSort,
  type ListingsView,
} from "@/features/listings/listings-search-schema";
import { loadPublicListingsPageData } from "@/features/listings/public-listings-page-data";
''',
          )
          replace_once(
              "src/routes/listings.index.tsx",
              '''export const Route = createFileRoute("/listings/")({
  validateSearch: listingsSearchSchema,
''',
              '''export const Route = createFileRoute("/listings/")({
  validateSearch: listingsSearchSchema,
  loaderDeps: ({ search }) => search,
  loader: ({ deps }) => loadPublicListingsPageData(deps),
''',
          )
          PY

          npx prettier --write src/routes/categories.tsx src/routes/listings.index.tsx

          if git diff --quiet; then
            echo "SSR route patch already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/categories.tsx src/routes/listings.index.tsx
          git commit -m "Render categories and listing results in initial HTML"
          git push origin HEAD:agent/phase-3-public-ssr-html
