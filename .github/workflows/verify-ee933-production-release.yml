name: Visible RAWAJ Cloudflare Worker Deploy ee933

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-ee933-production-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visible-rawaj-worker-deploy-ee933-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy-and-verify-worker:
    name: Deploy and verify reviewed Worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      RELEASE_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      EXPECTED_COMMIT_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      RAWAJ_EXPECTED_COMMIT_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      RAWAJ_PRODUCTION_APPROVAL: DEPLOY_RAWAJ_WORKER_PRODUCTION
      RAWAJ_WORKER_RELEASE_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      RAWAJ_WORKER_ENVIRONMENT: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout reviewed Worker source
        uses: actions/checkout@v4
        with:
          ref: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/worker/package-lock.json

      - name: Resolve existing D1 and active R2 binding
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "Required Cloudflare credential is missing: $key" >&2
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require("node:fs");

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const apiRoot = `https://api.cloudflare.com/client/v4/accounts/${accountId}`;
          const authHeaders = { Authorization: `Bearer ${apiToken}` };

          async function jsonRequest(path, init = {}) {
            const response = await fetch(`${apiRoot}${path}`, {
              ...init,
              headers: {
                ...authHeaders,
                ...(init.body ? { "Content-Type": "application/json" } : {}),
                ...(init.headers ?? {}),
              },
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
              const summary = Array.isArray(payload.errors)
                ? payload.errors.map((entry) => entry?.message).filter(Boolean).join("; ")
                : "Cloudflare API request failed";
              throw new Error(`${path}: ${response.status} ${summary}`);
            }
            return payload.result;
          }

          (async () => {
            const databases = await jsonRequest("/d1/database?name=rawaj-staging&per_page=100");
            const exactDatabases = (Array.isArray(databases) ? databases : []).filter(
              (database) => database?.name === "rawaj-staging" && typeof database?.uuid === "string",
            );
            if (exactDatabases.length !== 1) {
              throw new Error(
                `Expected exactly one D1 database named rawaj-staging; found ${exactDatabases.length}.`,
              );
            }
            const databaseId = exactDatabases[0].uuid;

            const queryResult = await jsonRequest(
              `/d1/database/${encodeURIComponent(databaseId)}/query`,
              {
                method: "POST",
                body: JSON.stringify({
                  sql: `SELECT ma.object_key
                        FROM media_assets AS ma
                        INNER JOIN listing_images AS li ON li.media_asset_id = ma.id
                        WHERE ma.status = 'ready'
                        ORDER BY ma.updated_at DESC
                        LIMIT 1`,
                }),
              },
            );
            const sampleObjectKey = Array.isArray(queryResult)
              ? queryResult.flatMap((entry) => entry?.results ?? []).find((row) => row?.object_key)?.object_key
              : undefined;
            if (typeof sampleObjectKey !== "string" || sampleObjectKey.length === 0) {
              throw new Error("No ready D1-backed listing image was available to resolve the active R2 bucket.");
            }

            const r2Result = await jsonRequest(
              "/r2/buckets?name_contains=rawaj&order=name&direction=asc&per_page=1000",
            );
            const rawajBuckets = (Array.isArray(r2Result?.buckets) ? r2Result.buckets : []).filter(
              (bucket) => typeof bucket?.name === "string" && bucket.name.toLowerCase().includes("rawaj"),
            );
            if (rawajBuckets.length === 0) {
              throw new Error("No RAWAJ R2 buckets were found.");
            }

            const encodedObjectKey = sampleObjectKey
              .split("/")
              .map((segment) => encodeURIComponent(segment))
              .join("/");
            const matchingBuckets = [];
            for (const bucket of rawajBuckets) {
              const response = await fetch(
                `${apiRoot}/r2/buckets/${encodeURIComponent(bucket.name)}/objects/${encodedObjectKey}`,
                { headers: authHeaders },
              );
              if (response.status === 200) matchingBuckets.push(bucket.name);
              else if (response.status !== 404) {
                const payload = await response.json().catch(() => ({}));
                const summary = Array.isArray(payload.errors)
                  ? payload.errors.map((entry) => entry?.message).filter(Boolean).join("; ")
                  : `HTTP ${response.status}`;
                throw new Error(`Unable to probe R2 bucket ${bucket.name}: ${summary}`);
              }
              await response.body?.cancel().catch(() => {});
            }

            if (matchingBuckets.length !== 1) {
              throw new Error(
                `Expected the D1-backed media object in exactly one RAWAJ R2 bucket; matched ${matchingBuckets.length}.`,
              );
            }

            const lines = [
              `CLOUDFLARE_D1_DATABASE_ID=${databaseId}`,
              "CLOUDFLARE_D1_DATABASE_NAME=rawaj-staging",
              `CLOUDFLARE_R2_BUCKET_NAME=${matchingBuckets[0]}`,
              "CLOUDFLARE_WORKER_CUSTOM_DOMAIN=api.rawa-j.com",
            ];
            fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
            console.log("Resolved the existing D1 database and the uniquely matching active R2 bucket.");
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Validate deployment safety contracts
        run: npm run test:cloudflare-deployment-safety

      - name: Deploy reviewed Worker once
        run: npm --prefix cloudflare/worker run deploy:production

      - name: Verify workers.dev release and read-only routes
        env:
          RAWAJ_WORKER_EXPECTED_RELEASE_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
          RAWAJ_WORKER_BASE_URL: https://rawaj-classifieds-hub.allidamech.workers.dev
        run: npm --prefix cloudflare/worker run smoke:production:read-only

      - name: Verify custom API domain release
        shell: bash
        run: |
          set -euo pipefail
          body_file=/tmp/rawaj-api-health.json
          status="$(curl --silent --show-error --max-time 20 \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header 'Origin: https://rawa-j.com' \
            https://api.rawa-j.com/v1/health || true)"
          release="$(node -e "try{const d=require('$body_file');process.stdout.write(d?.data?.releaseSha??'')}catch{}")"
          environment="$(node -e "try{const d=require('$body_file');process.stdout.write(d?.data?.environment??'')}catch{}")"
          if [[ "$status" != "200" || "$release" != "$RELEASE_SHA" || "$environment" != "production" ]]; then
            echo "Custom API domain did not expose the reviewed Worker release." >&2
            cat "$body_file" >&2 || true
            exit 1
          fi
          echo "api.rawa-j.com is serving the reviewed Worker release."

      - name: Confirm Vercel Production remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --max-time 20 https://rawa-j.com/)"
          printf '%s' "$html" | grep -Fq "name=\"rawaj-build-commit\" content=\"$RELEASE_SHA\""
          echo "Vercel Production remains on $RELEASE_SHA."

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-worker-deploy-ee933-${{ github.run_id }}
          path: |
            /tmp/rawaj-api-health.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Failure safety note
        if: failure()
        run: |
          echo "::error::Worker deployment or verification failed."
          echo "No D1 migration and no Vercel deployment were requested by this workflow."
