name: Visible RAWAJ Worker Deploy and Production Verification ee933

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-ee933-production-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visible-production-verification-ee933-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy-and-verify-production:
    name: Deploy stale Worker and verify Production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    env:
      RELEASE_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      E2E_BASE_URL: https://rawa-j.com
      PRODUCTION_ACCEPTANCE: "1"
      EXPECTED_COMMIT_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      RAWAJ_EXPECTED_COMMIT_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      RAWAJ_PRODUCTION_APPROVAL: DEPLOY_RAWAJ_WORKER_PRODUCTION
      RAWAJ_WORKER_RELEASE_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      RAWAJ_WORKER_ENVIRONMENT: production
      RAWAJ_ACCEPTANCE_EMAIL: ${{ secrets.RAWAJ_ACCEPTANCE_EMAIL }}
      RAWAJ_ACCEPTANCE_PASSWORD: ${{ secrets.RAWAJ_ACCEPTANCE_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_WORKER_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_WORKER_CUSTOM_DOMAIN }}

    steps:
      - name: Checkout reviewed release source
        uses: actions/checkout@v4
        with:
          ref: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
          fetch-depth: 0
          persist-credentials: false

      - name: Inspect current Cloudflare Worker release
        id: worker_state
        shell: bash
        run: |
          set -euo pipefail
          body_file=/tmp/rawaj-worker-before.json
          status="$(curl --silent --show-error --max-time 20 \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header 'Origin: https://rawa-j.com' \
            https://rawaj-classifieds-hub.allidamech.workers.dev/v1/health || true)"
          release="$(node -e "try{const d=require('$body_file');process.stdout.write(d?.data?.releaseSha??'')}catch{}")"
          environment="$(node -e "try{const d=require('$body_file');process.stdout.write(d?.data?.environment??'')}catch{}")"
          if [[ "$status" == "200" && "$release" == "$RELEASE_SHA" && "$environment" == "production" ]]; then
            echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Worker already serves $RELEASE_SHA."
          else
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Worker is stale and requires the reviewed release."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/worker/package-lock.json

      - name: Validate Cloudflare deployment configuration
        if: steps.worker_state.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_D1_DATABASE_NAME CLOUDFLARE_R2_BUCKET_NAME; do
            if [[ -z "${!key:-}" ]]; then
              echo "Required Cloudflare deployment value is missing: $key" >&2
              exit 1
            fi
          done

      - name: Install Worker dependencies
        if: steps.worker_state.outputs.needs_deploy == 'true'
        run: npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Validate deployment safety contracts
        if: steps.worker_state.outputs.needs_deploy == 'true'
        run: npm run test:cloudflare-deployment-safety

      - name: Deploy reviewed Worker once
        if: steps.worker_state.outputs.needs_deploy == 'true'
        run: npm --prefix cloudflare/worker run deploy:production

      - name: Verify Cloudflare Worker release
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            rm -f /tmp/rawaj-worker-body.json /tmp/rawaj-worker-headers.txt /tmp/rawaj-worker-headers-clean.txt
            status="$(curl --silent --show-error --max-time 20 \
              --output /tmp/rawaj-worker-body.json \
              --dump-header /tmp/rawaj-worker-headers.txt \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'Origin: https://rawa-j.com' \
              https://rawaj-classifieds-hub.allidamech.workers.dev/v1/health || true)"
            tr -d '\r' < /tmp/rawaj-worker-headers.txt > /tmp/rawaj-worker-headers-clean.txt || true
            release="$(node -e "try{const d=require('/tmp/rawaj-worker-body.json');process.stdout.write(d?.data?.releaseSha??'')}catch{}")"
            environment="$(node -e "try{const d=require('/tmp/rawaj-worker-body.json');process.stdout.write(d?.data?.environment??'')}catch{}")"
            if [[ "$status" == "200" \
              && "$release" == "$RELEASE_SHA" \
              && "$environment" == "production" ]] \
              && grep -Eiq '^access-control-allow-origin: https://rawa-j\.com$' /tmp/rawaj-worker-headers-clean.txt \
              && grep -Eiq '^x-content-type-options: nosniff$' /tmp/rawaj-worker-headers-clean.txt \
              && grep -Eiq '^referrer-policy: no-referrer$' /tmp/rawaj-worker-headers-clean.txt; then
              echo "Cloudflare Worker is serving $RELEASE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare Worker did not expose the approved release SHA." >&2
          cat /tmp/rawaj-worker-body.json >&2 || true
          exit 1

      - name: Run Worker read-only Production smoke
        if: steps.worker.outcome == 'success'
        env:
          RAWAJ_WORKER_EXPECTED_RELEASE_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
          RAWAJ_WORKER_BASE_URL: https://rawaj-classifieds-hub.allidamech.workers.dev
        run: |
          if [[ ! -d cloudflare/worker/node_modules ]]; then
            npm ci --prefix cloudflare/worker --ignore-scripts
          fi
          npm --prefix cloudflare/worker run smoke:production:read-only

      - name: Verify Vercel Production release
        id: vercel
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --max-time 20 https://rawa-j.com/)"
          printf '%s' "$html" | grep -Fq "name=\"rawaj-build-commit\" content=\"$RELEASE_SHA\""
          echo "Vercel Production is serving $RELEASE_SHA"

      - name: Inspect Android App Links association
        id: app_links
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          body_file=/tmp/rawaj-assetlinks.json
          status="$(curl --silent --show-error --max-time 20 \
            --output "$body_file" \
            --write-out '%{http_code}' \
            https://rawa-j.com/.well-known/assetlinks.json || true)"
          if [[ "$status" == "200" ]] \
            && node -e "const d=require('$body_file'); if(!Array.isArray(d)||!d.some(x=>x?.target?.package_name==='com.rawaj.marketplace'&&Array.isArray(x?.target?.sha256_cert_fingerprints)&&x.target.sha256_cert_fingerprints.length>0)) process.exit(1)"; then
            echo "Android App Links association is configured."
          else
            echo "::warning::Android App Links is blocked until RAWAJ_ANDROID_SHA256_CERT_FINGERPRINTS contains the Play App Signing SHA-256 fingerprint."
          fi

      - name: Validate dedicated acceptance credentials
        id: credentials
        if: steps.worker.outcome == 'success' && steps.vercel.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RAWAJ_ACCEPTANCE_EMAIL" || -z "$RAWAJ_ACCEPTANCE_PASSWORD" ]]; then
            echo "Production acceptance credentials are not configured." >&2
            exit 1
          fi

      - name: Install application dependencies
        if: steps.credentials.outcome == 'success'
        run: npm ci

      - name: Install Chromium
        if: steps.credentials.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Run authenticated mobile Production Acceptance
        if: steps.credentials.outcome == 'success'
        run: npx playwright test e2e/production-acceptance.spec.ts --project=mobile-chromium --workers=1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visible-production-verification-ee933-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            /tmp/rawaj-worker-before.json
            /tmp/rawaj-worker-body.json
            /tmp/rawaj-worker-headers.txt
            /tmp/rawaj-assetlinks.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Failure safety note
        if: failure()
        run: |
          echo "::error::Worker deployment or Production verification failed."
          echo "No D1 migration and no Vercel deployment were requested by this workflow."
