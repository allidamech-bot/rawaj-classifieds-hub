name: Visible RAWAJ Production Verification ee933

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-ee933-production-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visible-production-verification-ee933-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      E2E_BASE_URL: https://rawa-j.com
      PRODUCTION_ACCEPTANCE: "1"
      EXPECTED_COMMIT_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      RAWAJ_ACCEPTANCE_EMAIL: ${{ secrets.RAWAJ_ACCEPTANCE_EMAIL }}
      RAWAJ_ACCEPTANCE_PASSWORD: ${{ secrets.RAWAJ_ACCEPTANCE_PASSWORD }}

    steps:
      - name: Checkout verification source
        uses: actions/checkout@v4

      - name: Verify Cloudflare Worker release
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            rm -f /tmp/rawaj-worker-body.json /tmp/rawaj-worker-headers.txt /tmp/rawaj-worker-headers-clean.txt
            status="$(curl --silent --show-error --max-time 20 \
              --output /tmp/rawaj-worker-body.json \
              --dump-header /tmp/rawaj-worker-headers.txt \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'Origin: https://rawa-j.com' \
              https://rawaj-classifieds-hub.allidamech.workers.dev/v1/health || true)"
            tr -d '\r' < /tmp/rawaj-worker-headers.txt > /tmp/rawaj-worker-headers-clean.txt || true
            release="$(node -e "try{const d=require('/tmp/rawaj-worker-body.json');process.stdout.write(d?.data?.releaseSha??'')}catch{}")"
            environment="$(node -e "try{const d=require('/tmp/rawaj-worker-body.json');process.stdout.write(d?.data?.environment??'')}catch{}")"
            if [[ "$status" == "200" \
              && "$release" == "$RELEASE_SHA" \
              && "$environment" == "production" ]] \
              && grep -Eiq '^access-control-allow-origin: https://rawa-j\.com$' /tmp/rawaj-worker-headers-clean.txt \
              && grep -Eiq '^x-content-type-options: nosniff$' /tmp/rawaj-worker-headers-clean.txt \
              && grep -Eiq '^referrer-policy: no-referrer$' /tmp/rawaj-worker-headers-clean.txt; then
              echo "Cloudflare Worker is serving $RELEASE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare Worker did not expose the approved release SHA." >&2
          cat /tmp/rawaj-worker-body.json >&2 || true
          exit 1

      - name: Verify Vercel Production release
        id: vercel
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --max-time 20 https://rawa-j.com/)"
          printf '%s' "$html" | grep -Fq "name=\"rawaj-build-commit\" content=\"$RELEASE_SHA\""
          echo "Vercel Production is serving $RELEASE_SHA"

      - name: Inspect Android App Links association
        id: app_links
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          body_file=/tmp/rawaj-assetlinks.json
          status="$(curl --silent --show-error --max-time 20 \
            --output "$body_file" \
            --write-out '%{http_code}' \
            https://rawa-j.com/.well-known/assetlinks.json || true)"
          if [[ "$status" == "200" ]] \
            && node -e "const d=require('$body_file'); if(!Array.isArray(d)||!d.some(x=>x?.target?.package_name==='com.rawaj.marketplace'&&Array.isArray(x?.target?.sha256_cert_fingerprints)&&x.target.sha256_cert_fingerprints.length>0)) process.exit(1)"; then
            echo "Android App Links association is configured."
          else
            echo "::warning::Android App Links is blocked until RAWAJ_ANDROID_SHA256_CERT_FINGERPRINTS contains the Play App Signing SHA-256 fingerprint."
          fi

      - name: Validate dedicated acceptance credentials
        id: credentials
        if: steps.worker.outcome == 'success' && steps.vercel.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RAWAJ_ACCEPTANCE_EMAIL" || -z "$RAWAJ_ACCEPTANCE_PASSWORD" ]]; then
            echo "Production acceptance credentials are not configured." >&2
            exit 1
          fi

      - name: Set up Node.js
        if: steps.credentials.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.credentials.outcome == 'success'
        run: npm ci

      - name: Install Chromium
        if: steps.credentials.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Run authenticated mobile Production Acceptance
        if: steps.credentials.outcome == 'success'
        run: npx playwright test e2e/production-acceptance.spec.ts --project=mobile-chromium --workers=1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visible-production-verification-ee933-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            /tmp/rawaj-worker-body.json
            /tmp/rawaj-worker-headers.txt
            /tmp/rawaj-assetlinks.json
          if-no-files-found: ignore
          retention-days: 14
