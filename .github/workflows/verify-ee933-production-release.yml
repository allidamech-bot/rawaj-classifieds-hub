name: Verify RAWAJ Production Release ee933

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-ee933-production-release.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-rawaj-production-ee933
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      E2E_BASE_URL: https://rawa-j.com
      PRODUCTION_ACCEPTANCE: "1"
      EXPECTED_COMMIT_SHA: ee933ba68cfde9e621ca6b1e5b0f3f0ea3b85f3e
      RAWAJ_ACCEPTANCE_EMAIL: ${{ secrets.RAWAJ_ACCEPTANCE_EMAIL }}
      RAWAJ_ACCEPTANCE_PASSWORD: ${{ secrets.RAWAJ_ACCEPTANCE_PASSWORD }}

    steps:
      - name: Checkout verification source
        uses: actions/checkout@v4

      - name: Verify Cloudflare Worker release
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            rm -f /tmp/rawaj-worker-body.json /tmp/rawaj-worker-headers.txt /tmp/rawaj-worker-headers-clean.txt
            status="$(curl --silent --show-error --max-time 20 \
              --output /tmp/rawaj-worker-body.json \
              --dump-header /tmp/rawaj-worker-headers.txt \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'Origin: https://rawa-j.com' \
              https://rawaj-classifieds-hub.allidamech.workers.dev/v1/health || true)"
            tr -d '\r' < /tmp/rawaj-worker-headers.txt > /tmp/rawaj-worker-headers-clean.txt || true
            release="$(node -e "try{const d=require('/tmp/rawaj-worker-body.json');process.stdout.write(d?.data?.releaseSha??'')}catch{}")"
            environment="$(node -e "try{const d=require('/tmp/rawaj-worker-body.json');process.stdout.write(d?.data?.environment??'')}catch{}")"
            if [[ "$status" == "200" \
              && "$release" == "$RELEASE_SHA" \
              && "$environment" == "production" ]] \
              && grep -Eiq '^access-control-allow-origin: https://rawa-j\.com$' /tmp/rawaj-worker-headers-clean.txt \
              && grep -Eiq '^x-content-type-options: nosniff$' /tmp/rawaj-worker-headers-clean.txt \
              && grep -Eiq '^referrer-policy: no-referrer$' /tmp/rawaj-worker-headers-clean.txt; then
              echo "Cloudflare Worker is serving $RELEASE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare Worker did not expose the approved release SHA." >&2
          cat /tmp/rawaj-worker-body.json >&2 || true
          exit 1

      - name: Verify Vercel Production release
        id: vercel
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            html="$(curl --fail --silent --show-error --max-time 20 https://rawa-j.com/ || true)"
            if printf '%s' "$html" | grep -Fq "name=\"rawaj-build-commit\" content=\"$RELEASE_SHA\""; then
              echo "Vercel Production is serving $RELEASE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Vercel Production is not serving the approved release SHA." >&2
          exit 1

      - name: Validate dedicated acceptance credentials
        id: credentials
        if: steps.worker.outcome == 'success' && steps.vercel.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RAWAJ_ACCEPTANCE_EMAIL" || -z "$RAWAJ_ACCEPTANCE_PASSWORD" ]]; then
            echo "Production acceptance credentials are not configured." >&2
            exit 1
          fi

      - name: Set up Node.js
        if: steps.credentials.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.credentials.outcome == 'success'
        run: npm ci

      - name: Install Chromium
        if: steps.credentials.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Run authenticated mobile Production Acceptance
        id: acceptance
        if: steps.credentials.outcome == 'success'
        run: npx playwright test e2e/production-acceptance.spec.ts --project=mobile-chromium --workers=1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-ee933-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            /tmp/rawaj-worker-body.json
            /tmp/rawaj-worker-headers.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Report verification result on release PR
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          VERCEL_OUTCOME: ${{ steps.vercel.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKER_OUTCOME" == "success" \
            && "$VERCEL_OUTCOME" == "success" \
            && "$CREDENTIALS_OUTCOME" == "success" \
            && "$ACCEPTANCE_OUTCOME" == "success" ]]; then
            overall="SUCCESS"
          else
            overall="FAILURE"
          fi
          body="$(cat <<EOF
          ## Production verification: ${overall}

          Approved release: \`${RELEASE_SHA}\`

          - Cloudflare Worker release: **${WORKER_OUTCOME}**
          - Vercel Production identity: **${VERCEL_OUTCOME}**
          - Acceptance credentials: **${CREDENTIALS_OUTCOME}**
          - Authenticated mobile Production Acceptance: **${ACCEPTANCE_OUTCOME}**

          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
          payload="$(COMMENT_BODY="$body" node -e 'process.stdout.write(JSON.stringify({body: process.env.COMMENT_BODY}))')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/548/comments" \
            --data "$payload"
