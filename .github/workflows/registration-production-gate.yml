name: Registration Production Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/login.tsx"
      - "src/routes/auth.callback.tsx"
      - "scripts/registration-production-gate.test.mjs"
      - ".github/workflows/registration-production-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint --quiet src/routes/login.tsx src/routes/auth.callback.tsx scripts/registration-production-gate.test.mjs
      - run: node --test scripts/registration-production-gate.test.mjs
      - run: npm run typecheck -- --pretty false
