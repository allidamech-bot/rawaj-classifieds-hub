name: Migration Validator Lint Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent >/dev/null 2>&1
      - name: Capture ESLint output
        id: lint
        shell: bash
        run: |
          set +e
          npx eslint --quiet scripts/check-migration-ledger.mjs > lint-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: migration-validator-lint-output
          path: lint-output.txt
      - name: Fail when ESLint failed
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1
