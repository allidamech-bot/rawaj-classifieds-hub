name: Dynamic Listing Facets V1

on:
  pull_request:
    paths:
      - "supabase/migrations/202607190040_dynamic_listing_facets_v1.sql"
      - "supabase/migrations/202607190041_dynamic_listing_facets_repair_v1.sql"
      - "src/lib/api/listing-facets.ts"
      - "scripts/dynamic-listing-facets-v1.test.mjs"
      - ".github/workflows/dynamic-listing-facets-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-listing-facets-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dynamic listing facets contract
        run: node --test scripts/dynamic-listing-facets-v1.test.mjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
