name: Dynamic Listing Facets V1

on:
  pull_request:
    paths:
      - "supabase/migrations/202607190040_dynamic_listing_facets_v1.sql"
      - "supabase/migrations/202607190041_dynamic_listing_facets_repair_v1.sql"
      - "supabase/migrations/202607190042_dynamic_listing_search_page_v1.sql"
      - "src/lib/api/listing-facets.ts"
      - "src/lib/api/dynamic-listing-search.ts"
      - "src/lib/api/dynamic-filtered-listings.ts"
      - "src/lib/api/listing-attributes.ts"
      - "src/features/listings/listing-attribute-filter-state.ts"
      - "src/features/listings/DynamicListingFacetFilters.tsx"
      - "src/features/listings/use-listing-facets.ts"
      - "src/features/listings/listings-search-schema.ts"
      - "src/features/listings/listings-filters.ts"
      - "src/features/listings/use-listings-results.ts"
      - "src/features/listings/use-listings-pagination.ts"
      - "src/features/listings/public-listings-page-data.ts"
      - "src/features/search/SearchResultsToolbar.tsx"
      - "src/routes/listings.tsx"
      - "src/routes/listings.index.tsx"
      - "src/routes/profile/listings.$id.tsx"
      - "src/types/dynamic-listing-filters.d.ts"
      - "scripts/dynamic-listing-facets-v1.test.mjs"
      - "scripts/dynamic-listing-search-v1.test.mjs"
      - "scripts/sql/dynamic-listing-search-local-verification.sql"
      - ".github/workflows/dynamic-listing-facets-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynamic-listing-facets-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pending TypeScript fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          attributes = Path("src/lib/api/listing-attributes.ts")
          source = attributes.read_text(encoding="utf-8")
          source = source.replace('      code: "forbidden",\n', '      code: "permission_denied",\n')
          attributes.write_text(source, encoding="utf-8")

          route = Path("src/routes/profile/listings.$id.tsx")
          source = route.read_text(encoding="utf-8")
          source = source.replace(
              "        if (!dynamicValidation.ok) {",
              "        if (dynamicValidation.summary.length > 0) {",
          )
          source = source.replace(
              "setCondition(categoryDetailsGlobalCondition(categoryFieldKind, nextDetails));",
              "setCondition(resolveLegacyDetailCondition(categoryFieldKind, nextDetails));",
          )
          marker = "\nfunction fileFingerprint(file: File) {"
          helper = '''
function resolveLegacyDetailCondition(
  kind: CategoryFieldKind,
  details: CategorySpecificDetails,
): ListingCondition {
  const value = kind === "vehicles" ? details.vehicle_condition ?? details.condition : details.condition;
  if (value === "new") return "new";
  if (value === "excellent" || value === "good") return "like_new";
  if (value === "needs_work") return "for_parts";
  if (value === "used") return "used";
  return "not_applicable";
}
'''
          if "function resolveLegacyDetailCondition(" not in source:
              source = source.replace(marker, helper + marker, 1)
          route.write_text(source, encoding="utf-8")
          PY
          npx prettier --write src/lib/api/listing-attributes.ts 'src/routes/profile/listings.$id.tsx'
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/api/listing-attributes.ts 'src/routes/profile/listings.$id.tsx'
            git commit -m "fix: resolve taxonomy foundation type errors"
            git push origin HEAD:feature/taxonomy-search-foundation-v1
          fi
      - name: Dynamic listing facets contract
        run: node --test scripts/dynamic-listing-facets-v1.test.mjs
      - name: Dynamic listing search contract
        run: node --test scripts/dynamic-listing-search-v1.test.mjs
      - name: ESLint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/rawaj-dynamic-facets-lint.log"
      - name: Upload ESLint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-facets-eslint-${{ github.sha }}
          path: ${{ runner.temp }}/rawaj-dynamic-facets-lint.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when ESLint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/rawaj-dynamic-facets-typecheck.log"
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-facets-typecheck-${{ github.sha }}
          path: ${{ runner.temp }}/rawaj-dynamic-facets-typecheck.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when TypeScript failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Production build
        run: npm run build
