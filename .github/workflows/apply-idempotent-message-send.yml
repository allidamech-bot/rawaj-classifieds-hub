name: Apply idempotent message send

on:
  push:
    branches:
      - feature/idempotent-message-send
    paths:
      - .github/workflows/apply-idempotent-message-send.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/idempotent-message-send
          fetch-depth: 0

      - name: Implement database-backed message send idempotency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = r'''-- RAWAJ idempotent conversation message delivery.
          --
          -- A client-generated UUID identifies one logical send attempt. Repeating the
          -- same request returns the original message instead of inserting a duplicate.

          alter table public.conversation_messages
            add column if not exists client_request_id uuid;

          create unique index if not exists conversation_messages_sender_request_uidx
            on public.conversation_messages (sender_user_id, client_request_id)
            where client_request_id is not null;

          create or replace function public.rawaj_send_conversation_message_v2(
            p_conversation_id uuid,
            p_client_request_id uuid,
            p_body text
          )
          returns setof public.conversation_messages
          language plpgsql
          volatile
          security definer
          set search_path = public
          as $$
          declare
            v_actor uuid := auth.uid();
            v_body text := btrim(coalesce(p_body, ''));
            v_message public.conversation_messages%rowtype;
          begin
            if v_actor is null then
              raise exception 'Authentication is required to send messages.';
            end if;

            if p_conversation_id is null or p_client_request_id is null then
              raise exception 'Conversation and message request id are required.';
            end if;

            if char_length(v_body) not between 1 and 2000 then
              raise exception 'Message body must contain between 1 and 2000 characters.';
            end if;

            select m.*
              into v_message
            from public.conversation_messages m
            where m.sender_user_id = v_actor
              and m.client_request_id = p_client_request_id
            for update;

            if found then
              if v_message.conversation_id is distinct from p_conversation_id
                or v_message.body is distinct from v_body
              then
                raise exception 'message_request_payload_mismatch';
              end if;

              return next v_message;
              return;
            end if;

            begin
              insert into public.conversation_messages (
                conversation_id,
                sender_user_id,
                body,
                client_request_id
              ) values (
                p_conversation_id,
                v_actor,
                v_body,
                p_client_request_id
              )
              returning * into v_message;
            exception
              when unique_violation then
                select m.*
                  into v_message
                from public.conversation_messages m
                where m.sender_user_id = v_actor
                  and m.client_request_id = p_client_request_id
                for update;

                if not found then
                  raise;
                end if;

                if v_message.conversation_id is distinct from p_conversation_id
                  or v_message.body is distinct from v_body
                then
                  raise exception 'message_request_payload_mismatch';
                end if;
            end;

            return next v_message;
          end;
          $$;

          revoke all on function public.rawaj_send_conversation_message_v2(uuid, uuid, text) from public;
          revoke all on function public.rawaj_send_conversation_message_v2(uuid, uuid, text) from anon;
          grant execute on function public.rawaj_send_conversation_message_v2(uuid, uuid, text) to authenticated;

          comment on function public.rawaj_send_conversation_message_v2(uuid, uuid, text) is
            'Sends exactly one conversation message for one authenticated client request UUID.';

          notify pgrst, 'reload schema';
          '''
          Path('supabase/migrations/202607140003_idempotent_message_send.sql').write_text(
              migration, encoding='utf-8'
          )

          request_flow = r'''const MESSAGE_SEND_STORAGE_PREFIX = "rawaj:message-send-request:v1";
          const MESSAGE_SEND_MAX_AGE_MS = 24 * 60 * 60 * 1000;
          const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

          interface MessageSendAttempt {
            requestId: string;
            body: string;
            createdAt: number;
          }

          const memoryAttempts = new Map<string, MessageSendAttempt>();

          export function readOrCreateMessageSendRequestId(
            userId: string,
            conversationId: string,
            body: string,
          ): string {
            const cleanUserId = userId.trim();
            const cleanConversationId = conversationId.trim();
            const cleanBody = body.trim();
            if (!cleanUserId || !cleanConversationId || !cleanBody) {
              throw new Error("Message send requests require a user, conversation, and body.");
            }

            const key = attemptKey(cleanUserId, cleanConversationId);
            const existing = readAttempt(key);
            if (existing && existing.body === cleanBody) return existing.requestId;

            const attempt: MessageSendAttempt = {
              requestId: createUuid(),
              body: cleanBody,
              createdAt: Date.now(),
            };
            writeAttempt(key, attempt);
            return attempt.requestId;
          }

          export function completeMessageSendRequest(
            userId: string,
            conversationId: string,
            requestId: string,
          ): void {
            const key = attemptKey(userId.trim(), conversationId.trim());
            const cleanRequestId = requestId.trim();
            if (!key || !UUID_PATTERN.test(cleanRequestId)) return;

            const current = readAttempt(key);
            if (!current || current.requestId !== cleanRequestId) return;

            memoryAttempts.delete(key);
            const storage = readStorage();
            if (!storage) return;
            try {
              storage.removeItem(storageKey(key));
            } catch {
              // The database result is authoritative even when browser cleanup fails.
            }
          }

          function readAttempt(key: string): MessageSendAttempt | null {
            const memory = memoryAttempts.get(key);
            if (memory && isFreshAttempt(memory)) return memory;
            if (memory) memoryAttempts.delete(key);

            const storage = readStorage();
            if (!storage) return null;
            try {
              const parsed: unknown = JSON.parse(storage.getItem(storageKey(key)) ?? "null");
              if (!isMessageSendAttempt(parsed) || !isFreshAttempt(parsed)) {
                storage.removeItem(storageKey(key));
                return null;
              }
              memoryAttempts.set(key, parsed);
              return parsed;
            } catch {
              return null;
            }
          }

          function writeAttempt(key: string, attempt: MessageSendAttempt): void {
            memoryAttempts.set(key, attempt);
            const storage = readStorage();
            if (!storage) return;
            try {
              storage.setItem(storageKey(key), JSON.stringify(attempt));
            } catch {
              // In-memory retry safety remains available when storage is blocked.
            }
          }

          function readStorage(): Storage | null {
            if (typeof window === "undefined") return null;
            try {
              return window.sessionStorage;
            } catch {
              return null;
            }
          }

          function attemptKey(userId: string, conversationId: string): string {
            if (!userId || !conversationId) return "";
            return `${userId}:${conversationId}`;
          }

          function storageKey(key: string): string {
            return `${MESSAGE_SEND_STORAGE_PREFIX}:${key}`;
          }

          function isFreshAttempt(attempt: MessageSendAttempt): boolean {
            return Date.now() - attempt.createdAt <= MESSAGE_SEND_MAX_AGE_MS;
          }

          function isMessageSendAttempt(value: unknown): value is MessageSendAttempt {
            if (!value || typeof value !== "object") return false;
            const record = value as Record<string, unknown>;
            return (
              typeof record.requestId === "string" &&
              UUID_PATTERN.test(record.requestId) &&
              typeof record.body === "string" &&
              record.body.trim().length > 0 &&
              typeof record.createdAt === "number" &&
              Number.isFinite(record.createdAt) &&
              record.createdAt > 0
            );
          }

          function createUuid(): string {
            if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
              return crypto.randomUUID();
            }

            const bytes = new Uint8Array(16);
            if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") {
              crypto.getRandomValues(bytes);
            } else {
              for (let index = 0; index < bytes.length; index += 1) {
                bytes[index] = Math.floor(Math.random() * 256);
              }
            }
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            const hex = Array.from(bytes, (value) => value.toString(16).padStart(2, "0"));
            return `${hex.slice(0, 4).join("")}-${hex.slice(4, 6).join("")}-${hex
              .slice(6, 8)
              .join("")}-${hex.slice(8, 10).join("")}-${hex.slice(10).join("")}`;
          }
          '''
          Path('src/lib/api/message-send-request.ts').write_text(request_flow, encoding='utf-8')

          messaging_path = Path('src/lib/api/messaging.ts')
          messaging = messaging_path.read_text(encoding='utf-8')
          start = messaging.index('export async function sendConversationMessage(')
          end = messaging.index('export async function markConversationRead(', start)
          send_block = r'''const MESSAGE_REQUEST_UUID_PATTERN =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

          export async function sendConversationMessage(
            userId: string | null,
            conversationId: string,
            body: string,
            clientRequestId: string,
          ): Promise<ClassifiedsResult<ConversationMessage>> {
            if (!userId) {
              return {
                ok: false,
                error: { code: "auth_required", message: "يجب تسجيل الدخول لإرسال رسالة." },
              };
            }

            const cleanConversationId = conversationId.trim();
            const cleanBody = body.trim();
            const cleanRequestId = clientRequestId.trim();
            if (!cleanConversationId || cleanBody.length < 1 || cleanBody.length > 2000) {
              return {
                ok: false,
                error: { code: "validation_error", message: "اكتب رسالة بين 1 و2000 حرف." },
              };
            }
            if (!MESSAGE_REQUEST_UUID_PATTERN.test(cleanRequestId)) {
              return {
                ok: false,
                error: { code: "validation_error", message: "تعذر تحديد محاولة إرسال الرسالة." },
              };
            }

            const sendKey = JSON.stringify([userId, cleanRequestId]);
            const existingSend = pendingMessageSends.get(sendKey);
            if (existingSend) return existingSend;

            const sendPromise = performConversationMessageSend(
              userId,
              cleanConversationId,
              cleanBody,
              cleanRequestId,
            );
            pendingMessageSends.set(sendKey, sendPromise);

            try {
              return await sendPromise;
            } finally {
              if (pendingMessageSends.get(sendKey) === sendPromise) {
                pendingMessageSends.delete(sendKey);
              }
            }
          }

          async function performConversationMessageSend(
            userId: string,
            conversationId: string,
            cleanBody: string,
            clientRequestId: string,
          ): Promise<ClassifiedsResult<ConversationMessage>> {
            const clientResult = getClient();
            if (!clientResult.ok) return clientResult;

            const response = await clientResult.data.rpc("rawaj_send_conversation_message_v2", {
              p_conversation_id: conversationId,
              p_client_request_id: clientRequestId,
              p_body: cleanBody,
            });

            if (!response.error) {
              const row = ((response.data ?? []) as Record<string, unknown>[])[0];
              if (row) return { ok: true, data: mapMessage(row) };
              return {
                ok: false,
                error: {
                  code: "unknown",
                  message: "تم إرسال طلب الرسالة دون نتيجة قابلة للتحقق.",
                  operation: "conversation_message_send",
                },
              };
            }

            if (!isMissingMessageSendV2(response.error)) {
              if (isMessageRequestPayloadMismatch(response.error)) {
                return {
                  ok: false,
                  error: {
                    code: "validation_error",
                    message: "تغير محتوى محاولة الإرسال. أعد كتابة الرسالة ثم أرسلها مجدداً.",
                    operation: "conversation_message_send",
                  },
                };
              }
              return { ok: false, error: mapError(response.error, "conversation_message_send") };
            }

            return performLegacyConversationMessageSend(
              clientResult.data,
              userId,
              conversationId,
              cleanBody,
            );
          }

          async function performLegacyConversationMessageSend(
            client: SupabaseClient,
            userId: string,
            conversationId: string,
            cleanBody: string,
          ): Promise<ClassifiedsResult<ConversationMessage>> {
            const { data, error } = await client
              .from("conversation_messages")
              .insert({
                conversation_id: conversationId,
                sender_user_id: userId,
                body: cleanBody,
              })
              .select("*")
              .single();

            if (error) return { ok: false, error: mapError(error, "conversation_message_send") };
            return { ok: true, data: mapMessage(data as Record<string, unknown>) };
          }

          function isMissingMessageSendV2(error: {
            code?: string;
            message?: string;
            details?: string;
          }): boolean {
            const message = error.message ?? "";
            const details = error.details ?? "";
            return (
              error.code === "PGRST202" ||
              error.code === "42883" ||
              message.includes("rawaj_send_conversation_message_v2") ||
              details.includes("rawaj_send_conversation_message_v2")
            );
          }

          function isMessageRequestPayloadMismatch(error: {
            message?: string;
            details?: string;
          }): boolean {
            return `${error.message ?? ""} ${error.details ?? ""}`.includes(
              "message_request_payload_mismatch",
            );
          }

          '''
          messaging = messaging[:start] + send_block + messaging[end:]
          messaging_path.write_text(messaging, encoding='utf-8')

          chats_path = Path('src/routes/chats.tsx')
          chats = chats_path.read_text(encoding='utf-8')
          import_anchor = 'import type { ClassifiedsError, Conversation, ConversationMessage } from "@/lib/classifieds-types";\n'
          request_import = '''import {
            completeMessageSendRequest,
            readOrCreateMessageSendRequestId,
          } from "@/lib/api/message-send-request";
          '''
          if request_import.strip() not in chats:
              chats = chats.replace(import_anchor, request_import + import_anchor, 1)

          old_send = '''    const cleanBody = body.trim();
              if (!cleanBody) return;
              setNotice("");
              setMessageError(null);
              setSending(true);
              const result = await sendConversationMessage(profileId, conversationId, cleanBody);
              setSending(false);
          '''
          new_send = '''    const cleanBody = body.trim();
              if (!cleanBody) return;
              const requestId = readOrCreateMessageSendRequestId(profileId, conversationId, cleanBody);
              setNotice("");
              setMessageError(null);
              setSending(true);
              const result = await sendConversationMessage(
                profileId,
                conversationId,
                cleanBody,
                requestId,
              );
              setSending(false);
          '''
          if old_send not in chats:
              raise SystemExit('Chat send request anchor not found')
          chats = chats.replace(old_send, new_send, 1)

          old_success = '''    setBody("");
              setMessages((current) => [...current, result.data]);
          '''
          new_success = '''    completeMessageSendRequest(profileId, conversationId, requestId);
              setBody("");
              setMessages((current) =>
                current.some((message) => message.id === result.data.id)
                  ? current
                  : [...current, result.data],
              );
          '''
          if old_success not in chats:
              raise SystemExit('Chat send success anchor not found')
          chats = chats.replace(old_success, new_success, 1)
          chats_path.write_text(chats, encoding='utf-8')

          test_source = r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const [messagingSource, requestSource, routeSource, migrationSource, ledgerSource, packageSource] =
            await Promise.all([
              readFile(new URL("../src/lib/api/messaging.ts", import.meta.url), "utf8"),
              readFile(new URL("../src/lib/api/message-send-request.ts", import.meta.url), "utf8"),
              readFile(new URL("../src/routes/chats.tsx", import.meta.url), "utf8"),
              readFile(
                new URL(
                  "../supabase/migrations/202607140003_idempotent_message_send.sql",
                  import.meta.url,
                ),
                "utf8",
              ),
              readFile(
                new URL("../docs/production-schema/migration-ledger.json", import.meta.url),
                "utf8",
              ),
              readFile(new URL("../package.json", import.meta.url), "utf8"),
            ]);

          test("the database makes one client message request idempotent", () => {
            assert.match(migrationSource, /add column if not exists client_request_id uuid/);
            assert.match(
              migrationSource,
              /on public\.conversation_messages \(sender_user_id, client_request_id\)/,
            );
            assert.match(migrationSource, /rawaj_send_conversation_message_v2/);
            assert.match(migrationSource, /message_request_payload_mismatch/);
            assert.match(migrationSource, /when unique_violation/);
            assert.match(
              migrationSource,
              /grant execute on function public\.rawaj_send_conversation_message_v2\(uuid, uuid, text\) to authenticated/,
            );
          });

          test("the client sends through the idempotent RPC with a legacy compatibility fallback", () => {
            assert.match(messagingSource, /clientRequestId: string/);
            assert.match(messagingSource, /MESSAGE_REQUEST_UUID_PATTERN/);
            assert.match(messagingSource, /rawaj_send_conversation_message_v2/);
            assert.match(messagingSource, /p_client_request_id: clientRequestId/);
            assert.match(messagingSource, /isMissingMessageSendV2/);
            assert.match(messagingSource, /performLegacyConversationMessageSend/);
            assert.match(messagingSource, /JSON\.stringify\(\[userId, cleanRequestId\]\)/);
          });

          test("a failed or ambiguous browser attempt reuses its request UUID after reload", () => {
            assert.match(requestSource, /rawaj:message-send-request:v1/);
            assert.match(requestSource, /window\.sessionStorage/);
            assert.match(requestSource, /existing && existing\.body === cleanBody/);
            assert.match(requestSource, /return existing\.requestId/);
            assert.match(requestSource, /MESSAGE_SEND_MAX_AGE_MS = 24 \* 60 \* 60 \* 1000/);
            assert.match(requestSource, /completeMessageSendRequest/);
          });

          test("the chat route reuses then completes one send attempt and deduplicates rendered rows", () => {
            assert.match(routeSource, /readOrCreateMessageSendRequestId/);
            assert.match(
              routeSource,
              /sendConversationMessage\([\s\S]*cleanBody,[\s\S]*requestId/,
            );
            assert.match(routeSource, /completeMessageSendRequest\(profileId, conversationId, requestId\)/);
            assert.match(routeSource, /current\.some\(\(message\) => message\.id === result\.data\.id\)/);
          });

          test("the migration and contract are permanently registered", () => {
            const ledger = JSON.parse(ledgerSource);
            assert.ok(
              ledger.classifications.canonical.includes(
                "202607140003_idempotent_message_send.sql",
              ),
            );
            const packageJson = JSON.parse(packageSource);
            assert.match(packageJson.scripts["test:chat-workspace"], /message-send-idempotency\.test\.mjs/);
          });
          '''
          Path('scripts/message-send-idempotency.test.mjs').write_text(test_source, encoding='utf-8')

          package_path = Path('package.json')
          package = package_path.read_text(encoding='utf-8')
          old_script = '"test:chat-workspace": "node --test scripts/chat-workspace.test.mjs scripts/chat-workspace-live.test.mjs"'
          new_script = '"test:chat-workspace": "node --test scripts/chat-workspace.test.mjs scripts/chat-workspace-live.test.mjs scripts/message-send-idempotency.test.mjs"'
          if old_script not in package:
              raise SystemExit('Chat workspace package script anchor not found')
          package_path.write_text(package.replace(old_script, new_script, 1), encoding='utf-8')

          ledger_path = Path('docs/production-schema/migration-ledger.json')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger_anchor = '      "202607140002_idempotent_owner_draft_creation.sql"\n'
          ledger_replacement = (
              '      "202607140002_idempotent_owner_draft_creation.sql",\n'
              '      "202607140003_idempotent_message_send.sql"\n'
          )
          if ledger_anchor not in ledger:
              raise SystemExit('Migration ledger anchor not found')
          ledger_path.write_text(ledger.replace(ledger_anchor, ledger_replacement, 1), encoding='utf-8')

          Path('.github/workflows/apply-idempotent-message-send.yml').unlink()
          PY

          npx prettier --write \
            src/lib/api/message-send-request.ts \
            src/lib/api/messaging.ts \
            src/routes/chats.tsx \
            scripts/message-send-idempotency.test.mjs \
            package.json \
            docs/production-schema/migration-ledger.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/api/message-send-request.ts \
            src/lib/api/messaging.ts \
            src/routes/chats.tsx \
            scripts/message-send-idempotency.test.mjs \
            supabase/migrations/202607140003_idempotent_message_send.sql \
            package.json \
            docs/production-schema/migration-ledger.json \
            .github/workflows/apply-idempotent-message-send.yml
          git commit -m "Make conversation message sends idempotent"
          git push origin HEAD:feature/idempotent-message-send
