name: Seller Storefront Trust Integrity Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/seller.$id.tsx"
      - "src/features/storefront/**"
      - "src/features/reviews/**"
      - "src/lib/api/seller.ts"
      - "src/lib/api/seller-profile-*.ts"
      - "src/lib/api/reviews*.ts"
      - "src/lib/api/public-fields.ts"
      - "src/lib/classifieds-api.ts"
      - "src/lib/classifieds-types.ts"
      - "src/lib/public-seller-storefront.ts"
      - "supabase/migrations/202607090014_align_public_seller_visibility.sql"
      - "supabase/migrations/202607100004_seller_review_eligibility.sql"
      - "scripts/seller-storefront-trust-integrity.test.mjs"
      - "scripts/seller-review-*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/seller-storefront-trust-integrity.yml"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seller Storefront Trust Integrity contract
        run: npm run test:seller-storefront-trust

      - name: TypeScript
        run: npm run typecheck -- --pretty false
