name: Apply Saudi password reset fix

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-saudi-password-reset-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-saudi-password-reset-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saudi-password-reset-default-link-20260803
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove custom-domain dependency from password reset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/auth.tsx')
          text = path.read_text()
          old = '''    const requestPasswordReset = async (email: string) => {
      try {
        const origin =
          typeof window === "undefined" ? "https://rawa-j.com" : window.location.origin;
        await sendPasswordResetEmail(firebaseAuth, normalizeAuthEmail(email), {
          url: `${origin}/login`,
          handleCodeInApp: false,
        });
        return { error: null };
      } catch (error) {
        return { error: firebaseErrorMessage(error) };
      }
    };
'''
          new = '''    const requestPasswordReset = async (email: string) => {
      try {
        // Use Firebase's project-hosted password action page. A market-specific
        // continue URL makes reset delivery depend on every market hostname
        // being allowlisted, while the default handler works for all markets.
        await sendPasswordResetEmail(firebaseAuth, normalizeAuthEmail(email));
        return { error: null };
      } catch (error) {
        return { error: firebaseErrorMessage(error) };
      }
    };
'''
          if old in text:
            text = text.replace(old, new, 1)
          elif new not in text:
            raise SystemExit('Expected password reset implementation was not found')
          path.write_text(text)

          Path('scripts/firebase-password-reset-domain-independence.test.mjs').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { readFile } from "node:fs/promises";\n\ntest("password reset does not depend on a market hostname allowlist", async () => {\n  const auth = await readFile("src/lib/auth.tsx", "utf8");\n  const start = auth.indexOf("const requestPasswordReset = async");\n  const end = auth.indexOf("const signInWithGoogle = async", start);\n  assert.ok(start >= 0 && end > start);\n  const reset = auth.slice(start, end);\n  assert.match(reset, /sendPasswordResetEmail\\(firebaseAuth, normalizeAuthEmail\\(email\\)\\)/);\n  assert.doesNotMatch(reset, /window\\.location\\.origin/);\n  assert.doesNotMatch(reset, /handleCodeInApp/);\n  assert.doesNotMatch(reset, /url:/);\n});\n''')
          PY

      - name: Validate Saudi password reset fix
        run: |
          npm ci --ignore-scripts
          npx prettier --write src/lib/auth.tsx scripts/firebase-password-reset-domain-independence.test.mjs
          npx eslint --quiet src/lib/auth.tsx scripts/firebase-password-reset-domain-independence.test.mjs
          node --test scripts/firebase-password-reset-domain-independence.test.mjs
          npm run typecheck
          npm run build

      - name: Commit Saudi password reset fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/auth.tsx scripts/firebase-password-reset-domain-independence.test.mjs
          if git diff --cached --quiet; then
            echo "Password reset fix already applied."
            exit 0
          fi
          git commit -m "fix(saudi): decouple password reset from custom domain"
          git push origin HEAD:fix/saudi-password-reset-default-link-20260803
