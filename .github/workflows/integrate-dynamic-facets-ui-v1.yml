name: Integrate Dynamic Facets UI V1

on:
  pull_request:
    paths:
      - "scripts/integrate-dynamic-facets-ui-v1.py"
      - ".github/workflows/integrate-dynamic-facets-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-dynamic-facets-ui-v1
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate dynamic facets UI
        shell: bash
        run: |
          set +e
          python scripts/integrate-dynamic-facets-ui-v1.py > /tmp/dynamic-facets-ui.log 2>&1
          status=$?
          cat /tmp/dynamic-facets-ui.log
          if [ $status -ne 0 ]; then
            cp /tmp/dynamic-facets-ui.log scripts/dynamic-facets-ui-diagnostic.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/dynamic-facets-ui-diagnostic.txt
            git commit -m "chore: capture dynamic facets UI integration failure"
            git push origin HEAD:feature/taxonomy-search-foundation-v1
            exit $status
          fi
          set -euo pipefail
          npx prettier --write src/routes/listings.index.tsx
          grep -q 'DynamicListingFacetFilters' src/routes/listings.index.tsx
          grep -q 'encodedAttributeFilters' src/routes/listings.index.tsx
          grep -q 'attributeFilters' src/routes/listings.index.tsx
          if ! git diff --quiet -- src/routes/listings.index.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routes/listings.index.tsx
            git commit -m "feat: add governed facets across listing results"
            git push origin HEAD:feature/taxonomy-search-foundation-v1
          fi
