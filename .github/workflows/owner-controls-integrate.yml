name: Owner Controls Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feature/owner-only-system-controls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-only-system-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add owner controls navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin.tsx')
          s = p.read_text()
          s = s.replace('  Lock,\n', '  Lock,\n  Siren,\n', 1)
          marker = '''  {\n    to: "/admin/campaigns",\n    labelAr: "الحملات",\n    icon: Megaphone,\n    permission: "canManageAdCampaigns",\n  },\n'''
          insert = marker + '''  {\n    to: "/admin/owner-controls",\n    labelAr: "تحكم المالك",\n    icon: Siren,\n    permission: "canManageSystemSettings",\n  },\n'''
          if marker not in s:
            raise SystemExit('campaign nav marker missing')
          p.write_text(s.replace(marker, insert, 1))
          PY
      - name: Generate route tree
        run: npm run build || true
      - name: Verify generated route
        run: grep -q 'admin/owner-controls' src/routeTree.gen.ts
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/owner-controls-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx src/routeTree.gen.ts .github/workflows/owner-controls-integrate.yml
          git commit -m "Integrate owner controls route and navigation"
          git push origin HEAD:feature/owner-only-system-controls
