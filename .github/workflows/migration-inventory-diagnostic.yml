name: Migration Inventory Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: List migration files
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/contents/supabase/migrations?ref=$HEAD_SHA" \
            | jq -c '[.[] | select(.type == "file" and (.name | endswith(".sql"))) | .name] | sort'
