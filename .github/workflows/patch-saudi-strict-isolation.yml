name: Patch Saudi strict market isolation

"on":
  push:
    branches:
      - test/saudi-strict-market-isolation-20260803
    paths:
      - .github/workflows/patch-saudi-strict-isolation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/saudi-strict-market-isolation-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce exact Syrian isolation responses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/saudi-infra-admin-production-e2e.mjs')
          text = path.read_text(encoding='utf-8')
          old1 = '''  const syria = await request(SYRIA_SITE_URL, `/v1/listings/${listingId}`);
  if (syria.response.status === 200) throw new Error("Saudi listing leaked into the Syrian market");'''
          new1 = '''  const syria = await request(SYRIA_SITE_URL, `/v1/listings/${listingId}`);
  expectStatus(syria, 404, `${suffix} Syrian market isolation`);'''
          old2 = '''  const syriaApproved = await request(SYRIA_SITE_URL, `/v1/listings/${approved.id}`);
  if (syriaApproved.response.status === 200)
    throw new Error("Approved Saudi listing leaked into Syria");'''
          new2 = '''  const syriaApproved = await request(SYRIA_SITE_URL, `/v1/listings/${approved.id}`);
  expectStatus(syriaApproved, 404, "approved Saudi listing Syrian isolation");'''
          for old, new, label in [(old1, new1, 'pre-approval'), (old2, new2, 'approved')]:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one {label} isolation block, found {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          npx prettier --write scripts/saudi-infra-admin-production-e2e.mjs
          node --check scripts/saudi-infra-admin-production-e2e.mjs
          rm .github/workflows/patch-saudi-strict-isolation.yml
      - name: Commit strict isolation contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/saudi-infra-admin-production-e2e.mjs .github/workflows/patch-saudi-strict-isolation.yml
          git commit -m "test(saudi): require exact Syrian isolation status"
          git push origin HEAD:test/saudi-strict-market-isolation-20260803
