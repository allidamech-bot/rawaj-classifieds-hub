name: Batch 10 layout migration

on:
  push:
    branches:
      - refactor/core-marketplace-surfaces-batch-10

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-marketplace-surfaces-batch-10
          fetch-depth: 0
      - name: Apply canonical marketplace page rhythm
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/routes/categories.tsx'): [
                  ('rawaj-categories-v2 container-wide mobile-page-bottom pb-8 pt-3 sm:pt-5', 'rawaj-categories-v2 container-wide rawaj-content-stack mobile-page-bottom pb-8 pt-3 sm:pt-5'),
              ],
              Path('src/routes/listings.index.tsx'): [
                  ('rawaj-search-results-v1 container-wide mobile-page-bottom pb-8 pt-3 sm:pt-5', 'rawaj-search-results-v1 container-wide rawaj-content-stack mobile-page-bottom pb-8 pt-3 sm:pt-5'),
              ],
              Path('src/routes/activity.tsx'): [
                  ('rawaj-communication-v2 container-wide mobile-page-bottom pt-4', 'rawaj-communication-v2 container-wide rawaj-content-stack mobile-page-bottom pt-4'),
                  ('rawaj-communication-v2 rawaj-communication-v2--activity container-wide mobile-page-bottom space-y-4 pt-4', 'rawaj-communication-v2 rawaj-communication-v2--activity container-wide rawaj-content-stack mobile-page-bottom pt-4'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected class string in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          rm .github/workflows/batch-10-layout-migration.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/categories.tsx src/routes/listings.index.tsx src/routes/activity.tsx .github/workflows/batch-10-layout-migration.yml
          git diff --cached --check
          git commit -m "Align core marketplace surfaces with canonical rhythm"
          git push origin HEAD:refactor/core-marketplace-surfaces-batch-10
