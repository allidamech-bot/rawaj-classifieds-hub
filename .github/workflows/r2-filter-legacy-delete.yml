name: Filter R2 Keys From Supabase Cleanup

on:
  push:
    branches:
      - agent/r2-listing-images-phase-1
    paths:
      - ".github/workflows/r2-filter-legacy-delete.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r2-listing-images-phase-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch listing deletion cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/api/listings.ts")
          text = path.read_text(encoding="utf-8")
          old = '''  if (paths.length > 0) {
            const storageResult = await clientResult.data.storage.from(listingImagesBucket).remove(paths);
          '''
          new = '''  const supabaseStoragePaths = paths.filter((path) => !isR2ListingImagePath(path));
          if (supabaseStoragePaths.length > 0) {
            const storageResult = await clientResult.data.storage
              .from(listingImagesBucket)
              .remove(supabaseStoragePaths);
          '''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif "const supabaseStoragePaths = paths.filter" not in text:
              raise SystemExit("Listing cleanup statement not found")
          PY
          npx prettier --write src/lib/api/listings.ts
          git diff --check
      - name: Commit cleanup filter
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "rawaj-r2-agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/api/listings.ts
          git commit -m "perf: avoid Supabase cleanup calls for R2 objects"
          git push origin HEAD:agent/r2-listing-images-phase-1
