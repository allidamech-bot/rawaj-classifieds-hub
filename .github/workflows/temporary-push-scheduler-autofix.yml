name: Temporary push scheduler autofix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-push-scheduler-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.head_ref == 'feature/push-scheduler-observability-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/push-scheduler-observability-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply formatter and lint fixes
        run: |
          npx prettier --write scripts/push-delivery-scheduler-v1.test.mjs package.json
          npx eslint --fix scripts/push-delivery-scheduler-v1.test.mjs
          npm run test:push-scheduler

      - name: Commit fixes when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/push-delivery-scheduler-v1.test.mjs package.json; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/push-delivery-scheduler-v1.test.mjs package.json
          git commit -m "chore: format push scheduler contract"
          git push origin HEAD:feature/push-scheduler-observability-v1
