name: Canonical Listing Taxonomy Contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run taxonomy contract
        run: node --test scripts/canonical-listing-taxonomy.test.mjs
