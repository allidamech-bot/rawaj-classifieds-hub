name: Listing Pipeline Followup Fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'hotfix/listing-publish-review-pipeline' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/listing-publish-review-pipeline
          fetch-depth: 0

      - name: Repair rejected edit, resubmit, and canonical autosave flows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. Rejected listing edits must not mutate moderation-controlled fields.
          p = Path('src/lib/api/listings.ts')
          s = p.read_text()
          s = s.replace('''\n  if (existing.status === "rejected") {\n    updateData.reviewed_by = null;\n    updateData.reviewed_at = null;\n  }\n''', '\n', 1)
          p.write_text(s)

          # 2. Canonical locations must be enough for autosave/quality scoring even if legacy governorate state is empty.
          p = Path('src/routes/add-listing.tsx')
          s = p.read_text()
          s = s.replace(
            '        !!governorateId && (!!locationNodeId || !!district),',
            '        !!locationNodeId || (!!governorateId && !!district),',
            1,
          )
          s = s.replace(
            '      autosavePayload.governorateId.trim().length > 0 &&\n      autosavePayload.title.length >= 4;',
            '      (autosavePayload.governorateId.trim().length > 0 || locationNodeId.trim().length > 0) &&\n      autosavePayload.title.length >= 4;',
            1,
          )
          s = s.replace(
            '  }, [auth.status, auth.profile?.id, autosavePayload]);',
            '  }, [auth.status, auth.profile?.id, autosavePayload, locationNodeId]);',
            1,
          )
          p.write_text(s)

          # 3. Profile resubmit first saves editable content, then calls the protected submit RPC.
          p = Path('src/routes/profile/listings.$id.tsx')
          s = p.read_text()
          s = s.replace(
            '  resubmitOwnerListing,\n',
            '  submitOwnerListingForReview,\n',
            1,
          )
          old = '''    const result = await resubmitOwnerListing(auth.profile?.id ?? null, listing.id, {\n      categoryId: categoryId || undefined,\n      subcategoryId: subcategoryId ?? null,\n      governorateId: governorateId || undefined,\n      title: title.trim() || undefined,\n      description: description.trim() || undefined,\n      price: price ? Number(price) : null,\n      priceType,\n      condition,\n      districtAr: locationNodeId ? `@${locationNodeId}` : district || undefined,\n      contactName: contactName.trim() || undefined,\n      contactOptions: contact,\n      details: validation.details,\n    });\n\n    setResubmitting(false);\n    if (result.ok) {\n      setListing(result.data);\n      setSavingSuccess(text("تم إعادة إرسال الإعلان للمراجعة.", "Listing resubmitted for review."));\n    } else {\n      setSavingError(result.error.message);\n    }'''
          new = '''    const saveResult = await updateOwnerListing(auth.profile?.id ?? null, listing.id, {\n      categoryId: categoryId || undefined,\n      subcategoryId: subcategoryId ?? null,\n      governorateId: governorateId || undefined,\n      title: title.trim() || undefined,\n      description: description.trim() || undefined,\n      price: price ? Number(price) : null,\n      priceType,\n      condition,\n      districtAr: locationNodeId ? `@${locationNodeId}` : district || undefined,\n      contactName: contactName.trim() || undefined,\n      contactOptions: contact,\n      details: validation.details,\n    });\n\n    if (!saveResult.ok) {\n      setResubmitting(false);\n      setSavingError(saveResult.error.message);\n      return;\n    }\n\n    const result = await submitOwnerListingForReview(\n      auth.profile?.id ?? null,\n      saveResult.data.id,\n    );\n\n    setResubmitting(false);\n    if (result.ok) {\n      setListing(result.data);\n      setSavingSuccess(text("تم إعادة إرسال الإعلان للمراجعة.", "Listing resubmitted for review."));\n    } else {\n      setListing(saveResult.data);\n      setSavingError(result.error.message);\n    }'''
          if old not in s:
            raise SystemExit('profile resubmit block not found')
          p.write_text(s.replace(old, new, 1))

          # 4. Remove dead client-side notification path now handled atomically inside review RPC.
          p = Path('src/lib/api/admin.ts')
          s = p.read_text()
          s = s.replace('import type { SupabaseClient } from "@supabase/supabase-js";\n', '', 1)
          s = s.replace('import { getClient, mapError, rowString } from "@/lib/api/shared";', 'import { getClient, mapError } from "@/lib/api/shared";', 1)
          marker = '\nasync function createListingModerationNotification('
          if marker in s:
            s = s[:s.index(marker)] + '\n'
          p.write_text(s)
          PY

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/listing-pipeline-followup-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/listings.ts src/routes/add-listing.tsx src/routes/profile/listings.$id.tsx src/lib/api/admin.ts .github/workflows/listing-pipeline-followup-fixes.yml
          git commit -m "Fix rejected edits canonical autosave and resubmit flow"
          git push origin HEAD:hotfix/listing-publish-review-pipeline
