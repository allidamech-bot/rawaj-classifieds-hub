name: Run admin extended recovery on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-admin-extended-queues
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Extract and apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          payload = Path('.github/admin-extended-patch.b64').read_text().strip()
          target = Path('/tmp/recover_admin_extended.py')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          source = target.read_text()
          wrapper = '''
_original_replace_once = replace_once

def replace_once(text, old, new, label):
    if label in {"verification approve disabled", "verification reject disabled"} and old not in text:
        return text
    return _original_replace_once(text, old, new, label)

'''
          source, count = re.subn(r'(?m)^patch_listings\(\)$', wrapper + 'patch_listings()', source, count=1)
          if count != 1:
              raise SystemExit('patch entrypoint not found')
          target.write_text(source)
          PY
          set +e
          python /tmp/recover_admin_extended.py > /tmp/admin-patch-output.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/admin-patch-output.txt .github/admin-extended-recovery-error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/admin-extended-recovery-error.txt
            git commit -m 'Record admin recovery patch failure' || true
            git push origin HEAD:feature/recover-admin-extended-queues
            cat /tmp/admin-patch-output.txt
            exit "$status"
          fi
      - name: Format and validate focused files
        run: |
          npx prettier --write \
            src/routes/admin.listings.tsx \
            src/routes/admin.verifications.tsx \
            src/routes/admin.promotions.tsx \
            src/routes/admin.audit.tsx \
            src/routes/admin.owner-controls.tsx \
            src/routes/admin.ad-placements.tsx \
            scripts/admin-security-regression.mjs
          npx eslint \
            src/routes/admin.listings.tsx \
            src/routes/admin.verifications.tsx \
            src/routes/admin.promotions.tsx \
            src/routes/admin.audit.tsx \
            src/routes/admin.owner-controls.tsx \
            src/routes/admin.ad-placements.tsx
          node scripts/admin-security-regression.mjs
          npm run typecheck
      - name: Commit focused result and remove temporary files
        shell: bash
        run: |
          rm -f .github/admin-extended-recovery-error.txt
          rm .github/admin-extended-patch.b64
          rm .github/workflows/patch-admin-extended-recovery.yml
          rm .github/workflows/run-admin-extended-recovery-pr.yml
          rm .github/admin-extended-recovery.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Recover extended admin queues safely'
          git push origin HEAD:feature/recover-admin-extended-queues
