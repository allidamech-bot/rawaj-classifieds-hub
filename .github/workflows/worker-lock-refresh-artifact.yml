name: Worker Lock Refresh Artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/worker/package.json"
      - "cloudflare/worker/package-lock.json"
      - ".github/workflows/worker-lock-refresh-artifact.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-worker-package-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-worker-package-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate Worker lockfile from a clean state
        working-directory: cloudflare/worker
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Verify Worker package isolation
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("cloudflare/worker/package.json", "utf8"));
          const lock = JSON.parse(await readFile("cloudflare/worker/package-lock.json", "utf8"));
          if (manifest.dependencies && Object.keys(manifest.dependencies).length > 0) {
            throw new Error("Worker runtime dependencies must be explicitly justified.");
          }
          if (lock.packages?.[""]?.dependencies) {
            throw new Error("Worker lock root still contains application dependencies.");
          }
          if (lock.packages?.["../.."] || lock.packages?.["node_modules/tanstack_start_ts"]) {
            throw new Error("Worker lock still references the application package.");
          }
          NODE
      - name: Commit the generated lockfile to this maintenance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker/package-lock.json
          if git diff --cached --quiet; then
            echo "Worker lockfile is already current."
          else
            git commit -m "chore: regenerate isolated Worker lockfile"
            git push origin HEAD:fix/cloudflare-worker-package-isolation
          fi
      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-worker-package-lock-${{ github.run_id }}
          path: cloudflare/worker/package-lock.json
          if-no-files-found: error
          retention-days: 1
