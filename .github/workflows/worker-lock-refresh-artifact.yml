name: Worker Lock Refresh Artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/worker/package.json"
      - "cloudflare/worker/package-lock.json"
      - ".github/workflows/worker-lock-refresh-artifact.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate Worker lockfile only
        working-directory: cloudflare/worker
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify Worker package isolation
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("cloudflare/worker/package.json", "utf8"));
          const lock = JSON.parse(await readFile("cloudflare/worker/package-lock.json", "utf8"));
          if (manifest.dependencies && Object.keys(manifest.dependencies).length > 0) {
            throw new Error("Worker runtime dependencies must be explicitly justified.");
          }
          if (lock.packages?.[""]?.dependencies) {
            throw new Error("Worker lock root still contains application dependencies.");
          }
          if (lock.packages?.["../.."] || lock.packages?.["node_modules/tanstack_start_ts"]) {
            throw new Error("Worker lock still references the application package.");
          }
          NODE
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: isolated-worker-package-lock-${{ github.run_id }}
          path: cloudflare/worker/package-lock.json
          if-no-files-found: error
          retention-days: 1
