name: Apply Nearby UI Contract Fix

on:
  push:
    branches: [feature/nearby-discovery-ui-v1]
    paths:
      - "scripts/apply-nearby-ui-contract-fix.mjs"
      - ".github/workflows/apply-nearby-ui-contract-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nearby-discovery-ui-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-nearby-ui-contract-fix.mjs
      - run: npx prettier --write scripts/adaptive-listing-cards.test.mjs src/features/listings/use-nearby-discovery.ts
      - run: |
          rm .github/workflows/apply-nearby-ui-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve adaptive card contract for nearby results"
          git push
