name: Performance Budget Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/performance-budget-diagnostic.yml"
      - "src/**"
      - "scripts/performance-budget.mjs"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate report
        continue-on-error: true
        run: npm run performance:budget
      - uses: actions/upload-artifact@v4
        with:
          name: performance-budget-report
          path: performance-budget-report.json
