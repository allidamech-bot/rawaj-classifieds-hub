name: Diagnose Saudi closure run status

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diag-saudi-closure-run-status.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print latest Saudi workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=50" \
            --jq '.workflow_runs[] | select(.name == "Finalize Saudi Marketplace Production" or .name == "Saudi Infra and Admin Production Gate") | [.id,.name,.event,.head_sha,.status,(.conclusion // "pending"),.created_at,.updated_at] | @tsv' \
            | head -n 12

      - name: Probe Saudi and Syrian routing surfaces
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            local url="$2"
            local accept="${3:-*/*}"
            local body headers status content_type error_code server vercel cf_ray
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --silent --show-error --max-time 30 \
              -H "Accept: $accept" \
              -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            header() {
              local name="$1"
              awk -v target="$name" 'BEGIN{IGNORECASE=1} {line=$0; gsub(/\r/,"",line); split(line,parts,":"); if (tolower(parts[1])==tolower(target)) {sub(/^[^:]*:[[:space:]]*/,"",line); value=line}} END{print value}' "$headers"
            }
            content_type="$(header content-type)"
            server="$(header server)"
            vercel="$(header x-vercel-id)"
            cf_ray="$(header cf-ray)"
            error_code="$(BODY="$body" node - <<'NODE'
          const fs = require('node:fs');
          const path = process.env.BODY;
          try {
            const raw = fs.readFileSync(path, 'utf8');
            const json = JSON.parse(raw);
            process.stdout.write(String(json?.error?.code || json?.error || 'none').slice(0, 120));
          } catch {
            process.stdout.write('non-json');
          }
          NODE
            )"
            printf '%s\tstatus=%s\ttype=%s\terror=%s\tserver=%s\tvercel=%s\tcf=%s\n' \
              "$label" "$status" "${content_type:-none}" "$error_code" \
              "${server:-none}" "${vercel:-none}" "${cf_ray:-none}"
            rm -f "$body" "$headers"
          }

          for origin in \
            "https://rawaj-saudi-web.allidamech.workers.dev" \
            "https://sa.rawa-j.com"; do
            probe "$origin /" "$origin/" "text/html"
            probe "$origin /login" "$origin/login" "text/html"
            probe "$origin /add-listing" "$origin/add-listing" "text/html"
            probe "$origin /v1/health" "$origin/v1/health" "application/json"
            probe "$origin /v1/references" "$origin/v1/references" "application/json"
          done

          missing="00000000-0000-4000-8000-000000000001"
          for origin in \
            "https://rawa-j.com" \
            "https://rawaj-classifieds-hub.allidamech.workers.dev"; do
            probe "$origin /" "$origin/" "text/html"
            probe "$origin /v1/health" "$origin/v1/health" "application/json"
            probe "$origin missing listing" "$origin/v1/listings/$missing" "application/json"
          done
