name: Validate Android Brand Intro Once

on:
  push:
    branches:
      - agent/android-brand-intro-1-0-3
    paths:
      - ".github/workflows/validate-android-brand-intro-once.yml"

permissions:
  contents: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/android-brand-intro-1-0-3
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK and release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon

      - name: Remove one-time workflow
        run: rm .github/workflows/validate-android-brand-intro-once.yml

      - name: Commit successful native validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-android-brand-intro-once.yml
          git commit -m "Validate Android brand intro build"
          git push origin HEAD:agent/android-brand-intro-1-0-3
