name: Cloudflare Production Worker Deploy

on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: "Type DEPLOY_RAWAJ_WORKER_PRODUCTION exactly"
        required: true
        type: string
      expected_commit_sha:
        description: "Exact current main SHA selected for this dispatch"
        required: true
        type: string
      reviewed_release_sha:
        description: "Reviewed runtime release SHA exposed by Worker health"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rawaj-cloudflare-production-worker
  cancel-in-progress: false

jobs:
  deploy-production-worker:
    name: Deploy reviewed Worker SHA
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      REVIEWED_RELEASE_SHA: ${{ inputs.reviewed_release_sha }}
      RAWAJ_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      RAWAJ_PRODUCTION_APPROVAL: ${{ inputs.approval_phrase }}
      RAWAJ_WORKER_RELEASE_SHA: ${{ inputs.reviewed_release_sha }}
      RAWAJ_WORKER_ENVIRONMENT: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate manual approval and selected SHA
        env:
          DISPATCH_REF: ${{ github.ref }}
          APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Production deployment is allowed only through workflow_dispatch." >&2
            exit 1
          fi
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Production deployment is allowed only from refs/heads/main; tags and other branches are rejected." >&2
            exit 1
          fi
          if [[ "$APPROVAL_PHRASE" != "DEPLOY_RAWAJ_WORKER_PRODUCTION" ]]; then
            echo "The Production approval phrase is invalid." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit_sha must be an exact lowercase 40-character Git SHA." >&2
            exit 1
          fi
          if [[ ! "$REVIEWED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reviewed_release_sha must be an exact lowercase 40-character Git SHA." >&2
            exit 1
          fi

      - name: Checkout explicitly approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved SHA is the current main HEAD
        run: |
          set -euo pipefail
          ACTUAL_COMMIT_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_COMMIT_SHA" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "Checked-out HEAD does not match expected_commit_sha." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          MAIN_HEAD_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$EXPECTED_COMMIT_SHA" != "$MAIN_HEAD_SHA" ]]; then
            echo "expected_commit_sha is not the current HEAD of main; stale or non-main commits cannot be deployed." >&2
            exit 1
          fi

      - name: Prove runtime source matches reviewed release
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$REVIEWED_RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$REVIEWED_RELEASE_SHA" "$EXPECTED_COMMIT_SHA"
          mapfile -t changed_files < <(git diff --name-only "$REVIEWED_RELEASE_SHA" "$EXPECTED_COMMIT_SHA")
          for path in "${changed_files[@]}"; do
            case "$path" in
              .github/workflows/*|.github/deploy/*|vercel.json)
                ;;
              *)
                echo "Runtime-affecting drift exists after the reviewed release: $path" >&2
                exit 1
                ;;
            esac
          done
          echo "Runtime source is unchanged since $REVIEWED_RELEASE_SHA."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/worker/package-lock.json

      - name: Resolve existing D1 and active R2 binding
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "Required Cloudflare credential is missing: $key" >&2
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require("node:fs");

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const apiRoot = `https://api.cloudflare.com/client/v4/accounts/${accountId}`;
          const authHeaders = { Authorization: `Bearer ${apiToken}` };

          async function jsonRequest(path, init = {}) {
            const response = await fetch(`${apiRoot}${path}`, {
              ...init,
              headers: {
                ...authHeaders,
                ...(init.body ? { "Content-Type": "application/json" } : {}),
                ...(init.headers ?? {}),
              },
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
              const summary = Array.isArray(payload.errors)
                ? payload.errors.map((entry) => entry?.message).filter(Boolean).join("; ")
                : "Cloudflare API request failed";
              throw new Error(`${path}: ${response.status} ${summary}`);
            }
            return payload.result;
          }

          (async () => {
            const databases = await jsonRequest("/d1/database?name=rawaj-staging&per_page=100");
            const exactDatabases = (Array.isArray(databases) ? databases : []).filter(
              (database) => database?.name === "rawaj-staging" && typeof database?.uuid === "string",
            );
            if (exactDatabases.length !== 1) {
              throw new Error(
                `Expected exactly one D1 database named rawaj-staging; found ${exactDatabases.length}.`,
              );
            }
            const databaseId = exactDatabases[0].uuid;

            const queryResult = await jsonRequest(
              `/d1/database/${encodeURIComponent(databaseId)}/query`,
              {
                method: "POST",
                body: JSON.stringify({
                  sql: `SELECT ma.object_key
                        FROM media_assets AS ma
                        INNER JOIN listing_images AS li ON li.media_asset_id = ma.id
                        WHERE ma.status = 'ready'
                        ORDER BY ma.updated_at DESC
                        LIMIT 1`,
                }),
              },
            );
            const sampleObjectKey = Array.isArray(queryResult)
              ? queryResult.flatMap((entry) => entry?.results ?? []).find((row) => row?.object_key)?.object_key
              : undefined;
            if (typeof sampleObjectKey !== "string" || sampleObjectKey.length === 0) {
              throw new Error("No ready D1-backed listing image was available to resolve the active R2 bucket.");
            }

            const r2Result = await jsonRequest(
              "/r2/buckets?name_contains=rawaj&order=name&direction=asc&per_page=1000",
            );
            const rawajBuckets = (Array.isArray(r2Result?.buckets) ? r2Result.buckets : []).filter(
              (bucket) => typeof bucket?.name === "string" && bucket.name.toLowerCase().includes("rawaj"),
            );
            const encodedObjectKey = sampleObjectKey
              .split("/")
              .map((segment) => encodeURIComponent(segment))
              .join("/");
            const matchingBuckets = [];
            for (const bucket of rawajBuckets) {
              const response = await fetch(
                `${apiRoot}/r2/buckets/${encodeURIComponent(bucket.name)}/objects/${encodedObjectKey}`,
                { headers: authHeaders },
              );
              if (response.status === 200) matchingBuckets.push(bucket.name);
              else if (response.status !== 404) {
                const payload = await response.json().catch(() => ({}));
                const summary = Array.isArray(payload.errors)
                  ? payload.errors.map((entry) => entry?.message).filter(Boolean).join("; ")
                  : `HTTP ${response.status}`;
                throw new Error(`Unable to probe R2 bucket ${bucket.name}: ${summary}`);
              }
              await response.body?.cancel().catch(() => {});
            }
            if (matchingBuckets.length !== 1) {
              throw new Error(
                `Expected the D1-backed media object in exactly one RAWAJ R2 bucket; matched ${matchingBuckets.length}.`,
              );
            }

            fs.appendFileSync(
              process.env.GITHUB_ENV,
              [
                `CLOUDFLARE_D1_DATABASE_ID=${databaseId}`,
                "CLOUDFLARE_D1_DATABASE_NAME=rawaj-staging",
                `CLOUDFLARE_R2_BUCKET_NAME=${matchingBuckets[0]}`,
                "CLOUDFLARE_WORKER_CUSTOM_DOMAIN=api.rawa-j.com",
                "",
              ].join("\n"),
            );
            console.log("Resolved the existing D1 database and uniquely active R2 bucket.");
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Install shared application dependencies
        run: npm ci --ignore-scripts

      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Validate deployment safety contracts
        run: npm run test:cloudflare-deployment-safety

      - name: Deploy approved Worker version once
        run: npm --prefix cloudflare/worker run deploy:production

      - name: Verify deployed Worker release and read-only routes
        env:
          RAWAJ_WORKER_EXPECTED_RELEASE_SHA: ${{ inputs.reviewed_release_sha }}
          RAWAJ_WORKER_BASE_URL: https://rawaj-classifieds-hub.allidamech.workers.dev
        run: npm --prefix cloudflare/worker run smoke:production:read-only

      - name: Verify custom API domain release
        shell: bash
        run: |
          set -euo pipefail
          body_file=/tmp/rawaj-api-health.json
          status="$(curl --silent --show-error --max-time 20 \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header 'Origin: https://rawa-j.com' \
            https://api.rawa-j.com/v1/health || true)"
          release="$(node -e "try{const d=require('$body_file');process.stdout.write(d?.data?.releaseSha??'')}catch{}")"
          environment="$(node -e "try{const d=require('$body_file');process.stdout.write(d?.data?.environment??'')}catch{}")"
          if [[ "$status" != "200" || "$release" != "$REVIEWED_RELEASE_SHA" || "$environment" != "production" ]]; then
            echo "Custom API domain did not expose the reviewed Worker release." >&2
            cat "$body_file" >&2 || true
            exit 1
          fi
          echo "api.rawa-j.com is serving $REVIEWED_RELEASE_SHA."

      - name: Manual rollback instructions
        if: ${{ failure() }}
        run: |
          echo "::error::Production Worker deployment or verification failed."
          echo "Do not rerun this workflow until the failure is understood."
          echo "No automatic rollback was attempted."
          echo "If the failed release reached Production, use the Cloudflare dashboard deployment history to select the previously verified Worker version, obtain explicit approval, and perform a separate manual rollback."
