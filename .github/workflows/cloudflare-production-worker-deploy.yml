name: Syria Cloudflare Production Worker Deploy

on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: "Type DEPLOY_RAWAJ_SYRIA_WORKER_PRODUCTION exactly"
        required: true
        type: string
      expected_commit_sha:
        description: "Exact current main SHA selected for this dispatch"
        required: true
        type: string
      reviewed_release_sha:
        description: "Reviewed runtime release SHA exposed by Worker health"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rawaj-syria-cloudflare-production-worker
  cancel-in-progress: false

jobs:
  deploy-production-worker:
    name: Deploy reviewed Syria Worker SHA
    runs-on: ubuntu-latest
    environment: syria-production
    timeout-minutes: 25
    env:
      EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      REVIEWED_RELEASE_SHA: ${{ inputs.reviewed_release_sha }}
      RAWAJ_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      RAWAJ_PRODUCTION_APPROVAL: ${{ inputs.approval_phrase }}
      RAWAJ_WORKER_RELEASE_SHA: ${{ inputs.reviewed_release_sha }}
      RAWAJ_WORKER_ENVIRONMENT: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.SYRIA_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SYRIA_CLOUDFLARE_ACCOUNT_ID }}
      SYRIA_CLOUDFLARE_CREDENTIAL_SCOPE: ${{ vars.SYRIA_CLOUDFLARE_CREDENTIAL_SCOPE }}
      CLOUDFLARE_D1_DATABASE_ID: d0e6496c-9f63-48d3-beeb-d2e219500f6a
      CLOUDFLARE_D1_DATABASE_NAME: rawaj-staging
      CLOUDFLARE_R2_BUCKET_NAME: rawaj-listing-images-production

    steps:
      - name: Validate manual approval and selected SHA
        env:
          DISPATCH_REF: ${{ github.ref }}
          APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Production deployment is allowed only through workflow_dispatch." >&2
            exit 1
          fi
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Production deployment is allowed only from refs/heads/main; tags and other branches are rejected." >&2
            exit 1
          fi
          if [[ "$APPROVAL_PHRASE" != "DEPLOY_RAWAJ_SYRIA_WORKER_PRODUCTION" ]]; then
            echo "The Syria Production approval phrase is invalid." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit_sha must be an exact lowercase 40-character Git SHA." >&2
            exit 1
          fi
          if [[ ! "$REVIEWED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reviewed_release_sha must be an exact lowercase 40-character Git SHA." >&2
            exit 1
          fi

      - name: Verify dedicated Syria Production credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "The syria-production secret SYRIA_CLOUDFLARE_API_TOKEN is missing." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "The syria-production secret SYRIA_CLOUDFLARE_ACCOUNT_ID is missing." >&2
            exit 1
          fi
          if [[ "${SYRIA_CLOUDFLARE_CREDENTIAL_SCOPE:-}" != "rawaj-classifieds-hub" ]]; then
            echo "SYRIA_CLOUDFLARE_CREDENTIAL_SCOPE must equal rawaj-classifieds-hub." >&2
            exit 1
          fi

          response_file=/tmp/rawaj-syria-worker-access.json
          status="$(curl --silent --show-error --max-time 20 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/rawaj-classifieds-hub" || true)"

          success="$(node -e "try{const d=require('$response_file');process.stdout.write(d?.success===true?'true':'false')}catch{process.stdout.write('false')}")"
          if [[ "$status" != "200" || "$success" != "true" ]]; then
            echo "The dedicated Syria token cannot access the Syria Worker service." >&2
            echo "Do not substitute Saudi or generic account credentials." >&2
            exit 1
          fi
          echo "Dedicated Syria Production token access verified."

      - name: Checkout explicitly approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved SHA is the current main HEAD
        run: |
          set -euo pipefail
          ACTUAL_COMMIT_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_COMMIT_SHA" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "Checked-out HEAD does not match expected_commit_sha." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          MAIN_HEAD_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$EXPECTED_COMMIT_SHA" != "$MAIN_HEAD_SHA" ]]; then
            echo "expected_commit_sha is not the current HEAD of main; stale or non-main commits cannot be deployed." >&2
            exit 1
          fi

      - name: Prove runtime source matches reviewed release
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$REVIEWED_RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$REVIEWED_RELEASE_SHA" "$EXPECTED_COMMIT_SHA"
          mapfile -t changed_files < <(git diff --name-only "$REVIEWED_RELEASE_SHA" "$EXPECTED_COMMIT_SHA")
          for path in "${changed_files[@]}"; do
            case "$path" in
              .github/workflows/*|.github/deploy/*|docs/cloudflare-production-freeze.md|scripts/cloudflare-deployment-safety-gate.test.mjs|vercel.json)
                ;;
              *)
                echo "Runtime-affecting drift exists after the reviewed release: $path" >&2
                exit 1
                ;;
            esac
          done
          echo "Runtime source is unchanged since $REVIEWED_RELEASE_SHA."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/worker/package-lock.json

      - name: Install shared application dependencies
        run: npm ci --ignore-scripts

      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Validate deployment safety contracts
        run: npm run test:cloudflare-deployment-safety

      - name: Deploy approved Syria Worker version once
        run: npm --prefix cloudflare/worker run deploy:production

      - name: Verify deployed Syria Worker release and read-only routes
        env:
          RAWAJ_WORKER_EXPECTED_RELEASE_SHA: ${{ inputs.reviewed_release_sha }}
          RAWAJ_WORKER_BASE_URL: https://rawaj-classifieds-hub.allidamech.workers.dev
        run: npm --prefix cloudflare/worker run smoke:production:read-only

      - name: Manual rollback instructions
        if: ${{ failure() }}
        run: |
          echo "::error::Syria Production Worker deployment or verification failed."
          echo "Do not rerun this workflow until the failure is understood."
          echo "No automatic rollback was attempted."
          echo "If the failed release reached Production, use only the deployment history of rawaj-classifieds-hub after explicit approval."
