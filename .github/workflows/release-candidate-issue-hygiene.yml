name: Release Candidate Issue Hygiene

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-candidate.yml"
      - ".github/workflows/release-candidate-issue-hygiene.yml"
      - "scripts/release-candidate-issue-hygiene.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release candidate issue hygiene contract
        run: node --test scripts/release-candidate-issue-hygiene.test.mjs
      - name: Lint contract
        run: npx eslint scripts/release-candidate-issue-hygiene.test.mjs
