name: Format Taxonomy Data Quality Once

on:
  push:
    branches:
      - feature/taxonomy-search-foundation-v1
    paths:
      - ".github/workflows/format-taxonomy-data-quality-once.yml"
      - "src/lib/api/listing-data-quality-context.ts"
      - "src/routes/admin.data-quality.tsx"
      - "src/routes/admin.tsx"

permissions:
  contents: write

concurrency:
  group: format-taxonomy-data-quality-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format workspace sources
        run: |
          npx prettier --write \
            src/lib/api/listing-data-quality-context.ts \
            src/routes/admin.data-quality.tsx \
            src/routes/admin.tsx
      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet -- \
            src/lib/api/listing-data-quality-context.ts \
            src/routes/admin.data-quality.tsx \
            src/routes/admin.tsx; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/api/listing-data-quality-context.ts \
            src/routes/admin.data-quality.tsx \
            src/routes/admin.tsx
          git commit -m "style: format data quality workspace"
          git push origin HEAD:feature/taxonomy-search-foundation-v1
