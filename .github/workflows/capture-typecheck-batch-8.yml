name: Capture Batch 8 typecheck

on:
  push:
    branches:
      - agent/launch-readiness-batch-8

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness-batch-8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture TypeScript output
        run: npm run typecheck -- --pretty false > batch-8-typecheck.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batch-8-typecheck.txt
          git commit -m "Capture Batch 8 typecheck diagnostics"
          git push origin HEAD:agent/launch-readiness-batch-8
