name: Apply seller review traits patch

on:
  push:
    branches:
      - feature/seller-review-traits

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/seller-review-traits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one anchor in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/lib/classifieds-types.ts",
              'export type SellerReviewStatus = "pending_review" | "approved" | "rejected";\n',
              'export type SellerReviewStatus = "pending_review" | "approved" | "rejected";\n\n'
              'export type SellerReviewTrait =\n'
              '  | "accurate_description"\n'
              '  | "good_communication"\n'
              '  | "fast_response"\n'
              '  | "fair_deal"\n'
              '  | "punctual"\n'
              '  | "trustworthy";\n',
          )
          replace_once(
              "src/lib/classifieds-types.ts",
              '  rating: number;\n  comment: string;\n  status: SellerReviewStatus;\n',
              '  rating: number;\n  comment: string | null;\n  traits: SellerReviewTrait[];\n  status: SellerReviewStatus;\n',
          )
          replace_once(
              "src/lib/classifieds-types.ts",
              '  rating: number;\n  comment: string;\n}\n\nexport interface ModerateSellerReviewPayload',
              '  rating: number;\n  comment?: string | null;\n  traits?: SellerReviewTrait[];\n}\n\nexport interface ModerateSellerReviewPayload',
          )

          replace_once(
              "src/lib/api/reviews.ts",
              '  SellerReview,\n  SellerReviewStatus,\n',
              '  SellerReview,\n  SellerReviewStatus,\n  SellerReviewTrait,\n',
          )
          replace_once(
              "src/lib/api/reviews.ts",
              'import { getClient, mapError, rowNullableString, rowNumber, rowString } from "@/lib/api/shared";\n',
              'import { getClient, mapError, rowArray, rowNullableString, rowNumber, rowString } from "@/lib/api/shared";\n',
          )
          replace_once(
              "src/lib/api/reviews.ts",
              'export type SellerReviewWithResponse = SellerReview & SellerReviewResponseFields;\n',
              'export type SellerReviewWithResponse = SellerReview & SellerReviewResponseFields;\n\n'
              'export const SELLER_REVIEW_TRAITS = [\n'
              '  "accurate_description",\n'
              '  "good_communication",\n'
              '  "fast_response",\n'
              '  "fair_deal",\n'
              '  "punctual",\n'
              '  "trustworthy",\n'
              '] as const satisfies readonly SellerReviewTrait[];\n\n'
              'const sellerReviewTraitSet = new Set<string>(SELLER_REVIEW_TRAITS);\n\n'
              'export function sellerReviewTraitLabel(trait: SellerReviewTrait, language: string): string {\n'
              '  const labels: Record<SellerReviewTrait, [string, string]> = {\n'
              '    accurate_description: ["الوصف دقيق", "Accurate description"],\n'
              '    good_communication: ["تواصل جيد", "Good communication"],\n'
              '    fast_response: ["سريع الرد", "Fast response"],\n'
              '    fair_deal: ["تعامل منصف", "Fair deal"],\n'
              '    punctual: ["ملتزم بالموعد", "Punctual"],\n'
              '    trustworthy: ["جدير بالثقة", "Trustworthy"],\n'
              '  };\n'
              '  return labels[trait][language === "ar" ? 0 : 1];\n'
              '}\n',
          )
          replace_once(
              "src/lib/api/reviews.ts",
              '  const sellerUserId = payload.sellerUserId.trim();\n  const reviewerUserId = payload.reviewerUserId.trim();\n  const comment = payload.comment.trim();\n',
              '  const sellerUserId = payload.sellerUserId.trim();\n'
              '  const reviewerUserId = payload.reviewerUserId.trim();\n'
              '  const comment = payload.comment?.trim() ?? "";\n'
              '  const requestedTraitCount = payload.traits?.length ?? 0;\n'
              '  const traits = Array.from(new Set(payload.traits ?? []));\n',
          )
          replace_once(
              "src/lib/api/reviews.ts",
              '  if (comment.length < 10 || comment.length > 1200) {\n',
              '  if (comment && (comment.length < 10 || comment.length > 1200)) {\n',
          )
          replace_once(
              "src/lib/api/reviews.ts",
              '  const clientResult = getClient();\n  if (!clientResult.ok) return clientResult;\n\n  const { data, error } = await clientResult.data.rpc("rawaj_create_eligible_seller_review", {\n',
              '  if (\n'
              '    traits.length > 3 ||\n'
              '    traits.length !== requestedTraitCount ||\n'
              '    !traits.every((trait) => sellerReviewTraitSet.has(trait))\n'
              '  ) {\n'
              '    return {\n'
              '      ok: false,\n'
              '      error: {\n'
              '        code: "validation_error",\n'
              '        message: "اختر حتى 3 صفات معتمدة بدون تكرار.",\n'
              '      },\n'
              '    };\n'
              '  }\n\n'
              '  const clientResult = getClient();\n'
              '  if (!clientResult.ok) return clientResult;\n\n'
              '  const { data, error } = await clientResult.data.rpc("rawaj_create_eligible_seller_review", {\n',
          )
          replace_once(
              "src/lib/api/reviews.ts",
              '    p_comment: comment,\n    p_related_listing_id: payload.relatedListingId?.trim() || null,\n',
              '    p_comment: comment,\n    p_related_listing_id: payload.relatedListingId?.trim() || null,\n    p_traits: traits,\n',
          )
          replace_once(
              "src/lib/api/reviews.ts",
              '"id,seller_user_id,reviewer_user_id,related_listing_id,rating,comment,status,admin_note,reviewed_by,reviewed_at,created_at,updated_at",',
              '"id,seller_user_id,reviewer_user_id,related_listing_id,rating,comment,traits,status,admin_note,reviewed_by,reviewed_at,created_at,updated_at",',
          )
          replace_once(
              "src/lib/api/reviews.ts",
              '    comment: rowString(row, "comment"),\n    status: rowString(row, "status", "pending_review") as SellerReviewStatus,\n',
              '    comment: rowNullableString(row, "comment"),\n'
              '    traits: rowArray(row, "traits").filter(\n'
              '      (trait): trait is SellerReviewTrait => sellerReviewTraitSet.has(trait),\n'
              '    ),\n'
              '    status: rowString(row, "status", "pending_review") as SellerReviewStatus,\n',
          )

          replace_once(
              "src/features/reviews/SellerReviewCard.tsx",
              '  createSellerReviewReport,\n  readSellerReviewResponse,\n',
              '  createSellerReviewReport,\n  readSellerReviewResponse,\n  sellerReviewTraitLabel,\n',
          )
          replace_once(
              "src/features/reviews/SellerReviewCard.tsx",
              '      <p className="mt-1 whitespace-pre-line text-xs leading-6">{review.comment}</p>\n',
              '      {review.traits.length > 0 ? (\n'
              '        <div className="mt-2 flex flex-wrap gap-1.5">\n'
              '          {review.traits.map((trait) => (\n'
              '            <span\n'
              '              key={trait}\n'
              '              className="rounded-lg bg-primary/[0.06] px-2 py-1 text-[10px] font-bold text-primary"\n'
              '            >\n'
              '              {sellerReviewTraitLabel(trait, language)}\n'
              '            </span>\n'
              '          ))}\n'
              '        </div>\n'
              '      ) : null}\n'
              '      {review.comment ? (\n'
              '        <p className="mt-2 whitespace-pre-line text-xs leading-6">{review.comment}</p>\n'
              '      ) : null}\n',
          )

          replace_once(
              "src/routes/seller.$id.tsx",
              '  createSellerReview,\n  fetchPublicSellerProfile,\n  fetchSellerReviewEligibility,\n',
              '  createSellerReview,\n  fetchPublicSellerProfile,\n  fetchSellerReviewEligibility,\n  SELLER_REVIEW_TRAITS,\n  sellerReviewTraitLabel,\n',
          )
          replace_once(
              "src/routes/seller.$id.tsx",
              '  const [rating, setRating] = useState(5);\n  const [comment, setComment] = useState("");\n',
              '  const [rating, setRating] = useState(5);\n'
              '  const [comment, setComment] = useState("");\n'
              '  const [selectedTraits, setSelectedTraits] = useState<typeof SELLER_REVIEW_TRAITS[number][]>([]);\n',
          )
          replace_once(
              "src/routes/seller.$id.tsx",
              '      rating,\n      comment,\n    });\n',
              '      rating,\n      comment,\n      traits: selectedTraits,\n    });\n',
          )
          replace_once(
              "src/routes/seller.$id.tsx",
              '      setComment("");\n      setRating(5);\n',
              '      setComment("");\n      setRating(5);\n      setSelectedTraits([]);\n',
          )
          replace_once(
              "src/routes/seller.$id.tsx",
              '            <textarea\n              value={comment}\n',
              '            <div>\n'
              '              <p className="text-[10px] font-bold text-muted-foreground">\n'
              '                {text("صفات سريعة — اختر حتى 3", "Quick traits — choose up to 3")}\n'
              '              </p>\n'
              '              <div className="mt-2 flex flex-wrap gap-2">\n'
              '                {SELLER_REVIEW_TRAITS.map((trait) => {\n'
              '                  const selected = selectedTraits.includes(trait);\n'
              '                  return (\n'
              '                    <button\n'
              '                      key={trait}\n'
              '                      type="button"\n'
              '                      aria-pressed={selected}\n'
              '                      disabled={saving || (!selected && selectedTraits.length >= 3)}\n'
              '                      onClick={() =>\n'
              '                        setSelectedTraits((current) =>\n'
              '                          current.includes(trait)\n'
              '                            ? current.filter((item) => item !== trait)\n'
              '                            : current.length >= 3\n'
              '                              ? current\n'
              '                              : [...current, trait],\n'
              '                        )\n'
              '                      }\n'
              '                      className={`min-h-11 rounded-xl px-3 py-2 text-[11px] font-bold hairline disabled:opacity-45 ${\n'
              '                        selected ? "bg-primary text-primary-foreground" : "bg-white/72"\n'
              '                      }`}\n'
              '                    >\n'
              '                      {sellerReviewTraitLabel(trait, language)}\n'
              '                    </button>\n'
              '                  );\n'
              '                })}\n'
              '              </div>\n'
              '            </div>\n'
              '            <textarea\n'
              '              value={comment}\n',
          )
          replace_once(
              "src/routes/seller.$id.tsx",
              '                "اكتب تجربتك مع هذا المعلن",\n                "Write your experience with this seller",\n',
              '                "تعليق كتابي اختياري — 10 أحرف على الأقل عند الكتابة",\n                "Optional written comment — at least 10 characters when provided",\n',
          )

          replace_once(
              "package.json",
              '&& npm run test:review-response && npm run test:review-report && npm run lint',
              '&& npm run test:review-response && npm run test:review-report && npm run test:review-traits && npm run lint',
          )
          replace_once(
              "package.json",
              '    "test:review-report": "node --test scripts/seller-review-report.test.mjs",\n',
              '    "test:review-report": "node --test scripts/seller-review-report.test.mjs",\n'
              '    "test:review-traits": "node --test scripts/seller-review-traits.test.mjs",\n',
          )

          replace_once(
              ".github/workflows/quality-gate.yml",
              '      - name: Seller review report contract\n        run: npm run test:review-report\n\n      - name: Typecheck\n',
              '      - name: Seller review report contract\n'
              '        run: npm run test:review-report\n\n'
              '      - name: Seller review traits contract\n'
              '        run: npm run test:review-traits\n\n'
              '      - name: Typecheck\n',
          )
          PY

      - name: Format changed sources
        run: npx prettier --write src/lib/classifieds-types.ts src/lib/api/reviews.ts src/features/reviews/SellerReviewCard.tsx 'src/routes/seller.$id.tsx' package.json scripts/seller-review-traits.test.mjs .github/workflows/quality-gate.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/classifieds-types.ts src/lib/api/reviews.ts src/features/reviews/SellerReviewCard.tsx 'src/routes/seller.$id.tsx' package.json scripts/seller-review-traits.test.mjs .github/workflows/quality-gate.yml
          git commit -m "Implement seller review quick traits"
          git push origin HEAD:feature/seller-review-traits
