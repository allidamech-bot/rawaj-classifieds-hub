name: Public Auth Actions Integrity

on:
  pull_request:
    paths:
      - "src/routes/login.tsx"
      - "src/routes/reset-password.tsx"
      - "scripts/public-auth-actions-integrity.test.mjs"
      - ".github/workflows/public-auth-actions-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-auth-actions-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Public auth action contract
        run: node --test scripts/public-auth-actions-integrity.test.mjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
