name: Admin Actions Integrity

on:
  pull_request:
    paths:
      - "src/routes/admin*.tsx"
      - "src/lib/api/**"
      - "scripts/admin-actions-integrity.test.mjs"
      - "docs/admin-actions-inventory.md"
      - ".github/workflows/admin-actions-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-actions-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Admin Actions Integrity Contract
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/admin-actions-integrity.test.mjs 2>&1 | tee "$RUNNER_TEMP/admin-actions-contract.log"
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-actions-contract-${{ github.sha }}
          path: ${{ runner.temp }}/admin-actions-contract.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when contract failed
        if: steps.contract.outcome == 'failure'
        run: exit 1
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
