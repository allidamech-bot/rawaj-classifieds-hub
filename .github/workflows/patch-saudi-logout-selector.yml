name: Patch Saudi logout selector

"on":
  push:
    branches:
      - fix/saudi-closure-logout-selector-20260803
    paths:
      - .github/workflows/patch-saudi-logout-selector.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saudi-closure-logout-selector-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch and validate selector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/saudi-infra-admin-production-e2e.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'page.getByRole("button", { name: /تسجيل الخروج|Log out/i });'
          new = 'page.getByRole("button", { name: /^(?:خروج|تسجيل الخروج|Log out)$/i });'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one logout selector, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          npx prettier --write scripts/saudi-infra-admin-production-e2e.mjs
          node --check scripts/saudi-infra-admin-production-e2e.mjs
          rm .github/workflows/patch-saudi-logout-selector.yml
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/saudi-infra-admin-production-e2e.mjs .github/workflows/patch-saudi-logout-selector.yml
          git commit -m "fix(saudi): match production logout label"
          git push origin HEAD:fix/saudi-closure-logout-selector-20260803
