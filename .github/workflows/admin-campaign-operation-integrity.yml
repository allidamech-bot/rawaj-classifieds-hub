name: Admin Campaign Operation Integrity

on:
  pull_request:
    paths:
      - "src/lib/api/campaigns.ts"
      - "src/lib/classifieds-types.ts"
      - "src/routes/admin.campaigns.tsx"
      - "src/routes/admin.tsx"
      - "scripts/admin-campaign-operation-integrity.test.mjs"
      - ".github/workflows/admin-campaign-operation-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Admin campaign operation integrity contract
        run: node --test scripts/admin-campaign-operation-integrity.test.mjs
      - name: Lint changed TypeScript
        run: npx eslint --quiet src/lib/api/campaigns.ts src/lib/classifieds-types.ts
