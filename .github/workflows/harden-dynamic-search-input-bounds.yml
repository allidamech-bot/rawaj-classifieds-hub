name: Harden Dynamic Search Input Bounds

on:
  pull_request:
    paths:
      - ".github/workflows/harden-dynamic-search-input-bounds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply server-side request bounds
        shell: python
        run: |
          from pathlib import Path

          facets_path = Path("supabase/migrations/202607190041_dynamic_listing_facets_repair_v1.sql")
          facets = facets_path.read_text(encoding="utf-8")
          marker = """  if (select count(*) from jsonb_object_keys(v_filters)) > 50 then
              raise exception 'listing_facet_filter_limit_exceeded' using errcode = '54000';
            end if;
          """
          addition = marker + """
            if p_taxonomy_node_ids is not null and cardinality(p_taxonomy_node_ids) > 250 then
              raise exception 'listing_facet_taxonomy_node_limit_exceeded' using errcode = '54000';
            end if;

            if length(v_query) > 160 then
              raise exception 'listing_facet_query_too_long' using errcode = '22023';
            end if;
          """
          if facets.count(marker) != 1:
              raise SystemExit("Facet validation marker mismatch")
          facets_path.write_text(facets.replace(marker, addition), encoding="utf-8")

          search_path = Path("supabase/migrations/202607190042_dynamic_listing_search_page_v1.sql")
          search = search_path.read_text(encoding="utf-8")
          marker = """  if (select count(*) from jsonb_object_keys(v_filters)) > 50 then
              raise exception 'listing_search_filter_limit_exceeded' using errcode = '54000';
            end if;
          """
          addition = marker + """
            if p_taxonomy_node_ids is not null and cardinality(p_taxonomy_node_ids) > 250 then
              raise exception 'listing_search_taxonomy_node_limit_exceeded' using errcode = '54000';
            end if;

            if p_location_node_ids is not null and cardinality(p_location_node_ids) > 250 then
              raise exception 'listing_search_location_node_limit_exceeded' using errcode = '54000';
            end if;

            if length(v_query) > 160 then
              raise exception 'listing_search_query_too_long' using errcode = '22023';
            end if;
          """
          if search.count(marker) != 1:
              raise SystemExit("Search validation marker mismatch")
          search_path.write_text(search.replace(marker, addition), encoding="utf-8")

          facet_test_path = Path("scripts/dynamic-listing-facets-v1.test.mjs")
          facet_test = facet_test_path.read_text(encoding="utf-8")
          anchor = """  assert.match(migration, /grant execute[\\s\\S]*to anon, authenticated/i);
          """
          replacement = anchor + """  assert.match(migration, /cardinality\\(p_taxonomy_node_ids\\) > 250/);
            assert.match(migration, /length\\(v_query\\) > 160/);
          """
          if facet_test.count(anchor) != 1:
              raise SystemExit("Facet test marker mismatch")
          facet_test_path.write_text(facet_test.replace(anchor, replacement), encoding="utf-8")

          search_test_path = Path("scripts/dynamic-listing-search-v1.test.mjs")
          search_test = search_test_path.read_text(encoding="utf-8")
          anchor = """    assert.match(migration, /grant execute[\\s\\S]*to anon, authenticated/i);
          """
          replacement = anchor + """    assert.match(migration, /length\\(v_query\\) > 160/);
          """
          if search_test.count(anchor) != 1:
              raise SystemExit("Search test marker mismatch")
          search_test = search_test.replace(anchor, replacement)
          search_test += """

          test("public search RPC bounds direct-call array inputs", () => {
            assert.match(searchMigration, /cardinality\\(p_taxonomy_node_ids\\) > 250/);
            assert.match(searchMigration, /cardinality\\(p_location_node_ids\\) > 250/);
          });
          """
          search_test_path.write_text(search_test, encoding="utf-8")
      - name: Verify focused contracts
        run: |
          npm ci
          node --test scripts/dynamic-listing-facets-v1.test.mjs
          node --test scripts/dynamic-listing-search-v1.test.mjs
          npm run typecheck
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202607190041_dynamic_listing_facets_repair_v1.sql \
            supabase/migrations/202607190042_dynamic_listing_search_page_v1.sql \
            scripts/dynamic-listing-facets-v1.test.mjs \
            scripts/dynamic-listing-search-v1.test.mjs
          git commit -m "security: bound public dynamic search inputs"
          branch='${{ github.event.pull_request.head.ref || github.ref_name }}'
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
