name: Worker Lock Prune Artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/worker-lock-prune-artifact.yml"

permissions:
  contents: write

jobs:
  prune:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-worker-package-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-worker-package-isolation
      - name: Restore the accepted main lockfile
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git show refs/remotes/origin/main:cloudflare/worker/package-lock.json > cloudflare/worker/package-lock.json
      - name: Remove only the retired application links
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "cloudflare/worker/package-lock.json";
          const lock = JSON.parse(await readFile(path, "utf8"));
          delete lock.packages?.[""]?.dependencies;
          delete lock.packages?.["../.."];
          delete lock.packages?.["node_modules/tanstack_start_ts"];
          await writeFile(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Verify the lock changed only at the package boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const lock = JSON.parse(await readFile("cloudflare/worker/package-lock.json", "utf8"));
          if (lock.packages?.[""]?.dependencies) throw new Error("Worker root still has runtime dependencies.");
          if (lock.packages?.["../.."] || lock.packages?.["node_modules/tanstack_start_ts"]) {
            throw new Error("Worker lock still references the frontend package.");
          }
          if (lock.packages?.["node_modules/firebase"] || lock.packages?.["node_modules/react"]) {
            throw new Error("Worker lock contains frontend runtime packages.");
          }
          const expected = ["typescript", "wrangler"];
          const actual = Object.keys(lock.packages?.[""]?.devDependencies ?? {}).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected Worker root dev dependencies: ${actual.join(", ")}`);
          }
          NODE
      - name: Commit the pruned lockfile to this maintenance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker/package-lock.json
          if git diff --cached --quiet; then
            echo "Worker lockfile already matches the pruned main lock."
          else
            git commit -m "chore: prune frontend link from Worker lockfile"
            git push origin HEAD:fix/cloudflare-worker-package-isolation
          fi
