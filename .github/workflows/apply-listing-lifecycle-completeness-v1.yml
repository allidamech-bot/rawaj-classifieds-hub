name: Apply Listing Lifecycle Completeness V1

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/apply-listing-lifecycle-completeness-v1.yml"
      - "scripts/apply-listing-lifecycle-completeness-v1.mjs"

permissions:
  contents: write

concurrency:
  group: apply-listing-lifecycle-completeness-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply lifecycle completeness changes
        run: node scripts/apply-listing-lifecycle-completeness-v1.mjs
      - name: Make lifecycle contract formatting-independent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/listing-lifecycle-completeness-v1.test.mjs")
          source = path.read_text(encoding="utf-8")
          old = '  assert.match(ownerListings, /action: "close", targetStatus: "unavailable"/);'
          new = '''  assert.match(
            ownerListings,
            /action:\\s*"close",[\\s\\S]*?targetStatus:\\s*"unavailable"/,
          );'''
          if old not in source:
              raise SystemExit("Unavailable confirmation assertion was not found.")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Format changed files
        run: npx prettier --write src/routes/profile/listings.tsx scripts/listing-lifecycle-completeness-v1.test.mjs package.json
      - name: Verify focused lifecycle contract
        run: node --test scripts/listing-lifecycle-completeness-v1.test.mjs
      - name: Lint changed source
        run: npx eslint --quiet src/routes/profile/listings.tsx scripts/listing-lifecycle-completeness-v1.test.mjs
      - name: Typecheck application
        run: npm run typecheck
      - name: Commit generated batch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No lifecycle completeness changes were produced."
            exit 0
          fi
          git commit -m "feat(listing): complete owner lifecycle actions"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
