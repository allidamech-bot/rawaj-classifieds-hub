name: Home and Category Discovery Integrity Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/index.tsx"
      - "src/routes/categories.tsx"
      - "src/routes/category.$slug.tsx"
      - "src/features/home/**"
      - "src/features/categories/**"
      - "src/features/seo/MarketplaceLandingPage.tsx"
      - "src/lib/taxonomy.ts"
      - "src/lib/api/listings.ts"
      - "src/lib/api/references.ts"
      - "scripts/home-category-discovery-integrity.test.mjs"
      - "package.json"
      - ".github/workflows/home-category-discovery-integrity.yml"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Home and Category Discovery Integrity contract
        run: npm run test:home-category-discovery

      - name: TypeScript
        run: npm run typecheck
