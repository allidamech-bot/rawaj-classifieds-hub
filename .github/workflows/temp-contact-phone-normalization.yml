name: Implement contact phone normalization

on:
  push:
    branches:
      - fix/contact-phone-normalization

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contact-phone-normalization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply listing contact normalization
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/routes/listings.$id.tsx")
          text = path.read_text()

          import_anchor = 'import { listingStatusLabel } from "@/lib/status-labels";\n'
          import_replacement = (
              'import { phoneHref, whatsappHref } from "@/lib/contact-phone";\n'
              + import_anchor
          )
          if import_anchor not in text:
              raise SystemExit("contact import anchor missing")
          text = text.replace(import_anchor, import_replacement, 1)

          old = '''  const canCall = Boolean(listing.contactOptions.phone && cleanPhone);
            const canWhatsapp = Boolean(listing.contactOptions.whatsapp && cleanWhatsapp);'''
          new = '''  const callHref = listing.contactOptions.phone ? phoneHref(cleanPhone) : null;
            const whatsappUrl = listing.contactOptions.whatsapp ? whatsappHref(cleanWhatsapp) : null;
            const canCall = Boolean(callHref);
            const canWhatsapp = Boolean(whatsappUrl);'''
          if old not in text:
              raise SystemExit("contact capability anchor missing")
          text = text.replace(old, new, 1)

          if text.count('href={`tel:${cleanPhone}`}') != 2:
              raise SystemExit("unexpected tel link count")
          text = text.replace('href={`tel:${cleanPhone}`}', 'href={callHref ?? undefined}')

          wa_anchor = 'href={`https://wa.me/${normalizePhoneForWhatsapp(cleanWhatsapp)}`}'
          if text.count(wa_anchor) != 2:
              raise SystemExit("unexpected WhatsApp link count")
          text = text.replace(wa_anchor, 'href={whatsappUrl ?? undefined}')

          old_fn = '''function normalizePhoneForWhatsapp(value: string) {
            return value.replace(/[^\\d]/g, "");
          }

          '''
          if old_fn not in text:
              raise SystemExit("legacy WhatsApp normalizer missing")
          text = text.replace(old_fn, "", 1)
          path.write_text(text)
          PY
          npx prettier --write 'src/routes/listings.$id.tsx' src/lib/contact-phone.ts scripts/contact-phone.test.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/listings.$id.tsx' src/lib/contact-phone.ts scripts/contact-phone.test.mjs
          git commit -m "Normalize listing contact phone links"
          git push origin HEAD:fix/contact-phone-normalization
