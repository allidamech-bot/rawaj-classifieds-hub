name: Temporary PR 257 Lint Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture lint output
        shell: bash
        run: |
          npx eslint --quiet \
            src/lib/api/public-fields.ts \
            src/lib/api/reports.ts \
            src/features/search/SearchResultsToolbar.tsx \
            > lint.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr257-lint-diagnostic
          path: lint.log
          retention-days: 1
