name: App-wide Nearby Discovery V1

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/nearby-preferences.ts"
      - "src/lib/nearby-geolocation.ts"
      - "src/lib/api/nearby-listings.ts"
      - "src/features/listings/use-nearby-discovery.ts"
      - "src/features/listings/NearbyDiscoveryControl.tsx"
      - "scripts/app-wide-nearby-discovery-v1.test.mjs"
      - ".github/workflows/app-wide-nearby-discovery-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: App-wide nearby discovery contract
        run: node --test scripts/app-wide-nearby-discovery-v1.test.mjs
      - name: Lint nearby sources
        id: lint
        continue-on-error: true
        run: npx eslint src/lib/nearby-preferences.ts src/features/listings/use-nearby-discovery.ts src/features/listings/NearbyDiscoveryControl.tsx scripts/app-wide-nearby-discovery-v1.test.mjs > nearby-lint.log 2>&1
      - name: Upload lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: nearby-lint-log
          path: nearby-lint.log
      - name: Stop on lint failure
        if: steps.lint.outcome == 'failure'
        run: cat nearby-lint.log && exit 1
      - name: Typecheck
        run: npm run typecheck -- --pretty false
