name: Chat Image Attachments UI V1

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/chats.tsx"
      - "src/lib/api/messaging.ts"
      - "src/lib/api/messaging-guarded.ts"
      - "src/lib/classifieds-types.ts"
      - "scripts/chat-image-attachments-ui-v1.test.mjs"
      - "scripts/chat-workspace.test.mjs"
      - "scripts/chat-workspace-live.test.mjs"
      - "scripts/message-send-idempotency.test.mjs"
      - "scripts/chat-composer-scope-isolation.test.mjs"
      - "scripts/conversations-messaging-realtime-integrity.test.mjs"
      - ".github/workflows/chat-image-attachments-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chat image UI contract
        run: node --test scripts/chat-image-attachments-ui-v1.test.mjs
      - name: Chat workspace contract
        run: node --test scripts/chat-workspace.test.mjs
      - name: Chat live workspace contract
        run: node --test scripts/chat-workspace-live.test.mjs
      - name: Message idempotency contract
        run: node --test scripts/message-send-idempotency.test.mjs
      - name: Composer scope isolation contract
        run: node --test scripts/chat-composer-scope-isolation.test.mjs
      - name: Lint chat sources
        run: npx eslint --quiet src/routes/chats.tsx src/lib/api/messaging.ts src/lib/api/messaging-guarded.ts src/lib/classifieds-types.ts
      - name: Typecheck
        run: npm run typecheck -- --pretty false
