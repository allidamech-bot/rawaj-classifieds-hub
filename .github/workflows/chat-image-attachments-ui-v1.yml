name: Chat Image Attachments UI V1

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/chats.tsx"
      - "src/lib/api/messaging.ts"
      - "src/lib/api/messaging-guarded.ts"
      - "src/lib/api/chat-image-attachments.ts"
      - "src/lib/classifieds-types.ts"
      - "scripts/chat-image-attachments-ui-v1.test.mjs"
      - ".github/workflows/chat-image-attachments-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/chat-image-attachments-ui-v1.test.mjs
      - run: npx eslint --quiet src/routes/chats.tsx src/lib/api/messaging.ts src/lib/api/messaging-guarded.ts src/lib/api/chat-image-attachments.ts src/lib/classifieds-types.ts
      - run: npm run typecheck -- --pretty false
