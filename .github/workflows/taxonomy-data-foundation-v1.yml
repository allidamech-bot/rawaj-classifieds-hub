name: Taxonomy Data Foundation V1

on:
  pull_request:
    paths:
      - "supabase/migrations/20260719002*.sql"
      - "supabase/migrations/20260719003*.sql"
      - "src/lib/api/taxonomy-metadata.ts"
      - "src/lib/api/listing-attributes.ts"
      - "src/lib/dynamic-listing-fields.ts"
      - "src/features/listing-studio/DynamicListingFields.tsx"
      - "src/lib/classifieds-api.ts"
      - "scripts/taxonomy-data-foundation-v1.test.mjs"
      - "scripts/listing-attribute-write-contract-v1.test.mjs"
      - "scripts/taxonomy-metadata-api-v1.test.mjs"
      - "scripts/taxonomy-metadata-client-v1.test.mjs"
      - "scripts/taxonomy-mapping-review-apply-v1.test.mjs"
      - "scripts/vehicle-reference-review-apply-v1.test.mjs"
      - "scripts/dynamic-listing-submit-guard-v1.test.mjs"
      - "scripts/dynamic-listing-studio-client-v1.test.mjs"
      - "scripts/replay-supabase-local.mjs"
      - "scripts/sql/clean-replay-*.sql"
      - "scripts/sql/*-local-verification.sql"
      - "docs/production-schema/migration-ledger.json"
      - ".github/workflows/taxonomy-data-foundation-v1.yml"
      - ".github/workflows/supabase-local-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-data-foundation-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Taxonomy and data foundation contract
        run: node --test scripts/taxonomy-data-foundation-v1.test.mjs
      - name: Listing attribute write contract
        run: node --test scripts/listing-attribute-write-contract-v1.test.mjs
      - name: Taxonomy metadata API contract
        run: node --test scripts/taxonomy-metadata-api-v1.test.mjs
      - name: Taxonomy metadata client contract
        run: node --test scripts/taxonomy-metadata-client-v1.test.mjs
      - name: Taxonomy mapping review and apply contract
        run: node --test scripts/taxonomy-mapping-review-apply-v1.test.mjs
      - name: Vehicle reference review and apply contract
        run: node --test scripts/vehicle-reference-review-apply-v1.test.mjs
      - name: Dynamic listing submit guard contract
        run: node --test scripts/dynamic-listing-submit-guard-v1.test.mjs
      - name: Dynamic listing studio client contract
        run: node --test scripts/dynamic-listing-studio-client-v1.test.mjs
      - name: ESLint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/rawaj-taxonomy-lint.log"
      - name: Upload ESLint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-eslint-${{ github.sha }}
          path: ${{ runner.temp }}/rawaj-taxonomy-lint.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when ESLint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
