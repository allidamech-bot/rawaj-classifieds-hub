name: Taxonomy Data Foundation V1

on:
  pull_request:
    paths:
      - "supabase/migrations/20260719002*.sql"
      - "supabase/migrations/20260719003*.sql"
      - "src/lib/api/taxonomy-metadata.ts"
      - "src/lib/api/listing-attributes.ts"
      - "src/lib/api/taxonomy-review-queues.ts"
      - "src/lib/api/listing-data-quality.ts"
      - "src/lib/api/listing-data-quality-context.ts"
      - "src/lib/dynamic-listing-fields.ts"
      - "src/features/listing-studio/DynamicListingFields.tsx"
      - "src/routes/add-listing.tsx"
      - "src/routes/profile/listings.$id.tsx"
      - "src/routes/admin.data-quality.tsx"
      - "src/routes/admin.tsx"
      - "src/lib/classifieds-api.ts"
      - "scripts/taxonomy-data-foundation-v1.test.mjs"
      - "scripts/listing-attribute-write-contract-v1.test.mjs"
      - "scripts/taxonomy-metadata-api-v1.test.mjs"
      - "scripts/taxonomy-metadata-client-v1.test.mjs"
      - "scripts/taxonomy-mapping-review-apply-v1.test.mjs"
      - "scripts/vehicle-reference-review-apply-v1.test.mjs"
      - "scripts/taxonomy-review-queue-client-v1.test.mjs"
      - "scripts/listing-data-quality-workspace-v1.test.mjs"
      - "scripts/listing-data-quality-client-v1.test.mjs"
      - "scripts/admin-data-quality-workspace-v1.test.mjs"
      - "scripts/add-listing-dynamic-all-categories-v1.test.mjs"
      - "scripts/dynamic-listing-submit-guard-v1.test.mjs"
      - "scripts/dynamic-listing-studio-client-v1.test.mjs"
      - "scripts/replay-supabase-local.mjs"
      - "scripts/sql/clean-replay-*.sql"
      - "scripts/sql/*-local-verification.sql"
      - "docs/production-schema/migration-ledger.json"
      - ".github/workflows/taxonomy-data-foundation-v1.yml"
      - ".github/workflows/supabase-local-replay.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taxonomy-data-foundation-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Complete governed edit integration once
        shell: bash
        run: |
          set -euo pipefail
          route='src/routes/profile/listings.$id.tsx'
          if grep -q '<DynamicListingFields' "$route"; then
            echo "Governed edit integration already present."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/integrate-edit-listing-dynamic-all-categories-v1.py")
          source = path.read_text(encoding="utf-8")

          old_helper = '''def replace_once(label: str, old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, found {count}")
              source = source.replace(old, new, 1)
          '''
          new_helper = '''def replace_once(label: str, old: str, new: str) -> None:
              global source
              expected_count = 2 if label == "save loading guard" else 1
              count = source.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f"{label}: expected {expected_count} marker(s), found {count}"
                  )
              source = source.replace(old, new, 1)
          '''
          if old_helper not in source:
              raise SystemExit("Transformer helper marker missing")
          source = source.replace(old_helper, new_helper, 1)

          old_ui_marker = '''            <CategorySpecificFields
              kind={categoryFieldKind}
              values={categoryDetails}
              disabled={!isEditable}
              text={text}
              onChange={(nextDetails) => {
                setCategoryDetails(nextDetails);
                if (categoryFieldKind === "vehicles" || categoryFieldKind === "electronics") {
                  setCondition(categoryDetailsGlobalCondition(categoryFieldKind, nextDetails));
                }
              }}
            />
'''
          actual_ui_marker = '''            <CategorySpecificFields
              kind={categoryFieldKind}
              values={categoryDetails}
              disabled={!isEditable}
              onChange={setCategoryDetails}
              text={text}
            />
'''
          if old_ui_marker not in source:
              raise SystemExit("Transformer UI search marker missing")
          source = source.replace(old_ui_marker, actual_ui_marker, 1)
          path.write_text(source, encoding="utf-8")
          PY

          python scripts/integrate-edit-listing-dynamic-all-categories-v1.py
          npx prettier --write "$route"
          grep -q 'fetchOwnerListingAttributes' "$route"
          grep -q '<DynamicListingFields' "$route"
          grep -q 'replaceOwnerListingAttributes' "$route"
          grep -q 'validateDynamicListingFields' "$route"
          grep -q 'dynamicSchemaUsesListingCondition' "$route"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$route"
          git commit -m "feat: integrate dynamic editing across all categories"
          git push origin HEAD:feature/taxonomy-search-foundation-v1
      - name: Taxonomy and data foundation contract
        run: node --test scripts/taxonomy-data-foundation-v1.test.mjs
      - name: Listing attribute write contract
        run: node --test scripts/listing-attribute-write-contract-v1.test.mjs
      - name: Taxonomy metadata API contract
        run: node --test scripts/taxonomy-metadata-api-v1.test.mjs
      - name: Taxonomy metadata client contract
        run: node --test scripts/taxonomy-metadata-client-v1.test.mjs
      - name: Taxonomy mapping review and apply contract
        run: node --test scripts/taxonomy-mapping-review-apply-v1.test.mjs
      - name: Vehicle reference review and apply contract
        run: node --test scripts/vehicle-reference-review-apply-v1.test.mjs
      - name: Taxonomy review queue client contract
        run: node --test scripts/taxonomy-review-queue-client-v1.test.mjs
      - name: Cross-category listing data quality contract
        run: node --test scripts/listing-data-quality-workspace-v1.test.mjs
      - name: Listing data quality client contract
        run: node --test scripts/listing-data-quality-client-v1.test.mjs
      - name: Admin data quality workspace contract
        run: node --test scripts/admin-data-quality-workspace-v1.test.mjs
      - name: Add-listing dynamic all-category contract
        run: node --test scripts/add-listing-dynamic-all-categories-v1.test.mjs
      - name: Dynamic listing submit guard contract
        run: node --test scripts/dynamic-listing-submit-guard-v1.test.mjs
      - name: Dynamic listing studio client contract
        run: node --test scripts/dynamic-listing-studio-client-v1.test.mjs
      - name: ESLint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/rawaj-taxonomy-lint.log"
      - name: Upload ESLint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-eslint-${{ github.sha }}
          path: ${{ runner.temp }}/rawaj-taxonomy-lint.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when ESLint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/rawaj-taxonomy-typecheck.log"
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-typecheck-${{ github.sha }}
          path: ${{ runner.temp }}/rawaj-taxonomy-typecheck.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when TypeScript failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Production build
        run: npm run build
