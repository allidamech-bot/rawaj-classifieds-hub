name: Push Delivery Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: rawaj-push-delivery-scheduler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    if: github.event_name == 'workflow_dispatch' || vars.PUSH_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUSH_SCHEDULER_ENABLED: ${{ vars.PUSH_SCHEDULER_ENABLED }}
      PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
      WORKER_URL: https://dpymopdckflnpmowhlyq.supabase.co/functions/v1/send-push-notifications

    steps:
      - name: Check scheduler configuration
        id: configuration
        shell: bash
        run: |
          if [ -z "$PUSH_CRON_SECRET" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ "$PUSH_SCHEDULER_ENABLED" = "true" ]; then
              echo "::error::PUSH_SCHEDULER_ENABLED is true but PUSH_CRON_SECRET is not configured."
              exit 1
            fi
            echo "::notice::PUSH_CRON_SECRET is not configured; the manual worker run was skipped safely."
            {
              echo "## RAWAJ push scheduler"
              echo
              echo "Skipped safely because the repository secret \`PUSH_CRON_SECRET\` is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Flush saved-search alerts and deliver queued push notifications
        if: steps.configuration.outputs.enabled == 'true'
        shell: bash
        run: |
          set +e
          http_code="$(
            curl \
              --silent \
              --show-error \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 120 \
              --request POST \
              --header "content-type: application/json" \
              --header "x-cron-secret: ${PUSH_CRON_SECRET}" \
              --header "x-rawaj-scheduler: github-actions-v1" \
              --data '{"source":"github-actions-scheduler-v1"}' \
              --output worker-response.json \
              --write-out '%{http_code}' \
              "$WORKER_URL" \
              2>worker-curl-error.log
          )"
          curl_status=$?
          set -e

          if [ "$curl_status" -ne 0 ]; then
            echo "::error::Push worker network request failed with curl exit code ${curl_status}."
            {
              echo "## RAWAJ push scheduler"
              echo
              echo "Network request failed before a valid worker response was received."
              echo "Curl exit code: ${curl_status}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          HTTP_CODE="$http_code" node <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const status = Number.parseInt(process.env.HTTP_CODE ?? "0", 10);
          let payload;
          try {
            payload = JSON.parse(readFileSync("worker-response.json", "utf8"));
          } catch {
            throw new Error(`Push worker returned an unreadable response (HTTP ${status}).`);
          }

          const flushed = payload?.flushed ?? null;
          const summary = {
            httpStatus: status,
            ok: payload?.ok === true,
            checkedUsers: flushed?.checked_users ?? 0,
            checkedSearches: flushed?.checked_searches ?? 0,
            matchedListings: flushed?.matched_listings ?? 0,
            createdNotifications: flushed?.created_notifications ?? 0,
            claimed: payload?.claimed ?? 0,
            sent: payload?.sent ?? 0,
            retried: payload?.retried ?? 0,
            disabledDevices: payload?.disabledDevices ?? 0,
          };

          console.log(JSON.stringify(summary));
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## RAWAJ push scheduler",
              "",
              `- HTTP status: ${summary.httpStatus}`,
              `- Saved-search users checked: ${summary.checkedUsers}`,
              `- Saved searches flushed: ${summary.checkedSearches}`,
              `- Matching listings: ${summary.matchedListings}`,
              `- Notifications created: ${summary.createdNotifications}`,
              `- Push deliveries claimed: ${summary.claimed}`,
              `- Push deliveries sent: ${summary.sent}`,
              `- Push deliveries queued for retry: ${summary.retried}`,
              `- Invalid devices disabled: ${summary.disabledDevices}`,
              "",
            ].join("\n"),
          );

          if (status < 200 || status >= 300 || payload?.ok !== true) {
            throw new Error(`Push worker failed with HTTP ${status}: ${payload?.error ?? "unknown error"}`);
          }
          NODE
