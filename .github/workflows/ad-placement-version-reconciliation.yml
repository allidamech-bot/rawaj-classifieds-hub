name: Ad Placement Version Reconciliation

on:
  push:
    branches:
      - fix/home-page-navigation-ad-placement-audit

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ad placement RPC reconciliation contract
        run: node --test scripts/ad-placement-rpc-version-ambiguity.test.mjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
