name: Apply launch readiness Batch 2

on:
  push:
    branches:
      - agent/launch-readiness-batch-2
    paths:
      - .github/workflows/apply-launch-readiness-batch-2.yml
      - scripts/apply-launch-readiness-batch-2.mjs
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - .github/workflows/apply-launch-readiness-batch-2.yml
      - scripts/apply-launch-readiness-batch-2.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness-batch-2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply implementation patch
        run: node scripts/apply-launch-readiness-batch-2.mjs

      - name: Evolve auth account compatibility contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/auth-account-v2.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = '  assert.match(profile, /to="\\/support"/);';
          const after = '  assert.match(profile, /createAccountDeletionRequest/);\n  assert.match(profile, /changeOwnPassword/);';
          if (!source.includes(before)) throw new Error('Legacy support-link contract not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - name: Format and lint Batch 2 changes
        run: |
          npx eslint --fix \
            scripts/auth-account-v2.test.mjs \
            scripts/launch-readiness-batch-2.test.mjs \
            src/lib/auth-context.ts \
            src/lib/auth.tsx \
            src/lib/api/account-security.ts \
            src/lib/api/support.ts \
            src/lib/classifieds-api.ts \
            src/features/account/AccountExperience.tsx \
            src/features/storefront/StorefrontIdentityHero.tsx \
            src/routes/profile.tsx \
            src/routes/profile/listings.tsx \
            src/routes/notifications.tsx
          npx prettier --write package.json .github/workflows/quality-gate.yml
          npx eslint --quiet \
            scripts/auth-account-v2.test.mjs \
            scripts/launch-readiness-batch-2.test.mjs \
            src/lib/auth-context.ts \
            src/lib/auth.tsx \
            src/lib/api/account-security.ts \
            src/lib/api/support.ts \
            src/lib/classifieds-api.ts \
            src/features/account/AccountExperience.tsx \
            src/features/storefront/StorefrontIdentityHero.tsx \
            src/routes/profile.tsx \
            src/routes/profile/listings.tsx \
            src/routes/notifications.tsx

      - name: Auth recovery compatibility
        run: npm run test:auth-recovery

      - name: Auth and account compatibility
        run: node --test scripts/auth-account-v2.test.mjs

      - name: Seller storefront compatibility
        run: node --test scripts/seller-storefront-v2.test.mjs

      - name: Communication center compatibility
        run: node --test scripts/communication-center-v2.test.mjs

      - name: Launch readiness Batch 2 contract
        run: npm run test:launch-readiness-batch-2

      - name: Keep workflow changes for connector commit
        run: git checkout HEAD -- .github/workflows/quality-gate.yml

      - name: Commit source implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/auth-account-v2.test.mjs scripts/launch-readiness-batch-2.test.mjs src
          git commit -m "Polish account store and notification journeys"
          git push origin HEAD:agent/launch-readiness-batch-2
