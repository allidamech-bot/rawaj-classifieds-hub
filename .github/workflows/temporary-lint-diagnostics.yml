name: Temporary Lint Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture changed-file lint output
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )
          printf 'Linting %s\n' "${files[@]}" > lint-diagnostics.txt
          npx eslint --quiet "${files[@]}" >> lint-diagnostics.txt 2>&1
          echo "exit_code=$?" >> lint-diagnostics.txt
          exit 0

      - name: Upload lint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint-diagnostics.txt
          if-no-files-found: error
          retention-days: 1
