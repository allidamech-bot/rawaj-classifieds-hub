name: Temporary Lint Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture lint output
        shell: bash
        run: |
          set +e
          npx eslint --quiet \
            scripts/listing-detail-load-recovery.test.mjs \
            src/lib/api/listing-detail-read-guarded.ts \
            src/lib/classifieds-api.ts \
            > lint-diagnostics.txt 2>&1
          echo "exit_code=$?" >> lint-diagnostics.txt
          exit 0

      - name: Upload lint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: listing-detail-lint-diagnostics
          path: lint-diagnostics.txt
          if-no-files-found: error
          retention-days: 1
