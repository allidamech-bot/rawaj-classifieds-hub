name: Phase 4 Taxonomy Contract Format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-canonical-taxonomy-write-path
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Format and validate
        run: |
          npx prettier --write scripts/canonical-listing-taxonomy.test.mjs
          npx eslint --quiet scripts/canonical-listing-taxonomy.test.mjs
          node --test scripts/canonical-listing-taxonomy.test.mjs
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: phase4-taxonomy-contract
          path: scripts/canonical-listing-taxonomy.test.mjs
          retention-days: 1
