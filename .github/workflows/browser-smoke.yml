name: Browser Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-smoke.yml"

concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        env:
          RAWAJ_E2E_USE_FIXTURES: "1"
          RAWAJ_E2E_API_PROXY_TARGET: "https://rawaj-classifieds-hub.allidamech.workers.dev"
          VITE_PUBLIC_DATA_API_BASE_URL: "http://127.0.0.1:4173"
          VITE_RAWAJ_E2E_DISABLE_REMOTE_MEDIA: "1"
        run: npm run test:e2e:smoke

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
