name: Apply D1 0018 Listing Moderation Notifications

on:
  push:
    branches:
      - main
    paths:
      - .github/deploy/0018-listing-moderation-notifications.approved

permissions:
  contents: read

concurrency:
  group: rawaj-d1-production-migrations
  cancel-in-progress: false

jobs:
  apply-production-migration:
    name: Apply reviewed D1 migration 0018
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_WORKER_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_WORKER_CUSTOM_DOMAIN }}

    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate one-time approval marker and migration identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          grep -Fxq "APPROVED: APPLY_D1_0018_LISTING_MODERATION_NOTIFICATIONS" \
            .github/deploy/0018-listing-moderation-notifications.approved
          grep -Fxq "SCOPE: D1_PRODUCTION_ONLY" \
            .github/deploy/0018-listing-moderation-notifications.approved
          grep -Fxq "WORKER_DEPLOY: DISABLED" \
            .github/deploy/0018-listing-moderation-notifications.approved

          migration="cloudflare/d1/migrations/0018_listing_moderation_notifications.sql"
          test -f "$migration"
          actual_blob="$(git hash-object "$migration")"
          expected_blob="41dc6dab4b7ca69ce9d9f1534d73cb15ac399132"
          if [[ "$actual_blob" != "$expected_blob" ]]; then
            echo "Migration contents differ from the reviewed PR #526 artifact." >&2
            exit 1
          fi

      - name: Replay all D1 migrations locally
        run: |
          node scripts/check-migration-ledger.mjs
          node scripts/replay-d1-migrations.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json

      - name: Install Worker tooling
        run: npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Render Production-safe Wrangler configuration
        run: npm --prefix cloudflare/worker run render:production

      - name: Apply pending D1 migrations to Production
        working-directory: cloudflare/worker
        run: npx wrangler d1 migrations apply rawaj-staging --remote --config wrangler.generated.jsonc

      - name: Verify migration, triggers, and legacy target backfill
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute rawaj-staging --remote --config wrangler.generated.jsonc --json --command \
            "SELECT name FROM d1_migrations WHERE name = '0018_listing_moderation_notifications.sql';
             SELECT name FROM sqlite_master WHERE type = 'trigger' AND name IN ('trg_listing_moderation_owner_notification', 'trg_notification_target_metadata_normalization') ORDER BY name;
             SELECT count(*) AS unresolved_legacy_targets FROM notifications
              WHERE json_extract(data, '$.targetType') IS NULL
                AND json_extract(data, '$.target_type') IS NULL
                AND (
                  coalesce(json_extract(data, '$.listingId'), json_extract(data, '$.listing_id')) IS NOT NULL OR
                  coalesce(json_extract(data, '$.conversationId'), json_extract(data, '$.conversation_id')) IS NOT NULL OR
                  coalesce(json_extract(data, '$.sellerId'), json_extract(data, '$.seller_id')) IS NOT NULL OR
                  coalesce(json_extract(data, '$.savedSearchId'), json_extract(data, '$.saved_search_id')) IS NOT NULL OR
                  coalesce(json_extract(data, '$.supportRequestId'), json_extract(data, '$.support_request_id')) IS NOT NULL OR
                  coalesce(json_extract(data, '$.verificationRequestId'), json_extract(data, '$.verification_request_id')) IS NOT NULL OR
                  coalesce(json_extract(data, '$.promotionRequestId'), json_extract(data, '$.promotion_request_id')) IS NOT NULL
                );" > /tmp/d1-0018-verification.json

          node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/d1-0018-verification.json", "utf8"));
          const rows = [];
          const visit = (value) => {
            if (Array.isArray(value)) return value.forEach(visit);
            if (!value || typeof value !== "object") return;
            if (Array.isArray(value.results)) rows.push(...value.results);
            Object.values(value).forEach(visit);
          };
          visit(payload);

          const names = new Set(rows.map((row) => row?.name).filter(Boolean));
          const required = [
            "0018_listing_moderation_notifications.sql",
            "trg_listing_moderation_owner_notification",
            "trg_notification_target_metadata_normalization",
          ];
          const missing = required.filter((name) => !names.has(name));
          if (missing.length) throw new Error(`Missing Production migration objects: ${missing.join(", ")}`);

          const unresolved = rows.find((row) => Object.hasOwn(row ?? {}, "unresolved_legacy_targets"));
          if (!unresolved || Number(unresolved.unresolved_legacy_targets) !== 0) {
            throw new Error(`Legacy notification target backfill incomplete: ${JSON.stringify(unresolved)}`);
          }
          console.log("D1 Production migration 0018 verified: migration recorded, triggers installed, unresolved legacy targets = 0.");
          NODE

      - name: Confirm Worker deployment was not invoked
        run: echo "D1 migration completed. No Worker deploy command exists in this workflow."
