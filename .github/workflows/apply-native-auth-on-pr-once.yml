name: Apply Native Auth Audit On PR Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-native-auth-on-pr-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply, format, and validate
        id: audit
        shell: bash
        run: |
          set +e
          {
            python scripts/apply-native-auth-release-audit.py &&
            npm ci &&
            npx eslint --fix src/lib/native-auth.ts src/lib/auth.tsx src/routes/login.tsx scripts/native-mobile-auth.test.mjs &&
            npm run test:native-mobile-auth
          } 2>&1 | tee /tmp/native-auth-pr-audit.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record result
        shell: bash
        run: |
          status="${{ steps.audit.outputs.status }}"
          if [ "$status" = "0" ]; then
            {
              echo "PASS"
              echo "Native auth patch, formatting, and contract validation completed successfully."
            } > native-auth-pr-audit-result.txt
            rm scripts/apply-native-auth-release-audit.py
            rm .github/workflows/apply-native-auth-release-audit-once.yml
            rm .github/workflows/apply-native-auth-release-audit-retry-once.yml
            rm .github/workflows/apply-native-auth-on-pr-once.yml
          else
            {
              echo "FAIL"
              echo "Native auth PR audit exited with status $status."
              echo
              echo "Last 220 log lines:"
              tail -n 220 /tmp/native-auth-pr-audit.log
            } > native-auth-pr-audit-result.txt
          fi

      - name: Commit implementation and diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record native authentication PR audit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Enforce result
        if: steps.audit.outputs.status != '0'
        run: exit 1
