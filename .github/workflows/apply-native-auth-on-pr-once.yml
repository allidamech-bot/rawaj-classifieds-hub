name: Apply Native Auth Audit On PR Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-native-auth-on-pr-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply native auth release patch
        run: python scripts/apply-native-auth-release-audit.py

      - name: Install dependencies
        run: npm ci

      - name: Format and validate
        run: |
          npx eslint --fix src/lib/native-auth.ts src/lib/auth.tsx src/routes/login.tsx scripts/native-mobile-auth.test.mjs
          npm run test:native-mobile-auth

      - name: Remove temporary audit machinery
        run: |
          rm scripts/apply-native-auth-release-audit.py
          rm .github/workflows/apply-native-auth-release-audit-once.yml
          rm .github/workflows/apply-native-auth-release-audit-retry-once.yml
          rm .github/workflows/apply-native-auth-on-pr-once.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix native authentication return flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
