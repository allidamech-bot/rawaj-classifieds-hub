name: Notifications Activity Push Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/components/NotificationTrigger.tsx"
      - "src/features/notifications/**"
      - "src/lib/api/notification*.ts"
      - "src/lib/api/push-notifications.ts"
      - "src/lib/native-push.ts"
      - "src/lib/notification*.ts"
      - "src/lib/unread-activity.tsx"
      - "src/routes/activity.tsx"
      - "src/routes/notifications.tsx"
      - "supabase/functions/send-push-notifications/**"
      - "supabase/migrations/**notifications*"
      - "scripts/notifications-activity-push-integrity.test.mjs"
      - ".github/workflows/notifications-activity-push-integrity.yml"
      - ".github/workflows/quality-gate.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Notifications, Activity & Push Integrity contract
        run: npm run test:notifications-activity-push

      - name: Typecheck
        run: npm run typecheck -- --pretty false
