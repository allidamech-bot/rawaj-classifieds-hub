name: Listing Pipeline Lint Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'hotfix/listing-publish-review-pipeline' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/listing-publish-review-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix changed listing pipeline source files
        run: >-
          npx eslint --fix
          src/lib/api/listings.ts
          src/lib/api/reports.ts
          src/lib/api/admin.ts
          src/lib/auth-types.ts
          src/routes/add-listing.tsx
          'src/routes/profile/listings.$id.tsx'
          src/lib/api/location-aware-listings.ts
          src/lib/api/location-aware-listings-v2.ts
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/listing-pipeline-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/listings.ts src/lib/api/reports.ts src/lib/api/admin.ts src/lib/auth-types.ts src/routes/add-listing.tsx 'src/routes/profile/listings.$id.tsx' src/lib/api/location-aware-listings.ts src/lib/api/location-aware-listings-v2.ts .github/workflows/listing-pipeline-lint-fix.yml
          if git diff --cached --quiet; then
            echo "No lint fixes needed."
            exit 0
          fi
          git commit -m "Fix listing pipeline lint issues"
          git push origin HEAD:hotfix/listing-publish-review-pipeline
