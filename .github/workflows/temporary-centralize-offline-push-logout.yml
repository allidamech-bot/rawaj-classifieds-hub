name: Temporary Centralize Offline Push Logout

on:
  push:
    branches:
      - fix/phase-2-offline-push-detach

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-2-offline-push-detach
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove duplicate page-level Push detach
        shell: python
        run: |
          from pathlib import Path

          more_path = Path("src/routes/more.tsx")
          more_text = more_path.read_text(encoding="utf-8")
          more_text = more_text.replace(
              'import { disableNativePush } from "@/lib/native-push";\n',
              '',
          )
          duplicate = '''      if (auth.profile?.id) {
                  await disableNativePush(auth.profile.id, false).catch(() => undefined);
                }
          '''
          if duplicate not in more_text:
              raise SystemExit("Expected duplicate Push detach block was not found")
          more_path.write_text(more_text.replace(duplicate, ""), encoding="utf-8")

          test_path = Path("scripts/saved-search-push-v1.test.mjs")
          test_text = test_path.read_text(encoding="utf-8")
          old_assertions = '''  assert.match(moreRoute, /disableNativePush/);
            assert.match(moreRoute, /await disableNativePush/);
          '''
          if old_assertions not in test_text:
              raise SystemExit("Expected page-level Push assertions were not found")
          test_path.write_text(
              test_text.replace(
                  old_assertions,
                  '  assert.doesNotMatch(moreRoute, /disableNativePush/);\n',
              ),
              encoding="utf-8",
          )
      - run: npx prettier --write src/routes/more.tsx scripts/saved-search-push-v1.test.mjs
      - name: Commit centralized logout path
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/more.tsx scripts/saved-search-push-v1.test.mjs
          git commit -m "refactor: centralize native Push logout cleanup"
          git push origin HEAD:fix/phase-2-offline-push-detach
