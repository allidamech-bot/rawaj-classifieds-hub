name: Apply Search Card Contract Fix

on:
  push:
    branches: [feature/nearby-discovery-ui-v1]
    paths:
      - "scripts/apply-search-card-contract-fix.mjs"
      - ".github/workflows/apply-search-card-contract-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nearby-discovery-ui-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-search-card-contract-fix.mjs
      - run: npx prettier --write scripts/search-results-taxonomy-integrity.test.mjs
      - run: |
          rm .github/workflows/apply-search-card-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: accept distance-enhanced result cards"
          git push
