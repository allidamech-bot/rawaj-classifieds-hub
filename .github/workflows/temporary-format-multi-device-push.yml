name: Temporary Format Multi Device Push

on:
  push:
    branches:
      - fix/phase-2-multi-device-push

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-2-multi-device-push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          src/lib/native-push.ts
          src/features/notifications/NotificationPreferencesPanel.tsx
          scripts/saved-search-push-v1.test.mjs
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/native-push.ts \
            src/features/notifications/NotificationPreferencesPanel.tsx \
            scripts/saved-search-push-v1.test.mjs
          git commit -m "style: format multi-device push changes"
          git push origin HEAD:fix/phase-2-multi-device-push
