name: Chat Voice Upload ArrayBuffer

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/communication/ChatVoiceRecorder.tsx"
      - "src/lib/api/messaging.ts"
      - "scripts/chat-voice-upload-arraybuffer.test.mjs"
      - ".github/workflows/chat-voice-upload-arraybuffer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/chat-voice-upload-arraybuffer.test.mjs
      - run: npx eslint --quiet src/features/communication/ChatVoiceRecorder.tsx src/lib/api/messaging.ts
      - run: npm run typecheck -- --pretty false
      - run: npm run build
