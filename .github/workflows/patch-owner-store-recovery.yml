name: Patch owner store recovery

on:
  push:
    branches:
      - feature/recover-owner-store-loads

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-owner-store-loads
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply recovery patch
        run: node scripts/patch-owner-store-recovery.mjs
      - name: Format route
        run: npx eslint --fix src/routes/profile/listings.tsx
      - name: Commit patch and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-owner-store-recovery.yml scripts/patch-owner-store-recovery.mjs
          git add src/routes/profile/listings.tsx
          git commit -m "Recover owner store loads independently"
          git push origin HEAD:feature/recover-owner-store-loads
