name: Temporary PR 256 Formatter

on:
  push:
    branches:
      - design/adaptive-listing-cards-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/adaptive-listing-cards-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format PR files
        run: >-
          npx prettier --write
          .github/workflows/quality-gate.yml
          scripts/adaptive-listing-cards.test.mjs
          scripts/home-discovery-v3.test.mjs
          scripts/marketplace-core-v2.test.mjs
          src/adaptive-listing-cards.css
          src/features/favorites/FavoriteListingCard.tsx
          src/features/home/FeaturedListingShowcase.tsx
          src/features/listings/RealListingCard.tsx
          src/features/listings/cards
          src/features/listings/listings-components-public.tsx
          src/features/listings/listings-components.tsx
          src/routes/favorites.tsx
          src/routes/listings.index.tsx
          src/routes/__root.tsx

      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-pr256-formatter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format adaptive listing card system"
          git push origin HEAD:design/adaptive-listing-cards-v1
