name: Temporary Home Discovery V3 Formatter

on:
  push:
    branches:
      - design/home-discovery-v3

permissions:
  contents: write

concurrency:
  group: home-discovery-v3-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/home-discovery-v3
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format home discovery files
        run: >-
          npx prettier --write
          .github/workflows/quality-gate.yml
          scripts/home-discovery-v3.test.mjs
          scripts/marketplace-core-v2.test.mjs
          src/features/home/DiscoveryHero.tsx
          src/features/home/CategoryWorlds.tsx
          src/features/home/FeaturedListingMiniCard.tsx
          src/features/home/FeaturedListingShowcase.tsx
          src/features/home/LatestDiscovery.tsx
          src/features/home/HomeTrustStrip.tsx
          src/routes/index.tsx
          src/routes/__root.tsx
          src/home-discovery-v3.css

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality-gate.yml scripts src
          git commit -m "Format home discovery V3"
          git push origin HEAD:design/home-discovery-v3
