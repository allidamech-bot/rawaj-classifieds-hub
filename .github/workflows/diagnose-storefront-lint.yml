name: Storefront Lint Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          npx eslint --quiet 'src/routes/seller.$id.tsx' > lint-output.txt 2>&1
          status=$?
          echo "$status" > lint-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-lint-output
          path: |
            lint-output.txt
            lint-status.txt
