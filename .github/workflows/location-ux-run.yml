name: Location UX runner

on:
  push:
    branches:
      - location-ux-integration

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-ux-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-location-ux-integration.mjs
      - run: npx prettier --write src/routes/add-listing.tsx src/features/locations/CanonicalLocationSelector.tsx src/lib/api/listings.ts src/lib/api/location-aware-listings-v2.ts src/lib/api/listing-location-write.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate canonical location into listing creation [skip location runner]"
          git push origin HEAD:location-ux-integration
