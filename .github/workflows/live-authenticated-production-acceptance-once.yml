name: Live Authenticated Production Acceptance Once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/live-authenticated-production-acceptance-once.yml
      - e2e/live-authenticated-acceptance-once.spec.ts

permissions:
  contents: read

concurrency:
  group: live-authenticated-production-acceptance-once
  cancel-in-progress: true

jobs:
  acceptance:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: https://rawa-j.com
      PRODUCTION_ACCEPTANCE: "1"
      RAWAJ_ACCEPTANCE_EMAIL: ${{ secrets.RAWAJ_ACCEPTANCE_EMAIL }}
      RAWAJ_ACCEPTANCE_PASSWORD: ${{ secrets.RAWAJ_ACCEPTANCE_PASSWORD }}

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Validate protected acceptance credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAWAJ_ACCEPTANCE_EMAIL:-}" || -z "${RAWAJ_ACCEPTANCE_PASSWORD:-}" ]]; then
            echo "The production environment acceptance credentials are missing." >&2
            exit 1
          fi
          echo "Protected acceptance credentials are available."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only authenticated acceptance
        run: npx playwright test e2e/live-authenticated-acceptance-once.spec.ts --project=mobile-chromium --workers=1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-authenticated-production-acceptance-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
