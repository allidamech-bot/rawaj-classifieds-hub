name: Apply Chat Voice Upload ArrayBuffer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/chat-voice-upload-arraybuffer'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild patch from main
        run: |
          git checkout origin/main -- \
            src/features/communication/ChatVoiceRecorder.tsx \
            src/lib/api/messaging.ts
          rm -f scripts/chat-voice-upload-arraybuffer.test.mjs
          node --check scripts/apply-chat-voice-upload-arraybuffer.mjs
          node scripts/apply-chat-voice-upload-arraybuffer.mjs
      - name: Scope transport regression to audio upload
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/chat-voice-upload-arraybuffer.test.mjs")
          source = path.read_text()
          before = '''  assert.ok(!messaging.includes(".upload(path, payload.file"));'''
          after = '''  const audioUpload = messaging.slice(
            messaging.indexOf("export async function uploadChatAudio"),
            messaging.indexOf("export async function removeChatAudio"),
          );
          assert.ok(!audioUpload.includes(".upload(path, payload.file"));'''
          if before not in source:
              raise SystemExit("Audio upload assertion anchor not found")
          path.write_text(source.replace(before, after))
          PY
      - name: Export generated patch
        run: |
          mkdir -p generated-patch
          cp --parents \
            src/features/communication/ChatVoiceRecorder.tsx \
            src/lib/api/messaging.ts \
            scripts/chat-voice-upload-arraybuffer.test.mjs \
            generated-patch/
      - uses: actions/upload-artifact@v4
        with:
          name: chat-voice-upload-generated-patch
          path: generated-patch
          retention-days: 2
      - run: npx prettier --write src/features/communication/ChatVoiceRecorder.tsx
      - run: npx prettier --write src/lib/api/messaging.ts
      - run: npx prettier --write scripts/chat-voice-upload-arraybuffer.test.mjs
      - run: node --test scripts/chat-voice-upload-arraybuffer.test.mjs
      - run: npx eslint --quiet src/features/communication/ChatVoiceRecorder.tsx src/lib/api/messaging.ts
      - run: npm run typecheck -- --pretty false
      - run: npm run build
      - name: Commit verified product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/communication/ChatVoiceRecorder.tsx \
            src/lib/api/messaging.ts \
            scripts/chat-voice-upload-arraybuffer.test.mjs
          if git diff --cached --quiet; then
            echo "Verified patch already present."
            exit 0
          fi
          git commit -m "fix: normalize and stream chat voice uploads"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
