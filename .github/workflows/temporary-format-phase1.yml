name: Temporary Format Phase 1

on:
  push:
    branches:
      - test/phase-1-staging-write-journeys

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/phase-1-staging-write-journeys
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          e2e/staging-write-acceptance.spec.ts
          scripts/production-acceptance-contract.test.mjs
          .github/workflows/staging-write-acceptance.yml
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/staging-write-acceptance.spec.ts \
            scripts/production-acceptance-contract.test.mjs \
            .github/workflows/staging-write-acceptance.yml
          git commit -m "style: format staging write acceptance"
          git push origin HEAD:test/phase-1-staging-write-journeys
