name: Format Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/media/ResilientImage.tsx src/routes/admin.pending.tsx scripts/phases-51-53-release-gates.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: |
            src/components/media/ResilientImage.tsx
            src/routes/admin.pending.tsx
            scripts/phases-51-53-release-gates.test.mjs
