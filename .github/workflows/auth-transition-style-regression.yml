name: Auth Transition Style Regression Temporary Gate

# Temporary acceptance gate; remove after the validated Preview is available.
on:
  push:
    branches:
      - fix/home-page-navigation-ad-placement-audit
  workflow_dispatch:

concurrency:
  group: auth-transition-style-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  quality:
    name: Auth Transition Quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused auth-transition contracts
        run: node --test scripts/auth-stable-public-surfaces.test.mjs
      - name: Route CSS isolation contract
        run: node --test scripts/route-css-isolation.test.mjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Full repository check
        run: npm run check
      - name: Publish quality result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'Auth Transition Styles / Quality',
              description: passed ? 'Auth transition quality passed' : 'Auth transition quality failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  browser:
    name: Auth Transition Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run login-route and current acceptance regressions
        run: npx playwright test e2e/auth-transition-style-regression.spec.ts e2e/current-acceptance-regression.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-transition-style-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish browser result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'Auth Transition Styles / Browser',
              description: passed ? 'Login-route browser regression passed' : 'Login-route browser regression failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
