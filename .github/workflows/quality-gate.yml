name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          show-progress: false

      - name: Canonical migration ledger and collision check
        run: node scripts/check-migration-ledger.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Implement public data and JSON-LD hardening
        if: github.event_name == 'pull_request' && github.head_ref == 'security/public-data-and-jsonld-hardening' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          python <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Missing replacement anchor in {path}: {old[:80]}")
              file.write_text(text.replace(old, new, 1))

          seo = Path("src/lib/seo.ts")
          text = seo.read_text()
          old = '''export function jsonLdScript(data: unknown) {
            return {
              type: "application/ld+json",
              dangerouslySetInnerHTML: { __html: JSON.stringify(data) },
            };
          }
          '''
          new = '''export function serializeJsonLd(data: unknown) {
            return JSON.stringify(data)
              .replace(/</g, "\\u003c")
              .replace(/>/g, "\\u003e")
              .replace(/&/g, "\\u0026")
              .replace(/\\u2028/g, "\\u2028")
              .replace(/\\u2029/g, "\\u2029");
          }

          export function jsonLdScript(data: unknown) {
            return {
              type: "application/ld+json",
              dangerouslySetInnerHTML: { __html: serializeJsonLd(data) },
            };
          }
          '''
          if old not in text:
              raise SystemExit("Missing JSON-LD function anchor")
          seo.write_text(text.replace(old, new, 1))

          listings = Path("src/lib/api/listings.ts")
          text = listings.read_text()
          import_anchor = 'import { isListingPastExpiry, publicListingExpiryFilter } from "@/lib/api/listing-expiry";\n'
          import_replacement = import_anchor + 'import { publicListingSelect } from "@/lib/api/public-fields";\n'
          if import_anchor not in text:
              raise SystemExit("Missing listings import anchor")
          text = text.replace(import_anchor, import_replacement, 1)
          if text.count('.select("*")') < 2:
              raise SystemExit("Expected public listings wildcard selects")
          text = text.replace('.select("*")', '.select(publicListingSelect)', 2)
          listings.write_text(text)

          price_drops = Path("src/lib/api/price-drops.ts")
          text = price_drops.read_text()
          anchor = 'import { publicListingExpiryFilter } from "@/lib/api/listing-expiry";\n'
          if anchor not in text:
              raise SystemExit("Missing price drops import anchor")
          text = text.replace(anchor, anchor + 'import { publicListingSelect } from "@/lib/api/public-fields";\n', 1)
          if '.select("*")' not in text:
              raise SystemExit("Missing price drop wildcard select")
          price_drops.write_text(text.replace('.select("*")', '.select(publicListingSelect)', 1))

          seller = Path("src/lib/api/seller.ts")
          text = seller.read_text()
          anchor = 'import { publicListingExpiryFilter } from "@/lib/api/listing-expiry";\n'
          replacement = anchor + '''import {
            publicListingSelect,
            publicSellerReviewSelect,
          } from "@/lib/api/public-fields";
          '''
          if anchor not in text:
              raise SystemExit("Missing seller import anchor")
          text = text.replace(anchor, replacement, 1)
          if text.count('.select("*")') < 2:
              raise SystemExit("Expected seller wildcard selects")
          text = text.replace('.select("*")', '.select(publicListingSelect)', 1)
          text = text.replace('.select("*")', '.select(publicSellerReviewSelect)', 1)
          seller.write_text(text)

          for path in [
              "src/lib/api/location-aware-listings.ts",
              "src/lib/api/location-aware-listings-v2.ts",
          ]:
              file = Path(path)
              text = file.read_text()
              anchor = 'import { publicListingExpiryFilter } from "@/lib/api/listing-expiry";\n'
              if anchor not in text:
                  raise SystemExit(f"Missing public field import anchor in {path}")
              text = text.replace(anchor, anchor + 'import { publicListingSelect } from "@/lib/api/public-fields";\n', 1)
              if '.select("*")' not in text:
                  raise SystemExit(f"Missing wildcard select in {path}")
              file.write_text(text.replace('.select("*")', '.select(publicListingSelect)', 1))

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          scripts = package["scripts"]
          scripts["test:public-data-security"] = "node --test scripts/public-data-security.test.mjs"
          marker = "npm run test:deployment-truth && npm run lint"
          replacement = "npm run test:deployment-truth && npm run test:public-data-security && npm run lint"
          if marker not in scripts["check"]:
              raise SystemExit("Missing package check anchor")
          scripts["check"] = scripts["check"].replace(marker, replacement, 1)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")
          PY

          npx prettier --write \
            src/lib/seo.ts \
            src/lib/api/public-fields.ts \
            src/lib/api/listings.ts \
            src/lib/api/price-drops.ts \
            src/lib/api/seller.ts \
            src/lib/api/location-aware-listings.ts \
            src/lib/api/location-aware-listings-v2.ts \
            scripts/public-data-security.test.mjs \
            package.json

      - name: Commit public data hardening
        if: github.event_name == 'pull_request' && github.head_ref == 'security/public-data-and-jsonld-hardening' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/seo.ts src/lib/api/public-fields.ts src/lib/api/listings.ts src/lib/api/price-drops.ts src/lib/api/seller.ts src/lib/api/location-aware-listings.ts src/lib/api/location-aware-listings-v2.ts scripts/public-data-security.test.mjs package.json
          git commit -m "Harden public data reads and JSON-LD serialization"
          git push origin HEAD:security/public-data-and-jsonld-hardening

      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS source files to lint."
            exit 0
          fi

          printf 'Linting %s\n' "${files[@]}"
          npx eslint --quiet "${files[@]}"

      - name: Syria location classification contract
        run: npm run test:location-classification

      - name: Syria location discovery and presentation contract
        run: npm run test:location-presentation

      - name: Listings mobile category switch contract
        run: npm run test:listings-filters

      - name: Seller review eligibility contract
        run: npm run test:review-eligibility

      - name: Seller review response contract
        run: npm run test:review-response

      - name: Seller review report contract
        run: npm run test:review-report

      - name: Seller review traits contract
        run: npm run test:review-traits

      - name: Listing price drop contract
        run: npm run test:price-drop

      - name: Listing reservation contract
        run: npm run test:reservation

      - name: Chat workspace contract
        run: npm run test:chat-workspace

      - name: Listing studio image parity contract
        run: npm run test:listing-studio-images

      - name: Account activity center contract
        run: npm run test:activity-center

      - name: SEO discovery contract
        run: npm run test:seo-discovery

      - name: Semantic SEO contract
        run: npm run test:semantic-seo

      - name: Verification documents V2 contract
        run: npm run test:verification-documents

      - name: Production deployment truth contract
        run: npm run test:deployment-truth

      - name: Public data security contract
        run: npm run test:public-data-security

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Listing system regression contract
        run: npm run test:listing-system

      - name: Production build
        run: npm run build
