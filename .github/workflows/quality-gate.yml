name: Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-phase-8:
    if: github.head_ref == 'feature/phase-8-arabic-search-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-8-arabic-search-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Phase 8 files
        run: |
          npx prettier --write \
            src/lib/search-normalization.ts \
            src/lib/api/location-aware-listings.ts \
            src/lib/api/location-aware-listings-v2.ts \
            docs/production-schema/migration-ledger.json
      - name: Restore canonical Quality Gate
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/quality-gate.yml
      - name: Commit formatted Phase 8 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs .github/workflows/quality-gate.yml
          git commit -m "Format Arabic search implementation"
          git push origin HEAD:feature/phase-8-arabic-search-v2
