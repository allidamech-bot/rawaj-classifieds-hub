name: Quality Gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout notification preferences branch
        uses: actions/checkout@v4
        with:
          ref: feature/notification-preferences-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Format changed source and restore standard gate
        shell: bash
        run: |
          npm ci
          npx prettier --write \
            src/features/notifications/NotificationPreferencesPanel.tsx \
            src/lib/api/notification-preferences.ts \
            src/lib/classifieds-api.ts \
            src/routes/notifications.tsx
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format notification preference changes"
          git push origin HEAD:feature/notification-preferences-foundation
