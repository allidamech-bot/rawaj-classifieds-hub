name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS source files to lint."
            printf '0\n' > lint-status.txt
            : > lint-output.txt
            exit 0
          fi

          printf 'Linting %s\n' "${files[@]}"
          set +e
          npx eslint --quiet "${files[@]}" > lint-output.txt 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > lint-status.txt
          cat lint-output.txt

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: |
            lint-output.txt
            lint-status.txt
          if-no-files-found: error

      - name: Enforce lint result
        shell: bash
        run: |
          status="$(cat lint-status.txt)"
          if [ "$status" != "0" ]; then
            echo "Lint failed with exit code $status"
            exit "$status"
          fi

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Production build
        run: npm run build
