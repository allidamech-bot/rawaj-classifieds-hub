name: Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'hotfix/listing-submit-edit-rpc' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/listing-submit-edit-rpc
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fix changed source lint
        run: npx eslint --fix src/lib/api/listing-write-rpc.ts src/lib/classifieds-api.ts

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/listing-write-rpc.ts src/lib/classifieds-api.ts
          if git diff --cached --quiet; then
            echo "No lint fixes needed."
            exit 0
          fi
          git commit -m "Fix listing submit edit client lint"
          git push origin HEAD:hotfix/listing-submit-edit-rpc
