name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          show-progress: false

      - name: Canonical migration ledger and collision check
        run: node scripts/check-migration-ledger.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Implement categories and offers SSR
        if: github.event_name == 'pull_request' && github.head_ref == 'perf/categories-offers-ssr' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          python <<'PY'
          import json
          from pathlib import Path

          categories = Path("src/routes/categories.tsx")
          text = categories.read_text()
          text = text.replace(
              '''import type {
            ClassifiedCategory,
            ClassifiedsError,
            ClassifiedSubcategory,
            TaxonomyNode,
          } from "@/lib/classifieds-types";''',
              '''import type {
            ClassifiedCategory,
            ClassifiedSubcategory,
            TaxonomyNode,
          } from "@/lib/classifieds-types";''',
              1,
          )
          route_old = '''export const Route = createFileRoute("/categories")({
            validateSearch: categoriesSearchSchema,
            head: () =>
              createSeo({
                title: "الأقسام | RAWAJ / رواج",
                description: "دليل أقسام رواج لاختيار القسم المناسب قبل تصفح نتائج الإعلانات المعتمدة.",
                path: "/categories",
              }),
            component: CategoriesPage,
          });'''
          route_new = '''export const Route = createFileRoute("/categories")({
            validateSearch: categoriesSearchSchema,
            loader: async () => {
              const [taxonomyResult, categoriesResult, subcategoriesResult] = await Promise.all([
                fetchPublicTaxonomyNodes(),
                fetchPublicCategories(),
                fetchPublicSubcategories(),
              ]);

              let fetchError = !categoriesResult.ok
                ? categoriesResult.error
                : !subcategoriesResult.ok
                  ? subcategoriesResult.error
                  : null;

              if (!taxonomyResult.ok && taxonomyResult.error.code !== "schema_missing") {
                fetchError = taxonomyResult.error;
              }

              return {
                taxonomyNodes: taxonomyResult.ok ? taxonomyResult.data : [],
                taxonomyAvailable: taxonomyResult.ok,
                categories: categoriesResult.ok ? categoriesResult.data : [],
                subcategories: subcategoriesResult.ok ? subcategoriesResult.data : [],
                fetchError,
              };
            },
            head: () =>
              createSeo({
                title: "الأقسام | RAWAJ / رواج",
                description: "دليل أقسام رواج لاختيار القسم المناسب قبل تصفح نتائج الإعلانات المعتمدة.",
                path: "/categories",
              }),
            component: CategoriesPage,
          });'''
          if route_old not in text:
              raise SystemExit("Missing categories route anchor")
          text = text.replace(route_old, route_new, 1)

          state_old = '''  const { language, text } = useUiPreferences();
            const [taxonomyNodes, setTaxonomyNodes] = useState<TaxonomyNode[]>([]);
            const [taxonomyAvailable, setTaxonomyAvailable] = useState(false);
            const [categories, setCategories] = useState<ClassifiedCategory[]>([]);
            const [subcategories, setSubcategories] = useState<ClassifiedSubcategory[]>([]);
            const [query, setQuery] = useState(search.q ?? "");
            const [loading, setLoading] = useState(true);
            const [fetchError, setFetchError] = useState<ClassifiedsError | null>(null);'''
          state_new = '''  const { language, text } = useUiPreferences();
            const { taxonomyNodes, taxonomyAvailable, categories, subcategories, fetchError } =
              Route.useLoaderData();
            const [query, setQuery] = useState(search.q ?? "");'''
          if state_old not in text:
              raise SystemExit("Missing categories state anchor")
          text = text.replace(state_old, state_new, 1)

          effect_start = '''  useEffect(() => {
            let cancelled = false;

            async function load() {
              setLoading(true);
              setFetchError(null);

              const [taxonomyResult, categoriesResult, subcategoriesResult] = await Promise.all([
                fetchPublicTaxonomyNodes(),
                fetchPublicCategories(),
                fetchPublicSubcategories(),
              ]);
              if (cancelled) return;

              if (!categoriesResult.ok) {
                setFetchError(categoriesResult.error);
              } else if (!subcategoriesResult.ok) {
                setFetchError(subcategoriesResult.error);
              } else {
                setCategories(categoriesResult.data);
                setSubcategories(subcategoriesResult.data);
              }

              if (taxonomyResult.ok) {
                setTaxonomyNodes(taxonomyResult.data);
                setTaxonomyAvailable(true);
              } else if (taxonomyResult.error.code === "schema_missing") {
                setTaxonomyNodes([]);
                setTaxonomyAvailable(false);
              } else {
                setFetchError(taxonomyResult.error);
              }

              setLoading(false);
            }

            void load();
            return () => {
              cancelled = true;
            };
          }, []);

'''
          if effect_start not in text:
              raise SystemExit("Missing categories fetch effect anchor")
          text = text.replace(effect_start, "", 1)
          text = text.replace(
              '''        {loading ? (
                    <Panel title={text("جاري تحميل الأقسام", "Loading categories")} />
                  ) : fetchError ? (''',
              '''        {fetchError ? (''',
              1,
          )
          categories.write_text(text)

          offers = Path("src/routes/offers.tsx")
          text = offers.read_text()
          text = text.replace('import { useEffect, useState } from "react";\n', "", 1)
          text = text.replace('import type { ClassifiedsError } from "@/lib/classifieds-types";\n', "", 1)
          route_old = '''export const Route = createFileRoute("/offers")({
            head: () =>
              createSeo({
                title: "العروض الحقيقية | RAWAJ / رواج",
                description:
                  "إعلانات انخفض سعرها فعلياً على رواج، مع السعر السابق والجديد ونسبة التخفيض وتاريخ الانخفاض.",
                path: "/offers",
              }),
            component: OffersPage,
          });'''
          route_new = '''export const Route = createFileRoute("/offers")({
            loader: async () => {
              const result = await fetchActivePriceDropOffers(30);
              return result.ok
                ? { offers: result.data, error: null }
                : { offers: [], error: result.error };
            },
            head: () =>
              createSeo({
                title: "العروض الحقيقية | RAWAJ / رواج",
                description:
                  "إعلانات انخفض سعرها فعلياً على رواج، مع السعر السابق والجديد ونسبة التخفيض وتاريخ الانخفاض.",
                path: "/offers",
              }),
            component: OffersPage,
          });'''
          if route_old not in text:
              raise SystemExit("Missing offers route anchor")
          text = text.replace(route_old, route_new, 1)
          state_effect = '''  const { text } = useUiPreferences();
            const [offers, setOffers] = useState<ListingPriceDropOffer[]>([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState<ClassifiedsError | null>(null);

            useEffect(() => {
              let cancelled = false;
              async function load() {
                setLoading(true);
                setError(null);
                const result = await fetchActivePriceDropOffers(30);
                if (cancelled) return;
                if (result.ok) setOffers(result.data);
                else {
                  setOffers([]);
                  setError(result.error);
                }
                setLoading(false);
              }
              void load();
              return () => {
                cancelled = true;
              };
            }, []);'''
          state_new = '''  const { text } = useUiPreferences();
            const { offers, error } = Route.useLoaderData();'''
          if state_effect not in text:
              raise SystemExit("Missing offers state/effect anchor")
          text = text.replace(state_effect, state_new, 1)
          loading_render = '''            {loading ? (
                          <OffersState
                            title={text("جاري تحميل التخفيضات الحقيقية", "Loading real price drops")}
                            body={text(
                              "يتم التحقق من أحدث الأسعار العامة الآن.",
                              "Checking the latest public prices now.",
                            )}
                          />
                        ) : error ? ('''
          if loading_render not in text:
              raise SystemExit("Missing offers loading render anchor")
          text = text.replace(loading_render, '''            {error ? (''', 1)
          offers.write_text(text)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          scripts = package["scripts"]
          scripts["test:categories-offers-ssr"] = "node --test scripts/categories-offers-ssr.test.mjs"
          marker = "npm run test:home-ssr && npm run lint"
          replacement = "npm run test:home-ssr && npm run test:categories-offers-ssr && npm run lint"
          if marker not in scripts["check"]:
              raise SystemExit("Missing package check anchor")
          scripts["check"] = scripts["check"].replace(marker, replacement, 1)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")
          PY

          npx prettier --write src/routes/categories.tsx src/routes/offers.tsx scripts/categories-offers-ssr.test.mjs package.json

      - name: Commit categories and offers SSR
        if: github.event_name == 'pull_request' && github.head_ref == 'perf/categories-offers-ssr' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/categories.tsx src/routes/offers.tsx scripts/categories-offers-ssr.test.mjs package.json
          git commit -m "Render categories and offers through SSR loaders"
          git push origin HEAD:perf/categories-offers-ssr

      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS source files to lint."
            exit 0
          fi

          printf 'Linting %s\n' "${files[@]}"
          npx eslint --quiet "${files[@]}"

      - name: Syria location classification contract
        run: npm run test:location-classification

      - name: Syria location discovery and presentation contract
        run: npm run test:location-presentation

      - name: Listings mobile category switch contract
        run: npm run test:listings-filters

      - name: Seller review eligibility contract
        run: npm run test:review-eligibility

      - name: Seller review response contract
        run: npm run test:review-response

      - name: Seller review report contract
        run: npm run test:review-report

      - name: Seller review traits contract
        run: npm run test:review-traits

      - name: Listing price drop contract
        run: npm run test:price-drop

      - name: Listing reservation contract
        run: npm run test:reservation

      - name: Chat workspace contract
        run: npm run test:chat-workspace

      - name: Listing studio image parity contract
        run: npm run test:listing-studio-images

      - name: Account activity center contract
        run: npm run test:activity-center

      - name: SEO discovery contract
        run: npm run test:seo-discovery

      - name: Semantic SEO contract
        run: npm run test:semantic-seo

      - name: Verification documents V2 contract
        run: npm run test:verification-documents

      - name: Production deployment truth contract
        run: npm run test:deployment-truth

      - name: Public data security contract
        run: npm run test:public-data-security

      - name: Home SSR contract
        run: npm run test:home-ssr

      - name: Categories and offers SSR contract
        run: npm run test:categories-offers-ssr

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Listing system regression contract
        run: npm run test:listing-system

      - name: Production build
        run: npm run build
