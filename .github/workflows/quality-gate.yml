name: Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture-auth-lint:
    if: github.head_ref == 'feature/auth-recovery-session-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/auth-recovery-session-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture ESLint output
        shell: bash
        run: |
          npx eslint --quiet \
            src/lib/auth-return.ts \
            src/routes/auth.callback.tsx \
            src/routes/login.tsx \
            src/routes/reset-password.tsx \
            > auth-recovery-lint-output.txt 2>&1 || true
          cat auth-recovery-lint-output.txt

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-recovery-lint-output.txt
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
            exit 0
          fi
          git commit -m "Capture auth recovery lint diagnostics"
          git push origin HEAD:feature/auth-recovery-session-hardening
