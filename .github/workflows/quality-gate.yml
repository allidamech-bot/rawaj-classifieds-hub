name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check seller review API formatting
        run: npx prettier --check src/lib/api/reviews.ts

      - name: Format seller review eligibility contract diagnostic
        run: |
          npx prettier --write scripts/seller-review-eligibility.test.mjs
          git diff -- scripts/seller-review-eligibility.test.mjs > /tmp/review-contract-prettier.diff

      - name: Upload seller review contract formatting artifact
        uses: actions/upload-artifact@v4
        with:
          name: seller-review-contract-formatting
          path: |
            scripts/seller-review-eligibility.test.mjs
            /tmp/review-contract-prettier.diff
          if-no-files-found: error

      - name: Require committed seller review contract formatting
        run: git diff --exit-code -- scripts/seller-review-eligibility.test.mjs

      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS source files to lint."
            exit 0
          fi

          printf 'Linting %s\n' "${files[@]}"
          npx eslint --quiet "${files[@]}"

      - name: Syria location classification contract
        run: npm run test:location-classification

      - name: Syria location discovery and presentation contract
        run: npm run test:location-presentation

      - name: Listings mobile category switch contract
        run: npm run test:listings-filters

      - name: Seller review eligibility contract
        run: npm run test:review-eligibility

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Listing system regression contract
        run: npm run test:listing-system

      - name: Production build
        run: npm run build
