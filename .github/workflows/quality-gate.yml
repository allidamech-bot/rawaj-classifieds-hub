name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture lint diagnostics
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS source files to lint." > eslint-diagnostics.txt
            echo 0 > eslint-exit-code.txt
            exit 0
          fi

          set +e
          npx eslint --quiet "${files[@]}" > eslint-diagnostics.txt 2>&1
          code=$?
          set -e
          echo "$code" > eslint-exit-code.txt

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics
          path: |
            eslint-diagnostics.txt
            eslint-exit-code.txt

      - name: Enforce lint result
        shell: bash
        run: exit "$(cat eslint-exit-code.txt)"

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Production build
        run: npm run build
