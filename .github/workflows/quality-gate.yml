name: Quality Gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/syria-dependency-hardening-1'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout dependency hardening head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove unused Firebase Admin development dependency
        run: |
          npm pkg delete devDependencies.firebase-admin
          npm install --package-lock-only --ignore-scripts

      - name: Reinstall remediated application graph
        run: npm ci --ignore-scripts

      - name: Require clean full application audit
        run: npm audit --audit-level=moderate

      - name: Install and audit Worker graph
        run: |
          npm ci --prefix cloudflare/worker --ignore-scripts
          npm audit --prefix cloudflare/worker --audit-level=moderate

      - name: Verify runtime backend boundary
        run: npm run test:runtime-boundary

      - name: Validate and replay D1 migrations
        run: npm run test:d1-migrations

      - name: Run Cloudflare cutover contracts
        run: npm run test:cloudflare-cutover

      - name: Run administrative authorization regression
        run: npm run test:admin-security

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck Worker
        run: npx tsc -p cloudflare/worker/tsconfig.json --noEmit

      - name: Build application
        run: npm run build

      - name: Restore permanent read-only Quality Gate
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          git show origin/main:.github/workflows/quality-gate.yml > .github/workflows/quality-gate.yml

      - name: Commit zero-audit dependency graph to PR branch only
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json .github/workflows/quality-gate.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No dependency cleanup changes to commit."
            exit 0
          fi
          git commit -m "chore(security): remove unused Firebase Admin dependency"
          git push origin "HEAD:${HEAD_REF}"
