name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply marketplace visual soul pass
        shell: bash
        run: |
          git fetch origin design/marketplace-soul-pass
          git checkout -B design/marketplace-soul-pass origin/design/marketplace-soul-pass
          python - <<'PY'
          from pathlib import Path

          changes = {
            "src/routes/listings.index.tsx": [
              ('<main className="container-wide mobile-page-bottom pt-4">', '<main className="container-wide mobile-page-bottom pb-8 pt-3 sm:pt-5">'),
              ('<section className="rounded-[1.4rem] bg-card p-3.5 hairline shadow-premium-sm sm:p-4">', '<section className="rawaj-hero-surface rounded-[1.55rem] p-4 sm:rounded-[1.8rem] sm:p-5">'),
              ('<p className="text-[10px] font-extrabold text-brand-orange">', '<p className="rawaj-eyebrow">'),
              ('<h1 className="mt-0.5 truncate text-lg font-extrabold text-primary sm:text-xl">', '<h1 className="mt-1 truncate text-lg font-bold leading-tight text-primary sm:text-[1.35rem]">'),
              ('<p className="mt-1 truncate text-[10px] font-bold text-muted-foreground">', '<p className="mt-1.5 truncate text-[10px] font-medium text-muted-foreground">'),
              ('<span className="shrink-0 rounded-full bg-primary/7 px-2.5 py-1 text-[10px] font-extrabold text-primary">', '<span className="rawaj-chip shrink-0 border-primary/10 bg-card/75 px-2.5 py-1 text-primary shadow-soft">'),
              ('<label className="flex min-h-12 min-w-0 flex-1 items-center gap-2 rounded-2xl bg-background/75 px-3.5 transition focus-within:bg-card focus-within:ring-[3px] focus-within:ring-brand-orange/20">', '<label className="flex min-h-13 min-w-0 flex-1 items-center gap-2.5 rounded-[1.05rem] border border-border/85 bg-card/88 px-3.5 shadow-[0_7px_22px_rgba(16,43,70,0.05)] transition focus-within:border-brand-orange/60 focus-within:bg-card focus-within:ring-[3px] focus-within:ring-brand-orange/12">'),
              ('className="w-full bg-transparent text-sm font-semibold outline-none placeholder:font-medium"', 'className="w-full bg-transparent text-sm font-medium outline-none placeholder:font-normal"'),
              ('className="relative grid min-h-12 w-12 shrink-0 place-items-center rounded-2xl bg-primary text-primary-foreground shadow-soft transition active:scale-[0.98]"', 'className="rawaj-button-primary relative grid min-h-13 w-13 shrink-0 place-items-center rounded-[1.05rem] p-0"'),
              ('className="grid min-h-12 w-12 shrink-0 place-items-center rounded-2xl bg-background/75 text-primary transition active:scale-[0.98]"', 'className="rawaj-icon-button min-h-13 w-13 shrink-0 rounded-[1.05rem]"'),
              ('className={`shrink-0 rounded-full px-3 py-1.5 text-[11px] font-bold transition ${', 'className={`rawaj-chip shrink-0 px-3 py-1.5 transition ${'),
              ('? "bg-primary text-primary-foreground"\n                  : "bg-background text-muted-foreground"', '? "border-primary bg-primary text-primary-foreground"\n                  : "bg-card/72 text-muted-foreground"'),
              ('className="shrink-0 rounded-full bg-brand-orange/10 px-3 py-1.5 text-[11px] font-extrabold text-brand-orange"', 'className="rawaj-chip shrink-0 border-brand-orange/20 bg-brand-orange/8 px-3 py-1.5 font-semibold text-brand-orange"'),
              ('<div className="mt-3 grid grid-cols-2 gap-2 rounded-2xl bg-background/80 p-2 sm:grid-cols-4">', '<div className="rawaj-surface mt-3 grid grid-cols-2 gap-2 rounded-[1.15rem] p-2 sm:grid-cols-4">'),
              ('<section className="mt-3 hidden rounded-2xl bg-card p-3 shadow-soft hairline lg:block">', '<section className="rawaj-surface mt-4 hidden rounded-[1.35rem] p-4 lg:block">'),
              ('<div className="fixed inset-0 z-50 flex items-end bg-primary/35 p-0 backdrop-blur-[2px] lg:hidden">', '<div className="fixed inset-0 z-50 flex items-end bg-primary/32 p-0 backdrop-blur-[3px] lg:hidden">'),
              ('<div className="mx-auto flex max-h-[92dvh] w-full max-w-xl flex-col overflow-hidden rounded-t-[1.75rem] bg-card shadow-premium">', '<div className="mx-auto flex max-h-[92dvh] w-full max-w-xl flex-col overflow-hidden rounded-t-[2rem] border border-b-0 border-border/80 bg-card shadow-premium">'),
              ('<div className="relative flex items-center justify-between border-b border-border/70 px-4 pb-3 pt-5">', '<div className="relative flex items-center justify-between border-b border-border/70 px-4 pb-3 pt-5 before:absolute before:left-1/2 before:top-2 before:h-1 before:w-10 before:-translate-x-1/2 before:rounded-full before:bg-border">'),
              ('className="grid h-9 w-9 place-items-center rounded-full bg-muted-surface text-foreground"', 'className="rawaj-icon-button h-9 w-9"'),
              ('<div className="sticky bottom-0 grid grid-cols-[0.8fr_1.2fr] gap-2 border-t border-border/70 bg-card/96 p-4 backdrop-blur-xl">', '<div className="sticky bottom-0 grid grid-cols-[0.8fr_1.2fr] gap-2 border-t border-border/70 bg-card/94 p-4 shadow-[0_-10px_30px_rgba(16,43,70,0.06)] backdrop-blur-xl">'),
              ('className="min-h-12 rounded-2xl bg-primary px-4 py-2.5 text-xs font-extrabold text-primary-foreground shadow-soft"', 'className="rawaj-button-primary min-h-12 rounded-2xl px-4 py-2.5"'),
            ],
            "src/routes/categories.tsx": [
              ('<section className="overflow-hidden rounded-[1.35rem] bg-card hairline sm:rounded-3xl">', '<section className="rawaj-hero-surface rounded-[1.55rem] sm:rounded-[1.9rem]">'),
              ('className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-primary text-primary-foreground shadow-soft"', 'className="relative grid h-11 w-11 shrink-0 place-items-center rounded-[1rem] bg-primary text-primary-foreground shadow-[0_9px_22px_rgba(16,43,70,0.16)]"'),
              ('<p className="text-[10px] font-extrabold uppercase tracking-[0.12em] text-gold">', '<p className="rawaj-eyebrow">'),
              ('<h1 className="mt-1 text-xl font-extrabold leading-tight text-foreground sm:text-2xl">', '<h1 className="mt-1.5 text-xl font-bold leading-[1.4] text-primary sm:text-2xl">'),
              ('<p className="mt-2 max-w-2xl text-xs leading-6 text-muted-foreground sm:text-sm">', '<p className="mt-2.5 max-w-2xl text-xs leading-6 text-muted-foreground sm:text-sm sm:leading-7">'),
              ('<div className="border-t border-border/70 p-3 sm:p-4">', '<div className="border-t border-border/60 p-3 sm:p-4">'),
              ('<label className="flex items-center gap-2.5 rounded-2xl bg-muted-surface px-3.5 py-3 hairline focus-within:ring-2 focus-within:ring-gold/50">', '<label className="flex items-center gap-2.5 rounded-[1.05rem] border border-border/80 bg-card/82 px-3.5 py-3 shadow-[0_7px_22px_rgba(16,43,70,0.045)] transition focus-within:border-brand-orange/60 focus-within:ring-[3px] focus-within:ring-brand-orange/12">'),
              ('className="shrink-0 rounded-full bg-muted-surface px-2.5 py-1.5 transition hover:text-foreground"', 'className="rawaj-chip shrink-0 px-2.5 py-1.5 transition hover:border-gold/40 hover:text-primary"'),
              ('<div className="mt-4 rounded-2xl bg-card p-3 hairline sm:flex sm:items-center sm:justify-between sm:gap-4 sm:p-4">', '<div className="rawaj-surface mt-4 rounded-[1.25rem] p-4 sm:flex sm:items-center sm:justify-between sm:gap-4">'),
              ('className="mt-3 inline-flex w-full items-center justify-center rounded-xl bg-primary px-4 py-2.5 text-xs font-bold text-primary-foreground sm:mt-0 sm:w-auto"', 'className="rawaj-button-primary mt-3 w-full px-4 py-2.5 sm:mt-0 sm:w-auto"'),
              ('<section className="mt-4 grid grid-cols-1 gap-2.5 sm:grid-cols-2 lg:gap-3 xl:grid-cols-3">', '<section className="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:gap-4 xl:grid-cols-3">'),
              ('<article className="overflow-hidden rounded-[1.15rem] bg-card hairline transition sm:rounded-2xl sm:hover:-translate-y-0.5 sm:hover:shadow-soft">', '<article className="rawaj-surface tap-card overflow-hidden rounded-[1.25rem] transition sm:hover:-translate-y-0.5">'),
              ('className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-muted-surface text-primary sm:h-12 sm:w-12"', 'className="category-tile h-11 w-11 shrink-0 sm:h-12 sm:w-12"'),
              ('<span className="truncate text-sm font-extrabold text-foreground sm:text-[15px]">', '<span className="truncate text-sm font-semibold text-foreground sm:text-[15px]">'),
              ('<span className="mt-1.5 inline-flex text-[10px] font-bold text-primary sm:mt-2 sm:text-[11px]">', '<span className="mt-1.5 inline-flex text-[10px] font-semibold text-brand-orange sm:mt-2 sm:text-[11px]">'),
              ('className="overflow-hidden rounded-[1.15rem] bg-card hairline sm:rounded-2xl"', 'className="rawaj-surface tap-card overflow-hidden rounded-[1.25rem]"'),
              ('<div className="mt-4 rounded-[1.35rem] bg-card p-8 text-center text-sm hairline sm:rounded-3xl">', '<div className="rawaj-surface mt-4 rounded-[1.4rem] p-8 text-center text-sm sm:rounded-3xl">'),
            ],
            "src/routes/listings.$id.tsx": [
              ('<main className="container-wide listing-detail-mobile-bottom pb-8 pt-2 sm:pt-4">', '<main className="container-wide listing-detail-mobile-bottom pb-8 pt-3 sm:pt-5">'),
              ('<section className="overflow-hidden rounded-[1.35rem] bg-card hairline sm:rounded-3xl">', '<section className="rawaj-surface overflow-hidden rounded-[1.5rem] sm:rounded-[1.9rem]">'),
              ('className="inline-flex items-center gap-1.5 rounded-full bg-background/90 px-2.5 py-1.5 text-[11px] font-bold text-foreground shadow-soft backdrop-blur"', 'className="rawaj-chip border-white/40 bg-card/88 px-2.5 py-1.5 text-foreground shadow-soft backdrop-blur"'),
              ('className="grid h-9 w-9 place-items-center rounded-full bg-background/90 text-foreground shadow-soft backdrop-blur active:scale-[0.98]"', 'className="rawaj-icon-button h-9 w-9 bg-card/88 backdrop-blur"'),
              ('className="mt-4 rounded-[1.35rem] bg-card p-4 hairline sm:rounded-3xl sm:p-5 lg:hidden"', 'className="rawaj-surface mt-4 rounded-[1.4rem] p-4 sm:rounded-3xl sm:p-5 lg:hidden"'),
              ('<section className="mt-4 rounded-[1.35rem] bg-card p-4 hairline sm:rounded-3xl sm:p-5">', '<section className="rawaj-surface mt-4 rounded-[1.4rem] p-4 sm:rounded-3xl sm:p-5">'),
              ('className="rounded-2xl bg-muted-surface px-3 py-3"', 'className="rounded-[1.05rem] border border-border/65 bg-card-warm/72 px-3 py-3 shadow-[inset_0_1px_0_rgba(255,255,255,0.55)]"'),
              ('className="mt-4 flex items-center gap-3 rounded-2xl bg-muted-surface p-3.5 sm:p-4"', 'className="mt-4 flex items-center gap-3 rounded-[1.15rem] border border-border/65 bg-card-warm/72 p-3.5 sm:p-4"'),
              ('<section className="mt-4 rounded-[1.35rem] bg-warning/10 p-4 hairline sm:rounded-3xl sm:p-5">', '<section className="mt-4 rounded-[1.4rem] border border-warning/15 bg-warning/7 p-4 shadow-[0_8px_24px_rgba(16,43,70,0.035)] sm:rounded-3xl sm:p-5">'),
              ('className="mt-3 inline-flex w-full items-center justify-center gap-2 rounded-2xl bg-card py-3 text-xs font-bold text-destructive hairline transition hover:bg-destructive/5"', 'className="mt-3 inline-flex w-full items-center justify-center gap-2 rounded-2xl border border-destructive/12 bg-card/75 py-3 text-xs font-semibold text-destructive transition hover:bg-destructive/5"'),
              ('<section className="rounded-3xl bg-card p-5 hairline shadow-soft">', '<section className="rawaj-surface rounded-3xl p-5">'),
              ('<section className="rounded-3xl bg-card p-5 hairline">', '<section className="rawaj-surface rounded-3xl p-5">'),
              ('<section className="rounded-3xl bg-card p-4 hairline">', '<section className="rawaj-surface rounded-3xl p-4">'),
              ('className="inline-flex items-center justify-center gap-2 rounded-2xl bg-muted-surface py-3 text-xs font-bold text-foreground transition hover:bg-secondary"', 'className="inline-flex items-center justify-center gap-2 rounded-2xl border border-border/70 bg-card-warm/72 py-3 text-xs font-semibold text-foreground transition hover:border-gold/35 hover:bg-card"'),
              ('className="inline-flex items-center justify-center gap-2 rounded-2xl bg-primary py-3 text-xs font-bold text-primary-foreground"', 'className="rawaj-button-primary rounded-2xl py-3"'),
              ('<div className="mx-auto flex max-w-md items-center gap-2 rounded-[1.15rem] bg-card/95 p-2 shadow-premium hairline backdrop-blur">', '<div className="rawaj-surface mx-auto flex max-w-md items-center gap-2 rounded-[1.3rem] bg-card/94 p-2 backdrop-blur-xl">'),
              ('className="inline-flex min-w-0 flex-1 items-center justify-center gap-2 rounded-xl bg-primary px-4 py-3 text-xs font-extrabold text-primary-foreground"', 'className="rawaj-button-primary min-w-0 flex-1 rounded-xl px-4 py-3"'),
              ('className="rounded-full bg-muted-surface px-2.5 py-1 text-[10px] font-bold text-muted-foreground"', 'className="rawaj-chip px-2.5 py-1"'),
              ('<h1 className="mt-3 text-xl font-extrabold leading-[1.45] text-foreground text-balance sm:text-2xl">', '<h1 className="mt-3.5 text-xl font-bold leading-[1.5] text-primary text-balance sm:text-2xl">'),
              ('<div className="mt-1 text-2xl font-black leading-tight text-foreground text-balance sm:text-3xl">', '<div className="mt-1 text-2xl font-bold leading-tight text-primary text-balance sm:text-3xl">'),
              ('className="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-muted-surface text-primary"', 'className="category-tile h-12 w-12 shrink-0 rounded-full"'),
              ('<h2 className="mt-0.5 truncate text-sm font-extrabold text-foreground">', '<h2 className="mt-0.5 truncate text-sm font-semibold text-foreground">'),
              ('className="inline-flex items-center justify-center gap-1.5 rounded-2xl bg-primary px-3 py-3 text-[11px] font-bold text-primary-foreground"', 'className="rawaj-button-primary rounded-2xl px-3 py-3 text-[11px]"'),
              ('<h2 className="text-sm font-extrabold text-foreground sm:text-base">', '<div className="mb-1 h-0.5 w-7 rounded-full bg-gradient-to-r from-brand-orange to-gold" /><h2 className="text-sm font-bold text-primary sm:text-base">'),
              ('<div className="rounded-3xl bg-card p-10 text-center hairline">', '<div className="rawaj-surface rounded-3xl p-10 text-center">'),
              ('className="mt-4 inline-block rounded-xl bg-primary px-4 py-2 text-xs font-bold text-primary-foreground"', 'className="rawaj-button-primary mt-4 px-4 py-2"'),
            ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f"Missing replacement in {filename}: {old[:100]!r}")
                  text = text.replace(old, new)
                  print(f"{filename}: replaced {count} occurrence(s)")
              path.write_text(text, encoding="utf-8")
          PY

          npx prettier --write \
            'src/routes/listings.index.tsx' \
            'src/routes/listings.$id.tsx' \
            'src/routes/categories.tsx'

          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            'src/routes/listings.index.tsx' \
            'src/routes/listings.$id.tsx' \
            'src/routes/categories.tsx'
          git commit -m 'Extend RAWAJ visual soul across marketplace journey'
          git push origin HEAD:design/marketplace-soul-pass

      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS source files to lint."
            exit 0
          fi

          printf 'Linting %s\n' "${files[@]}"
          npx eslint --quiet "${files[@]}"

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Production build
        run: npm run build
