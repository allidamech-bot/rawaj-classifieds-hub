name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Report application dependency advisories
        continue-on-error: true
        run: npm audit --json

      - name: Report application production-only advisories
        continue-on-error: true
        run: npm audit --omit=dev --json

      - name: Report Worker dependency advisories
        continue-on-error: true
        run: npm audit --prefix cloudflare/worker --json

      - name: Report Worker production-only advisories
        continue-on-error: true
        run: npm audit --prefix cloudflare/worker --omit=dev --json

      - name: Generate safe application lockfile remediation
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Generate safe Worker toolchain remediation
        run: npm install --prefix cloudflare/worker --package-lock-only --ignore-scripts --save-dev wrangler@^4.114.0

      - name: Verify remediated application production graph
        run: npm audit --omit=dev --audit-level=high

      - name: Verify remediated Worker dependency graph
        run: npm audit --prefix cloudflare/worker --audit-level=high

      - name: Upload dependency remediation files
        uses: actions/upload-artifact@v4
        with:
          name: syria-dependency-remediation
          if-no-files-found: error
          path: |
            package.json
            package-lock.json
            cloudflare/worker/package.json
            cloudflare/worker/package-lock.json

      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS source files to lint."
            exit 0
          fi
          printf 'Linting %s\n' "${files[@]}"
          npx eslint --quiet "${files[@]}"

      - name: Verify runtime backend boundary
        run: npm run test:runtime-boundary

      - name: Validate and replay D1 migrations
        run: npm run test:d1-migrations

      - name: Run Cloudflare cutover contracts
        run: npm run test:cloudflare-cutover

      - name: Run administrative authorization regression
        run: npm run test:admin-security

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck Worker
        run: npx tsc -p cloudflare/worker/tsconfig.json --noEmit

      - name: Build application
        run: npm run build
