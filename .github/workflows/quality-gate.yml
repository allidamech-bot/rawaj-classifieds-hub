name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout moderation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/listing-moderation-console-hardening

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and persist route tree
        shell: bash
        run: |
          set +e
          npm run build
          build_code=$?
          set -e

          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "Regenerate TanStack route tree"
            git push origin HEAD:feature/listing-moderation-console-hardening
          else
            echo "Route tree is already current."
          fi

          exit "$build_code"
