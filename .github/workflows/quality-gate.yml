name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        shell: bash
        run: |
          set +e
          npm run lint -- --quiet > /tmp/eslint.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 80 /tmp/eslint.log
            exit "$status"
          fi

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Production build
        run: npm run build
