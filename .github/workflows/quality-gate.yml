name: Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-auth-recovery:
    if: github.head_ref == 'feature/auth-recovery-session-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/auth-recovery-session-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format auth recovery files
        run: >-
          npx prettier --write
          src/lib/auth-return.ts
          src/routes/auth.callback.tsx
          src/routes/login.tsx
          src/routes/reset-password.tsx

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/auth-return.ts src/routes/auth.callback.tsx src/routes/login.tsx src/routes/reset-password.tsx
          git commit -m "Format auth recovery flow"
          git push origin HEAD:feature/auth-recovery-session-hardening
