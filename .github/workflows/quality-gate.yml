name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format visual soul sources
        shell: bash
        run: |
          git fetch origin design/rawaj-visual-soul-pass
          git checkout -B design/rawaj-visual-soul-pass origin/design/rawaj-visual-soul-pass
          npx prettier --write \
            'src/components/AppHeader.tsx' \
            'src/components/BottomNav.tsx' \
            'src/components/PageHeader.tsx' \
            'src/routes/index.tsx' \
            'src/styles.css'
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            'src/components/AppHeader.tsx' \
            'src/components/BottomNav.tsx' \
            'src/components/PageHeader.tsx' \
            'src/routes/index.tsx' \
            'src/styles.css'
          git commit -m 'Format visual soul sources'
          git push origin HEAD:design/rawaj-visual-soul-pass

      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS source files to lint."
            exit 0
          fi

          printf 'Linting %s\n' "${files[@]}"
          npx eslint --quiet "${files[@]}"

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Production build
        run: npm run build
