name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS source files to lint."
            exit 0
          fi
          printf 'Linting %s\n' "${files[@]}"
          npx eslint --quiet "${files[@]}"

      - name: Verify runtime backend boundary
        run: npm run test:runtime-boundary

      - name: Validate and replay D1 migrations
        run: npm run test:d1-migrations

      - name: Verify isolated Syria D1 backup integrity and output-path safety
        run: node --test scripts/syria-d1-backup-integrity.test.mjs scripts/syria-backup-restore-safety.test.mjs

      - name: Rehearse pinned Syria D1 snapshot recovery in isolated SQLite\n        run: node --test scripts/syria-d1-isolated-restore.test.mjs\n\n      - name: Validate pinned manual release candidate gates
        run: node --test scripts/release-candidate-gating.test.mjs

      - name: Run Cloudflare cutover contracts
        run: npm run test:cloudflare-cutover

      - name: Run administrative authorization regression
        run: npm run test:admin-security

      - name: Run P1 security behavior and SQL regression tests
        run: npm run test:p1-stability-security

      - name: Run isolated Worker marketplace integration tests
        run: |
          npm run test:setup --prefix cloudflare/worker
          npm run test:fixtures --prefix cloudflare/worker
          cd cloudflare/worker
          node --test --test-concurrency=1 test/marketplace.integration.test.mjs

      - name: Verify audited dependency APIs
        run: node --test scripts/dependency-security-compatibility.test.mjs

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck Worker
        run: npx tsc -p cloudflare/worker/tsconfig.json --noEmit

      - name: Build application
        run: npm run build
