name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo 0 > eslint-status.txt
            printf '[]\n' > eslint-report.json
            exit 0
          fi
          set +e
          npx eslint --quiet --format json "${files[@]}" > eslint-report.json
          lint_status=$?
          set -e
          echo "$lint_status" > eslint-status.txt

      - name: Upload ESLint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics
          path: |
            eslint-report.json
            eslint-status.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Enforce lint result
        shell: bash
        run: |
          status="$(cat eslint-status.txt 2>/dev/null || echo 1)"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Production build
        run: npm run build
