name: Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  phase11-integration:
    if: github.head_ref == 'feature/phase-11-listing-image-processing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-11-listing-image-processing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate and format image processing
        run: |
          python scripts/phase11_image_processing_patch.py
          npx prettier --write \
            src/lib/api/listings.ts \
            src/lib/listing-image-processing.ts \
            scripts/listing-studio-image-parity.test.mjs
      - name: Restore workflow and remove patcher
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/quality-gate.yml
          rm scripts/phase11_image_processing_patch.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows/quality-gate.yml
          git commit -m "Integrate listing image preprocessing"
          git push origin HEAD:feature/phase-11-listing-image-processing
