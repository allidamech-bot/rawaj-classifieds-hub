name: Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture-phase-8-lint:
    if: github.head_ref == 'feature/phase-8-arabic-search-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-8-arabic-search-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture exact lint output
        run: |
          set +e
          npx eslint --quiet \
            src/lib/search-normalization.ts \
            src/lib/api/location-aware-listings.ts \
            src/lib/api/location-aware-listings-v2.ts \
            > docs/phase8-lint-output.txt 2>&1
          code=$?
          printf '\nexit_code=%s\n' "$code" >> docs/phase8-lint-output.txt
          exit 0
      - name: Restore canonical Quality Gate
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/quality-gate.yml
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phase8-lint-output.txt .github/workflows/quality-gate.yml
          git commit -m "Capture Phase 8 lint diagnostics"
          git push origin HEAD:feature/phase-8-arabic-search-v2
