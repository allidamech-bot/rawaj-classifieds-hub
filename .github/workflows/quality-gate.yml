name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          show-progress: false

      - name: Canonical migration ledger and collision check
        run: node scripts/check-migration-ledger.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Implement home SSR and dedup
        if: github.event_name == 'pull_request' && github.head_ref == 'perf/home-ssr-and-listing-dedup' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          python <<'PY'
          import json
          from pathlib import Path

          home = Path("src/routes/index.tsx")
          text = home.read_text()
          text = text.replace(
              'import { useEffect, useState, type FormEvent } from "react";',
              'import { useState, type FormEvent } from "react";',
              1,
          )
          text = text.replace(
              '''import type {
            ClassifiedCategory,
            ClassifiedListing,
            ClassifiedsError,
          } from "@/lib/classifieds-types";''',
              '''import type { ClassifiedCategory, ClassifiedListing } from "@/lib/classifieds-types";''',
              1,
          )

          route_old = '''export const Route = createFileRoute("/")({
            head: () => createSeo({ title: HOME_TITLE, description: HOME_DESCRIPTION, path: "/" }),
            component: HomePage,
          });'''
          route_new = '''export const Route = createFileRoute("/")({
            loader: async () => {
              const [listingsResult, categoriesResult] = await Promise.all([
                fetchPublicListings({}, null, 18),
                fetchPublicCategories(),
              ]);

              return {
                listings: listingsResult.ok ? listingsResult.data.items : [],
                categories: categoriesResult.ok ? categoriesResult.data : [],
                error: listingsResult.ok ? null : listingsResult.error,
              };
            },
            head: () => createSeo({ title: HOME_TITLE, description: HOME_DESCRIPTION, path: "/" }),
            component: HomePage,
          });'''
          if route_old not in text:
              raise SystemExit("Missing home route anchor")
          text = text.replace(route_old, route_new, 1)

          state_old = '''  const [searchValue, setSearchValue] = useState("");
            const [listings, setListings] = useState<ClassifiedListing[]>([]);
            const [categories, setCategories] = useState<ClassifiedCategory[]>([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState<ClassifiedsError | null>(null);

            useEffect(() => {
              let cancelled = false;
              async function load() {
                setLoading(true);
                setError(null);
                const [listingsResult, categoriesResult] = await Promise.all([
                  fetchPublicListings({}, null, 30),
                  fetchPublicCategories(),
                ]);
                if (cancelled) return;
                if (!listingsResult.ok) setError(listingsResult.error);
                else setListings(listingsResult.data.items);
                if (categoriesResult.ok) setCategories(categoriesResult.data);
                setLoading(false);
              }
              void load();
              return () => {
                cancelled = true;
              };
            }, []);'''
          state_new = '''  const { listings, categories, error } = Route.useLoaderData();
            const [searchValue, setSearchValue] = useState("");'''
          if state_old not in text:
              raise SystemExit("Missing home client-load state anchor")
          text = text.replace(state_old, state_new, 1)

          dedup_old = '''  const featuredListings = listings.filter((listing) => listing.isFeatured).slice(0, 6);
            const latestListings = listings.slice(0, 12);'''
          dedup_new = '''  const featuredListings = listings.filter((listing) => listing.isFeatured).slice(0, 6);
            const featuredListingIds = new Set(featuredListings.map((listing) => listing.id));
            const latestListings = listings
              .filter((listing) => !featuredListingIds.has(listing.id))
              .slice(0, 12);'''
          if dedup_old not in text:
              raise SystemExit("Missing home dedup anchor")
          text = text.replace(dedup_old, dedup_new, 1)

          render_old = '''        {loading ? (
                    <HomeState title={text("جاري تحميل الإعلانات", "Loading listings")} />
                  ) : error ? (
                    <HomeState
                      title={text("تعذر تحميل بيانات السوق", "Could not load marketplace data")}
                      body={error.message}
                    />
                  ) : (
                    <>
                      {featuredListings.length > 0 ? (
                        <ListingsSection
                          kicker={text("مختارات رواج", "RAWAJ picks")}
                          title={text("مختارات مميزة", "Featured picks")}
                          listings={featuredListings}
                          empty=""
                          mobileRail
                          tone="indigo"
                        />
                      ) : null}

                      <ListingsSection
                        kicker={text("وصل حديثًا", "Just arrived")}
                        title={text("أحدث الإعلانات", "Latest listings")}
                        listings={latestListings}
                        empty={text("لا توجد إعلانات معتمدة للعرض.", "No reviewed listings to show.")}
                        tone="orange"
                      />
                    </>
                  )}'''
          render_new = '''        {error ? (
                    <HomeState
                      title={text("تعذر تحميل بيانات السوق", "Could not load marketplace data")}
                      body={error.message}
                    />
                  ) : (
                    <>
                      {featuredListings.length > 0 ? (
                        <ListingsSection
                          kicker={text("مختارات رواج", "RAWAJ picks")}
                          title={text("مختارات مميزة", "Featured picks")}
                          listings={featuredListings}
                          empty=""
                          mobileRail
                          tone="indigo"
                        />
                      ) : null}

                      <ListingsSection
                        kicker={text("وصل حديثًا", "Just arrived")}
                        title={text("أحدث الإعلانات", "Latest listings")}
                        listings={latestListings}
                        empty={text("لا توجد إعلانات معتمدة للعرض.", "No reviewed listings to show.")}
                        tone="orange"
                      />
                    </>
                  )}'''
          if render_old not in text:
              raise SystemExit("Missing home loading render anchor")
          home.write_text(text.replace(render_old, render_new, 1))

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          scripts = package["scripts"]
          scripts["test:home-ssr"] = "node --test scripts/home-ssr-contract.test.mjs"
          marker = "npm run test:public-data-security && npm run lint"
          replacement = "npm run test:public-data-security && npm run test:home-ssr && npm run lint"
          if marker not in scripts["check"]:
              raise SystemExit("Missing package check anchor")
          scripts["check"] = scripts["check"].replace(marker, replacement, 1)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")
          PY

          npx prettier --write src/routes/index.tsx scripts/home-ssr-contract.test.mjs package.json

      - name: Commit home SSR optimization
        if: github.event_name == 'pull_request' && github.head_ref == 'perf/home-ssr-and-listing-dedup' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx scripts/home-ssr-contract.test.mjs package.json
          git commit -m "Render home marketplace data through SSR loader"
          git push origin HEAD:perf/home-ssr-and-listing-dedup

      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS source files to lint."
            exit 0
          fi

          printf 'Linting %s\n' "${files[@]}"
          npx eslint --quiet "${files[@]}"

      - name: Syria location classification contract
        run: npm run test:location-classification

      - name: Syria location discovery and presentation contract
        run: npm run test:location-presentation

      - name: Listings mobile category switch contract
        run: npm run test:listings-filters

      - name: Seller review eligibility contract
        run: npm run test:review-eligibility

      - name: Seller review response contract
        run: npm run test:review-response

      - name: Seller review report contract
        run: npm run test:review-report

      - name: Seller review traits contract
        run: npm run test:review-traits

      - name: Listing price drop contract
        run: npm run test:price-drop

      - name: Listing reservation contract
        run: npm run test:reservation

      - name: Chat workspace contract
        run: npm run test:chat-workspace

      - name: Listing studio image parity contract
        run: npm run test:listing-studio-images

      - name: Account activity center contract
        run: npm run test:activity-center

      - name: SEO discovery contract
        run: npm run test:seo-discovery

      - name: Semantic SEO contract
        run: npm run test:semantic-seo

      - name: Verification documents V2 contract
        run: npm run test:verification-documents

      - name: Production deployment truth contract
        run: npm run test:deployment-truth

      - name: Public data security contract
        run: npm run test:public-data-security

      - name: Home SSR contract
        run: npm run test:home-ssr

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Listing system regression contract
        run: npm run test:listing-system

      - name: Production build
        run: npm run build
