name: Quality Gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout expiry options branch
        uses: actions/checkout@v4
        with:
          ref: feature/listing-expiry-options
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Format changed source and restore standard gate
        shell: bash
        run: |
          npm ci
          npx prettier --write \
            src/lib/api/favorites.ts \
            src/lib/api/listing-expiry.ts \
            src/lib/api/listing-lifecycle.ts \
            src/lib/api/listings.ts \
            src/lib/api/location-aware-listings-v2.ts \
            src/lib/api/location-aware-listings.ts \
            src/lib/api/seller.ts \
            src/lib/classifieds-types.ts \
            src/routes/profile/listings.tsx
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format listing expiry option changes"
          git push origin HEAD:feature/listing-expiry-options
