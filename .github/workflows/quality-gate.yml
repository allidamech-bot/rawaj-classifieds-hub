name: Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  phase17-integration:
    if: github.head_ref == 'feature/phase-17-semantic-listing-types'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-17-semantic-listing-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate and format semantic listing data
        run: |
          python scripts/phase17_semantic_patch.py
          npx prettier --write \
            'src/routes/listings.$id.tsx' \
            src/lib/listing-structured-data.ts \
            scripts/semantic-seo.test.mjs
      - name: Restore workflow and remove patcher
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/quality-gate.yml
          rm scripts/phase17_semantic_patch.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows/quality-gate.yml
          git commit -m "Integrate category-aware listing structured data"
          git push origin HEAD:feature/phase-17-semantic-listing-types
