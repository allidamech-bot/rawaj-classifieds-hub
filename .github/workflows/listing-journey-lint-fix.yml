name: Listing Journey Lint Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply ESLint fixes to changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )
          printf 'Fixing %s\n' "${files[@]}"
          npx eslint --fix "${files[@]}"
          mkdir -p lint-fixed
          for file in "${files[@]}"; do
            mkdir -p "lint-fixed/$(dirname "$file")"
            cp "$file" "lint-fixed/$file"
          done

      - name: Upload fixed files
        uses: actions/upload-artifact@v4
        with:
          name: listing-journey-lint-fixed-${{ github.sha }}
          path: lint-fixed
          if-no-files-found: error
          retention-days: 1
