name: Patch Saudi finalizer media gate

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-saudi-finalizer-media-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/saudi-media-cache-production-gate-20260803
          fetch-depth: 0
      - name: Add listing media cache regression to finalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/saudi-finalize-production.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [index for index, line in enumerate(lines) if line.strip() == 'npm install --no-save jose@^6']
          if len(matches) != 1:
              raise SystemExit(f'Expected one Saudi Worker jose install line, found {len(matches)}')
          index = matches[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          test_line = f'{indent}node --test test/listing-media-cache-invalidation.test.mjs'
          if test_line not in lines:
              lines.insert(index + 1, test_line)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/patch-saudi-finalizer-media-gate.yml
      - name: Commit permanent finalizer gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/saudi-finalize-production.yml .github/workflows/patch-saudi-finalizer-media-gate.yml
          git commit -m "ci(saudi): verify listing media cache on deploy"
          git push origin HEAD:ci/saudi-media-cache-production-gate-20260803
