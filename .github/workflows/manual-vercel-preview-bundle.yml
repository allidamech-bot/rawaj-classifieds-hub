name: Manual Vercel Preview Bundle

on:
  push:
    branches:
      - feature/cloudflare-storage-migration-continuation

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Create source bundle
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.output \
            --exclude=.vercel \
            --exclude=artifacts \
            -czf /tmp/rawaj-vercel-preview-source.tar.gz .

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-vercel-preview-source-${{ github.sha }}
          path: /tmp/rawaj-vercel-preview-source.tar.gz
          if-no-files-found: error
          retention-days: 1
