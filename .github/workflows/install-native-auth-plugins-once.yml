name: Install Native Auth Plugins Once

on:
  push:
    branches:
      - agent/android-release-candidate-audit-1-0-3
    paths:
      - ".github/workflows/install-native-auth-plugins-once.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/android-release-candidate-audit-1-0-3
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install matching Capacitor plugins
        run: npm install --save-exact @capacitor/app@8.4.1 @capacitor/browser@8.4.1

      - name: Remove one-time workflow
        run: rm .github/workflows/install-native-auth-plugins-once.yml

      - name: Commit dependency lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/install-native-auth-plugins-once.yml
          git commit -m "Add Capacitor native auth plugins"
          git push origin HEAD:agent/android-release-candidate-audit-1-0-3
