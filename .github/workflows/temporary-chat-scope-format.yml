name: Temporary chat scope format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-chat-scope-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'fix/chat-composer-scope-isolation-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/chat-composer-scope-isolation-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format and lint changed files
        run: |
          npx prettier --write \
            src/routes/chats.tsx \
            scripts/chat-composer-scope-isolation.test.mjs \
            scripts/chat-workspace.test.mjs \
            scripts/listing-quality-chat-safety-v1.test.mjs \
            package.json
          npx eslint --fix \
            src/routes/chats.tsx \
            scripts/chat-composer-scope-isolation.test.mjs \
            scripts/chat-workspace.test.mjs \
            scripts/listing-quality-chat-safety-v1.test.mjs
          npm run test:chat-workspace
          npm run test:listing-quality-chat-safety
          npm run typecheck -- --pretty false

      - name: Commit formatter fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routes/chats.tsx \
            scripts/chat-composer-scope-isolation.test.mjs \
            scripts/chat-workspace.test.mjs \
            scripts/listing-quality-chat-safety-v1.test.mjs \
            package.json
          if git diff --cached --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git commit -m "chore: format chat scope isolation"
          git push origin HEAD:fix/chat-composer-scope-isolation-v2
