name: Temporary Security Lockfile Autofix

on:
  push:
    branches:
      - agent/security-continuous-hardening-20260811
    paths:
      - ".github/workflows/security-lockfile-autofix-temp.yml"

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: github.repository == 'allidamech-bot/rawaj-classifieds-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/security-continuous-hardening-20260811
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/worker/package-lock.json

      - name: Refresh root lockfile security patches
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Refresh Worker lockfile security patches
        working-directory: cloudflare/worker
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Commit only lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json cloudflare/worker/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "security: refresh vulnerable lockfiles"
          git push origin HEAD:agent/security-continuous-hardening-20260811
