name: Apply Review Card Actions Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-review-card-actions-integrity.mjs"
      - ".github/workflows/apply-review-card-actions-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-review-card-actions-integrity
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-site-actions-integrity-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded review-card repair
        id: repair
        continue-on-error: true
        shell: bash
        run: node scripts/apply-review-card-actions-integrity.mjs > review-card-repair.log 2>&1
      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-card-repair-${{ github.sha }}
          path: review-card-repair.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when repair failed
        if: steps.repair.outcome == 'failure'
        run: exit 1
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/reviews/SellerReviewCard.tsx scripts/apply-review-card-actions-integrity.mjs
          git commit -m "fix: harden review card action lifecycle"
          git push origin HEAD:agent/full-site-actions-integrity-audit
