name: Verify Saudi service binding live

"on":
  pull_request:
    branches:
      - saudi

permissions:
  contents: read

concurrency:
  group: verify-saudi-service-binding-live
  cancel-in-progress: false

jobs:
  verify:
    if: github.head_ref == 'fix/saudi-service-binding-request-url-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: rawaj-saudi-web
      WORKER_URL: https://rawaj-saudi-web.allidamech.workers.dev
      SITE_URL: https://sa.rawa-j.com
      FIREBASE_PROJECT_ID: project-af18fcaf-c46e-4ec5-93a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build verified Saudi frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test scripts/saudi-first-load-api-gateway.test.mjs
          npm run test:runtime-boundary
          npm run typecheck
          npm run build
          grep -R -q "$FIREBASE_PROJECT_ID" .output/public/assets

      - name: Prepare and deploy frontend Worker with service binding
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.output/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config.main !== 'index.mjs') throw new Error('Unexpected Saudi frontend entrypoint');
          config.name = process.env.WORKER_NAME;
          config.assets.run_worker_first = true;
          config.services = [{ binding: 'SAUDI_API', service: 'rawaj-saudi-classifieds' }];
          config.observability = { enabled: true };
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          npx --yes wrangler@4.118.0 deploy --config .output/server/wrangler.json

      - name: Verify Worker and custom-domain first load
        shell: bash
        run: |
          set -euo pipefail
          for origin in "$WORKER_URL" "$SITE_URL"; do
            key="binding-$(date +%s%N)"
            curl --retry 20 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/v1/health?release=$key" > /tmp/health.json
            curl --retry 20 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/v1/references?release=$key" > /tmp/references.json
            curl --retry 20 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/?release=$key" > /tmp/home.html
            ORIGIN="$origin" node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const refs = JSON.parse(fs.readFileSync('/tmp/references.json', 'utf8'));
          const home = fs.readFileSync('/tmp/home.html', 'utf8');
          const origin = process.env.ORIGIN;
          if (health.data?.database !== 'ready') throw new Error(`Health failed on ${origin}`);
          if ((refs.data?.categories?.length || 0) < 12) throw new Error(`Categories failed on ${origin}`);
          if ((refs.data?.taxonomyNodes?.length || 0) !== 117) throw new Error(`Taxonomy failed on ${origin}`);
          if ((refs.data?.governorates?.length || 0) !== 13) throw new Error(`Regions failed on ${origin}`);
          if (!home.includes('سيارات ومركبات') || !home.includes('عقارات')) {
            throw new Error(`First-load categories are absent on ${origin}`);
          }
          if (home.includes('/_vercel/insights/script.js')) {
            throw new Error(`Vercel Analytics rendered on ${origin}`);
          }
          console.log(`Saudi first load passed on ${origin}`);
          NODE
          done
