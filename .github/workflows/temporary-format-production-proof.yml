name: Temporary Format Production Proof

on:
  push:
    branches:
      - docs/phase-2-production-push-proof

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-2-production-push-proof
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/production-deployment-truth.test.mjs
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/production-deployment-truth.test.mjs
          git commit -m "style: format Production proof contract"
          git push origin HEAD:docs/phase-2-production-push-proof
