name: Format notifications PR

on:
  push:
    branches:
      - agent/fix-notifications-page-final

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-notifications-page-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/routes/notifications.tsx src/features/notifications/NotificationTimelineCard.tsx scripts/communication-center-v2.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/notifications.tsx src/features/notifications/NotificationTimelineCard.tsx scripts/communication-center-v2.test.mjs
          git commit -m "Format notification page repair"
          git push origin HEAD:agent/fix-notifications-page-final
