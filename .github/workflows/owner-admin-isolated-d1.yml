name: Owner Admin Isolated D1 Acceptance
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/owner-admin-isolated-d1.yml"
permissions:
  contents: read
jobs:
  isolated-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix cloudflare/worker --ignore-scripts
      - name: Run all local D1 integration tests
        run: npm test --prefix cloudflare/worker
