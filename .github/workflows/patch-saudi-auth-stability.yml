name: Patch Saudi auth stability

"on":
  pull_request:
    branches:
      - saudi

permissions:
  contents: write

concurrency:
  group: patch-saudi-auth-stability-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'fix/saudi-auth-cloudflare-gateway-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply auth hydration guard and permanent regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/login.tsx')
          text = path.read_text()

          replacements = [
            (
              'import { useRef, useState, type FormEvent, type ReactNode } from "react";',
              'import { useEffect, useRef, useState, type FormEvent, type ReactNode } from "react";',
            ),
            (
              'function GoogleButton({ returnTo }: { returnTo: string }) {',
              'function GoogleButton({ returnTo, interactive }: { returnTo: string; interactive: boolean }) {',
            ),
            (
              'disabled={loading || auth.status === "authUnavailable"}',
              'disabled={!interactive || loading || auth.status === "authUnavailable"}',
            ),
            (
              '  const submitInFlightRef = useRef(false);\n',
              '  const submitInFlightRef = useRef(false);\n  const [interactive, setInteractive] = useState(false);\n\n  useEffect(() => {\n    setInteractive(true);\n  }, []);\n',
            ),
            (
              '                aria-busy={submitting}\n              >\n',
              '                aria-busy={submitting}\n                data-interactive={interactive ? "true" : "false"}\n              >\n                <fieldset disabled={!interactive} className="contents">\n',
            ),
            (
              '                )}\n              </form>',
              '                )}\n                </fieldset>\n              </form>',
            ),
            (
              '<GoogleButton returnTo={returnTo} />',
              '<GoogleButton returnTo={returnTo} interactive={interactive} />',
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Auth stability patch anchor missing: {old[:100]}')
            text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path('scripts/saudi-auth-stability.test.mjs')
          test_path.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { readFile } from "node:fs/promises";\n\ntest("Saudi gateway proxies both public and authenticated API namespaces", async () => {\n  const server = await readFile("src/server-cloudflare.ts", "utf8");\n  assert.match(server, /pathname === "\\/v1"/);\n  assert.match(server, /pathname\\.startsWith\\("\\/v1\\/"\\)/);\n  assert.match(server, /pathname === "\\/api"/);\n  assert.match(server, /pathname\\.startsWith\\("\\/api\\/"\\)/);\n});\n\ntest("Saudi auth controls stay disabled until React hydration", async () => {\n  const login = await readFile("src/routes/login.tsx", "utf8");\n  assert.match(login, /const \\[interactive, setInteractive\\] = useState\\(false\\)/);\n  assert.match(login, /useEffect\\(\\(\\) => \\{\\s*setInteractive\\(true\\)/);\n  assert.match(login, /<fieldset disabled=\\{!interactive\\} className="contents">/);\n  assert.match(login, /disabled=\\{!interactive \\|\\| loading \\|\\| auth\\.status === "authUnavailable"\\}/);\n  assert.match(login, /<GoogleButton returnTo=\\{returnTo\\} interactive=\\{interactive\\} \\/>/);\n});\n''')

          Path('.github/workflows/patch-saudi-auth-stability.yml').unlink()
          PY

      - name: Validate auth stability change
        run: |
          npm ci
          node --test scripts/saudi-first-load-api-gateway.test.mjs scripts/saudi-auth-stability.test.mjs
          npm run typecheck
          npm run build

      - name: Commit permanent auth stability fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/login.tsx src/server-cloudflare.ts scripts/saudi-first-load-api-gateway.test.mjs scripts/saudi-auth-stability.test.mjs .github/workflows/patch-saudi-auth-stability.yml
          git commit -m "fix(saudi): stabilize Firebase and Cloudflare auth"
          git push origin HEAD:${{ github.head_ref }}
