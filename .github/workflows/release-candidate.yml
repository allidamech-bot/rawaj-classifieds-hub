name: Release Candidate

on:
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ inputs.expected_commit_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Verify candidate identity
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_COMMIT_SHA"
          test "${#EXPECTED_COMMIT_SHA}" -eq 40

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full repository quality gate
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee rc-quality-gate.log

      - name: Enforce built asset budgets
        run: npm run performance:budget

      - name: Install cross-browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser release journeys
        run: npm run test:release:browsers

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Assemble Android debug candidate
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run authenticated Production acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_production_acceptance }}
        env:
          E2E_BASE_URL: https://rawa-j.com
          PRODUCTION_ACCEPTANCE: "1"
          RAWAJ_ACCEPTANCE_EMAIL: ${{ secrets.RAWAJ_ACCEPTANCE_EMAIL }}
          RAWAJ_ACCEPTANCE_PASSWORD: ${{ secrets.RAWAJ_ACCEPTANCE_PASSWORD }}
        run: npx playwright test e2e/production-acceptance.spec.ts --project=mobile-chromium

      - name: Generate release candidate manifest
        env:
          PRODUCTION_ACCEPTANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_production_acceptance && '1' || '0' }}
        run: npm run release:manifest

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-rc-${{ inputs.expected_commit_sha || github.sha }}
          path: |
            .output/public
            android/app/build/outputs/apk/debug/app-debug.apk
            release-candidate-manifest.json
            playwright-report
          if-no-files-found: error
          retention-days: 30

      - name: Upload release diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-rc-diagnostics-${{ inputs.expected_commit_sha || github.sha }}
          path: |
            rc-quality-gate.log
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish release candidate evidence
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PRODUCTION_ACCEPTANCE_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_production_acceptance && 'executed' || 'external run still required' }}
        shell: bash
        run: |
          title="RAWAJ Release Candidate Status"
          {
            echo "## Latest RAWAJ Release Candidate evidence"
            echo
            echo "- Commit: ${EXPECTED_COMMIT_SHA}"
            echo "- Result: **${JOB_STATUS}**"
            echo "- Updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Web, browser, Android, and manifest artifacts are attached to the workflow run when the result is successful."
            echo "- Authenticated Production Acceptance: ${PRODUCTION_ACCEPTANCE_STATUS}"
            echo "- Physical Android device, release signing, Play Console, real App Links certificate fingerprint, and Firebase and Cloudflare production-console evidence remain external gates."
            echo
            echo "This issue is intentionally reused for every candidate. Historical evidence remains in GitHub Actions runs and artifacts."
            if [ -f rc-quality-gate.log ]; then
              echo
              echo "### Quality-gate diagnostic tail"
              echo
              tail -n 80 rc-quality-gate.log | sed 's/^/    /'
            fi
          } > rc-evidence.md

          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search '"RAWAJ Release Candidate Status" in:title' \
              --json number,title \
              --jq '.[] | select(.title == "RAWAJ Release Candidate Status") | .number' \
              | head -n 1
          )"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file rc-evidence.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file rc-evidence.md
          fi
