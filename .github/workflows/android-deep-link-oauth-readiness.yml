name: Android Deep Link and OAuth Readiness

on:
  pull_request:
    paths:
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/src/main/java/com/rawaj/marketplace/MainActivity.java"
      - "android/app/src/main/res/values/strings.xml"
      - "src/lib/auth.tsx"
      - "scripts/android-deep-link-oauth-readiness.test.mjs"
      - ".github/workflows/android-deep-link-oauth-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Android deep link and OAuth contract
        run: node --test scripts/android-deep-link-oauth-readiness.test.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Synchronize Capacitor Android project
        run: npx cap sync android
      - name: Android unit tests and debug build
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest assembleDebug --stacktrace --console=plain > gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 180 gradle-build.log
            exit "$status"
          fi
          tail -n 80 gradle-build.log
      - name: Upload Android build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-failure-log
          path: android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 3
