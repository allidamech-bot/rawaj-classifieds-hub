name: Temporary Phase 18 Registration Patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-phase-18-registration-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch registration callback integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/login.tsx')
          text = path.read_text()
          text = text.replace(
              '    event.preventDefault();\n    setMessage("");',
              '    event.preventDefault();\n    if (submitting) return;\n    setMessage("");',
              1,
          )
          text = text.replace(
              '    setSubmitting(true);\n    const result =',
              '    const signupCallbackUrl = new URL("/auth/callback", window.location.origin);\n    signupCallbackUrl.searchParams.set("returnTo", returnTo);\n\n    setSubmitting(true);\n    const result =',
              1,
          )
          text = text.replace(
              '            options: { data: { display_name: cleanName } },',
              '            options: {\n              emailRedirectTo: signupCallbackUrl.toString(),\n              data: { display_name: cleanName },\n            },',
              1,
          )
          path.write_text(text)
          PY
          npx prettier --write src/routes/login.tsx scripts/registration-production-gate.test.mjs .github/workflows/registration-production-gate.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/login.tsx scripts/registration-production-gate.test.mjs .github/workflows/registration-production-gate.yml
          git diff --cached --quiet || git commit -m "fix: harden registration confirmation callback"
          git push origin HEAD:${{ github.head_ref }}
