name: Temporary Reservation Contract Formatter

on:
  push:
    branches:
      - design/adaptive-listing-cards-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/adaptive-listing-cards-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format reservation contract
        run: npx prettier --write scripts/listing-reservation.test.mjs

      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-reservation-test-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format reservation contract"
          git push origin HEAD:design/adaptive-listing-cards-v1
