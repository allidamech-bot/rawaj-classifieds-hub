name: Apply Chat Image Attachments V1

on:
  push:
    branches: [feature/chat-image-attachments-v1]
    paths:
      - "scripts/apply-chat-image-attachments-v1.mjs"
      - ".github/workflows/apply-chat-image-attachments-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-image-attachments-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-chat-image-attachments-v1.mjs
      - run: npx prettier --write src/routes/chats.tsx src/lib/api/messaging.ts src/lib/classifieds-types.ts docs/production-schema/migration-ledger.json .github/workflows/quality-gate.yml
      - run: |
          rm scripts/apply-chat-image-attachments-v1.mjs
          rm .github/workflows/apply-chat-image-attachments-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate private chat image attachments"
          git push
