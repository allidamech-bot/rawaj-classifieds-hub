name: Campaign Manager Typecheck Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'feature/campaign-manager' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-manager
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture typecheck output
        shell: bash
        run: npm run typecheck -- --pretty false > campaign-typecheck-output.txt 2>&1 || true
      - name: Remove workflow and commit diagnostics
        shell: bash
        run: |
          rm .github/workflows/campaign-typecheck-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaign-typecheck-output.txt .github/workflows/campaign-typecheck-diagnostics.yml
          git commit -m "Capture campaign manager typecheck diagnostics"
          git push origin HEAD:feature/campaign-manager
