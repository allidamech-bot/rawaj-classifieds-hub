name: Temporary Phase 16 Formatter

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/admin.tsx"
      - "src/routes/auth.callback.tsx"
      - "src/routes/reset-password.tsx"
      - "src/lib/auth-recovery-session.ts"
      - "scripts/auth-recovery.test.mjs"
      - ".github/workflows/tmp-phase16-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 16 files
        run: >-
          npx prettier --write
          src/routes/admin.tsx
          src/routes/auth.callback.tsx
          src/routes/reset-password.tsx
          src/lib/auth-recovery-session.ts
          scripts/auth-recovery.test.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx src/routes/auth.callback.tsx src/routes/reset-password.tsx src/lib/auth-recovery-session.ts scripts/auth-recovery.test.mjs
          git commit -m "style: format Phase 16 files"
          git push
