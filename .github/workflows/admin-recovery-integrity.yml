name: Admin & Recovery Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/admin.tsx"
      - "src/routes/auth.callback.tsx"
      - "src/routes/reset-password.tsx"
      - "src/lib/auth-recovery-session.ts"
      - "scripts/auth-recovery.test.mjs"
      - ".github/workflows/admin-recovery-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-16-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Phase 16 changes
        run: >-
          npx eslint --quiet
          src/routes/admin.tsx
          src/routes/auth.callback.tsx
          src/routes/reset-password.tsx
          src/lib/auth-recovery-session.ts
          scripts/auth-recovery.test.mjs

      - name: Authentication recovery and admin boundary contract
        run: npm run test:auth-recovery

      - name: Typecheck
        run: npm run typecheck -- --pretty false
