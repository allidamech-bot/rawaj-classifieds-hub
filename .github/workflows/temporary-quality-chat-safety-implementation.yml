name: Temporary quality and chat safety implementation

on:
  push:
    branches:
      - feature/listing-quality-chat-safety-v1

permissions:
  contents: write

concurrency:
  group: temporary-quality-chat-safety-implementation
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/listing-quality-chat-safety-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded implementation
        run: node scripts/apply-listing-quality-chat-safety-v1.mjs

      - name: Format changed files
        run: |
          npx prettier --write \
            src/lib/listing-quality.ts \
            src/lib/message-safety.ts \
            src/routes/add-listing.tsx \
            'src/routes/profile/listings.$id.tsx' \
            src/routes/chats.tsx \
            scripts/listing-quality-chat-safety-v1.test.mjs \
            package.json \
            .github/workflows/quality-gate.yml
          npx eslint --fix \
            src/lib/listing-quality.ts \
            src/lib/message-safety.ts \
            src/routes/add-listing.tsx \
            'src/routes/profile/listings.$id.tsx' \
            src/routes/chats.tsx \
            scripts/listing-quality-chat-safety-v1.test.mjs

      - name: Validate focused contracts
        run: |
          npm run test:listing-quality-chat-safety
          npm run typecheck -- --pretty false

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/listing-quality.ts \
            src/lib/message-safety.ts \
            src/routes/add-listing.tsx \
            'src/routes/profile/listings.$id.tsx' \
            src/routes/chats.tsx \
            scripts/listing-quality-chat-safety-v1.test.mjs \
            package.json \
            .github/workflows/quality-gate.yml
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat: add listing quality and chat safety V1"
          git push origin HEAD:feature/listing-quality-chat-safety-v1
