name: Temporary quality and chat safety implementation

on:
  push:
    branches:
      - feature/listing-quality-chat-safety-v1

permissions:
  contents: write

concurrency:
  group: temporary-quality-chat-safety-implementation
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/listing-quality-chat-safety-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply, format, and validate with diagnostics
        id: implementation
        shell: bash
        run: |
          set +e
          mkdir -p docs
          : > docs/temp-quality-chat-diagnostic.txt
          {
            echo "== patch =="
            node scripts/apply-listing-quality-chat-safety-v1.mjs
            patch_status=$?
            echo "patch_status=$patch_status"
            if [ "$patch_status" -eq 0 ]; then
              echo "== format =="
              npx prettier --write \
                src/lib/listing-quality.ts \
                src/lib/message-safety.ts \
                src/routes/add-listing.tsx \
                'src/routes/profile/listings.$id.tsx' \
                src/routes/chats.tsx \
                scripts/listing-quality-chat-safety-v1.test.mjs \
                package.json \
                .github/workflows/quality-gate.yml
              format_status=$?
              echo "format_status=$format_status"

              echo "== lint =="
              npx eslint --fix \
                src/lib/listing-quality.ts \
                src/lib/message-safety.ts \
                src/routes/add-listing.tsx \
                'src/routes/profile/listings.$id.tsx' \
                src/routes/chats.tsx \
                scripts/listing-quality-chat-safety-v1.test.mjs
              lint_status=$?
              echo "lint_status=$lint_status"

              echo "== focused test =="
              npm run test:listing-quality-chat-safety
              test_status=$?
              echo "test_status=$test_status"

              echo "== typecheck =="
              npm run typecheck -- --pretty false
              typecheck_status=$?
              echo "typecheck_status=$typecheck_status"
            else
              format_status=99
              lint_status=99
              test_status=99
              typecheck_status=99
            fi
            echo "final_statuses=$patch_status,$format_status,$lint_status,$test_status,$typecheck_status"
          } 2>&1 | tee docs/temp-quality-chat-diagnostic.txt
          exit 0

      - name: Commit implementation or diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/listing-quality.ts \
            src/lib/message-safety.ts \
            src/routes/add-listing.tsx \
            'src/routes/profile/listings.$id.tsx' \
            src/routes/chats.tsx \
            scripts/listing-quality-chat-safety-v1.test.mjs \
            package.json \
            .github/workflows/quality-gate.yml \
            docs/temp-quality-chat-diagnostic.txt
          if git diff --cached --quiet; then
            echo "No implementation or diagnostic changes to commit."
            exit 0
          fi
          git commit -m "chore: capture quality and chat safety implementation result"
          git push origin HEAD:feature/listing-quality-chat-safety-v1
