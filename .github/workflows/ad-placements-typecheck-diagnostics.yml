name: Ad Placements Typecheck Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'feature/ad-placements-management' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ad-placements-management
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture typecheck output
        shell: bash
        run: npm run typecheck -- --pretty false > ad-placements-typecheck-output.txt 2>&1 || true

      - name: Remove workflow and commit diagnostics
        shell: bash
        run: |
          rm .github/workflows/ad-placements-typecheck-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ad-placements-typecheck-output.txt .github/workflows/ad-placements-typecheck-diagnostics.yml
          git commit -m "Capture ad placements typecheck diagnostics"
          git push origin HEAD:feature/ad-placements-management
