name: Run Syria owner parity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/syria-match-saudi-owner-listings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/syria-match-saudi-owner-listings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-syria-owner-workspace-parity.py
      - name: Repair progressive-list JSX wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/profile/listings.tsx')
          s = p.read_text()
          old = ') : (\n              <div className="rawaj-storefront-owner-grid">'
          new = ') : (\n              <>\n                <div className="rawaj-storefront-owner-grid">'
          if old not in s:
              raise SystemExit('missing progressive-list opening anchor')
          s = s.replace(old, new, 1)
          old = '                  {text("عرض المزيد", "Load more")} · {visibleListings.length}/{filteredListings.length}\n                </button>\n              ) : null}\n            )}'
          new = '                  {text("عرض المزيد", "Load more")} · {visibleListings.length}/{filteredListings.length}\n                </button>\n              ) : null}\n              </>\n            )}'
          if old not in s:
              raise SystemExit('missing progressive-list closing anchor')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npx prettier --write src/routes/profile/listings.tsx src/features/storefront/OwnerListingsWorkspaceTools.tsx src/features/storefront/OwnerStoreWorkspaceSummary.tsx src/owner-listings-workspace-v9.css src/lib/api/listing-draft-create-guarded.ts src/lib/classifieds-api.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:cloudflare-cutover
      - name: Reject Saudi runtime identity
        run: |
          if grep -RInE 'sa\.rawa-j\.com|rawaj-saudi|SAUDI_|Saudi Arabia|السعودية|\bSAR\b' src/routes/profile/listings.tsx src/features/storefront/OwnerListingsWorkspaceTools.tsx src/features/storefront/OwnerStoreWorkspaceSummary.tsx src/lib/api/listing-draft-create-guarded.ts src/lib/classifieds-api.ts; then
            exit 1
          fi
      - name: Commit result and remove one-shot files
        run: |
          git rm .github/workflows/run-syria-owner-parity.yml scripts/apply-syria-owner-workspace-parity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/profile/listings.tsx src/features/storefront/OwnerListingsWorkspaceTools.tsx src/features/storefront/OwnerStoreWorkspaceSummary.tsx src/owner-listings-workspace-v9.css src/lib/api/listing-draft-create-guarded.ts src/lib/classifieds-api.ts
          git commit -m "feat(syria): match scalable Saudi owner workspace"
          git push origin HEAD:feat/syria-match-saudi-owner-listings
