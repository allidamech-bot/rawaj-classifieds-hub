name: Integrate Edit Listing Dynamic Once

on:
  push:
    branches:
      - feature/taxonomy-search-foundation-v1
    paths:
      - ".github/workflows/integrate-edit-listing-dynamic-once.yml"
      - "scripts/integrate-edit-listing-dynamic-all-categories-v1.py"

permissions:
  contents: write

concurrency:
  group: integrate-edit-listing-dynamic-once
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align strict transformation markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/integrate-edit-listing-dynamic-all-categories-v1.py")
          source = path.read_text(encoding="utf-8")

          old_helper = '''def replace_once(label: str, old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, found {count}")
              source = source.replace(old, new, 1)
          '''
          new_helper = '''def replace_once(label: str, old: str, new: str) -> None:
              global source
              expected_count = 2 if label == "save loading guard" else 1
              count = source.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f"{label}: expected {expected_count} marker(s), found {count}"
                  )
              source = source.replace(old, new, 1)
          '''
          if old_helper not in source:
              raise SystemExit("Transformer helper marker missing")
          source = source.replace(old_helper, new_helper, 1)

          old_ui_marker = '''            <CategorySpecificFields
              kind={categoryFieldKind}
              values={categoryDetails}
              disabled={!isEditable}
              text={text}
              onChange={(nextDetails) => {
                setCategoryDetails(nextDetails);
                if (categoryFieldKind === "vehicles" || categoryFieldKind === "electronics") {
                  setCondition(categoryDetailsGlobalCondition(categoryFieldKind, nextDetails));
                }
              }}
            />
'''
          actual_ui_marker = '''            <CategorySpecificFields
              kind={categoryFieldKind}
              values={categoryDetails}
              disabled={!isEditable}
              onChange={setCategoryDetails}
              text={text}
            />
'''
          if old_ui_marker not in source:
              raise SystemExit("Transformer UI search marker missing")
          source = source.replace(old_ui_marker, actual_ui_marker, 1)

          old_condition_marker = '''function readDetailString(details: Record<string, unknown>, key: string) {
'''
          actual_condition_marker = '''function safeDetailString(details: Record<string, unknown>, key: string) {
'''
          if old_condition_marker not in source:
              raise SystemExit("Transformer condition-helper search marker missing")
          source = source.replace(old_condition_marker, actual_condition_marker, 1)

          path.write_text(source, encoding="utf-8")
          PY
      - name: Integrate governed fields into listing edit
        run: python scripts/integrate-edit-listing-dynamic-all-categories-v1.py
      - name: Format integrated route
        run: npx prettier --write 'src/routes/profile/listings.$id.tsx'
      - name: Verify integrated route markers
        shell: bash
        run: |
          grep -q 'fetchOwnerListingAttributes' 'src/routes/profile/listings.$id.tsx'
          grep -q '<DynamicListingFields' 'src/routes/profile/listings.$id.tsx'
          grep -q 'replaceOwnerListingAttributes' 'src/routes/profile/listings.$id.tsx'
          grep -q 'validateDynamicListingFields' 'src/routes/profile/listings.$id.tsx'
          grep -q 'dynamicSchemaUsesListingCondition' 'src/routes/profile/listings.$id.tsx'
      - name: Remove one-shot integration tooling
        run: |
          rm .github/workflows/integrate-edit-listing-dynamic-once.yml
          rm scripts/integrate-edit-listing-dynamic-all-categories-v1.py
      - name: Commit integrated route and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate dynamic editing across all categories"
          git push origin HEAD:feature/taxonomy-search-foundation-v1
