name: Integrate Add Listing Dynamic Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/integrate-add-listing-dynamic-once.yml"
      - "scripts/integrate-add-listing-dynamic-all-categories-v1.mjs"

permissions:
  contents: write

concurrency:
  group: integrate-add-listing-dynamic-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair transformation source quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/integrate-add-listing-dynamic-all-categories-v1.mjs")
          source = path.read_text(encoding="utf-8")
          replacements = {
              '              `تم حفظ الإعلان كمسودة، لكن تعذر حفظ حقول التصنيف: ${attributeResult.error.message}`,':
                  '              "تم حفظ الإعلان كمسودة، لكن تعذر حفظ حقول التصنيف: " + attributeResult.error.message,',
              '              `The listing was saved as a draft, but category fields could not be saved: ${attributeResult.error.message}`,':
                  '              "The listing was saved as a draft, but category fields could not be saved: " + attributeResult.error.message,',
              '              `تم حفظ الإعلان كمسودة. أكمل الحقول المطلوبة قبل الإرسال: ${missingLabels}`,':
                  '              "تم حفظ الإعلان كمسودة. أكمل الحقول المطلوبة قبل الإرسال: " + missingLabels,',
              '              `The listing was saved as a draft. Complete the required fields before submission: ${missingLabels}`,':
                  '              "The listing was saved as a draft. Complete the required fields before submission: " + missingLabels,',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Missing quote repair marker: {old}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY
      - name: Integrate governed fields for every category leaf
        id: integrate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/integrate-add-listing-dynamic-all-categories-v1.mjs 2>&1 | tee "$RUNNER_TEMP/rawaj-dynamic-integration.log"
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-integration-${{ github.sha }}
          path: ${{ runner.temp }}/rawaj-dynamic-integration.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when integration failed
        if: steps.integrate.outcome == 'failure'
        run: exit 1
      - name: Format integrated route
        run: npx prettier --write src/routes/add-listing.tsx
      - name: Commit integrated route
        shell: bash
        run: |
          if git diff --quiet -- src/routes/add-listing.tsx; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/add-listing.tsx
          git commit -m "feat: integrate dynamic listing fields across all categories"
          git push origin HEAD:feature/taxonomy-search-foundation-v1
