name: Integrate Add Listing Dynamic Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/integrate-add-listing-dynamic-once.yml"
      - "scripts/integrate-add-listing-dynamic-all-categories-v1.mjs"

permissions:
  contents: write

concurrency:
  group: integrate-add-listing-dynamic-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taxonomy-search-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate governed fields for every category leaf
        id: integrate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/integrate-add-listing-dynamic-all-categories-v1.mjs 2>&1 | tee "$RUNNER_TEMP/rawaj-dynamic-integration.log"
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-integration-${{ github.sha }}
          path: ${{ runner.temp }}/rawaj-dynamic-integration.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when integration failed
        if: steps.integrate.outcome == 'failure'
        run: exit 1
      - name: Format integrated route
        run: npx prettier --write src/routes/add-listing.tsx
      - name: Commit integrated route
        shell: bash
        run: |
          if git diff --quiet -- src/routes/add-listing.tsx; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/add-listing.tsx
          git commit -m "feat: integrate dynamic listing fields across all categories"
          git push origin HEAD:feature/taxonomy-search-foundation-v1
