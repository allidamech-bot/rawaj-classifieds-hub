name: Account Profile Verification Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/features/account/**"
      - "src/lib/api/account-*.ts"
      - "src/lib/api/profile.ts"
      - "src/lib/api/seller.ts"
      - "src/lib/api/storage.ts"
      - "src/lib/api/support*.ts"
      - "src/lib/api/verification.ts"
      - "src/lib/auth*.ts*"
      - "src/lib/classifieds-types.ts"
      - "src/lib/profile-dto.ts"
      - "src/routes/admin.verifications.tsx"
      - "src/routes/auth.callback.tsx"
      - "src/routes/login.tsx"
      - "src/routes/profile.tsx"
      - "src/routes/reset-password.tsx"
      - "src/routes/verification.tsx"
      - "supabase/migrations/**account*profile*verification*"
      - "scripts/account-profile-verification-integrity.test.mjs"
      - ".github/workflows/account-profile-verification-integrity.yml"
      - ".github/workflows/quality-gate.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Account, Profile & Verification Integrity contract
        run: npm run test:account-profile-verification

      - name: Typecheck
        run: npm run typecheck -- --pretty false
