name: Patch Saudi auth gate profile contract

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: patch-saudi-auth-gate-profile-contract-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'fix/saudi-auth-gate-profile-contract-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align production gate with profile API contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          journey = Path('scripts/saudi-firebase-cloudflare-production-e2e.mjs')
          text = journey.read_text()
          old = 'preferredContactMethod: "messages",'
          new = 'preferredContactMethod: "chat",'
          if text.count(old) != 1:
            raise SystemExit('Expected one outdated profile contact value')
          journey.write_text(text.replace(old, new, 1))

          test = Path('scripts/saudi-production-auth-gate.test.mjs')
          text = test.read_text()
          anchor = '  assert.match(script, /Firebase browser session did not persist/);\n'
          addition = (
            anchor
            + '  assert.match(script, /preferredContactMethod: "chat"/);\n'
            + '  assert.doesNotMatch(script, /preferredContactMethod: "messages"/);\n'
          )
          if anchor not in text:
            raise SystemExit('Auth gate test anchor missing')
          test.write_text(text.replace(anchor, addition, 1))

          Path('.github/workflows/patch-saudi-auth-gate-profile-contract.yml').unlink()
          PY

      - name: Validate corrected production gate
        run: |
          npm ci --ignore-scripts
          npx prettier --check scripts/saudi-firebase-cloudflare-production-e2e.mjs scripts/saudi-production-auth-gate.test.mjs
          node --check scripts/saudi-firebase-cloudflare-production-e2e.mjs
          node --test scripts/saudi-production-auth-gate.test.mjs

      - name: Commit corrected permanent gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/saudi-firebase-cloudflare-production-e2e.mjs scripts/saudi-production-auth-gate.test.mjs .github/workflows/patch-saudi-auth-gate-profile-contract.yml
          git commit -m "test(saudi): align auth gate with profile contract"
          git push origin HEAD:${{ github.head_ref }}
