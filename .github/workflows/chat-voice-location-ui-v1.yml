name: Chat Voice and Location UI V1

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/chats.tsx"
      - "src/lib/api/messaging.ts"
      - "src/lib/classifieds-types.ts"
      - "src/features/communication/ChatVoiceRecorder.tsx"
      - "src/features/communication/ChatVoiceAttachment.tsx"
      - "scripts/chat-voice-location-ui-v1.test.mjs"
      - ".github/workflows/chat-voice-location-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Voice and location UI contract
        run: node --test scripts/chat-voice-location-ui-v1.test.mjs
      - name: Lint changed sources
        run: npx eslint src/routes/chats.tsx src/lib/api/messaging.ts src/lib/classifieds-types.ts src/features/communication/ChatVoiceRecorder.tsx src/features/communication/ChatVoiceAttachment.tsx
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1
      - name: Upload typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: chat-voice-location-typecheck-log
          path: typecheck.log
      - name: Stop on typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: cat typecheck.log && exit 1
