name: Apply Chat Image Chunk Consolidation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-chat-image-chunk-consolidation.mjs"
      - ".github/workflows/apply-chat-image-chunk-consolidation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-image-attachments-ui-v1
          fetch-depth: 1
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-chat-image-chunk-consolidation.mjs
      - run: npx prettier --write src/lib/api/messaging.ts src/lib/api/messaging-guarded.ts .github/workflows/chat-image-attachments-ui-v1.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: consolidate chat image attachment module"
          git push origin HEAD:feature/chat-image-attachments-ui-v1
