name: Staging Write Acceptance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Main-branch commit to test against the dedicated RAWAJ staging database
        required: true
        default: main
        type: string

concurrency:
  group: staging-write-acceptance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  write-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: rawaj-staging
    env:
      RAWAJ_STAGING_WRITE_ACCEPTANCE: "1"
      RAWAJ_STAGING_PROJECT_REF: ${{ secrets.RAWAJ_STAGING_PROJECT_REF }}
      RAWAJ_PRODUCTION_PROJECT_REF: ${{ secrets.RAWAJ_PRODUCTION_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ secrets.RAWAJ_STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.RAWAJ_STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RAWAJ_STAGING_SERVICE_ROLE_KEY }}
      RAWAJ_STAGING_USER_A_EMAIL: ${{ secrets.RAWAJ_STAGING_USER_A_EMAIL }}
      RAWAJ_STAGING_USER_A_PASSWORD: ${{ secrets.RAWAJ_STAGING_USER_A_PASSWORD }}
      RAWAJ_STAGING_USER_B_EMAIL: ${{ secrets.RAWAJ_STAGING_USER_B_EMAIL }}
      RAWAJ_STAGING_USER_B_PASSWORD: ${{ secrets.RAWAJ_STAGING_USER_B_PASSWORD }}
      RAWAJ_STAGING_USER_C_EMAIL: ${{ secrets.RAWAJ_STAGING_USER_C_EMAIL }}
      RAWAJ_STAGING_USER_C_PASSWORD: ${{ secrets.RAWAJ_STAGING_USER_C_PASSWORD }}
      RAWAJ_STAGING_MODERATOR_EMAIL: ${{ secrets.RAWAJ_STAGING_MODERATOR_EMAIL }}
      RAWAJ_STAGING_MODERATOR_PASSWORD: ${{ secrets.RAWAJ_STAGING_MODERATOR_PASSWORD }}

    steps:
      - name: Checkout trusted main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate requested release commit
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          git fetch --no-tags origin main
          target_sha="$(git rev-parse --verify "${REQUESTED_REF}^{commit}")"

          if ! git merge-base --is-ancestor "$target_sha" origin/main; then
            echo "Requested ref must resolve to a commit already contained in main." >&2
            exit 1
          fi

          echo "RAWAJ_ACCEPTANCE_TARGET_SHA=$target_sha" >> "$GITHUB_ENV"

      - name: Checkout validated release commit
        run: git checkout --detach "$RAWAJ_ACCEPTANCE_TARGET_SHA"

      - name: Validate staging-only environment
        shell: bash
        run: |
          required=(
            RAWAJ_STAGING_PROJECT_REF
            RAWAJ_PRODUCTION_PROJECT_REF
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            RAWAJ_STAGING_USER_A_EMAIL
            RAWAJ_STAGING_USER_A_PASSWORD
            RAWAJ_STAGING_USER_B_EMAIL
            RAWAJ_STAGING_USER_B_PASSWORD
            RAWAJ_STAGING_USER_C_EMAIL
            RAWAJ_STAGING_USER_C_PASSWORD
            RAWAJ_STAGING_MODERATOR_EMAIL
            RAWAJ_STAGING_MODERATOR_PASSWORD
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required staging secret: $name" >&2
              exit 1
            fi
          done

          if [ "$RAWAJ_STAGING_PROJECT_REF" = "$RAWAJ_PRODUCTION_PROJECT_REF" ]; then
            echo "The staging project ref must not match RAWAJ Production." >&2
            exit 1
          fi

          expected_host="https://${RAWAJ_STAGING_PROJECT_REF}.supabase.co"
          if [ "$VITE_SUPABASE_URL" != "$expected_host" ]; then
            echo "RAWAJ_STAGING_SUPABASE_URL must exactly match the dedicated staging project ref." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run destructive staging journeys against local application build
        run: >-
          npx playwright test e2e/staging-write-acceptance.spec.ts
          --project=mobile-chromium --workers=1

      - name: Upload staging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-write-acceptance-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
