name: Temporary Spatial Shell Formatter

on:
  push:
    branches:
      - design/spatial-app-shell-v1

permissions:
  contents: write

concurrency:
  group: spatial-shell-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/spatial-app-shell-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Spatial App Shell files
        run: >-
          npx prettier --write
          .github/workflows/quality-gate.yml
          scripts/spatial-app-shell.test.mjs
          src/components/AppHeader.tsx
          src/components/BottomNav.tsx
          src/components/shell/AppShell.tsx
          src/components/shell/BottomDock.tsx
          src/components/shell/FloatingHeader.tsx
          src/components/shell/spatial-primitives.tsx
          src/lib/primary-navigation.ts
          src/routes/__root.tsx
          src/spatial-app-shell.css

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality-gate.yml scripts/spatial-app-shell.test.mjs src
          git commit -m "Format Spatial App Shell"
          git push origin HEAD:design/spatial-app-shell-v1
