name: Finalize SYP Denomination Phase A

on:
  pull_request:
    types: [synchronize]
    branches:
      - main
    paths:
      - ".github/workflows/finalize-syp-denomination-phase-a.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch agent/syp-denomination-phase-a \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply final hardening
        working-directory: repo
        run: python scripts/.finalize-syp-phase-a.py

      - name: Install dependencies
        working-directory: repo
        run: npm ci --silent

      - name: Format changed source and contracts
        working-directory: repo
        run: |
          npx prettier --write \
            src/routes/admin.pending.tsx \
            scripts/syp-denomination-phase-a.test.mjs >/dev/null

      - name: Verify Phase A contracts
        working-directory: repo
        run: node --test scripts/syp-denomination-phase-a.test.mjs

      - name: Verify TypeScript
        working-directory: repo
        run: npm run typecheck

      - name: Verify production build
        working-directory: repo
        run: npm run build

      - name: Verify generated diff
        working-directory: repo
        run: git diff --check

      - name: Remove one-shot finalizer
        working-directory: repo
        run: |
          rm -f scripts/.finalize-syp-phase-a.py
          rm -f .github/workflows/finalize-syp-denomination-phase-a.yml

      - name: Commit final Phase A hardening
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden final SYP denomination Phase A boundaries"
          git push origin HEAD:agent/syp-denomination-phase-a
