name: Diagnose Saudi Web Runtime

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-saudi-web-runtime.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://rawaj-saudi-web.allidamech.workers.dev
      API_URL: https://rawaj-saudi-classifieds.allidamech.workers.dev
    steps:
      - name: Compare frontend binding with direct API
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          timeout 30s npx --yes wrangler@4.118.0 tail rawaj-saudi-web --format json \
            >/tmp/rawaj-saudi-web-tail.jsonl 2>/tmp/rawaj-saudi-web-tail.stderr &
          web_tail_pid=$!
          timeout 30s npx --yes wrangler@4.118.0 tail rawaj-saudi-classifieds --format json \
            >/tmp/rawaj-saudi-api-tail.jsonl 2>/tmp/rawaj-saudi-api-tail.stderr &
          api_tail_pid=$!
          sleep 8

          probe() {
            local label="$1"
            local url="$2"
            local safe_name
            safe_name=$(printf '%s' "$label" | tr -cd '[:alnum:]_-')
            local status
            status=$(curl --silent --show-error \
              --output "/tmp/body-${safe_name}.txt" \
              --dump-header "/tmp/headers-${safe_name}.txt" \
              --write-out '%{http_code}' "$url" || true)
            echo "===== $label HTTP $status ====="
            cat "/tmp/headers-${safe_name}.txt" || true
            head -c 4000 "/tmp/body-${safe_name}.txt" || true
            echo
          }

          probe "frontend-root" "$SITE_URL/"
          probe "frontend-health" "$SITE_URL/v1/health"
          probe "frontend-references" "$SITE_URL/v1/references"
          probe "direct-health" "$API_URL/v1/health"
          probe "direct-references" "$API_URL/v1/references"

          wait "$web_tail_pid" || true
          wait "$api_tail_pid" || true

          echo "===== frontend tail stderr ====="
          cat /tmp/rawaj-saudi-web-tail.stderr || true
          echo "===== frontend tail events ====="
          cat /tmp/rawaj-saudi-web-tail.jsonl || true
          echo "===== API tail stderr ====="
          cat /tmp/rawaj-saudi-api-tail.stderr || true
          echo "===== API tail events ====="
          cat /tmp/rawaj-saudi-api-tail.jsonl || true
