name: Diagnose Saudi Web Runtime

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-saudi-web-runtime.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SITE_URL: https://rawaj-saudi-web.allidamech.workers.dev
      API_URL: https://rawaj-saudi-classifieds.allidamech.workers.dev
    steps:
      - name: Diagnose page content API counts and CORS
        shell: bash
        run: |
          set -euo pipefail

          request() {
            local label="$1"
            local url="$2"
            shift 2
            local status
            status=$(curl --silent --show-error \
              --output "/tmp/${label}.body" \
              --dump-header "/tmp/${label}.headers" \
              --write-out '%{http_code}' \
              "$@" "$url" || true)
            echo "===== $label HTTP $status ====="
            cat "/tmp/${label}.headers"
            echo "BODY_PREFIX:"
            head -c 1000 "/tmp/${label}.body" || true
            echo
          }

          request home "$SITE_URL/"
          request login "$SITE_URL/login"
          request add_listing "$SITE_URL/add-listing"
          request health "$API_URL/v1/health"
          request references "$API_URL/v1/references"
          request cors_get "$API_URL/v1/health" -H "Origin: $SITE_URL"
          request cors_options "$API_URL/v1/profile" \
            -X OPTIONS \
            -H "Origin: $SITE_URL" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: Authorization, Content-Type"

          echo "===== verification predicates ====="
          for spec in \
            "home:سوق إعلانات مبوبة في السعودية" \
            "login:تسجيل الدخول" \
            "add_listing:أضف إعلان"; do
            file=${spec%%:*}
            text=${spec#*:}
            if grep -q "$text" "/tmp/${file}.body"; then
              echo "PASS text $file: $text"
            else
              echo "FAIL text $file: $text"
            fi
          done

          echo "CORS GET allow-origin lines:"
          grep -i '^access-control-allow-origin:' /tmp/cors_get.headers || true
          echo "CORS OPTIONS allow-origin lines:"
          grep -i '^access-control-allow-origin:' /tmp/cors_options.headers || true

          node <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("/tmp/health.body", "utf8"));
          const refs = JSON.parse(fs.readFileSync("/tmp/references.body", "utf8"));
          console.log(JSON.stringify({
            health: health.data,
            categories: refs.data?.categories?.length,
            governorates: refs.data?.governorates?.length,
          }, null, 2));
          NODE
