name: Diagnose Saudi Web Runtime

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-saudi-web-runtime.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 3751d62381a386332e1b59521eea7db407b6d87d
    steps:
      - name: Monitor final Saudi production journey
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for locate_attempt in $(seq 1 40); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/saudi-finalize-production.yml/runs?branch=main&event=push&per_page=30" > /tmp/runs.json
            run_id=$(node -e 'const p=require("/tmp/runs.json"); const r=(p.workflow_runs||[]).find(x=>x.head_sha===process.env.TARGET_SHA); if(r) process.stdout.write(String(r.id));')
            if [ -n "$run_id" ]; then break; fi
            echo "Waiting for production run registration: $locate_attempt"
            sleep 5
          done
          test -n "$run_id"
          echo "Tracking Saudi production run $run_id"

          for attempt in $(seq 1 140); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/run.json
            status=$(node -e 'const r=require("/tmp/run.json"); process.stdout.write(r.status)')
            conclusion=$(node -e 'const r=require("/tmp/run.json"); process.stdout.write(r.conclusion||"pending")')
            echo "Attempt $attempt: $status/$conclusion"
            if [ "$status" = "completed" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > /tmp/jobs.json
              node -e 'const p=require("/tmp/jobs.json"); for(const j of p.jobs||[]){console.log(`Job ${j.id} ${j.name}: ${j.status}/${j.conclusion||"pending"}`); for(const s of j.steps||[]) console.log(`- ${s.name}: ${s.status}/${s.conclusion||"pending"}`)}'
              if [ "$conclusion" != "success" ]; then
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
                exit 1
              fi
              echo "Saudi production journey completed successfully."
              exit 0
            fi
            sleep 15
          done
          exit 1
