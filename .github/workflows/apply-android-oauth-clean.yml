name: Apply clean Android OAuth port

on:
  pull_request:
    branches:
      - main

concurrency:
  group: android-oauth-clean-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-oauth-clean-1-0-3
          fetch-depth: 0
      - name: Fetch reviewed Android OAuth source branch
        run: git fetch --no-tags origin agent/android-release-readiness-1-0-3
      - name: Port only native and auth files
        run: |
          git checkout origin/agent/android-release-readiness-1-0-3 -- \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/java/com/rawaj/marketplace/RawajNativePlugin.java \
            capacitor.config.ts \
            public/native-error.html \
            src/lib/native-runtime.ts \
            src/components/native/NativeAppRuntime.tsx \
            src/lib/auth.tsx \
            src/lib/supabase.ts \
            src/routes/auth.callback.tsx \
            src/routes/login.tsx
          python .github/android-oauth-clean-patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and validate web/native contract
        run: |
          npx prettier --write \
            capacitor.config.ts \
            src/lib/native-runtime.ts \
            src/components/native/NativeAppRuntime.tsx \
            src/lib/auth.tsx \
            src/lib/supabase.ts \
            src/routes/auth.callback.tsx \
            src/routes/login.tsx \
            scripts/android-oauth-clean.test.mjs \
            package.json
          npx eslint --quiet \
            capacitor.config.ts \
            src/lib/native-runtime.ts \
            src/components/native/NativeAppRuntime.tsx \
            src/lib/auth.tsx \
            src/lib/supabase.ts \
            src/routes/auth.callback.tsx \
            src/routes/login.tsx \
            scripts/android-oauth-clean.test.mjs
          npm run test:android-oauth-clean
          npm run typecheck -- --pretty false
          npm run build
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build native test artifacts
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleRelease --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab
      - name: Commit validated clean port
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/java/com/rawaj/marketplace/MainActivity.java \
            android/app/src/main/java/com/rawaj/marketplace/RawajNativePlugin.java \
            capacitor.config.ts \
            public/native-error.html \
            src/lib/native-runtime.ts \
            src/components/native/NativeAppRuntime.tsx \
            src/lib/auth.tsx \
            src/lib/supabase.ts \
            src/routes/auth.callback.tsx \
            src/routes/login.tsx \
            scripts/android-oauth-clean.test.mjs \
            package.json
          git commit -m 'Port Android OAuth onto current main'
          git push origin HEAD:feature/android-oauth-clean-1-0-3
