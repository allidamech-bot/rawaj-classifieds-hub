name: PR478 Acceptance Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture acceptance diagnostics
        shell: bash
        run: |
          node --test scripts/production-acceptance-contract.test.mjs > pr478-acceptance.log 2>&1 || true
          cat pr478-acceptance.log

      - name: Upload acceptance diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr478-acceptance-${{ github.sha }}
          path: pr478-acceptance.log
          if-no-files-found: error
          retention-days: 1
