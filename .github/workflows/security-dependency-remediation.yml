name: Security Dependency Remediation (isolated branch)

on:
  push:
    branches: [security/20261115-audit-fixes]
    paths:
      - ".github/workflows/security-dependency-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-dependency-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh vulnerable lockfiles without forced breaking upgrades
    if: github.ref == 'refs/heads/security/20261115-audit-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile for verified patched versions
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm ci --no-fund --no-audit
          npm ci --prefix cloudflare/worker --no-fund --no-audit
      - name: Verify patched dependency graph has no high or critical vulnerabilities
        run: |
          npm audit --audit-level=high
          npm audit --prefix cloudflare/worker --audit-level=high
      - name: Commit only dependency manifests and lockfiles to isolated security branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json cloudflare/worker/package.json cloudflare/worker/package-lock.json
          if git diff --cached --quiet; then
            echo "No safe dependency updates were available"
          else
            git commit -m "security: refresh audited Zod, gRPC and minimatch dependency graph"
            git push origin HEAD:security/20261115-audit-fixes
          fi
      - name: Validate application types and production build
        run: |
          npm run typecheck
          npx tsc -p cloudflare/worker/tsconfig.json --noEmit
          npm run build
