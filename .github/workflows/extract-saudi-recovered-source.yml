name: Extract Saudi recovered source

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/extract-saudi-recovered-source.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  extract:
    name: Extract and preserve recovered Saudi source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_PR: "593"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode recovered archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rawaj-saudi-recovered
          base64 --decode ops/rawaj-saudi-cloudflare-bootstrap.tar.gz.b64 \
            > /tmp/rawaj-saudi-recovered.tar.gz
          tar -xzf /tmp/rawaj-saudi-recovered.tar.gz \
            -C /tmp/rawaj-saudi-recovered

      - name: Inventory recovered project
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rawaj-saudi-recovered
          {
            echo "## Recovered Saudi project inventory"
            echo
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Artifact: \`rawaj-saudi-recovered-source\`"
            echo
            echo "### Top-level entries"
            find . -mindepth 1 -maxdepth 2 \
              -not -path '*/node_modules*' \
              -not -path '*/.git*' \
              -printf '%p\n' | sort | head -n 250 | sed 's/^/- `/' | sed 's/$/`/'
          } > /tmp/rawaj-saudi-inventory.md

      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-saudi-recovered-source
          path: /tmp/rawaj-saudi-recovered
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Report extraction
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$REPORT_PR" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/rawaj-saudi-inventory.md
