name: Patch Saudi finalizer first load

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: patch-saudi-finalizer-first-load-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'ci/harden-saudi-finalize-first-load-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Harden Saudi production finalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/saudi-finalize-production.yml')
          text = path.read_text()

          text, count = re.subn(
              r'\n      - name: Extract audited Saudi API package\n.*?(?=\n      - name: Enforce Saudi Worker currency contracts)',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one archived API extraction step, removed {count}')

          text = text.replace('/tmp/rawaj-saudi-api/cloudflare/worker', 'saudi-repo/cloudflare/worker')

          old_currency = '''          mapfile -t files < <(grep -RIl 'SYP' src || true)
          if [ "${#files[@]}" -gt 0 ]; then
            printf '%s\\n' "${files[@]}"
            sed -i 's/SYP/SAR/g' "${files[@]}"
          fi
          if grep -RIn 'SYP' src; then
            echo "Syrian currency remains in Saudi Worker runtime" >&2
            exit 1
          fi
          echo "Saudi Worker runtime is localized to SAR."
'''
          new_currency = '''          if grep -RIn 'SYP' src; then
            echo "Syrian currency remains in Saudi Worker runtime" >&2
            exit 1
          fi
          echo "Current Saudi Worker runtime is localized to SAR."
'''
          if old_currency not in text:
              raise SystemExit('Mutable currency normalization block was not found')
          text = text.replace(old_currency, new_currency, 1)

          old_build = '''          npm ci
          npm run test:runtime-boundary
          npm run typecheck
          npm run build
          grep -R -q "rawaj-saudi-classifieds.allidamech.workers.dev" .output/public .output/server
'''
          new_build = '''          npm ci
          npm run test:runtime-boundary
          node --test scripts/saudi-first-load-api-gateway.test.mjs
          npm run typecheck
          npm run build
          grep -R -q "https://sa.rawa-j.com" .output/public .output/server
'''
          if old_build not in text:
              raise SystemExit('Saudi frontend build block was not found')
          text = text.replace(old_build, new_build, 1)

          old_binding = '''          config.assets = { ...(config.assets || {}), run_worker_first: true };
          delete config.services;
          config.observability = { enabled: true };
'''
          new_binding = '''          config.assets = { ...(config.assets || {}), run_worker_first: true };
          config.services = [{ binding: "SAUDI_API", service: "rawaj-saudi-classifieds" }];
          config.observability = { enabled: true };
          if (config.services?.[0]?.binding !== "SAUDI_API") {
            throw new Error("Saudi API service binding is missing");
          }
'''
          if old_binding not in text:
              raise SystemExit('Service binding deletion block was not found')
          text = text.replace(old_binding, new_binding, 1)

          anchor = '''          if ((refs.data?.governorates?.length || 0) !== 13) throw new Error("Saudi region count mismatch");
          NODE
'''
          addition = anchor + '''
          for origin in "$SITE_URL" "$FINAL_SITE_URL"; do
            cache_bust="finalizer-$(date +%s%N)"
            key="$(echo "$origin" | tr -cd '[:alnum:]')"
            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/?release=$cache_bust" > "/tmp/rawaj-saudi-home-$key.html"
            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/v1/health?release=$cache_bust" > "/tmp/rawaj-saudi-gateway-health-$key.json"
            curl --retry 18 --retry-delay 3 --retry-all-errors --silent --show-error --fail \
              "$origin/v1/references?release=$cache_bust" > "/tmp/rawaj-saudi-gateway-references-$key.json"
            grep -q "سيارات ومركبات" "/tmp/rawaj-saudi-home-$key.html"
            grep -q "عقارات" "/tmp/rawaj-saudi-home-$key.html"
            if grep -q '/_vercel/insights/script.js' "/tmp/rawaj-saudi-home-$key.html"; then
              echo "Vercel Analytics rendered on Cloudflare Saudi origin: $origin" >&2
              exit 1
            fi
            ORIGIN="$origin" KEY="$key" node <<'NODE'
          const fs = require("node:fs");
          const origin = process.env.ORIGIN;
          const key = process.env.KEY;
          const health = JSON.parse(fs.readFileSync(`/tmp/rawaj-saudi-gateway-health-${key}.json`, "utf8"));
          const refs = JSON.parse(fs.readFileSync(`/tmp/rawaj-saudi-gateway-references-${key}.json`, "utf8"));
          if (health.data?.database !== "ready") throw new Error(`Saudi same-origin health failed on ${origin}`);
          if ((refs.data?.categories?.length || 0) !== 12) throw new Error(`Saudi categories failed on ${origin}`);
          if ((refs.data?.taxonomyNodes?.length || 0) !== 117) throw new Error(`Saudi taxonomy failed on ${origin}`);
          if ((refs.data?.governorates?.length || 0) !== 13) throw new Error(`Saudi regions failed on ${origin}`);
          NODE
          done
'''
          if anchor not in text:
              raise SystemExit('Live verification anchor was not found')
          text = text.replace(anchor, addition, 1)

          text = text.replace(
              'Saudi production journey passed on **$SITE_URL** with direct isolated API **$API_URL**:',
              'Saudi production journey passed on **$FINAL_SITE_URL** and **$SITE_URL** with same-origin API gateway and direct API **$API_URL**:',
          )

          path.write_text(text)

          Path('scripts/saudi-finalizer-first-load.test.mjs').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { readFile } from "node:fs/promises";\n\ntest("Saudi finalizer deploys current Saudi API and preserves its service binding", async () => {\n  const workflow = await readFile(".github/workflows/saudi-finalize-production.yml", "utf8");\n  assert.doesNotMatch(workflow, /ops\\/rawaj-saudi-cloudflare-bootstrap/);\n  assert.doesNotMatch(workflow, /delete config\\.services/);\n  assert.match(workflow, /config\\.services = \\[\\{ binding: "SAUDI_API", service: "rawaj-saudi-classifieds" \\}\\]/);\n  assert.match(workflow, /working-directory: saudi-repo\\/cloudflare\\/worker/);\n});\n\ntest("Saudi finalizer blocks first-load regressions on Worker and custom domain", async () => {\n  const workflow = await readFile(".github/workflows/saudi-finalize-production.yml", "utf8");\n  assert.match(workflow, /scripts\\/saudi-first-load-api-gateway\\.test\\.mjs/);\n  assert.match(workflow, /for origin in "\\$SITE_URL" "\\$FINAL_SITE_URL"/);\n  assert.match(workflow, /\\$origin\\/v1\\/references/);\n  assert.match(workflow, /سيارات ومركبات/);\n  assert.match(workflow, /_vercel\\/insights\\/script\\.js/);\n});\n''')

          Path('.github/workflows/patch-saudi-finalize-first-load.yml').unlink()
          PY

      - name: Validate finalizer contract
        run: node --test scripts/saudi-finalizer-first-load.test.mjs

      - name: Commit permanent hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/saudi-finalize-production.yml scripts/saudi-finalizer-first-load.test.mjs .github/workflows/patch-saudi-finalize-first-load.yml
          git commit -m "ci(saudi): preserve first-load API gateway"
          git push origin HEAD:${{ github.head_ref }}
