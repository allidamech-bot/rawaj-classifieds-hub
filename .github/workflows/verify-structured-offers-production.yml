name: Repair And Verify Structured Offers Production

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-structured-offers-production.yml"

permissions:
  contents: read

jobs:
  repair-and-verify-production:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      EXPECTED_RELEASE_SHA: 13f32021ffee5cc9bb40a89521868a31344980be
      RAWAJ_WORKER_EXPECTED_RELEASE_SHA: 13f32021ffee5cc9bb40a89521868a31344980be
      RAWAJ_WORKER_RELEASE_SHA: 13f32021ffee5cc9bb40a89521868a31344980be
      RAWAJ_WORKER_ENVIRONMENT: production
      RAWAJ_WORKER_BASE_URL: https://rawaj-classifieds-hub.allidamech.workers.dev
      E2E_BASE_URL: https://rawa-j.com
      PRODUCTION_ACCEPTANCE: "1"
      RAWAJ_ACCEPTANCE_EMAIL: ${{ secrets.RAWAJ_ACCEPTANCE_EMAIL }}
      RAWAJ_ACCEPTANCE_PASSWORD: ${{ secrets.RAWAJ_ACCEPTANCE_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: d0e6496c-9f63-48d3-beeb-d2e219500f6a
      CLOUDFLARE_D1_DATABASE_NAME: rawaj-staging
      CLOUDFLARE_R2_BUCKET_NAME: rawaj-listing-images-production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/worker/package-lock.json

      - name: Validate exact Production operation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.pull_request.base.sha }}" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "The verification PR base is not the exact published release." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare Production credentials are unavailable." >&2
            exit 1
          fi
          if [[ -z "${RAWAJ_ACCEPTANCE_EMAIL:-}" || -z "${RAWAJ_ACCEPTANCE_PASSWORD:-}" ]]; then
            echo "Production acceptance credentials are unavailable." >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix cloudflare/worker --ignore-scripts

      - name: Revalidate migration and Worker contracts
        run: |
          npm run test:d1-migrations
          npm run test:listing-price-offers
          npx tsc -p cloudflare/worker/tsconfig.json --noEmit

      - name: Render exact Production Worker configuration
        run: npm --prefix cloudflare/worker run render:production

      - name: Apply pending Production D1 migrations
        working-directory: cloudflare/worker
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.generated.jsonc

      - name: Verify Production D1 structured-offer table
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler d1 execute DB --remote --config wrangler.generated.jsonc --command "SELECT name FROM sqlite_schema WHERE type='table' AND name='listing_price_offers';")"
          printf '%s\n' "$output"
          if ! printf '%s' "$output" | grep -Fq "listing_price_offers"; then
            echo "listing_price_offers is missing from Production D1 after migration." >&2
            exit 1
          fi

      - name: Deploy exact reviewed Worker code
        working-directory: cloudflare/worker
        run: npx wrangler deploy --config wrangler.generated.jsonc

      - name: Verify Production Worker release
        run: npm --prefix cloudflare/worker run smoke:production:read-only

      - name: Verify Vercel Production release
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --max-time 30 https://rawa-j.com/)"
          if ! printf '%s' "$html" | grep -Fq "name=\"rawaj-build-commit\" content=\"$EXPECTED_RELEASE_SHA\""; then
            echo "rawa-j.com is not serving the expected release SHA." >&2
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated mobile Production Acceptance
        run: npx playwright test e2e/production-acceptance.spec.ts --project=mobile-chromium --workers=1

      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repair-structured-offers-production-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
