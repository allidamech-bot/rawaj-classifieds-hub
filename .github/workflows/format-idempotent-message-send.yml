name: Format idempotent message send

on:
  push:
    branches:
      - feature/idempotent-message-send
    paths:
      - .github/workflows/format-idempotent-message-send.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/idempotent-message-send
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format implementation files and remove temporary workflow
        shell: bash
        run: |
          npx prettier --write \
            src/lib/api/message-send-request.ts \
            src/lib/api/messaging-guarded.ts \
            src/lib/api/messaging.ts \
            src/routes/chats.tsx \
            scripts/message-send-idempotency.test.mjs \
            package.json \
            docs/production-schema/migration-ledger.json
          rm .github/workflows/format-idempotent-message-send.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/api/message-send-request.ts \
            src/lib/api/messaging-guarded.ts \
            src/lib/api/messaging.ts \
            src/routes/chats.tsx \
            scripts/message-send-idempotency.test.mjs \
            package.json \
            docs/production-schema/migration-ledger.json \
            .github/workflows/format-idempotent-message-send.yml
          git commit -m "Format idempotent message send"
          git push origin HEAD:feature/idempotent-message-send
