name: Temporary Public Security Diagnostic

on:
  push:
    branches:
      - design/search-filters-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture test output
        run: node --test scripts/public-data-security.test.mjs > public-security.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: public-security-diagnostic
          path: public-security.log
          retention-days: 1
