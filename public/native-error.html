<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080605" />
    <title>رواج | تعذر الاتصال</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
        color: #fff1d0;
        background: radial-gradient(circle at 50% 30%, #341706 0, #160c07 38%, #080605 75%);
      }
      main { width: min(100%, 430px); text-align: center; }
      .mark {
        width: 94px;
        height: 108px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        font-size: 43px;
        font-weight: 900;
        color: #fff1d0;
        background: linear-gradient(145deg, #e54b20, #c66a18 58%, #e9b85e);
        clip-path: polygon(50% 0, 92% 24%, 92% 74%, 50% 100%, 8% 74%, 8% 24%);
        filter: drop-shadow(0 18px 34px rgba(196, 105, 25, .35));
      }
      .card {
        padding: 28px 22px;
        border: 1px solid rgba(233, 184, 94, .22);
        border-radius: 28px;
        background: rgba(22, 12, 7, .82);
        box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
      }
      h1 { margin: 0 0 10px; font-size: 25px; }
      p { margin: 0; color: rgba(255, 241, 208, .72); line-height: 1.8; }
      button {
        width: 100%;
        min-height: 50px;
        margin-top: 24px;
        border: 0;
        border-radius: 16px;
        color: #160c07;
        background: #e9b85e;
        font: inherit;
        font-weight: 800;
      }
      small { display: block; margin-top: 14px; color: rgba(255, 241, 208, .5); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ر</div>
      <section class="card">
        <h1>تعذر فتح رواج</h1>
        <p>تحقق من اتصال الإنترنت، ثم اضغط إعادة المحاولة. لن تفقد جلسة حسابك أو بياناتك المحفوظة.</p>
        <button id="retry" type="button">إعادة المحاولة</button>
        <small>RAWAJ</small>
      </section>
    </main>
    <script>
      const retry = () => window.location.replace("https://rawa-j.com");
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
